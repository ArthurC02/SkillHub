# Local development stack (E1 deployment shape, cost-estimation §7.2).
# Only Postgres runs today; the service images land with the first feature that
# needs them (docs/plans/03-work-items.md CORE-001) together with infra/images/.
name: skillhub

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub
      POSTGRES_DB: skillhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub -d skillhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev (ADR-018: production uses a
  # managed S3 service; SeaweedFS is the licensed-clean self-host option).
  #
  # Credentialed, not anonymous: SBX-008 moves every byte between the planes
  # through a pre-signed URL, and pre-signing needs a key to sign with — an
  # anonymous bucket cannot produce one, and would make the grant meaningless
  # even if it could. An existing stack must recreate this container to pick the
  # identity file up.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # Probe 127.0.0.1, not `localhost`: SeaweedFS listens on IPv4 only, while
    # `localhost` resolves to ::1 first inside the container, so the old probe
    # got ECONNREFUSED forever and the service never went healthy. `/status` is
    # the S3 gateway's own health endpoint (200, empty body) — the bucket root
    # only answers while anonymous ListBuckets stays enabled.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The only model exit (ADR-017, iron rule 8). Provider API keys exist here and
  # nowhere else; every other component holds a Virtual Key minted per Run.
  #
  # It sits on two networks on purpose. `default` is how the control plane
  # reaches the management API and how the gateway reaches Postgres and the
  # provider. `egress` is internal (no route off the host) and is the only
  # network a sandbox is ever placed on, which makes the gateway the single
  # reachable address from inside a sandbox — SBX-007's allow list of one, in the
  # shape a developer machine can actually enforce. Production replaces this with
  # the egress proxy (domain allow list, DNS pinning, destination logging).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["model"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Both from the repo-root .env, which is gitignored. OPENAI_API_KEY must
      # not appear in any other service's environment.
      # Compose interpolates every service before profile selection, so these
      # accept blank values here. `task dev:model` runs devctl's fail-closed
      # profile check before enabling this service; core startup needs no keys.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Its own database on the shared instance (ADR-018: one Postgres, several
      # logical databases). The gateway's key store must not share a schema with
      # the platform's — a migration on either side would then touch both.
      DATABASE_URL: postgresql://skillhub:skillhub@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      # Localhost only: the management API mints spending credentials.
      - "127.0.0.1:4000:4000"
    networks:
      - default
      - egress

  # The thing that was missing under alerts.yml. Twenty rules, thresholds set by
  # ADR-022, and nothing that evaluates them — so X-02～X-04 had no trigger path
  # at all, on any machine. Profile-gated because it is a maintenance surface,
  # not part of the ten-minute journey: `task dev:observability`.
  #
  # It scrapes the host, not other containers: cmd/api and cmd/worker run on the
  # developer's machine (see the TODO below), so the targets are
  # host.docker.internal. Production is not this file (04 甲類).
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Rules are reloadable without a restart: `curl -XPOST localhost:9095/-/reload`
      # after editing alerts.yml, which is the point of mounting the directory.
      - --web.enable-lifecycle
    volumes:
      - ../observability:/etc/prometheus:ro
    ports:
      # 9095, not 9090: 9090 is what METRICS_ADDR usually binds on the host, and
      # a collision there means the scraper eats its own target's port.
      - "127.0.0.1:9095:9090"
    # No-op on Docker Desktop, required on Linux — without it host.docker.internal
    # does not resolve and every target is down for a reason that looks like the
    # services being down.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # TODO(CORE-001): add api / worker / llm / web services once infra/images/
  # holds their Dockerfiles. Build contexts are the repo root, since the Go
  # build needs apps/platform and the generated packages/ output.

networks:
  default:
  # `internal: true` is the enforcement: containers on this network have no
  # route off the host, so a sandbox placed here can reach the gateway and
  # nothing beyond it. Object storage is deliberately absent — the execution
  # node moves those bytes on the sandbox's behalf (SBX-008).
  egress:
    internal: true

volumes:
  postgres-data:
  seaweedfs-data:
