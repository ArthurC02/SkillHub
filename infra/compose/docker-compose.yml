name: skillhub

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub
      POSTGRES_DB: skillhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub -d skillhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Probes 127.0.0.1, not localhost: this container listens on IPv4 only, and
  # localhost can resolve to ::1 first.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80@sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
    profiles: ["model"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://skillhub:skillhub@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - default
      - egress

  prometheus:
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ../observability:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9095:9090"
    # Required on Linux for host.docker.internal to resolve; no-op elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  platform-api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/images/platform/Dockerfile
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skillhub:skillhub@postgres:5432/skillhub
      OBJSTORE_ENDPOINT: seaweedfs:8333
      OBJSTORE_ACCESS_KEY: skillhubdev
      OBJSTORE_SECRET_KEY: skillhubdevsecret
      OBJSTORE_BUCKET: skillhub
      OBJSTORE_SSL: "0"
      LLM_SERVICE_URL: http://llm:8000
      LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:-}
      SKILLHUB_TRACE_INGEST_URL: http://platform-api:8080
      SKILLHUB_TRACE_INGEST_SECRET: ${SKILLHUB_TRACE_INGEST_SECRET:-}
      METRICS_ADDR: ${METRICS_ADDR:-}
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
      DEV_LOGIN: ${DEV_LOGIN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-}
      APP_URL: ${APP_URL:-}
      OPERATOR_USER_IDS: ${OPERATOR_USER_IDS:-}
      BETA_ALLOWLIST: ${BETA_ALLOWLIST:-}
      DEV_CORS_ORIGIN: ${DEV_CORS_ORIGIN:-}
      IMPORT_ALLOW_INSECURE: ${IMPORT_ALLOW_INSECURE:-}
      IMPORT_EXTRA_HOSTS: ${IMPORT_EXTRA_HOSTS:-}
      DOWNLOAD_ARTIFACT_RETENTION: ${DOWNLOAD_ARTIFACT_RETENTION:-}
      RUN_QUOTA: ${RUN_QUOTA:-}
      GENERATE_QUOTA: ${GENERATE_QUOTA:-}
      RATE_LIMIT: ${RATE_LIMIT:-}
      GENERATE_SKILL_EXPOSED: ${GENERATE_SKILL_EXPOSED:-}
      FEEDBACK_RETENTION: ${FEEDBACK_RETENTION:-}
      ANALYTICS_RETENTION: ${ANALYTICS_RETENTION:-}
    ports:
      - "127.0.0.1:8080:8080"

  platform-worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/images/platform/Dockerfile
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skillhub:skillhub@postgres:5432/skillhub
      OBJSTORE_ENDPOINT: seaweedfs:8333
      OBJSTORE_ACCESS_KEY: skillhubdev
      OBJSTORE_SECRET_KEY: skillhubdevsecret
      OBJSTORE_BUCKET: skillhub
      OBJSTORE_SSL: "0"
      LLM_SERVICE_URL: http://llm:8000
      LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:-}
      SKILLHUB_TRACE_INGEST_URL: http://platform-api:8080
      SKILLHUB_TRACE_INGEST_SECRET: ${SKILLHUB_TRACE_INGEST_SECRET:-}
      METRICS_ADDR: ${METRICS_ADDR:-}

  llm:
    profiles: ["app"]
    build:
      context: ../../apps/llm
      dockerfile: ../../infra/images/llm/Dockerfile
    environment:
      LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      ENRICH_MODEL: ${ENRICH_MODEL:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      GENERATE_SKILL_MODEL: ${GENERATE_SKILL_MODEL:-}
      MATCH_REASON_MODEL: ${MATCH_REASON_MODEL:-}
      SUGGEST_CRITERIA_MODEL: ${SUGGEST_CRITERIA_MODEL:-}

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/images/web/Dockerfile
    depends_on:
      - platform-api
    ports:
      - "127.0.0.1:8081:80"

networks:
  default:
  egress:
    internal: true

volumes:
  postgres-data:
  seaweedfs-data:
