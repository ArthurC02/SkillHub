rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="platform", process="api"}'
        values: "1x4 _x20"
      - series: 'up{job="platform", process="worker"}'
        values: "1x4 0x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: PlatformApiDown
        exp_alerts: []
      - eval_time: 3m
        alertname: PlatformWorkerDown
        exp_alerts: []
      - eval_time: 20m
        alertname: PlatformApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "platform-api 抓不到，或抓到了但沒有回應"
              description: "每一個網頁與 API 請求都經過它。series 不存在＝容器不在（dns_sd 找不到名字）， up=0＝容器在但 metrics 端點不回。先 docker compose ps 與 docker compose logs platform-api。"
      - eval_time: 20m
        alertname: PlatformWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "platform-worker 抓不到，或抓到了但沒有回應"
              description: "它是唯一的佇列消費者：Run、評估、索引增強與清理全部停在佇列裡。 先 docker compose ps 與 docker compose logs platform-worker。"

  - name: provider never reachable waits five minutes before firing
    interval: 1m
    input_series:
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="error"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: ProviderCapabilityUnreachable
        exp_alerts: []
      - eval_time: 6m
        alertname: ProviderCapabilityUnreachable
        exp_alerts:
          - &unreachable
            exp_labels:
              provider: unreachable
              severity: critical
            exp_annotations:
              summary: "Provider unreachable 的 capability 完全抓不到"
              description: "確認 sandboxd 是否存活、SKILLHUB_SANDBOX_TOKEN_* 是否輪替過。"

  - name: another provider succeeding cannot hide an unreachable provider
    interval: 1m
    input_series:
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="error", instance="worker-a"}'
        values: "0+1x20"
      - series: 'skillhub_provider_capability_total{provider="healthy", result="ok", instance="worker-b"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProviderCapabilityUnreachable
        exp_alerts:
          - *unreachable

  - name: a zero error counter is not evidence of an unreachable provider
    interval: 1m
    input_series:
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="error"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProviderCapabilityUnreachable
        exp_alerts: []

  - name: successes on another worker keep the same provider reachable
    interval: 1m
    input_series:
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="error", instance="worker-a"}'
        values: "0+1x20"
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="ok", instance="worker-b"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProviderCapabilityUnreachable
        exp_alerts: []

  - name: a success counter without recent successes cannot hide failures
    interval: 1m
    input_series:
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="error"}'
        values: "0+1x20"
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="ok"}'
        values: "7x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProviderCapabilityUnreachable
        exp_alerts:
          - *unreachable

  - name: a recovered provider resolves the alert despite older failures
    interval: 1m
    input_series:
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="error"}'
        values: "0+1x20"
      - series: 'skillhub_provider_capability_total{provider="unreachable", result="ok"}'
        values: "_ _ _ _ _ _ _ _ _ _ _ 0+1x10"
    alert_rule_test:
      - eval_time: 11m
        alertname: ProviderCapabilityUnreachable
        exp_alerts:
          - *unreachable
      - eval_time: 12m
        alertname: ProviderCapabilityUnreachable
        exp_alerts: []

  - name: capacity healthy worker is not endangered by API defaults
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "120x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples: []
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h
        exp_samples: []

  - name: capacity worker risk waits six hours
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "89x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 5h59m
        exp_samples: []
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples:
          - labels: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing",process="worker",instance="worker-a",job="platform",severity="warning"}'
            value: 1

  - name: capacity ninety days is outside the risk boundary
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "90x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples: []

  - name: capacity an observed zero remains a real risk
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "0x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples:
          - labels: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing",process="worker",instance="worker-a",job="platform",severity="warning"}'
            value: 1

  - name: capacity a healthy worker replica cannot hide another at risk
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "89x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-b"}'
        values: "120x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples:
          - labels: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing",process="worker",instance="worker-a",job="platform",severity="warning"}'
            value: 1

  - name: capacity healthy growth resolves the worker risk
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "89x360 120x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples:
          - labels: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing",process="worker",instance="worker-a",job="platform",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h1m
        exp_samples: []

  - name: capacity API defaults cannot hide a missing worker observation
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 1h59m
        exp_samples: []
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing",process="worker",severity="warning"}'
            value: 1

  - name: capacity a missing scrape still reports unknown
    interval: 1m
    input_series: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing",process="worker",severity="warning"}'
            value: 1

  - name: capacity a lost worker observation becomes unknown
    interval: 1m
    input_series:
      - series: 'up{job="platform",process="worker",instance="worker-a"}'
        values: "1x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "120 stale _x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h
        exp_samples: []
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h1m
        exp_samples:
          - labels: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing",process="worker",severity="warning"}'
            value: 1

  - name: capacity a returning worker resolves unknown
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="api",instance="api-a"}'
        values: "0x400"
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "_x121 120x280"
    promql_expr_test:
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing",process="worker",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h1m
        exp_samples: []

  - name: capacity a healthy worker does not need API observations
    interval: 1m
    input_series:
      - series: 'skillhub_restore_budget_days_left{job="platform",process="worker",instance="worker-a"}'
        values: "120x400"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DatabaseNearRestoreBudget",alertstate="firing"}'
        eval_time: 6h
        exp_samples: []
      - expr: 'ALERTS{alertname="CapacityNotObserved",alertstate="firing"}'
        eval_time: 2h
        exp_samples: []

  - name: backlog observed empty worker categories stay healthy without API observations
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="enrichment"}'
        values: "0x180"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples: []

  - name: backlog orphan_objects cannot be hidden by other categories or API observations
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="future_category"}'
        values: "0x180"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 59m
        exp_samples: []
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="orphan_objects",process="worker",severity="warning"}'
            value: 1

  - name: backlog source_checks cannot be hidden by other categories or API observations
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="future_category"}'
        values: "0x180"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 59m
        exp_samples: []
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="source_checks",process="worker",severity="warning"}'
            value: 1

  - name: backlog enrichment cannot be hidden by other categories or API observations
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="future_category"}'
        values: "0x180"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 59m
        exp_samples: []
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="enrichment",process="worker",severity="warning"}'
            value: 1

  - name: backlog API observations cannot hide all missing worker categories
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="enrichment"}'
        values: "0x180"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 59m
        exp_samples: []
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="orphan_objects",process="worker",severity="warning"}'
            value: 1
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="source_checks",process="worker",severity="warning"}'
            value: 1
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="enrichment",process="worker",severity="warning"}'
            value: 1

  - name: backlog no scrape leaves every required category unknown
    interval: 1m
    input_series: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="orphan_objects",process="worker",severity="warning"}'
            value: 1
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="source_checks",process="worker",severity="warning"}'
            value: 1
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="enrichment",process="worker",severity="warning"}'
            value: 1

  - name: backlog a lost category waits an hour before warning
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="orphan_objects"}'
        values: "0 stale _x180"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples: []
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h1m
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="orphan_objects",process="worker",severity="warning"}'
            value: 1

  - name: backlog a recovered empty category resolves unknown
    interval: 1m
    input_series:
      - series: 'up{process="worker"}'
        values: "1x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="orphan_objects"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="source_checks"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="api",backlog="enrichment"}'
        values: "0x180"
      - series: 'skillhub_backlog_oldest_seconds{process="worker",backlog="orphan_objects"}'
        values: "_x61 0x120"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing",backlog="orphan_objects",process="worker",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="BacklogObserverSilent",alertstate="firing"}'
        eval_time: 1h1m
        exp_samples: []

  - name: a platform budget refusal fires at once and clears after fifteen quiet minutes
    interval: 1m
    input_series:
      - series: 'skillhub_model_platform_budget_exhausted_total{job="platform", process="worker"}'
        values: "0x5 1x25"
    alert_rule_test:
      - eval_time: 5m
        alertname: ModelPlatformBudgetExhausted
        exp_alerts: []
      - eval_time: 6m
        alertname: ModelPlatformBudgetExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "模型閘道的平台總預算已用完，所有模型呼叫都被拒絕"
              description: "閘道設定的總預算（litellm-config 的 max_budget 與 budget_duration）在這個週期內花完了： 搜尋的語意腿、創作、評估與生成都會失敗，直到週期重置或調高預算。 先查閘道的花費紀錄，分清是正常用量還是失控的呼叫迴圈，再決定等重置或調高。"
      - eval_time: 22m
        alertname: ModelPlatformBudgetExhausted
        exp_alerts: []

  - name: a zero platform budget counter is not a spent budget
    interval: 1m
    input_series:
      - series: 'skillhub_model_platform_budget_exhausted_total{job="platform", process="worker"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ModelPlatformBudgetExhausted
        exp_alerts: []

  - name: "operational confirmed empty observations stay healthy despite API failures"
    interval: "1m"
    input_series:
      - series: "skillhub_run_cleanup_backlog{process=\"worker\"}"
        values: "0x130"
      - series: "skillhub_outbox_dead_lettered{process=\"worker\"}"
        values: "0x130"
      - series: "skillhub_storage_objects_missing{process=\"worker\",resource_kind=\"dataset\"}"
        values: "0x130"
      - series: "skillhub_storage_objects_missing{process=\"worker\",resource_kind=\"artifact\"}"
        values: "0x130"
      - series: "skillhub_orphan_observation_success{process=\"worker\",provider=\"sandbox\"}"
        values: "1x130"
      - series: "skillhub_dispatch_halt_observation_success{process=\"worker\"}"
        values: "1x130"
      - series: "up{process=\"worker\"}"
        values: "1x130"
      - series: "skillhub_orphan_observation_success{process=\"api\",provider=\"sandbox\"}"
        values: "0x130"
      - series: "skillhub_dispatch_halt_observation_success{process=\"api\"}"
        values: "0x130"
    alert_rule_test:
      - eval_time: "2h"
        alertname: "CleanupBacklogNotObserved"
        exp_alerts: []
      - eval_time: "2h"
        alertname: "OutboxBacklogNotObserved"
        exp_alerts: []
      - eval_time: "2h"
        alertname: "ObjectSightingsNotObserved"
        exp_alerts: []
      - eval_time: "2h"
