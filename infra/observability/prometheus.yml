global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # api and worker are separate processes with their own METRICS_ADDR; a
  # target with no listener shows here as down, not zero.
  - job_name: platform
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels: { process: api }
      - targets: ["host.docker.internal:9091"]
        labels: { process: worker }

