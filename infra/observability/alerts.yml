# Skill Hub 平台告警規則（O11Y-001～003 / NFR-005）
#
# 這是 Prometheus 的 alerting rules 檔，不是部署。Alertmanager 的部署、路由與
# 通知管道屬部署期，本批只定義「什麼情況算異常、依據哪個指標、要人做什麼」。
# 掛上去的方式：Prometheus 的 rule_files 指向本檔。
#
# 兩條硬性邊界（ADR-009、contracts/events/README.md §1）：
#
# 1. 這裡的每一條規則只讀 services/platform 與 services/sandbox 自己曝露的
#    /metrics。**不得**讀 trace_events：Trace payload 大量來自 Sandbox，是使用者
#    可操控的輸入，讓告警依賴它等於把告警的觸發權交給不受信任的來源。
# 2. 指標標籤不含 run_id、workspace_id、user_id 或任何使用者內容。要定位到個別
#    Run 一律走 log（以 run_id 關聯），不是靠展開一個高基數的 label。
#
# 門檻值註記：以下數字是**首發預設**，不是實測校準值。NFR-004 自陳效能目標
# 「需在確認基礎設施後校準」。上線後第一個月應以實際分佈回填，並在此註明校準日期。
#
# 例外：skillhub-cleanup-and-leaks 群組的門檻**不是**首發預設——SEC-002 的六項門檻
# 已於 2026-08-16 由 ADR-022 第二部分定值（X-02 每 5 分鐘、X-03 連 2 輪、X-04 單節點
# 50%／全池 25% 下限 2 筆）。**該群組的規則已全部改為正式形式**：SBX-012 已落地
# （Reconciler 的 in-flight orphan 表 `reconciler_orphan_sightings`、gauge
# `skillhub_orphan_sandbox_persistent`、分項計數器 `skillhub_gateway_revoke_failed_total`
# 與 `skillhub_sandbox_destroy_failed_total`），原本兩條以累加計數器近似的過渡規則
# 已改讀這些指標，不再有「兩筆各失敗一次也會觸發」的誤報路徑。
#
# 本檔只定義「什麼情況算異常」；ADR-022 定的動作（drain 節點、暫停整池派送、暫停
# P-03 例行重建）屬平台實作，不是 Alertmanager 的職責。
#
# 2026-08-18：前兩個動作已由 SEC-012 落地（`dispatch_halts` 表 ＋
# `internal/run/halt.go`；Reconciler 自己撥開關，P1 由 operator 端點撥，兩者同一份
# 狀態）。上面那句仍然成立——**告警還是不執行動作**——改變的是「平台已經自己停下來
# 了」現在是一個看得到的狀態，故新增 `DispatchHalted` 與 `DispatchHaltedForIncident`
# 兩條。**P-03 例行重建的暫停仍未做**：節點重建在部署期，平台沒有它的控制點。

groups:
  # --- O11Y-001：搜尋與 Run 漏斗 ---------------------------------------------
  - name: skillhub-run-funnel
    rules:
      - alert: SearchLatencyAboveTarget
        # NFR-004：已索引內容的搜尋 p95 目標 < 2 秒。用 histogram_quantile 而非
        # 平均值——平均值會被大量快查詢壓下去，正好蓋住使用者實際感受到的尾巴。
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, mode) (rate(skillhub_search_duration_seconds_bucket[10m]))
          ) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "搜尋 p95 延遲超過 NFR-004 的 2 秒目標（mode={{ $labels.mode }})"
          description: >-
            mode=fts 代表向量腿不可用、已降級為純詞彙檢索（跨語言召回會掉），
            先查 LLM 服務與 embedding 供應狀態；mode=hybrid 則查資料庫負載與
            pgvector 索引。

      - alert: RunQueueWaitTooLong
        # 排隊時間長 = 沒有 worker，或所有 provider 的 slot 都滿了。使用者看到的
        # 是「按了開始但什麼都沒發生」，這是最早能發現的訊號。
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(skillhub_run_queue_duration_seconds_bucket[15m]))
          ) > 120
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Run 從建立到開始佈建的 p95 等待超過 2 分鐘"
          description: >-
            先確認 worker 是否存活（skillhub_run_created_total 仍在增加但
            skillhub_run_queue_duration_seconds_count 沒動 = worker 沒在消化），
            再看 provider 的 concurrent_run_slots。

      - alert: RunFailureRateHigh
        # 只算平台自己的錯：workload_error 是 Skill 自己跑失敗，那是產品訊號不是
        # 事故，把它算進來會讓這條告警在使用者測試爛 Skill 時整天響。
        expr: |
          sum(rate(skillhub_run_terminal_total{failure_class=~"provider_error|platform_error|capability_mismatch"}[30m]))
          /
          clamp_min(sum(rate(skillhub_run_terminal_total[30m])), 0.001)
          > 0.2
        for: 20m
        labels:
          severity: critical
        annotations:
          summary: "超過 20% 的 Run 因平台或 Provider 因素失敗"
          description: >-
            依 failure_class 拆解：provider_error 查 Provider 健康度告警；
            capability_mismatch 表示排程要求與 Provider 宣告不相容（可能是剛換了
            Runtime 版本）；platform_error 查控制平面的錯誤 log。

      - alert: RunTimeoutRateHigh
        expr: |
          sum(rate(skillhub_run_terminal_total{status="timed_out"}[30m]))
          /
          clamp_min(sum(rate(skillhub_run_terminal_total[30m])), 0.001)
          > 0.1
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "超過 10% 的 Run 逾時"
          description: >-
            PDM-005 的 wall clock 是 soft 600s / hard 900s。若逾時集中在特定時段，
            先看節點資源；若普遍發生，可能是模型閘道變慢，查 Langfuse。

  # --- O11Y-002：Provider 健康度 ---------------------------------------------
  - name: skillhub-provider-health
    rules:
      - alert: ProviderCapabilityUnreachable
        # RUN-005 用 capability 決定派送。抓不到 = 那台 Provider 事實上退出輪替，
        # 而且使用者只會看到「no configured sandbox provider can run this request」。
        expr: |
          sum by (provider) (rate(skillhub_provider_capability_total{result="error"}[10m])) > 0
          and
          sum by (provider) (rate(skillhub_provider_capability_total{result="ok"}[10m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Provider {{ $labels.provider }} 的 capability 完全抓不到"
          description: "確認 sandboxd 是否存活、SKILLHUB_SANDBOX_TOKEN_* 是否輪替過。"

      - alert: ProviderSelfReportsUnhealthy
        expr: sum by (provider) (rate(skillhub_provider_capability_total{result="unhealthy"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} 自陳不健康"
          description: "通常是該節點的容器 runtime（Docker／runsc）不可用。"

      - alert: ProviderServerErrorRateHigh
        expr: |
          sum by (provider) (rate(skillhub_provider_request_total{class="server_error"}[15m]))
          /
          clamp_min(sum by (provider) (rate(skillhub_provider_request_total[15m])), 0.001)
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} 的 5xx 比例超過 10%"

      - alert: ProviderThrottling
        # 429 = slot 用完。不是錯誤，是容量訊號：持續出現代表要加節點或調 slot。
        expr: sum by (provider) (rate(skillhub_provider_request_total{class="throttled"}[15m])) > 0.05
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Provider {{ $labels.provider }} 持續回 429（slot 不足）"

  # --- O11Y-003：遺留 Sandbox、清理積壓、遮罩 ---------------------------------
  - name: skillhub-cleanup-and-leaks
    rules:
      - alert: CleanupBacklogGrowing
        # 終態但未確認釋放的 Run。這是唯一能發現「Sandbox 在燒錢而沒人回收」的
        # 指標，因為 Run 本身看起來完全正常。
        #
        # 門檻仍不是 ADR-022 定的值（SEC-002 的六項門檻不含它），但**已依封測容量
        # 校準（2026-08-16）**：舊值 5 大於整池的 4 個 slot，意思是整池的沙箱全部
        # 洩漏都還低於門檻——一條在容量耗盡之前不可能響的告警等於沒有。
        #
        # 新值 2 ＝ 封測 4 slot 的 50%，與 ADR-022 X-04 的單節點 drain 門檻同一個比例
        # （該處是「遺留 ≥ 節點 slot 的 50%」）；用同一個比例，是因為兩者測的是同一
        # 件事的兩端——這裡是平台側「該釋放而未確認釋放」，那裡是節點側「已經留在
        # 那裡」。for: 15m 不變，正常清理的短暫積壓仍然不會觸發（清理是冪等的、
        # 失敗會被 supervisor 重排，15 分鐘還在就不是暫態）。
        #
        # 校準義務不變：這是依封測 4 slot 推的比例值，池容量改變時要重推。
        expr: skillhub_run_cleanup_backlog > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "清理積壓 {{ $value }} 個 Run 未確認釋放"
          description: >-
            RUN-007 的清理是冪等的、失敗會由 supervisor 重排；積壓仍上升代表
            Provider 的 DELETE 一直失敗，或該 Provider 已從設定中移除但仍持有
            Sandbox。後者平台無法自行釋放，必須人工處理。

      - alert: CleanupFailing
        expr: sum(rate(skillhub_run_cleanup_total{result="failed"}[30m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Run 清理持續失敗"

      - alert: LeakedSandboxesDestroyed
        # 孤兒掃描真的殺掉了東西 = 之前有東西漏掉了。不是事故，是要去看為什麼的
        # 訊號（RUN-007 的掃描是最後一道防線，不該是常態路徑）。
        expr: increase(skillhub_orphan_sandbox_total{action="destroyed"}[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "孤兒掃描在 {{ $labels.provider }} 上清掉了 {{ $value }} 個遺留 Sandbox"
          description: "查該時段的 cleanup 失敗與 worker 重啟紀錄。"

      - alert: LeakedSandboxStillPresent
        # X-03（ADR-022）：同一 provider_run_id 連續 2 輪掃描（10 分鐘）仍存在即告警。
        #
        # SBX-012 之後這是**正式形式**：gauge 直接就是「本輪還在、且已連續 ≥2 輪」的
        # 筆數，事實來源是 Reconciler 的 in-flight orphan 表（migration 0021）。連續性
        # 由該表保證——某一輪沒看到就刪列，重新出現從第 1 輪起算，所以這裡的 >0 不會
        # 被「兩筆不同資源各出現一次」湊出來。gauge 已是當下狀態，不需要 for:。
        #
        # 【漏報方向不變】掃描**找不到**的遺留資源仍然計不到：本 gauge 的來源是
        # GET /runs?active=true 回報的清單，節點上存在但 provider 記憶體狀態沒回報的
        # 沙箱對本條完全隱形，只有 SEC-009 測項 T7 的注入子項驗得到。
        expr: max by (provider) (skillhub_orphan_sandbox_persistent) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.provider }} 上有遺留 Sandbox 連續兩輪掃描仍未清除（X-03）"
          description: >-
            ADR-022 X-04 的下一級是節點 drain（遺留 ≥ 該節點 slot 的 50%，封測規模下
            即 1 筆）與全池暫停派送（≥ 總 slot 的 25%，下限 2 筆）。**那兩個動作是
            平台實作，不是本告警的職責**；本條只負責讓人知道它正在往那裡走。

      - alert: LeakedSandboxDestroyFailed
        # 這條才是真的要人：掃描找到了、也試著殺了、殺不掉，資源還在。
        #
        # 兩個來源都算：孤兒掃描（orphan_sandbox_total{action="failed"}）與 Run 結束
        # 時的正規清理（sandbox_destroy_failed_total，SBX-012）。分開計是因為它們是
        # 不同的失效——清理失敗是常態路徑壞了，掃描失敗是最後一道防線也壞了——但
        # 「有沙箱殺不掉」這個結論兩邊一樣，要人做的事也一樣（drain 該節點）。
        expr: |
          increase(skillhub_orphan_sandbox_total{action="failed"}[1h]) > 0
          or
          increase(skillhub_sandbox_destroy_failed_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.provider }} 上有無法銷毀的遺留 Sandbox"

      - alert: CredentialRevokeFailing
        # X-03/X-04 的 6b（ADR-022）：不佔 slot 的遺留資源（Virtual Key、Network Rule）
        # 連續 3 輪（15 分鐘）撤銷失敗 → 最高嚴重度，**但不暫停派送**——暫停新 Run
        # 不會讓已經外洩的憑證消失，正確動作是人介入（閘道側強制刪除或 SEC-010 停用）。
        #
        # SBX-012 之後這是**正式形式**：讀的是分項計數器 gateway_revoke_failed，
        # 不再是整體的 cleanup result="failed"。差別是實質的——沙箱殺不掉要 drain
        # 節點，金鑰撤不掉 drain 一點用都沒有，混在一個計數器裡的告警指不出該做哪件。
        # 沙箱側的對應計數器是 skillhub_sandbox_destroy_failed_total，由上一條
        # LeakedSandboxDestroyFailed 承接。
        #
        # 【漏報方向】撤銷**沒被嘗試**就不會計入：撤銷失敗要先有人呼叫 /key/delete。
        # cleanup job 本身沒被排入（worker 停擺、River leader 選舉卡住）時，金鑰會
        # 安靜地活到 TTL，本條一聲不響——那條路徑由 CleanupBacklogGrowing 與
        # OrphanScanNotRunning 覆蓋，兩者要一起看。
        expr: sum(increase(skillhub_gateway_revoke_failed_total[15m])) >= 3
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "短效憑證撤銷連續失敗（ADR-022 X-03/X-04 6b）"
          description: >-
            物件短效授權**不在**本條範圍：預簽 URL 沒有撤銷手段，其窗口上界就是簽發
            時的 TTL（SBX-008：硬牆鐘 + 5 分鐘），那是明示的殘餘風險而非可監控門檻。

      - alert: OrphanScanNotRunning
        # 掃描本身停了是靜默失效：沒有告警會響，但保護也沒了。
        # ADR-022 X-02：掃描每 5 分鐘一輪，停擺超過 2 輪（10 分鐘）即最高嚴重度，
        # 並暫停新 Run 排入受影響節點池（暫停的動作屬平台實作，見檔頭）。
        expr: sum(increase(skillhub_orphan_scan_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "孤兒掃描超過 10 分鐘（2 個掃描週期）沒有執行"
          description: >-
            掃描是 River 的 leader-only periodic job（5 分鐘一次），先查 worker 的
            leader 選舉。**沒有 Reconciler 在跑，就沒有人知道洩漏了多少**——ADR-022
            把這一項列為阻擋級，不是 warning。
            **本條的「暫停派送」仍是人的動作**：偵測不到 Reconciler 在跑的東西，只能
            在平台外面；SEC-012 的開關由 `PUT /admin/dispatch/halt` 撥（見下一條）。

      - alert: DispatchHalted
        # SEC-012 的開關本身（`skillhub_dispatch_halted`，1 = 該 target 不再派送）。
        # 檔頭原本寫「ADR-022 定的動作（drain 節點、暫停整池派送）屬平台實作，不是
        # Alertmanager 的職責」——那句仍然成立，改變的是那些動作現在真的存在，因此
        # 「平台已經自己停下來了」變成一個要讓人知道的狀態。
        #
        # 兩個 source 的差別就是要不要人回來：`orphan_threshold` 連續 2 輪門檻以下會
        # 自己解除（ADR-022 X-04），`p1_incident` 永遠不會（03:SEC-012「解除不得是
        # 自動的」），所以只有後者是 critical。
        #
        # 【已知延遲】這個 gauge 由 Reconciler 每 5 分鐘從 dispatch_halts 重新發佈，
        # 因為撥開關的可能是 API 程序而發佈指標的是 worker。行為沒有延遲（每條決策
        # 路徑都直接讀表），只有這個顯示會晚最多一輪。
        expr: max by (target, source) (skillhub_dispatch_halted) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }} 已停止派送新 Run（source={{ $labels.source }}）"
          description: >-
            `source=orphan_threshold` 是 ADR-022 X-04 的容量暫停，清理跟上就會自己
            恢復；`source=p1_incident` 是 02:SEC-010 的 P1，**現場正被保留（清理與
            孤兒回收都已停手）**，要人走完 runbook 後以
            `DELETE /admin/dispatch/halt` 解除。

      - alert: DispatchHaltedForIncident
        # 同一個 gauge 的 P1 切片，分開一條是因為值班要做的事完全不同：上一條可能
        # 什麼都不用做，這一條表示平台正在等人。
        expr: max by (target) (skillhub_dispatch_halted{source="p1_incident"}) > 0
        labels:
          severity: critical
        annotations:
          summary: "P1 安全事件生效中：{{ $labels.target }} 已停派送並保留現場"
          description: >-
            02:SEC-010「1 小時內接手，走對應 runbook」。**保留現場期間 sandbox 不會被
            回收**，slot 與費用持續佔用；調查完成前不要以「清一清就好」繞過這個狀態。

  # --- Trace 管線本身 ---------------------------------------------------------
  - name: skillhub-trace-pipeline
    rules:
      - alert: TraceMaskingStopped
        # NFR-002 沒有其他偵測器：遮罩器壞掉時一切照常運作，只是 Secrets 開始
        # 落庫。有事件進來、卻一個欄位都沒遮，就是它壞了的樣子。
        expr: |
          sum(rate(skillhub_trace_events_total{result="stored"}[1h])) > 0
          and
          sum(rate(skillhub_trace_masked_fields_total[1h])) == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Trace 遮罩器連續一小時沒有遮掉任何欄位"
          description: >-
            正常流量下 tool_call 的 arguments 與 script_log 的 message 幾乎必然
            有東西被遮。歸零代表遮罩規則或呼叫路徑被改壞了——這是鐵律 11 的
            靜默失效，優先於一切其他告警處理。

      - alert: TraceIngestionRejecting
        expr: sum(rate(skillhub_trace_ingest_rejected_total[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Trace 收集端持續拒絕請求（reason={{ $labels.reason }}）"
          description: >-
            reason=expired 代表 Run 活得比自己的 token 久（見 trace/token.go 的
            DefaultTTL）；reason=bad_token 代表簽章密鑰不一致，通常是 api 與
            worker 的 SKILLHUB_TRACE_INGEST_SECRET 不同步。

      - alert: TraceIngestLagAboveTarget
        # NFR-004：事件產生後目標 3 秒內出現在執行畫面。
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(skillhub_trace_ingest_lag_seconds_bucket[15m]))
          ) > 3
        for: 20m
        labels:
          severity: info
        annotations:
          summary: "Trace 事件從產生到入庫的 p95 超過 3 秒"
          description: "sandboxd 的收集 ticker 是 2 秒；超標通常是批次過大或平台端寫入變慢。"
