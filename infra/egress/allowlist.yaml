destinations:
  - name: model_gateway
    tier: sandbox
    fqdn: litellm.internal
    pinned_ip: unset # renders no accept rule (fail-closed) until a real IP is set
    port: 4000
    protocol: tcp
    justification: >-
      The only destination a run's workload may reach. Every model call must go
      through the gateway (iron rule 8) and it is the sole holder of provider
      keys; per-run virtual keys bound the blast radius.
    owner: platform
    review_by: 2026-11-14

