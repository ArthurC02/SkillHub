global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: platform
    static_configs:
      - targets: ["platform-api:9090"]
        labels: { process: api }
      - targets: ["platform-worker:9091"]
        labels: { process: worker }
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
