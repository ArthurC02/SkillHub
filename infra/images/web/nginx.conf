# Serves the built SPA and reverse-proxies apps/platform's API so the bundle
# stays same-origin (api/client.ts's API_BASE_URL default is the empty
# string — see that file's header comment for why that has to be the default).
#
# Why this is NOT `location /api/ { proxy_pass ...; }`
# -----------------------------------------------------
# contracts/openapi/public.yaml has no such prefix: routes are top-level
# (/skills, /runs/{id}, /auth/..., /me, ...) with only four paths actually
# under /api/. A single-prefix proxy would silently 404 almost every request
# apps/web makes.
#
# The harder problem a prefix can't solve at all: several of those top-level
# API routes share their exact path with a client-side page route — GET
# /skills/{id} (JSON) is also the address of the Skill detail page
# (/skills/$skillId in apps/web/src/router.tsx), and GET /runs/{id} is also
# the Trace screen. apps/web/vite.config.ts says this in so many words: "the
# obvious dev setup — proxy a list of path prefixes — cannot work with these
# routes ... Proxying /skills breaks every deep link in the browser; not
# proxying it breaks fetch()." That file solves it in dev by NOT proxying
# (two origins, CORS instead). apps/platform/cmd/api/main.go solves the
# same problem for its own clean-mode bundle (SKILLHUB_CLEAN_MODE=1) with
# spaFallback/navigationCatcher — inspecting the API's response status and
# Content-Type in Go and swallowing a 404/405/2xx-JSON to hand back
# index.html instead. Neither mechanism runs outside its own case: dev-CORS
# only works with two origins, and clean mode's swallow logic lives inside
# cmd/api's own process, not in this nginx image sitting in front of a
# *separate* platform-api container.
#
# This config reaches for the same signal spaFallback itself starts from
# (its own comment: "Every client of this API is fetch(), which sends */* or
# application/json; a browser address bar is the only thing that says
# text/html") and stops there, without needing to inspect the response at
# all: a GET request whose Accept header contains text/html is a browser
# navigation, so it gets index.html and the client-side router decides what
# page that is; everything else (every fetch() call apps/web's api/*.ts
# modules make) is proxied straight to platform-api.
#
# That default is right for every current page/API path collision (measured
# against contracts/openapi/public.yaml and router.tsx on 2026-09-05) but
# wrong for the two routes in the table that ARE real browser navigations
# needing the API's own answer, not index.html: the GitHub OAuth redirect
# dance (/auth/github/login, /auth/github/callback — both 302) and a
# downloaded package's bytes (/downloads/{id}/content, reached by a plain
# <a href>, not fetch()). Those two prefixes are proxied unconditionally,
# ahead of the general rule, so they keep working under a browser's
# Accept: text/html.
#
# Known gap, honestly: this is a request-side approximation of a decision
# clean mode makes with the response in hand. It is complete for the routes
# that exist today. A future top-level GET route that is BOTH a real
# browser-navigation target (a redirect, a stream, anything not JSON) AND
# shares its exact path with a client-side page route would need its own
# unconditional location added here, the same way /auth/ and /downloads/ are
# — it will not be caught automatically. See infra/images/README.md's
# "服務映像" section for the fuller writeup.

map $http_accept $spa_fallback {
    default            "/__not_a_real_file__";
    "~*text/html"       "/index.html";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `platform-api` is resolved through Docker's embedded DNS (127.0.0.11 on
    # every compose/user-defined bridge network) into a variable rather than
    # a static `upstream` block: an `upstream` resolves its hostname once, at
    # config load, and refuses to start at all if that name is not there yet
    # (measured here: nginx exits with "host not found in upstream" if this
    # container starts before platform-api's DNS entry exists — a real
    # ordering nginx itself does not wait out). A variable is resolved lazily
    # per request instead, so nginx starts either way and only a request
    # arriving before platform-api is reachable fails, not the whole process.
    resolver 127.0.0.11 valid=10s;
    set $platform_api "http://platform-api:8080";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Not X-Forwarded-For for rate limiting purposes: apps/platform's own
    # limiter deliberately does not read it (NFR-001 clause 5's comment in
    # .env.example — "a header the client sets is a bucket the client
    # chooses"), so this is passed for logging only.

    # Container-level liveness probe (this file's own Dockerfile HEALTHCHECK).
    # Not `GET /` for this: an unadorned wget/curl sends no Accept header,
    # $spa_fallback then falls through to @api (proxy), and platform-api has
    # no route for "/" — a healthcheck against the SPA's own home page would
    # therefore measure platform-api's reachability, not nginx's own, and
    # fail with 404 whenever this container is healthy but its upstream
    # is not (measured here: exactly that combination stayed "unhealthy"
    # until this location was added). Nginx itself answering is the only
    # thing this container's healthcheck should assert.
    location = /healthz {
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # Vite's hashed build output; safe to cache hard since the filename
    # changes on content change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Real browser navigations the API must handle itself (see header
    # comment): the OAuth dance's redirects and a package download's stream.
    # Ahead of the general rule so Accept: text/html does not swallow them.
    location /auth/ {
        proxy_pass $platform_api;
    }

    location /downloads/ {
        proxy_pass $platform_api;
    }

    # Everything else: index.html for a browser navigation (client-side
    # router takes it from there), proxy for every fetch() call.
    location / {
        try_files $spa_fallback @api;
    }

    location @api {
        proxy_pass $platform_api;
    }
}
