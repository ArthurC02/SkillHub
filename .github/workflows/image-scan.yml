name: Image Scan

on:
  pull_request:
    paths:
      - 'infra/compose/**'
      - 'infra/images/platform/**'
      - 'infra/images/web/**'
      - 'infra/images/llm/**'
      - 'infra/images/postgres/**'
      - 'infra/images/sandboxd/**'
      - 'infra/images/devtools/**'
      - 'tools/ci/scan-images.sh'
      - '.github/workflows/image-scan.yml'
  push:
    branches: [main]
    paths:
      - 'infra/compose/**'
      - 'infra/images/platform/**'
      - 'infra/images/web/**'
      - 'infra/images/llm/**'
      - 'infra/images/postgres/**'
      - 'infra/images/sandboxd/**'
      - 'infra/images/devtools/**'
      - 'tools/ci/scan-images.sh'
      - '.github/workflows/image-scan.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SYFT: docker.io/anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
  GRYPE: docker.io/anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the compose and application images
        env:
          FAIL_ON_UPSTREAM: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: bash tools/ci/scan-images.sh

      - name: Keep the SBOMs and the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scan-${{ github.sha }}
          path: scan/
          retention-days: 90
