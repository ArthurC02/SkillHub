name: gVisor baseline

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      INCIDENT_ASSIGNEE: ${{ vars.SKILLHUB_INCIDENT_ASSIGNEE || github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baseline is N or N-1 and not older than 90 days
        run: |
          set -euo pipefail
          BASELINE=$(awk '!/^#/ && NF {print $1; exit}' infra/nodes/gvisor-baseline.txt)
          if [ "$BASELINE" = unset ]; then
            echo "::warning::gVisor baseline is unset — this check has never compared anything. It will stay green until infra/nodes/gvisor-baseline.txt names a version (04 甲-1)."
            {
              echo '### gVisor baseline: NOT CHECKED'
              echo
              echo '`infra/nodes/gvisor-baseline.txt` is `unset`, so neither the'
              echo 'N/N-1 comparison nor the escape-class advisory scan ran.'
              echo 'This job is green because there is no sandbox node to reconcile'
              echo 'against yet (04 甲-1), **not** because the baseline is current.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          gh api repos/google/gvisor/releases --jq \
            '[.[] | select(.prerelease == false)] | .[0,1].tag_name' > recent.txt
          AGE_DAYS=$(gh api repos/google/gvisor/releases --jq \
            '[.[] | select(.prerelease == false)][0].published_at | (now - fromdateiso8601) / 86400 | floor')
          FAIL=""
          grep -qx "$BASELINE" recent.txt || FAIL="baseline $BASELINE is not upstream N or N-1 ($(tr '\n' ' ' < recent.txt))"
          [ "$AGE_DAYS" -le 90 ] || FAIL="${FAIL:+$FAIL; }latest upstream release is ${AGE_DAYS}d old"
          [ -z "$FAIL" ] || { echo "FAIL=$FAIL" >> "$GITHUB_ENV"; echo "::error::$FAIL"; }

      - name: Recent suspected escape-class advisories
        if: ${{ env.SKIP != '1' }}
        run: |
          set -euo pipefail
          gh api repos/google/gvisor/security-advisories --jq \
            '.[] | select(.published_at != null)
                 | select((now - (.published_at | fromdateiso8601)) < 604800)
                 | select(.severity == "critical" or (.summary | ascii_downcase | test("escape")))
                 | [.ghsa_id, .severity, .summary, .html_url] | @tsv' > advisories.tsv \
            || { echo "::error::gVisor security-advisories feed unreachable — cannot conclude 'no new advisory'"; exit 1; }
          gh api repos/google/gvisor/releases --jq \
            '[.[] | select(.prerelease == false)][0]
             | select(.body != null and (.body | test("escape|CVE-"; "i")))
             | select((now - (.published_at | fromdateiso8601)) < 604800)
             | [.tag_name, .html_url] | @tsv' > relnotes.tsv \
            || { echo "::error::gVisor releases feed unreachable — cannot conclude 'no new advisory'"; exit 1; }
          if [ -s advisories.tsv ] || [ -s relnotes.tsv ]; then
            echo "ESCAPE=1" >> "$GITHUB_ENV"
            cat advisories.tsv relnotes.tsv
          else
            echo "::notice::both sources reachable, 0 suspected escape-class matches in the last 7 days ($(date -u +%F))"
          fi

      - name: File or update the issue
        if: ${{ env.FAIL != '' || env.ESCAPE == '1' }}
        run: bash tools/ci/gvisor-incident-issues.sh

      - name: Fail the run if the baseline drifted
        if: ${{ env.FAIL != '' || env.ESCAPE == '1' }}
        run: exit 1
