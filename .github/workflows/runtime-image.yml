name: Runtime Image

on:
  pull_request:
    paths:
      - 'infra/images/**'
      - '!infra/images/**/*.md'
      - '.github/workflows/runtime-image.yml'
      - 'tools/ci/scan_predicate.sh'
      - 'tools/devctl/image_*.go'
  push:
    branches: [main]
    paths:
      - 'infra/images/**'
      - '!infra/images/**/*.md'
      - '.github/workflows/runtime-image.yml'
      - 'tools/ci/scan_predicate.sh'
      - 'tools/devctl/image_*.go'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: skillhub/runtime-agent-sdk:ci
  # GHCR rejects mixed-case registry paths.
  REGISTRY_IMAGE: ghcr.io/arthurc02/skillhub-runtime-agent-sdk
  SYFT: docker.io/anchore/syft:v1.51.0@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
  GRYPE: docker.io/anchore/grype:v0.117.0@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253

jobs:
  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/devctl/go.mod
          cache: false

      - name: Source gates (I-05 version bump, I-02 digest pin, ADR-023 §4 upgrade record)
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --quiet origin "${{ github.base_ref }}"
              RANGE="origin/${{ github.base_ref }}...HEAD"
              ;;
            push) RANGE="${{ github.event.before }}..${{ github.sha }}" ;;
            *) RANGE="" ;;
          esac
          go -C tools/devctl run . image-gate --range "$RANGE"

      - name: Build
        run: docker build -t "$IMAGE" infra/images/runtime-agent-sdk

      - name: SBOM (I-03)
        run: |
          mkdir -p scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/scan:/scan" "$SYFT" "$IMAGE" -o spdx-json=/scan/sbom.spdx.json

      - name: Vulnerability report (I-04)
        run: |
          docker run --rm -v "$PWD/scan:/scan" "$GRYPE" sbom:/scan/sbom.spdx.json \
            -o table --file /scan/vulnerabilities.txt
          docker run --rm -v "$PWD/scan:/scan" "$GRYPE" sbom:/scan/sbom.spdx.json \
            -o json --file /scan/vulnerabilities.json
          {
            echo '### Runtime image scan'
            echo '```'
            head -40 scan/vulnerabilities.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the SBOM and the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-agent-sdk-scan-${{ github.sha }}
          path: scan/
          retention-days: 90

      # --only-fixed skips CVEs that Debian marks won't-fix.
      - name: Fail on fixable Critical/High (I-06, ADR-022)
        run: |
          docker run --rm -v "$PWD/scan:/scan" "$GRYPE" sbom:/scan/sbom.spdx.json \
            --only-fixed --fail-on high -o table

      - name: Build scan attestation predicate (I-04)
        run: bash tools/ci/scan_predicate.sh scan/vulnerabilities.json scan/scan-predicate.json

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Publish only a version the registry does not have yet
        id: version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG IMAGE_VERSION=\(.*\)$/\1/p' infra/images/runtime-agent-sdk/Dockerfile)
          [ -n "$version" ] || { echo "::error::ARG IMAGE_VERSION not found in Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if found=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$version" 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "$REGISTRY_IMAGE:$version is already published, and a version tag is never moved; nothing was pushed."
              grep -m1 'Digest:' <<<"$found" || true
            } >> "$GITHUB_STEP_SUMMARY"
          elif grep -qiE 'not found|manifest unknown|no such manifest' <<<"$found"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not tell whether $REGISTRY_IMAGE:$version exists: $found"
            exit 1
          fi

      - name: Push to GHCR
        id: push
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          docker tag "$IMAGE" "$REGISTRY_IMAGE:$version"
          docker tag "$IMAGE" "$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$REGISTRY_IMAGE:$version"
          docker push "$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $REGISTRY_IMAGE:$version@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the SBOM to the pushed digest (I-03)
        id: attest-sbom
        if: steps.push.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: scan/sbom.spdx.json
          push-to-registry: true
      - name: Attest the SBOM to the pushed digest (I-03, second attempt)
        if: steps.attest-sbom.outcome == 'failure'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: scan/sbom.spdx.json
          push-to-registry: true

      - name: Record the scan attestation (I-04)
        id: attest-scan
        if: steps.push.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://in-toto.io/attestation/vulns/v0.1
          predicate-path: scan/scan-predicate.json
          push-to-registry: true
      - name: Record the scan attestation (I-04, second attempt)
        if: steps.attest-scan.outcome == 'failure'
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://in-toto.io/attestation/vulns/v0.1
          predicate-path: scan/scan-predicate.json
          push-to-registry: true

  rescan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # the re-attestation is a registry write; see below
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Resolve the published digest
        id: published
        run: |
          version=$(sed -n 's/^ARG IMAGE_VERSION=\(.*\)$/\1/p' infra/images/runtime-agent-sdk/Dockerfile)
          docker pull "$REGISTRY_IMAGE:$version"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Re-scanning $REGISTRY_IMAGE:$version@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM and scan of the published digest
        run: |
          mkdir -p scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/scan:/scan" "$SYFT" \
            "$REGISTRY_IMAGE@${{ steps.published.outputs.digest }}" -o spdx-json=/scan/sbom.spdx.json
          docker run --rm -v "$PWD/scan:/scan" "$GRYPE" sbom:/scan/sbom.spdx.json \
            -o json --file /scan/vulnerabilities.json
          docker run --rm -v "$PWD/scan:/scan" "$GRYPE" sbom:/scan/sbom.spdx.json \
            -o table --file /scan/vulnerabilities.txt
          {
            echo '### Published image re-scan'
            echo '```'
            head -40 scan/vulnerabilities.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the re-scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-agent-sdk-rescan-${{ github.run_id }}
          path: scan/
          retention-days: 90

      - name: Re-attest the scan result (I-04 scanned_at)
        run: bash tools/ci/scan_predicate.sh scan/vulnerabilities.json scan/scan-predicate.json
      - uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.published.outputs.digest }}
          predicate-type: https://in-toto.io/attestation/vulns/v0.1
          predicate-path: scan/scan-predicate.json
          push-to-registry: true

      - name: Fail on fixable Critical/High in the published image (I-06)
        run: |
          docker run --rm -v "$PWD/scan:/scan" "$GRYPE" sbom:/scan/sbom.spdx.json \
            --only-fixed --fail-on high -o table
