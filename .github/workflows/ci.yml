name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      platform: ${{ steps.filter.outputs.platform }}
      llm: ${{ steps.filter.outputs.llm }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      qa002: ${{ steps.filter.outputs.qa002 }}
      pglite: ${{ steps.filter.outputs.pglite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client-ts/**'
              - 'docs/design/**'
              - '.github/workflows/ci.yml'
            platform:
              - 'apps/platform/**'
              - 'db/**'
              - 'contracts/**'
              - 'apps/llm/**'
              - '.github/workflows/ci.yml'
            llm:
              - 'apps/llm/**'
              - 'packages/api-stub-py/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            sandbox:
              - 'apps/sandbox/**'
              - 'contracts/**'
              - 'infra/images/**'
              - 'infra/egress/**'
              - 'tools/sec009/**'
              - '.github/workflows/ci.yml'
            qa002:
              - 'apps/platform/internal/skill/admission/**'
              - 'apps/platform/internal/shared/skillpkg/**'
              - 'tools/qa/**'
              - '.github/workflows/ci.yml'
            pglite:
              - 'tools/pglite/**'
              - 'tools/cleanmode/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci
        working-directory: packages/api-client-ts
      - if: runner.os == 'Linux'
        run: npm run typecheck
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm run format:check
      - if: runner.os == 'Linux'
        run: npm run lint
      - if: runner.os == 'Linux'
        run: npm run typecheck
      - run: npm test
      - if: runner.os == 'Linux'
        run: npm run build

  web-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: chromium firefox webkit
            projects: ""
          - os: windows-latest
            install: chromium
            projects: "--project=chromium"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.install }}
      - if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.install }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    services:
      postgres:
        image: docker.io/pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillhub_test?sslmode=disable
      SKILLHUB_REQUIRE_DB: "1"
      SKILLHUB_TEST_OBJSTORE_ENDPOINT: 127.0.0.1:8333
      SKILLHUB_REQUIRE_OBJSTORE: "1"
      SKILLHUB_CREATION_PYTHON: ${{ github.workspace }}/apps/llm/.venv/bin/python
      SKILLHUB_REQUIRE_CREATION_PYTHON: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start SeaweedFS (credentialed S3, for the SBX-008 grant tests)
        run: |
          docker run -d --name seaweedfs --network host \
            -v "$GITHUB_WORKSPACE/infra/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            docker.io/chrislusf/seaweedfs:3.80@sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for _ in $(seq 60); do
            if curl -fs -o /dev/null http://127.0.0.1:8333/status; then exit 0; fi
            sleep 1
          done
          echo "SeaweedFS never became ready"
          docker logs seaweedfs
          exit 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Sync the creation service's interpreter (Go-to-Python test)
        working-directory: apps/llm
        run: uv sync --frozen
      # A prebuilt golangci-lint rejects a config targeting a newer Go than it was built with,
      # so it is installed with the job's own toolchain.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - name: Check database-only immutability constraints
        run: |
          go test -count=1 ./internal/entrypoint/api/apiserver -run '^$'
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace:ro" \
            docker.io/pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f psql "$SKILLHUB_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 --single-transaction -f /workspace/db/tests/immutability_test.sql
      - name: Platform tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform tests' go test -count=1 ./...
      - name: Platform tests (race detector, database-free packages)
        run: |
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform race tests'             go test -race -count=1               ./cmd/...               ./internal/creator/...               ./internal/entrypoint/worker/...               ./internal/foundation/...               ./internal/product/...               ./internal/trial/evidence/...               ./internal/trial/execution/...
      - run: go build ./...

  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox
    env:
      SKILLHUB_REQUIRE_DOCKER: "1"
      # docker_test.go also reads SKILLHUB_SANDBOX_TEST_IMAGE; setting only this variable
      # keeps the other dockerdrv tests on busybox.
      RUNTIME_IMAGE_FOR_PROBE: ghcr.io/arthurc02/skillhub-runtime-agent-sdk:2026.08-10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - name: Pull the Runtime Image the P-02 probe dials from
        run: |
          docker pull "$RUNTIME_IMAGE_FOR_PROBE"
          docker tag "$RUNTIME_IMAGE_FOR_PROBE" skillhub/runtime-agent-sdk:2026.08-10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - name: Sandbox tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox tests' go test -count=1 ./...
      - name: Sandbox tests (race detector)
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox race tests' go test -race -count=1 ./internal/sandbox/... ./cmd/...
      - name: Gate A node probe self-check (SEC-009 T8)
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Gate A node probe self-check' python3 tools/sec009/t8-node-probe.py --self-check
      - name: Runtime workload script tests
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Runtime workload script tests' node --test infra/images/runtime-agent-sdk/run.test.mjs
      - run: go build ./...
      - name: Build the runtime image (SBX-002)
        run: docker build -t skillhub/runtime-agent-sdk:ci infra/images/runtime-agent-sdk
        working-directory: .
      - name: Install gVisor
        run: |
          set -euo pipefail
          BASELINE=$(awk '!/^#/ && NF {print $1; exit}' infra/nodes/gvisor-baseline.txt)
          if [ -z "$BASELINE" ] || [ "$BASELINE" = unset ]; then
            echo "::error::infra/nodes/gvisor-baseline.txt is unset; Suite 1 has no version to test"
            exit 1
          fi
          ARCH="$(uname -m)"
          # Release tags read `release-YYYYMMDD.N`; the download path drops the prefix.
          URL="https://storage.googleapis.com/gvisor/releases/release/${BASELINE#release-}/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512"                "${URL}/containerd-shim-runsc-v1" "${URL}/containerd-shim-runsc-v1.sha512"
          sha512sum -c runsc.sha512 -c containerd-shim-runsc-v1.sha512
          sudo install -m 0755 -t /usr/local/bin runsc containerd-shim-runsc-v1
          sudo runsc install
          sudo systemctl reload docker
        working-directory: .
      - name: Sandbox driver tests on gVisor
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox driver tests on gVisor' go test ./internal/dockerdrv/... -count=1
        env:
          SKILLHUB_SANDBOX_TEST_RUNTIME: runsc

  sandbox-windows:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go build ./...
      - run: go vet ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go test ./internal/localdrv/... -count=1

  llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/llm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/devctl/go.mod
          cache: false
      - run: go -C tools/devctl vet ./...
      - run: go -C tools/devctl test -race -count=1 ./...
      - name: Agent automation contract
        run: go -C tools/devctl run . automation-check
      - name: Generate portable Agent artifacts from Claude sources
        run: go -C tools/devctl run . agent-sync
      - name: Deterministic generated-output check
        run: go -C tools/devctl run . gen --check

      - name: redocly lint (contracts/openapi)
        run: npx --yes @redocly/cli@2.46.1 lint contracts/openapi/*.yaml

      - name: Trace event contract (contracts/events)
        run: |
          pip install jsonschema==4.26.0
          python tools/contracts/validate_trace_events.py

      - name: Packaging contracts (contracts/packaging)
        run: python tools/contracts/validate_packaging.py

      - name: Judge evidence-citation regression (ADR-043)
        run: python tools/eval-regression/test_judge_regression.py

  qa002:
    needs: changes
    if: needs.changes.outputs.qa002 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
      - name: Corpus generator self-test (offline)
        run: python tools/qa/skillpkg-corpus/generate.py --selftest
      - name: Build the QA-002 breaking corpus
        run: python tools/qa/skillpkg-corpus/generate.py --out "$RUNNER_TEMP/qa002"
      - name: QA-002 corpus
        working-directory: apps/platform
        env:
          QA002_CORPUS: ${{ runner.temp }}/qa002
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'QA-002 corpus' go test -count=1 ./internal/skill/admission -run QA002 -v

  tools-pglite:
    needs: changes
    if: needs.changes.outputs.pglite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pglite/package-lock.json
      - run: npm ci --prefix tools/pglite
      - name: PORT-001 acceptance checks
        run: node tools/pglite/verify.mjs
      - name: The acceptance checks must be able to fail
        run: |
          set -uo pipefail
          for mutation in multiplexer missing-row no-prune; do
            if node tools/pglite/verify.mjs "--mutate=$mutation"; then
              echo "::error::verify.mjs --mutate=$mutation exited 0; the check that mutation breaks is not asserting anything"
              exit 1
            fi
            echo "ok: --mutate=$mutation failed as it must"
          done

  images:
    # Jobs skipped by path filters count as success, so this blocks only on a real failure.
    if: ${{ !failure() && !cancelled() }}
    needs: [web, platform, llm, contracts-drift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build service images
        run: |
          set -euo pipefail
          # platform and web build from the repo root (go.work, packages/); llm builds from apps/llm.
          docker build -f infra/images/platform/Dockerfile -t "${REGISTRY}/skillhub-platform:${GITHUB_SHA}" .
          docker build -f infra/images/web/Dockerfile      -t "${REGISTRY}/skillhub-web:${GITHUB_SHA}" .
          docker build -f infra/images/llm/Dockerfile      -t "${REGISTRY}/skillhub-llm:${GITHUB_SHA}" apps/llm
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep skillhub-
      - name: Smoke the images before pushing them
        env:
          PLATFORM_IMAGE: ${{ env.REGISTRY }}/skillhub-platform:${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/skillhub-web:${{ github.sha }}
          LLM_IMAGE: ${{ env.REGISTRY }}/skillhub-llm:${{ github.sha }}
        run: bash tools/ci/stack-smoke.sh
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for svc in platform llm web; do
            docker push "${REGISTRY}/skillhub-${svc}:${GITHUB_SHA}"
          done
