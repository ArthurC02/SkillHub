name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters are hand-written (ADR-019 accepted cost of option D).
  # Adding a top-level directory means updating the filters below.
  #
  # Every filter used to carry a `!docs/**` rule, which does not mean what it
  # reads like. Rules are OR-ed and a negated rule matches every file the glob
  # does NOT match, so `!docs/**` matched any changed file outside docs/ and
  # turned all four filters on. One touched AGENTS.md ran the whole matrix; the
  # four filters were really one "is this push docs-only" question. Removed, and
  # the one thing that genuinely must run everything is now stated positively.
  #
  # Not the cause, checked and ruled out before touching this: `fetch-depth: 1`.
  # paths-filter fetches the push's before-commit itself (`git fetch --depth=1
  # --no-tags origin <sha>`) when it is missing, and the run logs show it doing
  # so and diffing correctly. Deepening the checkout here would fix nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      platform: ${{ steps.filter.outputs.platform }}
      llm: ${{ steps.filter.outputs.llm }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # This file is repeated in every filter on purpose: a change to the
          # filters cannot be scoped by the filters it is changing, so editing
          # CI runs the whole matrix and the change is seen doing its job.
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client-ts/**'
              - '.github/workflows/ci.yml'
            platform:
              - 'apps/platform/**'
              - 'db/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            llm:
              - 'apps/llm/**'
              - 'packages/api-stub-py/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            sandbox:
              - 'apps/sandbox/**'
              - 'contracts/**'
              - 'infra/images/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci
        working-directory: packages/api-client-ts
      - run: npm run typecheck
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ADR-036 / 03:QA-008. A separate job, not extra steps on `web`: this one
  # downloads three browser engines and the tier above answers in under a
  # minute, so folding them together would put the slow half in front of the
  # fast half's feedback on every push.
  #
  # No browser cache yet. `actions/cache` is not among the SHAs this repo has
  # pinned, and inventing one to save ninety seconds is the wrong trade against
  # a supply-chain rule the rest of this file keeps.
  web-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # ADR-036 §待決策 1, resolved in part. Two things about this app genuinely
    # differ by operating system and both are what the layout assertion
    # measures: `system-ui` resolves to Segoe UI here and to DejaVu/Cantarell on
    # the Linux runner, so text wraps at different widths; and Chromium on
    # Windows draws classic scrollbars that occupy 15-17px of layout, where
    # macOS and Linux draw overlay scrollbars that occupy none. A page that does
    # not scroll sideways on Linux can still do so on Windows.
    #
    # macOS is deliberately absent. Its runners bill at 10x against Windows's
    # 2x, and the gap it would close — "real Safari" — it does not actually
    # close, because Playwright ships its own WebKit build on macOS too. That
    # one stays open in ADR-036.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: chromium firefox webkit
            projects: ""
          - os: windows-latest
            install: chromium
            projects: "--project=chromium"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci
      # --with-deps installs OS packages and only means anything on Linux.
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.install }}
      - if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.install }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      # The report is only worth keeping when something failed; on a green run
      # it is a few hundred kilobytes saying so.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/web/playwright-report/
          retention-days: 7

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    # The cross-workspace authorization tests (CORE-006) skip themselves when
    # SKILLHUB_TEST_DATABASE_URL is unset, so without this service they would
    # pass by never running. A tenancy boundary nobody checks is not a boundary.
    services:
      postgres:
        image: docker.io/pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillhub_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      # golangci-lint-action installs a prebuilt binary, and a prebuilt binary
      # refuses to load a config whose module targets a newer Go than the one it
      # was itself built with:
      #
      #   can't load config: the Go language version (go1.26) used to build
      #   golangci-lint is lower than the targeted Go version (1.27.0)
      #
      # 9e4fb84 raised the floor to 1.27.0 on 2026-08-21, the day after v2.13.1
      # shipped, so this step has failed on every push since. The cost was not
      # the lint: the five `- run:` steps below live in the same job, so go vet,
      # the immutability SQL, `go test ./...` and `go build ./...` were skipped
      # rather than run, for four days and eight commits. Every "the suite is
      # green" in that window meant "it was green on someone's laptop".
      #
      # Building the pinned version with this job's own Go removes the coupling:
      # whatever toolchain compiles the tree compiles the linter. Still pinned
      # to v2.13.1 and still checksum-verified (module proxy + sumdb), so an
      # upstream release still cannot turn an untouched tree red.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - name: Check database-only immutability constraints
        run: |
          # The integration harness (TestMain runs the migrations) lives in
          # internal/entrypoint/api/apiserver owns the API-wide tests.
          go test -count=1 ./internal/entrypoint/api/apiserver -run '^$'
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace:ro" \
            docker.io/pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f psql "$SKILLHUB_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 --single-transaction -f /workspace/db/tests/immutability_test.sql
      # Test output goes to the step summary on failure. Job logs need admin
      # rights on the repository, so a leg that only fails on a machine nobody
      # has -- gVisor, a Linux runner, an empty database -- is otherwise a red
      # square with no way to read it. The summary is returned by the check-runs
      # API to anyone who can see the repository, which is the difference
      # between "it failed" and "here is what failed".
      - name: Platform tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform tests' go test ./...
      - run: go build ./...

  # apps/sandbox is its own Go module (ADR-019, iron rule 2), so it needs
  # its own job: the platform job's working-directory would never see it.
  #
  # GitHub-hosted runners have a Docker daemon, so the dockerdrv integration
  # tests run here for real rather than skipping. What they cannot cover is
  # gVisor used to be written off here on the grounds that runsc needs nested
  # virtualization (ADR-019 open question 3). **ADR-022 §0 overturned that**:
  # the systrap platform intercepts with seccomp + SIGSYS and needs no /dev/kvm,
  # so a GitHub-hosted ubuntu-latest is enough, and ADR-022 附錄 splits SEC-009
  # into a Suite 1 that needs only Linux + Docker + runsc and a Suite 2 that can
  # only run on the node about to join the pool. The comment outlived the
  # correction by a milestone and kept Suite 1 filed as impossible.
  #
  # The step below is Suite 1's first cut: the same driver assertions, on runsc.
  # It buys syscall-compatibility regression, which ADR-015 flags as recurring
  # whenever a Runtime is added. It buys **none** of the escape, egress,
  # credential-scope or cleanup testing — those measure the production node's own
  # configuration, so a different machine is a different subject and SEC-009 /
  # SBX-010 stay deployment-time acceptance (04 甲-1～甲-4).
  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      # Same build-it-here reason as the platform job above; apps/sandbox
      # carries the same 1.27.0 floor, so it holds the same landmine. It has not
      # gone off only because this job is path-filtered and no sandbox file has
      # changed since the bump.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      # Test output goes to the step summary on failure. Job logs need admin
      # rights on the repository, so a leg that only fails on a machine nobody
      # has -- gVisor, a Linux runner, an empty database -- is otherwise a red
      # square with no way to read it. The summary is returned by the check-runs
      # API to anyone who can see the repository, which is the difference
      # between "it failed" and "here is what failed".
      - name: Sandbox tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox tests' go test ./...
      - run: go build ./...
      - name: Build the runtime image (SBX-002)
        run: docker build -t skillhub/runtime-agent-sdk:ci infra/images/runtime-agent-sdk
        working-directory: .
      # SEC-009 Suite 1 (ADR-022 附錄). `latest` rather than a pin because the
      # pin belongs in infra/nodes/gvisor-baseline.txt and that file is still
      # `unset` — there is no node yet to be reconciled against. Point this at
      # the baseline the moment the first node fills it, so CI and the pool
      # cannot drift.
      - name: Install gVisor
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512"                "${URL}/containerd-shim-runsc-v1" "${URL}/containerd-shim-runsc-v1.sha512"
          sha512sum -c runsc.sha512 -c containerd-shim-runsc-v1.sha512
          sudo install -m 0755 -t /usr/local/bin runsc containerd-shim-runsc-v1
          sudo runsc install
          sudo systemctl reload docker
        working-directory: .
      # The driver tests again, on runsc this time. `Config.Runtime` has existed
      # since SBX-001 and no test had ever taken its non-empty path, so the knob
      # that implements ADR-015 was itself unexercised.
      #
      # TestRequestedRuntimeIsTheOneTheContainerGot fails rather than skips when
      # a runtime was explicitly asked for, which is what stops this step from
      # going green on a daemon that never heard of runsc — the same silent-zero
      # shape as 04 丙-36.
      # This leg has never passed. It was written in 15a9dd7 and GitHub runs a
      # push's workflow on the head commit only, so it did not execute then; the
      # next push that touched this file (b255333) ran it for the first time and
      # it went red. Until the output below is readable, nobody knows whether
      # that is a runsc syscall gap -- the recurring cost ADR-015 names -- or
      # something about the runner.
      - name: Sandbox driver tests on gVisor
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox driver tests on gVisor' go test ./internal/dockerdrv/... -count=1
        env:
          SKILLHUB_SANDBOX_TEST_RUNTIME: runsc

  llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/llm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  # Deliberately unfiltered: drift can also come from hand-editing generated
  # output, and such a commit never touches contracts/ (ADR-019 §3).
  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/devctl/go.mod
          cache: false
      # devctl carries six test files and until now no job ran one of them.
      # automation-check proves the checks execute; it cannot prove they still
      # detect anything -- a checker rewritten to `return nil` prints the same
      # green line. That is AGENTS.md rule 9 one level up, on the code that is
      # supposed to be this repo's immune system, so it runs before the checks
      # whose output the rest of this job trusts.
      - run: go -C tools/devctl vet ./...
      - run: go -C tools/devctl test ./...
      - name: Agent automation contract
        run: go -C tools/devctl run . automation-check
      # devctl reads the pinned sqlc version from tools/toolchain.yaml, writes
      # into same-filesystem scratch space, and compares every file including
      # untracked additions. CI and local development therefore use one path.
      - name: Deterministic generated-output check
        run: go -C tools/devctl run . gen --check

      # Iron rule 12's first half: the schema has to be valid before anything can
      # be generated from it. Pinned like sqlc above: a floating linter turns an
      # upstream release into a red build on an untouched tree.
      #
      # Errors fail, warnings do not. The tree carries 13 warnings on purpose:
      # info-license on all three files (nothing is published under a license
      # yet), no-server-example.com on public.yaml's localhost server, and the
      # 2xx/4xx-response rules on the OAuth redirect and 204 routes, which have
      # no other status to document. Promoting those to errors would mean
      # inventing responses the implementation does not return.
      - name: redocly lint (contracts/openapi)
        run: npx --yes @redocly/cli@2.46.1 lint contracts/openapi/*.yaml

      # Iron rule 12's other half: contracts/events is not OpenAPI, so redocly
      # never saw it. The validator has existed since M2 and the contract README
      # names it as the verification step, but no job ran it - a schema edit was
      # gated only by whoever remembered. Pinned like the tools above.
      - name: Trace event contract (contracts/events)
        run: |
          pip install jsonschema==4.26.0
          python tools/contracts/validate_trace_events.py

      # Same half of iron rule 12, third contract type: contracts/packaging holds
      # file formats (the manifest inside a downloaded zip, a packaging profile, a
      # portable test case), so neither redocly nor the trace validator sees them.
      # One of the consumers is outside this repository - the user unzipping the
      # package - which is exactly the consumer that cannot report drift.
      # jsonschema is already installed by the step above and pinned there.
      - name: Packaging contracts (contracts/packaging)
        run: python tools/contracts/validate_packaging.py

  # Registry is still open (ADR-019 open question 1) and infra/images/ has no
  # Dockerfiles yet, so this job only records the intended shape.
  images:
    # Filtered-out upstream jobs are skipped, not failed, so gate on !failure().
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled()
    needs: [web, platform, llm, sandbox, contracts-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Build and push service images
        run: |
          echo "Image build is not wired yet. Enable once infra/images/ holds the"
          echo "Dockerfiles and ADR-019 open question 1 (container registry) is closed."
          echo "Images are tagged with ${{ github.sha }}, never 'latest'."
