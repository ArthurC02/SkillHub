name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.web == 'true' }}
      platform: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.platform == 'true' }}
      llm: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.llm == 'true' }}
      sandbox: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.sandbox == 'true' }}
      qa002: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.qa002 == 'true' }}
      pglite: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.pglite == 'true' }}
      images: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.images == 'true' }}
      devtools: ${{ steps.filter.outputs.devtools == 'true' }}
      deploy: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.scope.outputs.all != 'true'
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client-ts/**'
              - 'docs/design/**'
              - '.github/workflows/ci.yml'
            platform:
              - 'apps/platform/**'
              - 'infra/images/seaweedfs/**'
              - 'infra/images/prometheus/summarize-tests.py'
              - 'tools/devctl/gateway_search_proof*'
              - 'tools/devctl/searchproof/**'
              - 'tools/devctl/main.go'
              - 'db/**'
              - 'contracts/**'
              - 'apps/llm/**'
              - 'tools/ci/**'
              - 'tools/toolchain.yaml'
              - '.github/actions/golangci-lint/**'
              - '.github/workflows/ci.yml'
            llm:
              - 'apps/llm/**'
              - 'packages/api-stub-py/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            sandbox:
              - 'apps/sandbox/**'
              - 'contracts/**'
              - 'infra/nodes/gvisor-baseline.txt'
              - 'infra/deploy/sandbox/daemon.json'
              - 'infra/images/runtime-agent-sdk/**'
              - 'infra/egress/**'
              - 'tools/sec009/**'
              - 'tools/ci/**'
              - 'tools/toolchain.yaml'
              - '.github/actions/golangci-lint/**'
              - '.github/workflows/ci.yml'
            qa002:
              - 'apps/platform/internal/skill/admission/**'
              - 'apps/platform/internal/shared/skillpkg/**'
              - 'tools/qa/**'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'
            pglite:
              - 'tools/pglite/**'
              - 'tools/cleanmode/**'
              - '.github/workflows/ci.yml'
            devtools:
              - 'infra/images/devtools/**'
              - '.devcontainer/**'
            images:
              - 'apps/platform/**'
              - 'apps/web/**'
              - 'apps/llm/**'
              - 'packages/**'
              - 'contracts/**'
              - 'db/**'
              - 'infra/images/platform/**'
              - 'infra/images/web/**'
              - 'infra/images/llm/**'
              - 'infra/images/postgres/**'
              - 'infra/images/seaweedfs/**'
              - 'infra/images/postgres-exporter/**'
              - 'infra/images/blackbox-exporter/**'
              - 'infra/images/caddy/**'
              - 'infra/images/prometheus/**'
              - 'infra/images/alertmanager/**'
              - 'apps/sandbox/**'
              - 'infra/images/sandboxd/**'
              - 'infra/compose/**'
              - 'infra/deploy/**'
              - 'tools/deploy/**'
              - 'tools/ci/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            deploy:
              - 'infra/images/caddy/**'
              - 'infra/images/prometheus/**'
              - 'infra/images/alertmanager/**'
              - 'infra/deploy/**'
              - 'infra/compose/control-plane.yml'
              - 'infra/compose/gateway.yml'
              - 'infra/observability/**'
              - 'infra/images/postgres/skillhub-*'
              - 'infra/images/runtime-agent-sdk/Dockerfile'
              - 'infra/egress/**'
              - 'infra/nodes/**'
              - 'tools/egress/**'
              - 'tools/ci/check_egress_allowlist.py'
              - 'tools/sec009/t8-node-probe.py'
              - 'tools/deploy/**'
              - 'tools/ci/deploy-config-check.sh'
              - '.github/workflows/ci.yml'

  gateway-search:
    needs: changes
    if: needs.changes.outputs.platform == 'true' || needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - name: Verify search permissions with the pinned gateway and local providers
        run: go -C tools/devctl run . gateway-search-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gateway-search-proof
          path: .devctl/scratchpad/gateway-search-proof-*/
          retention-days: 7

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 3 }
          - { os: ubuntu-latest, shard: 2, shards: 3 }
          - { os: ubuntu-latest, shard: 3, shards: 3 }
          - { os: windows-latest, shard: 1, shards: 3 }
          - { os: windows-latest, shard: 2, shards: 3 }
          - { os: windows-latest, shard: 3, shards: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci --no-audit
        working-directory: packages/api-client-ts
      - if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run typecheck
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci --no-audit
      - if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run format:check
      - if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run lint
      - if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run typecheck
      - run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - if: runner.os == 'Linux' && matrix.shard == 1
        run: npm run build

  web-browser-shards:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            shard: 1
            total: 2
            weights: "52:48"
          - os: ubuntu-latest
            browser: chromium
            shard: 2
            total: 2
            weights: "52:48"
          - os: ubuntu-latest
            browser: firefox
            shard: 1
            total: 2
            weights: "50:50"
          - os: ubuntu-latest
            browser: firefox
            shard: 2
            total: 2
            weights: "50:50"
          - os: ubuntu-latest
            browser: webkit
            shard: 1
            total: 2
            weights: "42:58"
          - os: ubuntu-latest
            browser: webkit
            shard: 2
            total: 2
            weights: "42:58"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci --no-audit
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci --no-audit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            playwright-debs-${{ runner.os }}-${{ matrix.browser }}-
            playwright-debs-${{ runner.os }}-
      - timeout-minutes: 9
        name: Install Linux browser dependencies
        run: |
          mkdir -p ~/playwright-debs
          find ~/playwright-debs -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' |
            sudo tee /etc/apt/apt.conf.d/80-stalled-mirror >/dev/null
          for attempt in 1 2 3; do
            sudo timeout -k 10 120 env "PATH=$PATH" npx playwright install-deps ${{ matrix.browser }} && break
            if [ "$attempt" = 3 ]; then
              echo "::error::playwright install-deps ${{ matrix.browser }} stalled or failed three times"
              exit 1
            fi
            echo "::warning::playwright install-deps attempt $attempt stalled past 120 s or failed; resuming"
            echo "::notice::Waiting for package manager locks before repairing packages"
            sudo python3 - <<'PY'
          import fcntl
          with open("/var/lib/dpkg/lock-frontend", "r+") as frontend, open("/var/lib/dpkg/lock", "r+") as database:
              for lock in (frontend, database):
                  fcntl.lockf(lock, fcntl.LOCK_EX)
          PY
            sudo dpkg --configure -a || sudo apt-get --fix-broken install --yes
          done
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/playwright-debs {} +
          npx playwright install ${{ matrix.browser }}
      - env:
          PWTEST_SHARD_WEIGHTS: ${{ matrix.weights }}
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.total }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  web-browser:
    needs: [changes, web-browser-shards]
    if: always() && needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BROWSER_SHARD_RESULT: ${{ needs.web-browser-shards.result }}
        run: |
          test "$BROWSER_SHARD_RESULT" = success
          echo "All browser shards passed."

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/platform
    services:
      postgres:
        image: docker.io/pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillhub_test?sslmode=disable
      SKILLHUB_REQUIRE_DB: "1"
      SKILLHUB_TEST_OBJSTORE_ENDPOINT: 127.0.0.1:8333
      SKILLHUB_REQUIRE_OBJSTORE: "1"
      SKILLHUB_CREATION_PYTHON: ${{ github.workspace }}/apps/llm/.venv/bin/python
      SKILLHUB_REQUIRE_CREATION_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the SeaweedFS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/seaweedfs/Dockerfile
          tags: skillhub-ci/seaweedfs:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=seaweedfs
          cache-to: type=gha,mode=max,scope=seaweedfs
      - name: Start SeaweedFS (credentialed S3, for the SBX-008 grant tests)
        run: |
          docker run -d --name seaweedfs --network host \
            -v "$GITHUB_WORKSPACE/infra/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            skillhub-ci/seaweedfs:${{ github.sha }} \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - run: go mod verify
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Sync the creation service's interpreter (Go-to-Python test)
        working-directory: apps/llm
        run: uv sync --frozen
      - name: Check database-only immutability constraints
        env:
          PSQL: docker run --rm -i --network host docker.io/pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47 psql
        run: |
          bash "$GITHUB_WORKSPACE/tools/ci/apply-sql.sh" "$GITHUB_WORKSPACE"/db/migrations/*.sql -- $PSQL "$SKILLHUB_TEST_DATABASE_URL"
          $PSQL "$SKILLHUB_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction <"$GITHUB_WORKSPACE/db/tests/immutability_test.sql"
      - name: Apply new migrations to a database that already holds data
        env:
          PSQL: docker run --rm -i --network host docker.io/pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47 psql
        run: |
          $PSQL postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE skillhub_upgrade'
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Upgrade with data' \
            bash "$GITHUB_WORKSPACE/db/tests/upgrade_with_data.sh" 'postgres://postgres:postgres@localhost:5432/skillhub_upgrade?sslmode=disable'
      - name: Wait for SeaweedFS to answer
        run: |
          for _ in $(seq 60); do
            if curl -fs -o /dev/null http://127.0.0.1:8333/status; then exit 0; fi
            sleep 1
          done
          echo "SeaweedFS never became ready"
          docker logs seaweedfs
          exit 1
      - name: Platform tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform tests' go test -count=1 ./...
      - run: go build ./...

  platform-lint:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - uses: ./.github/actions/golangci-lint
      - name: golangci-lint (an exclusion that matches nothing fails)
        run: |
          set -o pipefail
          golangci-lint run 2>&1 | tee "$RUNNER_TEMP/golangci-lint.log"
          if grep -F "Skipped 0 issues by rules" "$RUNNER_TEMP/golangci-lint.log"; then
            echo "::error file=apps/platform/.golangci.yml::an exclusion rule matches nothing; delete it"
            exit 1
          fi
      - run: golangci-lint fmt --diff
      - run: go vet ./...

  platform-race:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/platform
    env:
      SKILLHUB_CREATION_PYTHON: ${{ github.workspace }}/apps/llm/.venv/bin/python
      SKILLHUB_REQUIRE_CREATION_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Sync the creation service's interpreter (Go-to-Python test)
        working-directory: apps/llm
        run: uv sync --frozen
      - name: Platform tests (race detector, database-free packages)
        run: >-
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform race tests'
          go test -race -count=1 ./cmd/... ./internal/creator/... ./internal/entrypoint/worker/... ./internal/foundation/... ./internal/product/... ./internal/trial/evidence/... ./internal/trial/execution/...

  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/sandbox
    env:
      SKILLHUB_REQUIRE_DOCKER: "1"
      # docker_test.go also reads SKILLHUB_SANDBOX_TEST_IMAGE; setting only this variable
      # keeps the other dockerdrv tests on busybox.
      RUNTIME_IMAGE_FOR_PROBE: ghcr.io/arthurc02/skillhub-runtime-agent-sdk@sha256:042d9b91cbacc7c9718a1d3a20800777e48895c227d9a1b01c9e1c95c90aafaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - run: go mod verify
      - name: Pull the Runtime Image the P-02 probe dials from
        run: |
          docker pull "$RUNTIME_IMAGE_FOR_PROBE"
          docker tag "$RUNTIME_IMAGE_FOR_PROBE" skillhub/runtime-agent-sdk:2026.08-27
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/golangci-lint
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - name: Sandbox tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox tests' go test -count=1 ./...
      - name: Sandbox tests (race detector)
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox race tests' go test -race -count=1 ./internal/sandbox/... ./cmd/...
      - name: Gate A node probe self-check (SEC-009 T8)
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Gate A node probe self-check' python3 tools/sec009/t8-node-probe.py --self-check
      - name: Install the runtime image's locked dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix infra/images/runtime-agent-sdk --no-audit --no-fund
      - name: Runtime workload script tests
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Runtime workload script tests' node --test infra/images/runtime-agent-sdk/run.test.mjs
      - run: go build ./...
      - name: Install gVisor
        run: |
          set -euo pipefail
          BASELINE=$(awk '!/^#/ && NF {print $1; exit}' infra/nodes/gvisor-baseline.txt)
          if [ -z "$BASELINE" ] || [ "$BASELINE" = unset ]; then
            echo "::error::infra/nodes/gvisor-baseline.txt is unset; Suite 1 has no version to test"
            exit 1
          fi
          ARCH="$(uname -m)"
          # Release tags read `release-YYYYMMDD.N`; the download path drops the prefix.
          URL="https://storage.googleapis.com/gvisor/releases/release/${BASELINE#release-}/${ARCH}"
          EXPECTED=$(awk -v a="$ARCH" '$1 == "sha512" && $2 == a {print $3}' infra/nodes/gvisor-baseline.txt)
          if [ -z "$EXPECTED" ]; then
            echo "::error::infra/nodes/gvisor-baseline.txt pins no sha512 for $ARCH"
            exit 1
          fi
          wget -q "${URL}/gvisor.tar.zstd"
          echo "$EXPECTED  gvisor.tar.zstd" | sha512sum -c -
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          rm -f gvisor.tar.zstd
          mapfile -t RUNSC_ARGS < <(jq -r '.runtimes.runsc.runtimeArgs[]' infra/deploy/sandbox/daemon.json)
          sudo runsc install -- "${RUNSC_ARGS[@]}"
          sudo systemctl reload docker
          diff <(jq -c '.runtimes.runsc.runtimeArgs' infra/deploy/sandbox/daemon.json) \
               <(docker info --format '{{json .Runtimes.runsc.Args}}' | jq -c .)
        working-directory: .
      - name: Sandbox driver tests on gVisor
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox driver tests on gVisor' go test ./internal/dockerdrv/... -count=1
        env:
          SKILLHUB_SANDBOX_TEST_RUNTIME: runsc

  sandbox-escape:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The negative control runs first and on its own: if the probes cannot
      # see an escape without a sandbox, everything after it measures nothing.
      - name: SEC-009 T1 negative control
        env:
          SEC009_NO_SANDBOX: "1"
        run: bash tools/ci/report-failure.sh 'SEC-009 T1 negative control' bash tools/sec009/t1-escape-attempts.sh
      - name: SEC-009 T1 escape attempts under gVisor
        run: bash tools/ci/report-failure.sh 'SEC-009 T1 escape attempts' bash tools/sec009/t1-escape-attempts.sh
      - name: gVisor smoke
        run: bash tools/ci/report-failure.sh 'gVisor smoke' bash tools/sec009/gvisor-smoke.sh
      # A short run is a procedure check. The acceptance duration is 4x1800s
      # and belongs to the run on a real node, not to every pull request.
      - name: SEC-009 T2 syscall fuzz (procedure check)
        env:
          SEC009_FUZZ_SECONDS: "60"
        run: bash tools/ci/report-failure.sh 'SEC-009 T2 syscall fuzz' bash tools/sec009/t2-syscall-fuzz.sh

  sandbox-nodocker:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/sandbox
    env:
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Sandbox tests with no container runtime in reach
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox tests without a container runtime' go test -count=1 ./...
      - name: The local driver's ceilings hold without a container
        env:
          SKILLHUB_REQUIRE_CGROUP: "1"
        run: |
          go test -c -o /tmp/localdrv.test ./internal/localdrv/
          cd internal/localdrv
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Local driver ceilings' \
            bash "$GITHUB_WORKSPACE/tools/ci/with-delegated-cgroup.sh" \
            /tmp/localdrv.test -test.run Ceiling -test.v

  sandbox-windows:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: go build ./...
      - run: go vet ./...
      - uses: ./.github/actions/golangci-lint
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go test ./internal/localdrv/... -count=1

  llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  devctl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/devctl/go.mod
          cache-dependency-path: |
            tools/devctl/go.mod
            apps/platform/go.sum
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - uses: ./.github/actions/golangci-lint
      - run: golangci-lint run
        working-directory: tools/devctl
      - run: golangci-lint fmt --diff
        working-directory: tools/devctl
      - run: go -C tools/devctl vet ./...
      - name: Hook launcher toolchain
        run: rustup toolchain install
        working-directory: tools/harness
      - name: Hook launcher lint
        run: cargo fmt --check && cargo clippy --quiet --all-targets -- -D warnings
        working-directory: tools/harness
      - name: Hook launcher tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'hook launcher tests' cargo test --quiet --manifest-path tools/harness/Cargo.toml
      - name: Install the pinned Domain Memory plugin
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'install the pinned Domain Memory plugin' go -C tools/devctl run . domain-memory-install
      - name: devctl tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'devctl tests' go -C tools/devctl test -race -count=1 ./...
      - name: Agent automation contract
        run: go -C tools/devctl run . automation-check
      - name: Generate portable Agent artifacts from Claude sources
        run: go -C tools/devctl run . agent-sync

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/devctl/go.mod
          cache-dependency-path: |
            apps/platform/go.sum
            apps/sandbox/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Shipped dependencies — fixable vulnerabilities, licenses, workflow audit
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Dependency audit' go -C tools/devctl run . dep-audit
      - name: Every project — fixable vulnerabilities (dev dependencies too), licenses, workflow audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Full dependency audit' go -C tools/devctl run . dep-audit --full

  contracts-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/devctl/go.mod
          cache: false
      - name: Key the codegen images by their sources and image tags only
        id: codegen-key
        run: echo "hash=$({ cat $(git ls-files tools/codegen); grep -E '_codegen:' tools/toolchain.yaml; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: codegen-images
        with:
          path: ~/codegen-images.tar
          key: codegen-images-${{ steps.codegen-key.outputs.hash }}
      - if: steps.codegen-images.outputs.cache-hit == 'true'
        name: Load the codegen images built by an earlier run of the same sources
        run: docker load -i ~/codegen-images.tar
      - name: Deterministic generated-output check
        env:
          SKILLHUB_CODEGEN_IMAGES_PREBUILT: ${{ steps.codegen-images.outputs.cache-hit }}
        run: go -C tools/devctl run . gen --check
      - if: steps.codegen-images.outputs.cache-hit != 'true'
        name: Save the codegen images for the next run of the same sources
        run: docker save -o ~/codegen-images.tar $(grep -o '"skillhub/[^"]*"' tools/toolchain.yaml | tr -d '"')

      - name: redocly lint (contracts/openapi)
        run: npx --yes @redocly/cli@2.71.0 lint contracts/openapi/*.yaml

      - name: Event contracts (contracts/events)
        run: |
          pip install jsonschema==4.26.0
          python tools/contracts/validate_trace_events.py
          python tools/contracts/validate_egress_records.py

      - name: Packaging contracts (contracts/packaging)
        run: python tools/contracts/validate_packaging.py

      - name: Judge evidence-citation regression
        run: python tools/eval-regression/test_judge_regression.py

      - name: Creation frozen-set comparison
        run: python tools/eval-regression/test_creation_frozen_compare.py

      - name: Capability-set import into test cases
        run: python tools/eval-regression/skill-capability/test_import_test_cases.py

      - name: Tools scripts — complexity gate
        run: |
          pip install ruff==0.17.2
          ruff check tools --config tools/ruff.toml

      - name: Shell scripts
        run: bash tools/ci/shell-lint.sh

      - name: Install the pinned Domain Memory plugin
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'install the pinned Domain Memory plugin' go -C tools/devctl run . domain-memory-install

      - name: Tools scripts — characterisation tests
        run: |
          pip install PyYAML==6.0.2
          for test in tools/*/test_*_characterization.py; do
            echo "== $test"
            python "$test"
          done

      - name: Data readiness — no ratio below its baseline
        run: >-
          bash tools/ci/report-failure.sh 'Data readiness'
          python tools/data-readiness/measure_readiness.py --repo-root .
          --baseline tools/data-readiness/baseline.json --targets tools/data-readiness/targets.json
          --fail-on-regression

      - name: Data readiness — every known answer still holds
        run: >-
          bash tools/ci/report-failure.sh 'Known answers'
          python tools/data-readiness/known_answers.py check --repo-root .

      - name: Domain Memory attested commits carry their packages
        run: >-
          bash tools/ci/report-failure.sh 'Domain Memory attestation audit'
          .domain-memory/domain-memory audit-attestations
          --repo-root . --changes-root docs/domain-memory/changes

  qa002:
    needs: changes
    if: needs.changes.outputs.qa002 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: apps/llm/.python-version
      - name: Corpus generator self-test (offline)
        run: python tools/qa/skillpkg-corpus/generate.py --selftest
      - name: Build the QA-002 breaking corpus
        run: python tools/qa/skillpkg-corpus/generate.py --out "$RUNNER_TEMP/qa002"
      - name: QA-002 corpus
        working-directory: apps/platform
        env:
          QA002_CORPUS: ${{ runner.temp }}/qa002
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'QA-002 corpus' go test -count=1 ./internal/skill/admission -run QA002 -v

  tools-pglite:
    needs: changes
    if: needs.changes.outputs.pglite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/pglite/package-lock.json
      - run: npm ci --prefix tools/pglite
      - name: PORT-001 acceptance checks
        run: node tools/pglite/verify.mjs
      - name: The acceptance checks must be able to fail
        run: |
          set -uo pipefail
          for mutation in multiplexer missing-row no-prune; do
            if node tools/pglite/verify.mjs "--mutate=$mutation"; then
              echo "::error::verify.mjs --mutate=$mutation exited 0; the check that mutation breaks is not asserting anything"
              exit 1
            fi
            echo "ok: --mutate=$mutation failed as it must"
          done

  deploy-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render, validate and lint the node deployment
        run: bash tools/ci/deploy-config-check.sh

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/platform/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-platform:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/web/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-web:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build the llm image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/llm
          file: infra/images/llm/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-llm:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=llm
          cache-to: type=gha,mode=max,scope=llm
      - name: Build the SeaweedFS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/seaweedfs/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-seaweedfs:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=seaweedfs
          cache-to: type=gha,mode=max,scope=seaweedfs
      - name: Smoke the images before pushing them
        env:
          PLATFORM_IMAGE: ${{ env.REGISTRY }}/skillhub-platform:${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/skillhub-web:${{ github.sha }}
          LLM_IMAGE: ${{ env.REGISTRY }}/skillhub-llm:${{ github.sha }}
          SEAWEEDFS_IMAGE: ${{ env.REGISTRY }}/skillhub-seaweedfs:${{ github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Stack smoke' bash tools/ci/stack-smoke.sh

  images-postgres-sandboxd:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images/postgres
          tags: ${{ env.REGISTRY }}/skillhub-postgres:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Build the SeaweedFS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/seaweedfs/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-seaweedfs:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=seaweedfs
          cache-to: type=gha,mode=max,scope=seaweedfs
      - name: Back up, restore and compare before pushing it
        env:
          POSTGRES_IMAGE: ${{ env.REGISTRY }}/skillhub-postgres:${{ github.sha }}
          SEAWEEDFS_IMAGE: ${{ env.REGISTRY }}/skillhub-seaweedfs:${{ github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Backup drill' bash tools/ci/backup-drill.sh
      - name: Build the postgres-exporter image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images/postgres-exporter
          tags: ${{ env.REGISTRY }}/skillhub-postgres-exporter:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=postgres-exporter
          cache-to: type=gha,mode=max,scope=postgres-exporter
      - name: Collect real database metrics and reject invalid credentials
        env:
          POSTGRES_IMAGE: ${{ env.REGISTRY }}/skillhub-postgres:${{ github.sha }}
          POSTGRES_EXPORTER_IMAGE: ${{ env.REGISTRY }}/skillhub-postgres-exporter:${{ github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Postgres exporter smoke' bash tools/ci/postgres-exporter-smoke.sh
      - name: Build the blackbox-exporter image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images/blackbox-exporter
          tags: ${{ env.REGISTRY }}/skillhub-blackbox-exporter:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=blackbox-exporter
          cache-to: type=gha,mode=max,scope=blackbox-exporter
      - name: Distinguish healthy and failed HTTP and TCP probes
        env:
          BLACKBOX_EXPORTER_IMAGE: ${{ env.REGISTRY }}/skillhub-blackbox-exporter:${{ github.sha }}
          PROBE_TARGET_IMAGE: python:3.15.2-slim-bookworm@sha256:96599df822d0e1c6bb700014a05c7f3c8cabc6e0f7ff3c4f9f69cee033b4b5d9
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Blackbox exporter smoke' bash tools/ci/blackbox-exporter-smoke.sh
      - name: Build the caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images/caddy
          tags: ${{ env.REGISTRY }}/skillhub-caddy:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Verify proxy compression, security headers and failure status
        env:
          CADDY_IMAGE: ${{ env.REGISTRY }}/skillhub-caddy:${{ github.sha }}
          PROBE_TARGET_IMAGE: python:3.15.2-slim-bookworm@sha256:96599df822d0e1c6bb700014a05c7f3c8cabc6e0f7ff3c4f9f69cee033b4b5d9
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Caddy smoke' bash tools/ci/caddy-smoke.sh
      - name: Build the alertmanager image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images/alertmanager
          tags: ${{ env.REGISTRY }}/skillhub-alertmanager:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=alertmanager
          cache-to: type=gha,mode=max,scope=alertmanager
      - name: Verify alert lifecycle, local notifications and UI
        env:
          ALERTMANAGER_IMAGE: ${{ env.REGISTRY }}/skillhub-alertmanager:${{ github.sha }}
          PROBE_TARGET_IMAGE: python:3.15.2-slim-bookworm@sha256:96599df822d0e1c6bb700014a05c7f3c8cabc6e0f7ff3c4f9f69cee033b4b5d9
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Alertmanager smoke' bash tools/ci/alertmanager-smoke.sh
      - name: Build the sandboxd image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/sandboxd/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-sandboxd:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=sandboxd
          cache-to: type=gha,mode=max,scope=sandboxd
      - name: The sandboxd binary runs and refuses to start without a token
        env:
          SANDBOXD_IMAGE: ${{ env.REGISTRY }}/skillhub-sandboxd:${{ github.sha }}
        run: |
          set -uo pipefail
          status=0
          output=$(docker run --rm "$SANDBOXD_IMAGE" 2>&1) || status=$?
          echo "$output"
          [ "$status" = 1 ] && grep -q 'SKILLHUB_SANDBOX_TOKEN is required' <<<"$output"

  images-prometheus:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the prometheus image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images/prometheus
          tags: ${{ env.REGISTRY }}/skillhub-prometheus:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=prometheus
          cache-to: type=gha,mode=max,scope=prometheus
      - name: Verify preserved data, queries, rules, UI and remote-read limits
        env:
          PROMETHEUS_IMAGE: ${{ env.REGISTRY }}/skillhub-prometheus:${{ github.sha }}
          PROBE_TARGET_IMAGE: python:3.15.2-slim-bookworm@sha256:96599df822d0e1c6bb700014a05c7f3c8cabc6e0f7ff3c4f9f69cee033b4b5d9
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Prometheus smoke' bash tools/ci/prometheus-smoke.sh

  devtools-image:
    needs: changes
    if: needs.changes.outputs.devtools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Dev Container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/devtools/Dockerfile
          push: false

  images-push:
    needs: [images, images-postgres-sandboxd, images-prometheus, web, web-browser, platform, platform-lint, platform-race, llm, sandbox, devctl, contracts-drift, dependency-audit]
    if: ${{ !failure() && !cancelled() && needs.images.result == 'success' && needs.images-postgres-sandboxd.result == 'success' && needs.images-prometheus.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: platform, context: ., file: infra/images/platform/Dockerfile }
          - { image: web, context: ., file: infra/images/web/Dockerfile }
          - { image: llm, context: apps/llm, file: infra/images/llm/Dockerfile }
          - { image: postgres, context: infra/images/postgres, file: infra/images/postgres/Dockerfile }
          - { image: seaweedfs, context: ., file: infra/images/seaweedfs/Dockerfile }
          - { image: postgres-exporter, context: infra/images/postgres-exporter, file: infra/images/postgres-exporter/Dockerfile }
          - { image: blackbox-exporter, context: infra/images/blackbox-exporter, file: infra/images/blackbox-exporter/Dockerfile }
          - { image: caddy, context: infra/images/caddy, file: infra/images/caddy/Dockerfile }
          - { image: prometheus, context: infra/images/prometheus, file: infra/images/prometheus/Dockerfile }
          - { image: alertmanager, context: infra/images/alertmanager, file: infra/images/alertmanager/Dockerfile }
          - { image: sandboxd, context: ., file: infra/images/sandboxd/Dockerfile }
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.image == 'prometheus' || matrix.image == 'seaweedfs') && 45 || 15 }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ env.REGISTRY }}/skillhub-${{ matrix.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
