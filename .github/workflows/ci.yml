name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.web == 'true' }}
      platform: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.platform == 'true' }}
      llm: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.llm == 'true' }}
      sandbox: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.sandbox == 'true' }}
      qa002: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.qa002 == 'true' }}
      pglite: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.pglite == 'true' }}
      images: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.images == 'true' }}
      deploy: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.deploy == 'true' }}
      domain-memory: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.domain-memory == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.scope.outputs.all != 'true'
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client-ts/**'
              - 'docs/design/**'
              - '.github/workflows/ci.yml'
            platform:
              - 'apps/platform/**'
              - 'db/**'
              - 'contracts/**'
              - 'apps/llm/**'
              - 'tools/ci/**'
              - 'tools/toolchain.yaml'
              - '.github/actions/golangci-lint/**'
              - '.github/workflows/ci.yml'
            llm:
              - 'apps/llm/**'
              - 'packages/api-stub-py/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            sandbox:
              - 'apps/sandbox/**'
              - 'contracts/**'
              - 'infra/images/runtime-agent-sdk/**'
              - 'infra/egress/**'
              - 'tools/sec009/**'
              - 'tools/ci/**'
              - 'tools/toolchain.yaml'
              - '.github/actions/golangci-lint/**'
              - '.github/workflows/ci.yml'
            qa002:
              - 'apps/platform/internal/skill/admission/**'
              - 'apps/platform/internal/shared/skillpkg/**'
              - 'tools/qa/**'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'
            pglite:
              - 'tools/pglite/**'
              - 'tools/cleanmode/**'
              - '.github/workflows/ci.yml'
            images:
              - 'apps/platform/**'
              - 'apps/web/**'
              - 'apps/llm/**'
              - 'packages/**'
              - 'contracts/**'
              - 'db/**'
              - 'infra/images/platform/**'
              - 'infra/images/web/**'
              - 'infra/images/llm/**'
              - 'infra/images/postgres/**'
              - 'apps/sandbox/**'
              - 'infra/images/sandboxd/**'
              - 'infra/compose/**'
              - 'infra/deploy/**'
              - 'tools/deploy/**'
              - 'tools/ci/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            deploy:
              - 'infra/deploy/**'
              - 'infra/compose/control-plane.yml'
              - 'infra/compose/gateway.yml'
              - 'infra/observability/**'
              - 'infra/images/postgres/skillhub-*'
              - 'infra/images/runtime-agent-sdk/Dockerfile'
              - 'infra/egress/**'
              - 'infra/nodes/**'
              - 'tools/egress/**'
              - 'tools/ci/check_egress_allowlist.py'
              - 'tools/sec009/t8-node-probe.py'
              - 'tools/deploy/**'
              - 'tools/ci/deploy-config-check.sh'
              - '.github/workflows/ci.yml'
            domain-memory:
              - '.claude/skills/domain-memory/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci
        working-directory: packages/api-client-ts
      - if: runner.os == 'Linux'
        run: npm run typecheck
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm run format:check
      - if: runner.os == 'Linux'
        run: npm run lint
      - if: runner.os == 'Linux'
        run: npm run typecheck
      - run: npm test
      - if: runner.os == 'Linux'
        run: npm run build

  web-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: chromium firefox webkit
            projects: ""
          - os: windows-latest
            install: chromium
            projects: "--project=chromium"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/api-client-ts/package-lock.json
      - run: npm ci
        working-directory: packages/api-client-ts
      - run: npm run build
        working-directory: packages/api-client-ts
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.install }}
      - if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.install }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform
    services:
      postgres:
        image: docker.io/pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillhub_test?sslmode=disable
      SKILLHUB_REQUIRE_DB: "1"
      SKILLHUB_TEST_OBJSTORE_ENDPOINT: 127.0.0.1:8333
      SKILLHUB_REQUIRE_OBJSTORE: "1"
      SKILLHUB_CREATION_PYTHON: ${{ github.workspace }}/apps/llm/.venv/bin/python
      SKILLHUB_REQUIRE_CREATION_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start SeaweedFS (credentialed S3, for the SBX-008 grant tests)
        run: |
          docker run -d --name seaweedfs --network host \
            -v "$GITHUB_WORKSPACE/infra/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for _ in $(seq 60); do
            if curl -fs -o /dev/null http://127.0.0.1:8333/status; then exit 0; fi
            sleep 1
          done
          echo "SeaweedFS never became ready"
          docker logs seaweedfs
          exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - run: go mod verify
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Sync the creation service's interpreter (Go-to-Python test)
        working-directory: apps/llm
        run: uv sync --frozen
      - uses: ./.github/actions/golangci-lint
      - name: golangci-lint (an exclusion that matches nothing fails)
        run: |
          golangci-lint run 2>&1 | tee "$RUNNER_TEMP/golangci-lint.log"
          if grep -F "Skipped 0 issues by rules" "$RUNNER_TEMP/golangci-lint.log"; then
            echo "::error file=apps/platform/.golangci.yml::an exclusion rule matches nothing; delete it"
            exit 1
          fi
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - name: Check database-only immutability constraints
        run: |
          go test -count=1 ./internal/entrypoint/api/apiserver -run '^$'
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace:ro" \
            docker.io/pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a psql "$SKILLHUB_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 --single-transaction -f /workspace/db/tests/immutability_test.sql
      - name: Apply new migrations to a database that already holds data
        env:
          PSQL: docker run --rm -i --network host docker.io/pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a psql
        run: |
          $PSQL postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE skillhub_upgrade'
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Upgrade with data' \
            bash "$GITHUB_WORKSPACE/db/tests/upgrade_with_data.sh" 'postgres://postgres:postgres@localhost:5432/skillhub_upgrade?sslmode=disable'
      - name: Platform tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform tests' go test -count=1 ./...
      - name: Platform tests (race detector, database-free packages)
        run: |
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Platform race tests'             go test -race -count=1               ./cmd/...               ./internal/creator/...               ./internal/entrypoint/worker/...               ./internal/foundation/...               ./internal/product/...               ./internal/trial/evidence/...               ./internal/trial/execution/...
      - run: go build ./...

  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/sandbox
    env:
      SKILLHUB_REQUIRE_DOCKER: "1"
      # docker_test.go also reads SKILLHUB_SANDBOX_TEST_IMAGE; setting only this variable
      # keeps the other dockerdrv tests on busybox.
      RUNTIME_IMAGE_FOR_PROBE: ghcr.io/arthurc02/skillhub-runtime-agent-sdk@sha256:789d20e50701ec1eb199a55f823522ec642e2c05554652ee52f789bf9b22f00a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - run: go mod verify
      - name: Pull the Runtime Image the P-02 probe dials from
        run: |
          docker pull "$RUNTIME_IMAGE_FOR_PROBE"
          docker tag "$RUNTIME_IMAGE_FOR_PROBE" skillhub/runtime-agent-sdk:2026.08-18
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/golangci-lint
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - name: Sandbox tests
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox tests' go test -count=1 ./...
      - name: Sandbox tests (race detector)
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox race tests' go test -race -count=1 ./internal/sandbox/... ./cmd/...
      - name: Gate A node probe self-check (SEC-009 T8)
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Gate A node probe self-check' python3 tools/sec009/t8-node-probe.py --self-check
      - name: Runtime workload script tests
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Runtime workload script tests' node --test infra/images/runtime-agent-sdk/run.test.mjs
      - run: go build ./...
      - name: Install gVisor
        run: |
          set -euo pipefail
          BASELINE=$(awk '!/^#/ && NF {print $1; exit}' infra/nodes/gvisor-baseline.txt)
          if [ -z "$BASELINE" ] || [ "$BASELINE" = unset ]; then
            echo "::error::infra/nodes/gvisor-baseline.txt is unset; Suite 1 has no version to test"
            exit 1
          fi
          ARCH="$(uname -m)"
          # Release tags read `release-YYYYMMDD.N`; the download path drops the prefix.
          URL="https://storage.googleapis.com/gvisor/releases/release/${BASELINE#release-}/${ARCH}"
          EXPECTED=$(awk -v a="$ARCH" '$1 == "sha512" && $2 == a {print $3}' infra/nodes/gvisor-baseline.txt)
          if [ -z "$EXPECTED" ]; then
            echo "::error::infra/nodes/gvisor-baseline.txt pins no sha512 for $ARCH"
            exit 1
          fi
          wget -q "${URL}/gvisor.tar.zstd"
          echo "$EXPECTED  gvisor.tar.zstd" | sha512sum -c -
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          rm -f gvisor.tar.zstd
          mapfile -t RUNSC_ARGS < <(jq -r '.runtimes.runsc.runtimeArgs[]' infra/deploy/sandbox/daemon.json)
          sudo runsc install -- "${RUNSC_ARGS[@]}"
          sudo systemctl reload docker
          diff <(jq -c '.runtimes.runsc.runtimeArgs' infra/deploy/sandbox/daemon.json) \
               <(docker info --format '{{json .Runtimes.runsc.Args}}' | jq -c .)
        working-directory: .
      - name: Sandbox driver tests on gVisor
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox driver tests on gVisor' go test ./internal/dockerdrv/... -count=1
        env:
          SKILLHUB_SANDBOX_TEST_RUNTIME: runsc

  sandbox-escape:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The negative control runs first and on its own: if the probes cannot
      # see an escape without a sandbox, everything after it measures nothing.
      - name: SEC-009 T1 negative control
        env:
          SEC009_NO_SANDBOX: "1"
        run: bash tools/ci/report-failure.sh 'SEC-009 T1 negative control' bash tools/sec009/t1-escape-attempts.sh
      - name: SEC-009 T1 escape attempts under gVisor
        run: bash tools/ci/report-failure.sh 'SEC-009 T1 escape attempts' bash tools/sec009/t1-escape-attempts.sh
      - name: gVisor smoke
        run: bash tools/ci/report-failure.sh 'gVisor smoke' bash tools/sec009/gvisor-smoke.sh
      # A short run is a procedure check. The acceptance duration is 4x1800s
      # and belongs to the run on a real node, not to every pull request.
      - name: SEC-009 T2 syscall fuzz (procedure check)
        env:
          SEC009_FUZZ_SECONDS: "60"
        run: bash tools/ci/report-failure.sh 'SEC-009 T2 syscall fuzz' bash tools/sec009/t2-syscall-fuzz.sh

  sandbox-nodocker:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/sandbox
    env:
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Sandbox tests with no container runtime in reach
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Sandbox tests without a container runtime' go test -count=1 ./...
      - name: The local driver's ceilings hold without a container
        env:
          SKILLHUB_REQUIRE_CGROUP: "1"
        run: |
          go test -c -o /tmp/localdrv.test ./internal/localdrv/
          cd internal/localdrv
          bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Local driver ceilings' \
            bash "$GITHUB_WORKSPACE/tools/ci/with-delegated-cgroup.sh" \
            /tmp/localdrv.test -test.run Ceiling -test.v

  domain-memory-windows:
    needs: changes
    if: needs.changes.outputs.domain-memory == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Domain Memory plugin tests on Windows
        shell: bash
        run: >-
          bash tools/ci/report-failure.sh 'Domain Memory plugin tests on Windows'
          python -m unittest discover -s .claude/skills/domain-memory/scripts -p 'test_*.py'

  sandbox-windows:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: go build ./...
      - run: go vet ./...
      - uses: ./.github/actions/golangci-lint
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go test ./internal/localdrv/... -count=1

  llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  devctl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/devctl/go.mod
          cache-dependency-path: |
            tools/devctl/go.mod
            apps/platform/go.sum
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: ./.github/actions/golangci-lint
      - run: golangci-lint run
        working-directory: tools/devctl
      - run: golangci-lint fmt --diff
        working-directory: tools/devctl
      - run: go -C tools/devctl vet ./...
      - run: go -C tools/devctl test -race -count=1 ./...
      - name: Agent automation contract
        run: go -C tools/devctl run . automation-check
      - name: Generate portable Agent artifacts from Claude sources
        run: go -C tools/devctl run . agent-sync

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/devctl/go.mod
          cache-dependency-path: |
            apps/platform/go.sum
            apps/sandbox/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Shipped dependencies — fixable vulnerabilities, licenses, workflow audit
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: go -C tools/devctl run . dep-audit
      - name: Every project — fixable vulnerabilities (dev dependencies too), licenses, workflow audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go -C tools/devctl run . dep-audit --full

  contracts-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/devctl/go.mod
          cache: false
      - name: Deterministic generated-output check
        run: go -C tools/devctl run . gen --check

      - name: redocly lint (contracts/openapi)
        run: npx --yes @redocly/cli@2.52.1 lint contracts/openapi/*.yaml

      - name: Event contracts (contracts/events)
        run: |
          pip install jsonschema==4.26.0
          python tools/contracts/validate_trace_events.py
          python tools/contracts/validate_egress_records.py

      - name: Packaging contracts (contracts/packaging)
        run: python tools/contracts/validate_packaging.py

      - name: Judge evidence-citation regression
        run: python tools/eval-regression/test_judge_regression.py

      - name: Creation frozen-set comparison
        run: python tools/eval-regression/test_creation_frozen_compare.py

      - name: Tools scripts — complexity gate
        run: |
          pip install ruff==0.16.7
          ruff check tools --config tools/ruff.toml

      - name: Shell scripts
        run: bash tools/ci/shell-lint.sh

      - name: Tools scripts — characterisation tests
        run: |
          pip install PyYAML==6.0.2
          for test in tools/*/test_*_characterization.py; do
            echo "== $test"
            python "$test"
          done

      - name: Domain Memory plugin tests
        run: >-
          bash tools/ci/report-failure.sh 'Domain Memory plugin tests'
          python -m unittest discover -s .claude/skills/domain-memory/scripts -p 'test_*.py'

      - name: Domain Memory plugin lint
        run: >-
          bash tools/ci/report-failure.sh 'Domain Memory plugin lint'
          ruff check .claude/skills/domain-memory

      - name: Domain Memory attested commits carry their packages
        run: >-
          bash tools/ci/report-failure.sh 'Domain Memory attestation audit'
          python .claude/skills/domain-memory/scripts/registry_tools.py audit-attestations
          --repo-root . --changes-root docs/domain-memory/changes

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Domain Memory plugin tests on the oldest Python it supports
        run: >-
          bash tools/ci/report-failure.sh 'Domain Memory plugin tests on Python 3.10'
          python -m unittest discover -s .claude/skills/domain-memory/scripts -p 'test_*.py'

  qa002:
    needs: changes
    if: needs.changes.outputs.qa002 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/platform/go.mod
          cache-dependency-path: apps/platform/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: apps/llm/.python-version
      - name: Corpus generator self-test (offline)
        run: python tools/qa/skillpkg-corpus/generate.py --selftest
      - name: Build the QA-002 breaking corpus
        run: python tools/qa/skillpkg-corpus/generate.py --out "$RUNNER_TEMP/qa002"
      - name: QA-002 corpus
        working-directory: apps/platform
        env:
          QA002_CORPUS: ${{ runner.temp }}/qa002
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'QA-002 corpus' go test -count=1 ./internal/skill/admission -run QA002 -v

  tools-pglite:
    needs: changes
    if: needs.changes.outputs.pglite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/pglite/package-lock.json
      - run: npm ci --prefix tools/pglite
      - name: PORT-001 acceptance checks
        run: node tools/pglite/verify.mjs
      - name: The acceptance checks must be able to fail
        run: |
          set -uo pipefail
          for mutation in multiplexer missing-row no-prune; do
            if node tools/pglite/verify.mjs "--mutate=$mutation"; then
              echo "::error::verify.mjs --mutate=$mutation exited 0; the check that mutation breaks is not asserting anything"
              exit 1
            fi
            echo "ok: --mutate=$mutation failed as it must"
          done

  deploy-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render, validate and lint the node deployment
        run: bash tools/ci/deploy-config-check.sh

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/platform/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-platform:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform
      - name: Build the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/web/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-web:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build the llm image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/llm
          file: infra/images/llm/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-llm:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=llm
          cache-to: type=gha,mode=max,scope=llm
      - name: Smoke the images before pushing them
        env:
          PLATFORM_IMAGE: ${{ env.REGISTRY }}/skillhub-platform:${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/skillhub-web:${{ github.sha }}
          LLM_IMAGE: ${{ env.REGISTRY }}/skillhub-llm:${{ github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Stack smoke' bash tools/ci/stack-smoke.sh
      - name: Build the postgres image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/images/postgres
          tags: ${{ env.REGISTRY }}/skillhub-postgres:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Back up, restore and compare before pushing it
        env:
          POSTGRES_IMAGE: ${{ env.REGISTRY }}/skillhub-postgres:${{ github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/report-failure.sh" 'Backup drill' bash tools/ci/backup-drill.sh
      - name: Build the sandboxd image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/sandboxd/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-sandboxd:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=sandboxd
          cache-to: type=gha,mode=max,scope=sandboxd
      - name: The sandboxd binary runs and refuses to start without a token
        env:
          SANDBOXD_IMAGE: ${{ env.REGISTRY }}/skillhub-sandboxd:${{ github.sha }}
        run: |
          set -uo pipefail
          status=0
          output=$(docker run --rm "$SANDBOXD_IMAGE" 2>&1) || status=$?
          echo "$output"
          [ "$status" = 1 ] && grep -q 'SKILLHUB_SANDBOX_TOKEN is required' <<<"$output"

  images-push:
    needs: [images, web, platform, llm, sandbox, devctl, contracts-drift, dependency-audit]
    if: ${{ !failure() && !cancelled() && needs.images.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/arthurc02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/platform/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-platform:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=platform
      - name: Push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/web/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-web:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=web
      - name: Push the llm image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/llm
          file: infra/images/llm/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-llm:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=llm
      - name: Push the postgres image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/images/postgres
          tags: ${{ env.REGISTRY }}/skillhub-postgres:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=postgres
      - name: Push the sandboxd image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/sandboxd/Dockerfile
          tags: ${{ env.REGISTRY }}/skillhub-sandboxd:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=sandboxd
