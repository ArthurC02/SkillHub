name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters are hand-written (ADR-019 accepted cost of option D).
  # Adding a top-level directory means updating the filters below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      platform: ${{ steps.filter.outputs.platform }}
      llm: ${{ steps.filter.outputs.llm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client-ts/**'
              - '!spikes/**'
            platform:
              - 'services/platform/**'
              - 'db/**'
              - 'contracts/**'
              - '!spikes/**'
            llm:
              - 'services/llm/**'
              - 'packages/api-stub-py/**'
              - 'contracts/**'
              - '!spikes/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    # The cross-workspace authorization tests (CORE-006) skip themselves when
    # SKILLHUB_TEST_DATABASE_URL is unset, so without this service they would
    # pass by never running. A tenancy boundary nobody checks is not a boundary.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillhub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/platform/go.mod
          # No third-party dependencies yet, so there is no go.sum to key a cache on.
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/platform
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  # Deliberately unfiltered: drift can also come from hand-editing generated
  # output, and such a commit never touches contracts/ (ADR-019 §3).
  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and check for drift
        run: |
          echo "Codegen is not wired yet: contracts/ has no generated consumers."
          echo "Enable this job when packages/api-client-ts, packages/api-stub-py"
          echo "or db/queries/*.sql gain their first real content. The check is:"
          echo "  task gen && git diff --exit-code"
          test -z "$(find db/queries -name '*.sql' -print -quit)" \
            || { echo 'db/queries has content: wire sqlc generate into this job'; exit 1; }

  # Registry is still open (ADR-019 open question 1) and infra/images/ has no
  # Dockerfiles yet, so this job only records the intended shape.
  images:
    # Filtered-out upstream jobs are skipped, not failed, so gate on !failure().
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled()
    needs: [web, platform, llm, contracts-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Build and push service images
        run: |
          echo "Image build is not wired yet. Enable once infra/images/ holds the"
          echo "Dockerfiles and ADR-019 open question 1 (container registry) is closed."
          echo "Images are tagged with ${{ github.sha }}, never 'latest'."
