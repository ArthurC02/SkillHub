name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters are hand-written (ADR-019 accepted cost of option D).
  # Adding a top-level directory means updating the filters below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      platform: ${{ steps.filter.outputs.platform }}
      llm: ${{ steps.filter.outputs.llm }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client-ts/**'
              - '!spikes/**'
            platform:
              - 'services/platform/**'
              - 'db/**'
              - 'contracts/**'
              - '!spikes/**'
            llm:
              - 'services/llm/**'
              - 'packages/api-stub-py/**'
              - 'contracts/**'
              - '!spikes/**'
            sandbox:
              - 'services/sandbox/**'
              - 'contracts/**'
              - 'infra/images/**'
              - '!spikes/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    # The cross-workspace authorization tests (CORE-006) skip themselves when
    # SKILLHUB_TEST_DATABASE_URL is unset, so without this service they would
    # pass by never running. A tenancy boundary nobody checks is not a boundary.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillhub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      # v8 is the action line that speaks golangci-lint v2, which is what the
      # `fmt` subcommand below needs. Both are pinned: an unpinned linter turns
      # every upstream release into a red build on an untouched tree.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: services/platform
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # services/sandbox is its own Go module (ADR-019, iron rule 2), so it needs
  # its own job: the platform job's working-directory would never see it.
  #
  # GitHub-hosted runners have a Docker daemon, so the dockerdrv integration
  # tests run here for real rather than skipping. What they cannot cover is
  # gVisor: runsc needs nested virtualization, which is ADR-019 open question 3
  # and stays a deployment-time check (SEC-009, SBX-010).
  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/sandbox/go.mod
          cache-dependency-path: services/sandbox/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: services/sandbox
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Build the runtime image (SBX-002)
        run: docker build -t skillhub/runtime-agent-sdk:ci infra/images/runtime-agent-sdk
        working-directory: .

  llm:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  # Deliberately unfiltered: drift can also come from hand-editing generated
  # output, and such a commit never touches contracts/ (ADR-019 §3).
  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version stamped into the committed output (see the header
      # of any db/gen/*.sql.go). Floating the tag would make an sqlc release red
      # a tree nobody touched, which is the opposite of a useful gate.
      - name: sqlc generate
        run: docker run --rm -v "$PWD:/src" -w /src/db sqlc/sqlc:1.31.1 generate

      # `git add` first so a query whose generated file was never committed
      # shows up: an untracked file is invisible to a plain `git diff`.
      - name: Fail if generated code is out of sync with db/queries
        run: |
          git add -A -- db services/platform/internal/platform/db/gen
          git diff --cached --exit-code -- db services/platform/internal/platform/db/gen

      # Iron rule 12's first half: the schema has to be valid before anything can
      # be generated from it. Pinned like sqlc above: a floating linter turns an
      # upstream release into a red build on an untouched tree.
      #
      # Errors fail, warnings do not. The tree carries 13 warnings on purpose:
      # info-license on all three files (nothing is published under a license
      # yet), no-server-example.com on public.yaml's localhost server, and the
      # 2xx/4xx-response rules on the OAuth redirect and 204 routes, which have
      # no other status to document. Promoting those to errors would mean
      # inventing responses the implementation does not return.
      - name: redocly lint (contracts/openapi)
        run: npx --yes @redocly/cli@2.46.1 lint contracts/openapi/*.yaml

      - name: OpenAPI codegen (placeholder, deliberately not failing)
        run: |
          echo "The specs are linted above, but no codegen is wired yet:"
          echo "packages/api-client-ts and api-stub-py do not exist, so there is"
          echo "nothing to regenerate and no drift to detect. Add the generator"
          echo "here and extend the git diff paths above when those packages land."

  # Registry is still open (ADR-019 open question 1) and infra/images/ has no
  # Dockerfiles yet, so this job only records the intended shape.
  images:
    # Filtered-out upstream jobs are skipped, not failed, so gate on !failure().
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled()
    needs: [web, platform, llm, sandbox, contracts-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Build and push service images
        run: |
          echo "Image build is not wired yet. Enable once infra/images/ holds the"
          echo "Dockerfiles and ADR-019 open question 1 (container registry) is closed."
          echo "Images are tagged with ${{ github.sha }}, never 'latest'."
