# ADR-044 open question 4, answered: drift detection runs on a schedule and
# files an issue. It is deliberately NOT part of the merge gate.
#
# The gate decides whether our code is fit to merge. Whether somebody else's
# repository changed a line this morning is not a fact about our code, and
# wiring it into the gate hands a third party's main branch the power to block
# our merges - including at 03:00, including for a typo fix in their prose.
#
# But invisible drift is worse than the coupling. Every conformance statement
# this repository makes (skillpkg.SpecRevision, INSTALL.md's "What was checked",
# ADR-044) names a revision that can go stale with nobody noticing, because the
# specification has no version, no tag and no release to watch. So: a scheduled
# job, an issue when it moves, and a failed run so the schedule's own history
# shows it. Same shape and same reasoning as gvisor-baseline.yml.
name: Agent Skills spec drift

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  # A change to the pin itself is a change to our code, so that one file does
  # gate: re-pinning without the bytes agreeing is a defect we introduced.
  pull_request:
    paths:
      - 'contracts/spec/SOURCE.json'
      - 'tools/contracts/check_spec_drift.py'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare the pinned revision against upstream
        id: drift
        run: |
          set +e
          python tools/contracts/check_spec_drift.py | tee drift.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Exit 3 is "the pin does not reproduce" and always fails, on a pull
      # request too: it means SOURCE.json describes bytes upstream does not
      # serve, which no schedule should be the first to notice.
      - name: File or update the issue
        if: ${{ github.event_name != 'pull_request' && steps.drift.outputs.code != '0' && steps.drift.outputs.code != '1' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.drift.outputs.code }}" = 3 ]; then
            TITLE="Agent Skills spec pin does not reproduce (ADR-044)"
            BODY=$(printf 'contracts/spec/SOURCE.json records a blob SHA the pinned commit does not serve. Until this is explained, every conformance statement in the repository names a revision we did not validate against.\n\n```\n%s\n```\n' "$(cat drift.txt)")
          else
            TITLE="Agent Skills specification has drifted (ADR-044)"
            BODY=$(printf 'Upstream main has moved away from the pinned revision. Read the diff, decide whether it changes what `skillpkg.Validate` checks, then re-pin `contracts/spec/SOURCE.json` and record the decision.\n\nDrift is not automatically a defect. It is automatically something a person has to read.\n\n```\n%s\n```\n' "$(cat drift.txt)")
          fi
          if gh issue list --state open --search "in:title \"$TITLE\"" --json title --jq '.[].title' | grep -qxF "$TITLE"; then
            echo "::notice::issue already open, not duplicating"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Report the outcome
        run: |
          case "${{ steps.drift.outputs.code }}" in
            0) echo "::notice::pinned revision still current" ;;
            1) echo "::error::upstream unreachable — 'no drift' cannot be concluded"; exit 1 ;;
            2) echo "::error::specification drifted"; exit 1 ;;
            3) echo "::error::the pin does not reproduce"; exit 1 ;;
            *) echo "::error::unexpected exit ${{ steps.drift.outputs.code }}"; exit 1 ;;
          esac
