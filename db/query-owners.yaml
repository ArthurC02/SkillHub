# Query ownership 宣告（ADR-033）
#
# sqlc 把 db/queries/*.sql 全部生成到同一個 Go package
# (apps/platform/internal/platform/db/gen)，所以 depguard 擋得住 `run` import
# `eval`，卻擋不住 `run` 直接呼叫 `eval` 的 query。這份檔案補上那道防線：
# 為每一個 query 宣告擁有它的 Bounded Context，由
# `go -C tools/devctl run . automation-check` 在 CI 強制。
#
# 檢查範圍（ADR-033 §決策）：
#   - **write 與 read 都強制**（ADR-035，2026-08-21 起）。write 是
#     INSERT／UPDATE／DELETE，含 `WITH ... DELETE` 這種 CTE 寫入；其餘是 read。
#     兩側棘輪的形狀相同，只是容忍清單分成 `allow:`（write）與
#     `read_allow:`（read）兩段——放錯段落 CI 會指出該搬去哪一段。
#     ADR-033 當初只鎖 write 的理由是「同一批擋 read 會製造十幾條容忍條目」；
#     write 存量歸零後那個顧慮不再成立，read 的存量因此有自己乾淨的一段。
#   - 呼叫端 context 由檔案路徑推得：apps/platform/internal/<context>/...
#   - 只掃 import 了 db/gen 的非測試 Go 檔。
#
# owner 判準：**該 query 主要資料表的擁有 context**（context 清單見 ADR-032 §1）。
# `artifacts` 是唯一被兩個 context 共用的表，依 `kind` 逐 query 指派：
# run 輸出歸 run，download package 歸 packaging。
#
# 維護規則：
#   - 新增 db/queries/*.sql 的 query 一定要在這裡登記，漏了 CI 會 FAIL。
#   - 刪掉的 query 也要從這裡移除，殘留條目 CI 會 FAIL。
#   - `allow:` 是**存量漂移**，不是擴充點。新的跨 context write 一律修程式，
#     不准往下面加行；清除路徑見 ADR-033。

# 每個 db/queries/*.sql 的預設 owner。
files:
  auth.sql: identity
  beta.sql: analytics
  dispatch.sql: run
  evaluation.sql: eval
  governance.sql: identity
  packaging.sql: packaging
  reconcile.sql: objreconcile
  run_permissions.sql: run
  runs.sql: run
  search.sql: catalog
  skill_fork.sql: registry
  skill_import.sql: ingest
  skill_versions.sql: registry
  skills.sql: registry
  test_lab.sql: testlab
  trace.sql: trace
  users.sql: identity
  workspaces.sql: identity

# 單一 query 的 owner 覆寫。混合檔（governance/beta/reconcile/runs/trace…）
# 依主要資料表歸屬，不依它躺在哪個檔。
queries:
  # beta.sql：配額與漏斗量測的讀取端在 policy／analytics，資料表不是。
  CountQuotaRuns: run
  RunInWorkspace: run
  GetWorkspaceCreatedAt: identity
  GetIdentityProviderIDs: identity

  # evaluation.sql：Judge 取材讀 trace_events。
  FindLiveTraceEvents: trace

  # governance.sql：一個檔裝了三種治理動作，資料表分屬四個 context。
  InsertAuditEvent: audit
  ListAuditEventsByActor: audit
  ListWorkspaceObjectKeys: testlab
  DeleteWorkspaceDatasets: testlab
  DeleteWorkspaceArtifacts: run
  PurgeUnreferencedSkills: registry
  PurgeUnreferencedSkillSources: ingest
  TakedownSkill: registry
  LockSkillForRestriction: registry
  SetSkillAccessRestriction: registry
  ListSourcesToCheck: ingest
  MarkSourceChecked: ingest

  # packaging.sql：打包要讀的溯源材料本身屬於 registry／ingest／testlab／eval。
  ListTestCasesForSkill: testlab
  ListSuggestionsAppliedToVersion: eval
  GetPreviousSkillVersion: registry
  GetVersionLineage: registry
  GetOldestSkillVersion: registry
  GetLineageSource: ingest

  # reconcile.sql：objreconcile 自己的表只有 object_reconcile_sightings；
  # 其餘是它代掃的別人的列（artifacts 這三條只碰 kind='download_package'）。
  ListArtifactsPastRetention: packaging
  MarkArtifactPurged: packaging
  ListArtifactsClaimingObject: packaging
  ListDatasetsClaimingObject: testlab
  MarkDatasetObjectLost: testlab

  # runs.sql：Outbox 表與 run 同檔（同交易寫入），但表是 outbox 的。
  InsertOutboxEvent: outbox
  ListUnpublishedOutboxEvents: outbox
  RecordOutboxDeliveryFailure: outbox
  DeleteOutboxEventsPublishedBefore: outbox
  MarkOutboxEventsPublished: outbox
  ListOutboxEventsByAggregate: outbox

  # skill_import.sql：匯入流程要先查 registry 的既有 Skill／版本。
  GetSkillByName: registry
  GetVersionBySkillAndHash: registry

  # skills.sql：Enrichment 摘要住在 search_documents。
  GetSkillEnrichment: catalog

  # trace.sql：Trace ingest 要先確認 run 存在。
  GetRunForTraceIngest: run
  CountRunsNeedingCleanup: run

# 存量漂移：本檔導入時就已存在的跨 context write 呼叫。
# **目前零條，維持零條**——ADR-033 記錄的 15 條已由 DDD-019／020／025／026
# 全數清除（寫入回到 owner，呼叫端的交易原地不動），最後 6 條帳號刪除 purge
# 由 ADR-034 的依賴反轉收斂。**不准新增條目**——新的跨 context write 要改程式。
allow:

# 存量跨 context read（ADR-035 導入時就已存在的呼叫）
#
# ADR-032 §2 的四種關係裡沒有「直接呼叫別人的 query」這一項——跨 context 取事實
# 的合法機制是 **import 對方套件的公開 Service API**。下面每一條都是那條規則的
# read 版漏洞，形狀與清空前的 `allow:` 一模一樣。
#
# **不是擴充點**——新的跨 context read 一律改程式（owner 開讀取面，或比照
# ADR-034 由 composition root 注入）。逐組清除方向見 ADR-035「存量清除路徑」。
# 值是被容忍的呼叫端 context 清單；理由按成因分組寫在各組上方。
#
# 導入時是 35 條、七組；**B 組（鎖留在呼叫端的兩條）已由 DDD-031 收掉**，現為
# 33 條、六組。組別字母不重編：A 之後直接跳 C，是為了讓 ADR-035 的分組表與這裡
# 永遠指同一組東西。
read_allow:
  # ── A. registry 的 Skill／Version 事實（21 條、6 個呼叫端）────────────────
  # 最大的一組，成因單一：`skills` 與 `skill_versions` 是全平台的共享事實——
  # 要跑、要打包、要評估、要顯示，都得先讀到那一列。registry 至今只公開了**寫入面**
  # （DDD-019／020 的三支 `*FromPackage` 與 `SetAccessRestriction`），沒有對應的
  # 讀取面，於是六個 context 各自去呼叫 query。這一組不是判定可商榷，是缺一支 API。
  GetSkill: catalog, eval, ingest, packaging, run, testlab
  GetSkillVersion: eval, packaging, run
  GetLatestSkillVersion: catalog, eval
  GetSkillRuntimeCompatibility: catalog, eval, packaging
  GetCatalogSkill: catalog
  GetSkillSource: catalog
  GetSkillByName: ingest
  GetVersionBySkillAndHash: ingest
  GetPreviousSkillVersion: packaging
  GetOldestSkillVersion: packaging
  GetVersionLineage: packaging

  # ── C. testlab 的 Test Case／Dataset 快照（6 條）──────────────────────────
  # 與 A 同因（owner 沒有讀取面），但成本低得多：附錄 A 已允許
  # `run → testlab`、`eval → testlab`、`packaging → testlab` 三條 import，
  # testlab 也已有 Service 門面（DDD-007 的單一讀寫門面），純粹是還沒搬。
  # `ListWorkspaceObjectKeys` 是例外：identity 的帳號刪除要盤點待刪物件鍵，
  # 方向與 ADR-034 的 `PurgeWorkspace` 一致，卻沒被收進那支注入的函式裡。
  GetTestCaseSnapshot: eval, run
  GetDataset: run
  ListDatasets: packaging
  ListTestCasesForSkill: packaging
  ListWorkspaceObjectKeys: identity

  # ── D. run 的 Run 事實（7 條）──────────────────────────────────────────────
  # 與 A、C 同因，但 import 方向被 depguard 擋著：`eval → run`、`trace → run`、
  # `analytics → run`、`policy → run` 全在 deny 清單裡，而且 `run → policy`、
  # `run → trace` 是既有的合法方向——加白名單會製造循環。因此這一組的正解是
  # ADR-034 的注入，不是 import。
  GetRun: eval, trace
  GetRunForTraceIngest: trace
  ListRunArtifacts: eval
  ListRunAttempts: eval
  ListRunStatusTransitions: trace
  RunInWorkspace: analytics

  # ── E. Generic 掃描器代讀 owner 的清單（3 條）─────────────────────────────
  # DDD-020 把 objreconcile 的**寫入**半邊反轉成注入（`MarkArtifactPurged`／
  # `MarkDatasetObjectLost` 由 composition root 提供），**讀取半邊留著**：
  # 掃描器仍自己決定「哪些列該被掃」。注入形狀已經在那裡，補兩三個 lister 欄位即可。
  ListArtifactsPastRetention: objreconcile
  ListArtifactsClaimingObject: objreconcile
  ListDatasetsClaimingObject: objreconcile

  # ── F. 單點跨界，各有各的成因（6 條）──────────────────────────────────────
  # `ListPendingEnrichment`：ADR-034 把 `search_documents` 的**寫入**反轉成
  #   `catalog.IndexSkill` 注入，但 `ReindexPending` 讀「還沒 enrich 的投影列」
  #   這一半沒跟著走——同一批的自然殘留，補一個 lister 欄位就收掉。
  # `ListSuggestionsAppliedToVersion`：打包 manifest 要寫「這個版本採納了哪些建議」，
  #   那是 eval 的溯源事實；`packaging → eval` 是 deny，故走注入。
  # `GetLineageSource`：同上，打包要寫匯入來源，事實屬 ingest；`packaging → ingest`
  #   亦為 deny。B 之外的溯源讀取全部集中在 `packaging/manifest.go` 一個檔。
  # `CountArtifactsSharingObject`：run 刪自己的 Run 產物前，要確認底層物件沒有被
  #   packaging 的 download package 共用。這是「別人還要不要用」，只有 owner 答得出來。
  # `CountQuotaRuns`：owner 判定**可以商榷**——表是 `runs`（故歸 run），但 ADR-032 §1
  #   說 quota 規則歸 policy，而這條 query 除了算配額沒有第二個用途。維持按表歸屬
  #   （宣告的判準是「主要資料表的擁有 context」，不是用途），改判會讓判準出現例外。
  # `GetWorkspaceCreatedAt`：policy 要 workspace 建立時間才能算配額週期。這一條最好收：
  #   鐵律 3 讓每個 context 都已經 import `identity`，只差 identity 公開一支讀取面。
  ListPendingEnrichment: ingest
  ListSuggestionsAppliedToVersion: packaging
  GetLineageSource: packaging
  CountArtifactsSharingObject: run
  CountQuotaRuns: policy
  GetWorkspaceCreatedAt: policy

  # ── G. trace 事件的讀取（2 條）────────────────────────────────────────────
  # 兩條的 import 方向都已經合法（附錄 A 有 `run → trace` 與 `eval → trace`），
  # trace 也已有 Service（DDD-004 把現場建構改成注入）。純粹是還沒搬，成本同 C。
  FindLiveTraceEvents: eval
  CountTraceMaskingInWindow: run

# 不可變資料表宣告（ADR-003、鐵律 4；ADR-032 §4 的 aggregate 不變量）
#
# 這裡列的表**只接受 INSERT**：任何 UPDATE 或 DELETE 命中它們，
# `automation-check` 就 FAIL。
#
# 為什麼還要這道檢查——資料庫已經擋了：db/migrations 的 `enforce_immutable()`
# trigger（0005／0013／0027／0033）會在 runtime RAISE，db/tests/immutability_test.sql
# 也證明了它會擋。差別在**什麼時候**知道：trigger 要等語句真的跑到才炸，
# 一條 `UPDATE skill_versions SET ...` 合進來後是 staging 的 500，
# 這道檢查讓它在寫出來的那個 PR 上就是紅的。
#
# 只列**無條件凍結**的表。`runs`（終態後才凍）、`run_attempts`／`evaluations`／
# `evaluation_suggestions`（只凍部分欄位）是列級／欄位級規則，不是「這張表不可寫」，
# 放進來只會製造一堆假警報。
#
# 維護規則：每一列的值是**理由**，不得留空；而且該表在 db/migrations 必須有一個
# 無 WHEN、無欄位參數的 `enforce_immutable()` trigger——兩邊由 CI 互相對帳，
# 單獨拿掉任何一邊都會 FAIL。要移除一張表，先移除 trigger 的那個 migration。
immutable:
  skill_versions: ADR-003 版本快照；採納建議＝新版本，不原地覆寫（鐵律 4）
  test_case_snapshots: ADR-003 Run 引用的測試資料快照，改了會讓歷史 Run 的輸入說謊
  run_status_transitions: ADR-008 狀態機的歷史；重寫轉移紀錄等於重寫 Run 發生過的事
  trace_events: TRACE-001 執行事實；保存期到期是 DROP PARTITION，不是 DELETE
  audit_events: NFR-001 稽核軌跡；可被改寫的軌跡不是軌跡
  download_artifacts: ADR-027 產出的位元組與雙雜湊；重打包是新列
  download_records: ADR-027「誰在何時下載了什麼」，不是可編輯的狀態
  evaluation_model_usage: ADR-026 判定當下的模型用量；重評是 append 新列

# 不可變表的具名豁免。形狀比照 `allow:`：具名、有理由、有清除路徑。
# **不得**為了讓檢查過關就把整張表移出 `immutable:`。
immutable_allow:
  # 帳號刪除的保存期 purge（PDM-006 6.1）。這是唯一被允許硬刪凍結列的路徑，
  # 資料庫側同樣走具名豁免——identity/purge.go 開的交易裡那句
  # `SET LOCAL skillhub.purge = 'on'`，trigger 只認這個旗標。
  # DDD-026 後呼叫點搬到 registry.PurgeWorkspace，但它跑在同一個交易內
  # （ADR-034：owner 的 purge 函式收呼叫端的 *gen.Queries，不自開交易），
  # 所以旗標的作用範圍與本豁免都不變。ADR-034 已否決事件式自清，
  # 這條 CTE 沒有預定的消失時程；要移除它得先讓帳號刪除不再硬刪 skill_versions。
  PurgeUnreferencedSkills: skill_versions

# 裸 SQL 的具名豁免（ADR-033 2026-08-20 追加）
#
# 上面兩段的前提是「所有寫入都經過 sqlc」。`automation-check` 另有一道 tripwire：
# apps/platform/internal/** 與 apps/platform/cmd/** 的非測試 Go 檔中，
# 把含 INSERT／UPDATE／DELETE 的**字面值**交給 pgx 的 Exec／Query／QueryRow／Queue
# 就 FAIL。生成目錄（internal/platform/db/gen、internal/api/gen）與 _test.go 不在範圍。
#
# 它是 tripwire 不是證明——const 常數、fmt.Sprintf、字串串接組出來的 SQL 都繞得過。
# 界限寫在 tools/devctl/query_owners.go 的「裸 SQL tripwire」註解與 ADR-033。
#
# key 是 repo 相對路徑，value 是理由（不得留空）。失效的豁免（該檔已無裸 DML）會 FAIL。
# **目前零條，維持零條**——需要寫 DML 就去 db/queries/*.sql 開一條 query。
raw_sql_allow:
