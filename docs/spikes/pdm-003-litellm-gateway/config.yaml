# LiteLLM Proxy config for the PDM-003 protocol-layer spike.
# Model aliases are named after the intended Anthropic models so the client side
# is byte-identical to production; the backend is OpenAI because this environment
# has no Anthropic key. See the report for the scope caveat.
model_list:
  - model_name: sonnet-test
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      # Kept as documentation of a measured LiteLLM 1.96.2 gap, NOT as a fix:
      # neither drop_params nor additional_drop_params is applied on the
      # /v1/messages (Anthropic-compat) route, so an Anthropic `thinking` block
      # still reaches the OpenAI backend as `reasoning_effort` and gpt-4o-mini
      # 400s. The same param IS dropped correctly on /v1/chat/completions.
      # Workaround used by the spike: MAX_THINKING_TOKENS=0 on the client.
      # Only relevant because the backend is OpenAI - a real Anthropic model
      # behind the gateway handles `thinking` natively.
      additional_drop_params: ["reasoning_effort", "thinking"]
  - model_name: haiku-test
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      # Kept as documentation of a measured LiteLLM 1.96.2 gap, NOT as a fix:
      # neither drop_params nor additional_drop_params is applied on the
      # /v1/messages (Anthropic-compat) route, so an Anthropic `thinking` block
      # still reaches the OpenAI backend as `reasoning_effort` and gpt-4o-mini
      # 400s. The same param IS dropped correctly on /v1/chat/completions.
      # Workaround used by the spike: MAX_THINKING_TOKENS=0 on the client.
      # Only relevant because the backend is OpenAI - a real Anthropic model
      # behind the gateway handles `thinking` natively.
      additional_drop_params: ["reasoning_effort", "thinking"]

  # Added 2026-08-14 for the supplemental tests (test_supplemental.py). The
  # provider is now decided (OpenAI via LiteLLM, ADR-017 unchanged), so these
  # aliases name real current-generation models instead of Anthropic stand-ins.
  - model_name: flagship-test          # current OpenAI flagship, $5 / $30 per 1M
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort", "thinking"]
  - model_name: mini-test              # mini tier, $0.75 / $4.50 per 1M
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort", "thinking"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # flush spend to the DB every second so a per-key budget becomes enforceable
  # within a test run instead of the default batched interval
  proxy_batch_write_at: 1

litellm_settings:
  drop_params: true
