# Thin command index only (ADR-019 §2). Every task wraps one native command.
# Do not grow this into a dependency graph or a cache layer.
version: "3"

tasks:
  dev:
    desc: Start secret-free core infrastructure (Postgres and SeaweedFS)
    cmd: docker compose -f infra/compose/docker-compose.yml up -d postgres seaweedfs

  dev:core:
    desc: Start secret-free core infrastructure (Postgres and SeaweedFS)
    cmd: docker compose -f infra/compose/docker-compose.yml up -d postgres seaweedfs

  dev:model:
    desc: Start core plus LiteLLM; requires model secrets and may enable paid calls
    cmds:
      - go -C tools/devctl run . profile-check model
      - docker compose --profile model -f infra/compose/docker-compose.yml up -d

  down:
    desc: Stop local infrastructure without deleting volumes
    cmd: docker compose -f infra/compose/docker-compose.yml down

  doctor:
    desc: Check portable developer prerequisites; read-only and prints no secret values
    cmd: go -C tools/devctl run . doctor

  bootstrap:
    desc: Download project dependencies using native package managers
    cmd: go -C tools/devctl run . bootstrap

  env:init:
    desc: Create .env from .env.example without overwriting an existing file
    cmd: go -C tools/devctl run . env-init

  test:
    desc: Run all test suites
    deps: [test:platform, test:sandbox, test:llm, test:web, test:api-client, test:devctl]

  test:platform:
    dir: services/platform
    cmd: go test ./...

  test:sandbox:
    dir: services/sandbox
    cmd: go test ./...

  test:devctl:
    dir: tools/devctl
    cmd: go test ./...

  test:llm:
    dir: services/llm
    cmd: uv run pytest

  test:web:
    dir: apps/web
    cmd: npm test

  test:api-client:
    dir: packages/api-client-ts
    cmd: npm run typecheck

  lint:
    desc: Lint all services
    deps: [lint:platform, lint:llm, lint:web]

  lint:platform:
    dir: services/platform
    cmd: golangci-lint run ./...

  lint:llm:
    dir: services/llm
    cmd: uv run ruff check .

  lint:web:
    dir: apps/web
    cmd: npm run lint

  vet:platform:
    dir: services/platform
    cmd: go vet ./...

  format:
    desc: Format all services
    deps: [format:platform, format:llm, format:web]

  format:platform:
    dir: services/platform
    cmd: golangci-lint fmt

  format:llm:
    dir: services/llm
    cmd: uv run ruff format .

  format:web:
    dir: apps/web
    cmd: npm run format

  format:check:
    desc: Check formatting in all services
    deps: [format:check:platform, format:check:llm, format:check:web]

  format:check:platform:
    dir: services/platform
    cmd: golangci-lint fmt --diff

  format:check:llm:
    dir: services/llm
    cmd: uv run ruff format --check .

  format:check:web:
    dir: apps/web
    cmd: npm run format:check

  check:
    desc: Run lint, formatting, and Go static analysis
    deps: [lint, format:check, vet:platform]

  build:
    desc: Build all services
    deps: [build:platform, build:web]

  build:platform:
    dir: services/platform
    cmd: go build ./...

  build:web:
    deps: [build:api-client]
    dir: apps/web
    cmd: npm run build

  build:api-client:
    dir: packages/api-client-ts
    cmd: npm run build

  gen:
    desc: Regenerate committed outputs atomically; modifies generated files
    cmd: go -C tools/devctl run . gen

  gen:sql:
    desc: Regenerate committed sqlc output atomically; modifies generated files
    cmd: go -C tools/devctl run . gen --scope=sql

  gen:openapi:
    desc: Regenerate committed TypeScript and Python OpenAPI outputs atomically
    cmd: go -C tools/devctl run . gen --scope=openapi

  gen:check:
    desc: Check generated outputs without modifying tracked files
    cmd: go -C tools/devctl run . gen --check
