# Thin command index only (ADR-019 §2). Every task wraps one native command.
# Do not grow this into a dependency graph or a cache layer.
version: "3"

tasks:
  dev:
    desc: Start secret-free core infrastructure (Postgres and SeaweedFS)
    cmd: docker compose -f infra/compose/docker-compose.yml up -d postgres seaweedfs

  dev:core:
    desc: Start secret-free core infrastructure (Postgres and SeaweedFS)
    cmd: docker compose -f infra/compose/docker-compose.yml up -d postgres seaweedfs

  dev:model:
    desc: Start core plus LiteLLM; requires model secrets and may enable paid calls
    cmds:
      - go -C tools/devctl run . profile-check model
      # --env-file is load-bearing: with -f, compose resolves ${...} from the
      # compose file's OWN directory (infra/compose/, which has no .env), not
      # from the repo root. Without it the gateway comes up with an EMPTY
      # master key and every caller gets 401 "token not found in db" — found
      # 2026-08-24 on the first real-gateway generation (04 丙-56).
      - docker compose --env-file .env --profile model -f infra/compose/docker-compose.yml up -d

  dev:observability:
    desc: Start Prometheus so infra/observability/alerts.yml is actually evaluated
    cmd: docker compose --profile observability -f infra/compose/docker-compose.yml up -d prometheus

  down:
    desc: Stop local infrastructure without deleting volumes
    cmd: docker compose -f infra/compose/docker-compose.yml down

  doctor:
    desc: Check portable developer prerequisites; read-only and prints no secret values
    cmd: go -C tools/devctl run . doctor

  bootstrap:
    desc: Download project dependencies using native package managers
    cmd: go -C tools/devctl run . bootstrap

  env:init:
    desc: Create .env from .env.example without overwriting an existing file
    cmd: go -C tools/devctl run . env-init

  automation:check:
    desc: Verify Agent docs, task descriptions and generated ownership markers
    cmd: go -C tools/devctl run . automation-check

  ci:
    desc: Run the local secret-free CI sequence in deterministic order
    cmds:
      - go -C tools/devctl run . automation-check
      - go -C tools/devctl run . gen --check
      - task: check
      - task: test
      - task: build

  test:
    desc: Run all test suites
    deps: [test:platform, test:sandbox, test:llm, test:web, test:api-client, test:devctl]

  test:platform:
    desc: Run Go platform tests; DB integration requires its explicit test URL
    dir: apps/platform
    cmd: go test ./...

  test:sandbox:
    desc: Run Go sandbox tests; Docker-backed tests use the local daemon
    dir: apps/sandbox
    cmd: go test ./...

  test:devctl:
    desc: Run portable developer automation unit tests
    dir: tools/devctl
    cmd: go test ./...

  test:llm:
    desc: Run mocked Python LLM tests without live provider calls
    dir: apps/llm
    cmd: uv run pytest

  test:web:
    desc: Run Web Vitest suite without external services
    dir: apps/web
    cmd: npm test

  test:api-client:
    desc: Typecheck the generated TypeScript API client
    dir: packages/api-client-ts
    cmd: npm run typecheck

  lint:
    desc: Lint all applications
    deps: [lint:platform, lint:llm, lint:web]

  lint:platform:
    desc: Lint the Go platform module
    dir: apps/platform
    cmd: golangci-lint run ./...

  lint:llm:
    desc: Lint the Python LLM service
    dir: apps/llm
    cmd: uv run ruff check .

  lint:web:
    desc: Lint the Web application
    dir: apps/web
    cmd: npm run lint

  vet:platform:
    desc: Run Go static analysis on the platform module
    dir: apps/platform
    cmd: go vet ./...

  format:
    desc: Format all applications
    deps: [format:platform, format:llm, format:web]

  format:platform:
    desc: Format the Go platform module; modifies files
    dir: apps/platform
    cmd: golangci-lint fmt

  format:llm:
    desc: Format the Python LLM service; modifies files
    dir: apps/llm
    cmd: uv run ruff format .

  format:web:
    desc: Format the Web application; modifies files
    dir: apps/web
    cmd: npm run format

  format:check:
    desc: Check formatting in all applications
    deps: [format:check:platform, format:check:llm, format:check:web]

  format:check:platform:
    desc: Check Go platform formatting without modifying files
    dir: apps/platform
    cmd: golangci-lint fmt --diff

  format:check:llm:
    desc: Check Python LLM formatting without modifying files
    dir: apps/llm
    cmd: uv run ruff format --check .

  format:check:web:
    desc: Check Web formatting without modifying files
    dir: apps/web
    cmd: npm run format:check

  check:
    desc: Run lint, formatting, and Go static analysis
    deps: [lint, format:check, vet:platform]

  build:
    desc: Build all applications
    deps: [build:platform, build:web]

  build:platform:
    desc: Build all Go platform commands
    dir: apps/platform
    cmd: go build ./...

  build:web:
    desc: Build the Web production bundle after the generated client
    deps: [build:api-client]
    dir: apps/web
    cmd: npm run build

  build:api-client:
    desc: Compile the generated TypeScript API client package
    dir: packages/api-client-ts
    cmd: npm run build

  gen:
    desc: Regenerate committed outputs atomically; modifies generated files
    cmd: go -C tools/devctl run . gen

  gen:sql:
    desc: Regenerate committed sqlc output atomically; modifies generated files
    cmd: go -C tools/devctl run . gen --scope=sql

  gen:openapi:
    desc: Regenerate committed Go, TypeScript and Python OpenAPI outputs atomically
    cmd: go -C tools/devctl run . gen --scope=openapi

  gen:check:
    desc: Check generated outputs without modifying tracked files
    cmd: go -C tools/devctl run . gen --check
