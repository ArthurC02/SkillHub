version: "2"

linters:
  enable:
    - gocognit
    - nestif
    - errorlint
    - gocritic
    - unparam
    - dupl
    - revive
    - funlen
    - cyclop
    - goconst
    - mnd
    - usestdlibvars
    - unconvert
    - wastedassign
    - interfacebloat

  exclusions:
    presets:
      - std-error-handling
    warn-unused: true
    rules:
      - path: _test\.go
        linters: [gocognit, dupl, revive, unparam, funlen, cyclop, goconst, mnd]

  settings:
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    cyclop:
      max-complexity: 15
    goconst:
      min-occurrences: 3
      min-len: 3
    mnd:
      ignored-numbers: ["0", "1", "2", "10", "100", "1000", "1024"]
      ignored-functions:
        - '^strconv\.'
        - '^make$'
        - '^time\.'
        - '^strings\.SplitN$'
        - '^os\.(WriteFile|MkdirAll|OpenFile|Chmod)$'
        - '^context\.WithTimeout$'
    revive:
      rules:
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
        - name: flag-parameter
