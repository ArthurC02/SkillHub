# golangci-lint v2. Default linter set (errcheck, govet, ineffassign,
# staticcheck, unused) plus the exclusions v1 applied by default and v2 makes
# opt-in: a deferred Close/Flush has no caller left to return an error to, so
# flagging it only teaches people to write `_ =` noise.
version: "2"

linters:
  enable:
    - depguard

  exclusions:
    presets:
      - std-error-handling

  settings:
    # This depguard block is the machine-readable form of docs/adr/ADR-032
    # appendix A (the cross-context import whitelist). Changing any
    # cross-context dependency MUST edit both places in the same commit; the
    # `drift:` markers below are compared against the ADR by
    # `devctl automation-check`, so a divergence turns CI red.
    #
    # Rules are deny lists: "legal but unlisted = denied" from the appendix is
    # already folded in, so every context denies every other context except the
    # collaborations the appendix keeps. Test files are exempt (`!$test`) —
    # integration tests' cross-context imports are handled by DDD-011.
    depguard:
      rules:
        identity:
          files:
            - "**/internal/identity/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/analytics
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/catalog
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/eval
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/ingest
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/packaging
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/policy
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/registry
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/run
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/testlab
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trace
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        analytics:
          files:
            - "**/internal/analytics/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/catalog
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/eval
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/ingest
