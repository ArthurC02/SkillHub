            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        # run -> testlab and run -> trace are legal synchronous collaborations.
        # run -> eval was DDD-005; the terminal transition now only announces
        # run.succeeded/run.failed and eval's own consumer enqueues the evaluation.
        run:
          files:
            - "**/internal/trial/execution/**"
            - "!$test"
          deny:
