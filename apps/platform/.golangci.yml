version: "2"

linters:
  enable:
    - depguard
    - gocognit

  exclusions:
    presets:
      - std-error-handling
    warn-unused: true
    rules:
      - path: _test\.go
        linters: [gocognit]
      - path: cmd/api/main\.go
        linters: [gocognit]
        text: 'func `main`'
      - path: internal/creator/workspace/purge\.go
        linters: [gocognit]
        text: 'func `\(\*Service\)\.purgeAccount`'
      - path: internal/entrypoint/api/apiserver/creation_stream\.go
        linters: [gocognit]
        text: 'func `\(\*creationHandler\)\.Stream`'
      - path: internal/entrypoint/api/apiserver/creation_wiring\.go
        linters: [gocognit]
        text: 'func `wireCreationReads`'
      - path: internal/entrypoint/worker/creation_wiring\.go
        linters: [gocognit]
        text: 'func `wireCreationReads`'
      - path: internal/foundation/storage/objreconcile/objreconcile\.go
        linters: [gocognit]
        text: 'func `PurgeExpired`'
      - path: internal/shared/skillpkg/archive\.go
        linters: [gocognit]
        text: 'func `PackageFS`'
      - path: internal/shared/skillpkg/skillpkg\.go
        linters: [gocognit]
        text: 'func `\(\*Report\)\.parseFrontmatter`'
      - path: internal/skill/admission/generate\.go
        linters: [gocognit]
        text: 'func `\(\*Service\)\.GenerateSkill`'
      - path: internal/skill/delivery/packaging\.go
        linters: [gocognit]
        text: 'func `\(\*Service\)\.persist`'
      - path: internal/skill/discovery/creation\.go
        linters: [gocognit]
        text: 'func `\(\*Service\)\.CreationKnowledgeIDs`'
      - path: internal/trial/design/dataset\.go
        linters: [gocognit]
        text: 'func `\(\*Service\)\.UploadDataset`'
      - path: internal/trial/execution/job\.go
        linters: [gocognit]
        text: 'func `\(\*driver\)\.dispatch`'
      - path: internal/trial/improvement/apply\.go
        linters: [gocognit]
        text: 'func `\(\*Service\)\.ApplySuggestions`'

  settings:
    gocognit:
      min-complexity: 30
    depguard:
      rules:
        creation:
          files:
            - "**/internal/creator/creation/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/entitlements
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/discovery
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/admission
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/library
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/design
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/improvement
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/publishing
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/wiring
              desc: "creation uses injected owner APIs"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "creation uses injected owner APIs"

        credit:
          files:
            - "**/internal/creator/credit/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/publishing
              desc: "credit records what a call cost; it never reaches into the context that made the call"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
