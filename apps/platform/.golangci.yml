# golangci-lint v2. Default linter set (errcheck, govet, ineffassign,
# staticcheck, unused) plus the exclusions v1 applied by default and v2 makes
# opt-in: a deferred Close/Flush has no caller left to return an error to, so
# flagging it only teaches people to write `_ =` noise.
version: "2"

linters:
  enable:
    - depguard

  exclusions:
    presets:
      - std-error-handling

  settings:
    # This depguard block is the machine-readable form of docs/adr/ADR-032
    # appendix A (the cross-context import whitelist). Changing any
    # cross-context dependency MUST edit both places in the same commit; the
    # `drift:` markers below are compared against the ADR by
    # `devctl automation-check`, so a divergence turns CI red.
    #
    # Rules are deny lists: "legal but unlisted = denied" from the appendix is
    # already folded in, so every context denies every other context except the
    # collaborations the appendix keeps. Test files are exempt (`!$test`) —
    # integration tests' cross-context imports are handled by DDD-011.
    depguard:
      rules:
        creation:
          files:
            - "**/internal/creator/creation/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/entitlements
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/discovery
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/admission
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/library
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/design
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/improvement
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "creation uses injected owner APIs (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "creation uses injected owner APIs (ADR-067)"

        identity:
          files:
            - "**/internal/creator/workspace/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/discovery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/improvement
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/admission
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/entitlements
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/library
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/design
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "composition root; contexts must not import it (ADR-032 §5, ADR-060 decision 6)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        analytics:
          files:
            - "**/internal/product/learning/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/discovery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/improvement
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/admission
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/entitlements
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/library
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/design
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "composition root; contexts must not import it (ADR-032 §5, ADR-060 decision 6)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        # catalog -> analytics is legal (projection facts).
        # catalog -> registry is legal (Customer–Supplier): the licensing hold is
        # catalog's decision — the reason codes, the rendered sentences, the
        # operator routes and the audit event all live there — but the flag is a
        # column of registry's `skills` table, so the write goes through
        # registry.SetAccessRestriction inside catalog's own transaction instead
        # of reaching past the owner into the query
        # (ADR-033 clearance path 4, 2026-08-20).
        catalog:
          files:
            - "**/internal/skill/discovery/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/improvement
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/admission
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/entitlements
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/design
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "composition root; contexts must not import it (ADR-032 §5, ADR-060 decision 6)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        # eval -> testlab and eval -> trace are legal synchronous queries.
        # eval -> ingest is legal (Customer–Supplier): 採納建議 writes the new
        # version through ingest.SaveVersion, the one path that runs the full
        # import validation pipeline. A second version-creation path here would
        # be a second truth (M4 PACK-002 ruling, DDD-006 2026-08-20).
        eval:
          files:
            - "**/internal/trial/improvement/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/discovery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/entitlements
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/library
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "composition root; contexts must not import it (ADR-032 §5, ADR-060 decision 6)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        # ingest -> registry is legal (Customer–Supplier): ingest owns the only
        # verified version-write path, registry owns skills/skill_versions, so
        # the import calls registry's write API inside its own transaction
        # instead of reaching past the owner into the queries
        # (ADR-033 clearance path 2, 2026-08-20).
        ingest:
          files:
            - "**/internal/skill/admission/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/discovery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/improvement
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/delivery
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/design
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "composition root; contexts must not import it (ADR-032 §5, ADR-060 decision 6)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        # packaging -> testlab is a legal synchronous query.
        packaging:
          files:
            - "**/internal/skill/delivery/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
