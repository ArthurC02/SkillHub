              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/admission
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/skill/library
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/execution
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/trial/evidence
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/api/apiserver
              desc: "presentation layer / composition root; contexts must not import it (ADR-032 §5)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/entrypoint/worker
              desc: "composition root; contexts must not import it (ADR-032 §5, ADR-060 decision 6)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/foundation/storage/objreconcile
              desc: "generic subdomain; contexts must not import it (ADR-032 appendix A)"

        # Policy & Usage (DDD-014). It answers "what may this workspace spend"
        # and "how long is this kept", and it must be able to answer without
        # knowing who is asking: every context is denied, including the two that
        # call it. run and packaging import policy, never the other way round.
        policy:
          files:
            - "**/internal/product/entitlements/**"
            - "!$test"
          deny:
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/creation
              desc: "creation owns its session; integrate through callbacks (ADR-067)"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/creator/workspace
              desc: "cross-context import forbidden by ADR-032; see docs/adr/ADR-032 appendix A"
            - pkg: github.com/ArthurC02/skillhub/apps/platform/internal/product/learning
