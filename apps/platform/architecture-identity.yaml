# One architecture identity per Shared Kernel or Generic package under
# apps/platform/internal; Bounded Contexts are declared in the reviewed
# Domain Memory Registry. One package, one path, and paths may not overlap.
packages:
  - id: skillpkg
    kind: Shared Kernel
    path: shared/skillpkg
  - id: audit
    kind: Generic
    path: foundation/observability/audit
  - id: outbox
    kind: Generic
    path: foundation/messaging/outbox
  - id: objreconcile
    kind: Generic
    path: foundation/storage/objreconcile
  - id: llmclient
    kind: Generic
    path: foundation/integration/llmclient
  - id: modelbudget
    kind: Generic
    path: foundation/integration/modelbudget
  - id: queue
    kind: Generic
    path: foundation/messaging/queue
  - id: objstore
    kind: Generic
    path: foundation/storage/objstore
  - id: metrics
    kind: Generic
    path: foundation/observability/metrics
  - id: partition
    kind: Generic
    path: foundation/persistence/partition
  - id: pgconv
    kind: Generic
    path: foundation/persistence/pgconv
  - id: envx
    kind: Generic
    path: foundation/runtime/envx
  - id: httpx
    kind: Generic
    path: foundation/runtime/httpx
  - id: platform
    kind: Generic
    path: foundation/persistence/db/gen
  - id: apiserver
    kind: Generic
    path: entrypoint/api/apiserver
  - id: api
    kind: Generic
    path: entrypoint/api/gen
  - id: worker
    kind: Generic
    path: entrypoint/worker
  - id: wiring
    kind: Generic
    path: entrypoint/wiring
