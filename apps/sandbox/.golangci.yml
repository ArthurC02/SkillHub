version: "2"

linters:
  enable:
    - gocognit

  exclusions:
    presets:
      - std-error-handling
    warn-unused: true
    rules:
      - path: internal/sandbox/manager\.go
        linters: [gocognit]
        text: 'func `\(Config\)\.accept`'
      - path: internal/sandbox/trace\.go
        linters: [gocognit]
        text: 'func `\(\*Manager\)\.flushTrace`'

  settings:
    gocognit:
      min-complexity: 30
