[project]
name = "skillhub-llm"
version = "0.1.0"
description = "Skill Hub internal LLM service (FastAPI). See ADR-016."
readme = "README.md"
authors = [
    { name = "ArthurC", email = "a802216@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.60",
    # Imported directly by every module in src/. It used to arrive only as
    # fastapi's transitive dependency, which is a version this project does not
    # control and would not notice losing.
    "pydantic>=2",
]
# litellm was declared here and imported nowhere. app.py argues at length why
# its entry point is deliberately NOT used - it picks a provider handler from
# the model name prefix, so a `gemini/...` in an env var reroutes the call
# behind gateway()'s back, which is a way around Iron Rule 8 - so the largest
# dependency in this service was the one tool for evading its main rule. Its
# only remaining effect was feeding PyYAML to the test suite by accident;
# PyYAML is now declared where it is used.

[tool.uv.sources]
skillhub-api-stub = { path = "../../packages/api-stub-py", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pyyaml>=6",  # tests/test_generated_contract.py reads the contract itself
    "ruff>=0.8",
    "skillhub-api-stub",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
