[project]
name = "skillhub-llm"
version = "0.1.0"
description = "Skill Hub internal LLM service (FastAPI). See ADR-016."
readme = "README.md"
authors = [
    { name = "ArthurC", email = "a802216@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "litellm>=1.40",
    "openai>=1.60",
    "skillhub-api-stub",
]

[tool.uv.sources]
skillhub-api-stub = { path = "../../packages/api-stub-py", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
