[project]
name = "skillhub-llm"
version = "0.1.0"
description = "Skill Hub internal LLM service (FastAPI). See ADR-016."
readme = "README.md"
authors = [
    { name = "ArthurC", email = "a802216@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.60",
    "pydantic>=2",
    "langgraph>=1,<2",
    "langsmith>=0.12,<1",
]

[tool.uv.sources]
skillhub-api-stub = { path = "../../packages/api-stub-py", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pyyaml>=6",  # tests/test_generated_contract.py reads the contract itself
    "ruff>=0.8",
    "skillhub-api-stub",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
