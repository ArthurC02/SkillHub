openapi: 3.1.0
info:
  title: Skill Hub Sandbox Provider Port
  version: 0.1.0
  description: |
    The provider-neutral Run contract (ADR-004, RUN-001/002/003). Every sandbox
    implementation - SelfHostedProvider, a dev DockerProvider, a future
    third-party one - speaks exactly these shapes. The orchestrator depends on
    this file and never on a provider's own API, so swapping providers leaves
    Skill, Test Case, Trace and Evaluation data untouched.

    Two boundaries make this a separate file rather than part of public.yaml:

    - apps/sandbox is its own Go module (ADR-031, iron rule 2). It must be
      able to generate from this contract without reaching into the control
      plane's schemas.
    - Nothing here is reachable by a browser. public.yaml is the Web surface;
      this is the control plane to execution plane surface.

    Interaction model: the provider serves this API and the Go control plane is
    its only client, by polling. There is no provider-to-platform callback and
    no provider access to the platform's database (iron rule 2) - the execution
    plane answers questions, it never reaches into the control plane. A worker
    dispatches with POST /runs, follows the attempt with
    GET /runs/{provider_run_id}, and tears it down with DELETE.

    ADR-004's lifecycle verbs are not one endpoint each. provision, prepare and
    execute are the provider's own business once a run exists and are visible to
    the caller only as `state`; collectArtifacts happens before the attempt goes
    terminal and its output is the artifact manifest inside RunResult.
    streamEvents is deliberately absent: trace events travel the Outbox path of
    contracts/events/trace-event.schema.json, not this API.

    Idempotency: (run_id, attempt) from the request body is the key of a created
    run. Re-sending that pair returns the run that already exists and starts no
    second sandbox, which is what makes a dispatch safe to retry when the worker
    cannot tell whether the first one arrived (ADR-004 "失敗與重試"). cancel and
    destroy are idempotent for the same reason (iron rule 9).

    States: `state` is the *provider's* lifecycle, not a mirror of the platform's
    run status machine. The platform owns its states and maps into them from
    here (iron rule 5); a provider answering `evaluating` or `queued` would be
    claiming authority it does not have. See ProviderRunState.

    Numeric limits come from PDM-005 5.2 and are repeated here as schema
    defaults so a provider can validate a request without reading a plan
    document. Changing one means changing both.
servers:
  - url: http://sandbox:9000

security:
  - providerToken: []

paths:
  /capability:
    get:
      operationId: getProviderCapability
      summary: What this provider can run (RUN-002)
      description: |
        Read before dispatch. RUN-005 matches a RunRequest against this answer
        and refuses incompatible work before queueing, with a reason a user can
        read (ADR-004). `availability` is a current reading rather than a static
        manifest, so a scheduler re-reads it instead of caching it forever.
      responses:
        "200":
          description: The provider's declared capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCapability"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /runs:
    post:
      operationId: createProviderRun
      summary: Dispatch one execution attempt (RUN-001, RUN-005)
      description: |
        Creates the sandbox for one attempt and answers as soon as it is
        accepted. Execution is asynchronous; progress is read by polling
        GET /runs/{provider_run_id}.

        Idempotent on (run_id, attempt) from the body. The first call creates and
        answers 201; a repeat of the same pair answers 200 with the run that
        already exists, in whatever state it has reached, and starts nothing. A
        repeat carrying a *different* RunRequest for that pair answers 409 rather
        than silently serving the first body's run - that combination is a caller
        bug and hiding it would make a superseded attempt look dispatched.

        `idempotency_key`, when the platform sends one, is its own stable label
        for the same pair. It is not a second, independent key: a provider must
        not create two runs for one (run_id, attempt) because the labels differ.

        Two error bodies, and a client has to branch on status to parse them:
        **422 carries a RunError**, every other failure carries an `Error`. The
        refusal is the one failure the platform records against the run itself -
        it becomes the attempt's `error_class` and decides whether a retry is
        even considerable - so it needs the classification rather than a
        sentence. This is the only operation in this file with the split.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Sandbox created for this attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRun"
        "200":
          description: |
            This (run_id, attempt) was already dispatched; the existing run is
            returned unchanged and nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRun"
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            The same (run_id, attempt) was dispatched before with different
            content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Refused before anything was created: the request asks for capability
            this provider does not have, or a limit it cannot enforce. Answered
            as a classified RunError so the platform can tell a capability
            mismatch from a transient failure without parsing message strings
            (ADR-004). No sandbox exists, so there is nothing to destroy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunError" }
        "429":
          description: |
            No free run slot right now. Distinct from 422: the request is
            acceptable and retrying later or choosing another provider is the
            correct response, whereas a 422 will fail identically forever.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listProviderRuns
      summary: List the runs still alive on this provider (RUN-007)
      description: |
        The comparison side of orphan scanning: anything listed here that the
        platform holds no live attempt for is a leaked sandbox and is destroyed.

        "Live" means still holding resources - **including a run that has reached
        a terminal state but has not been destroyed yet**. Those are exactly the
        sandboxes a scan needs to see: a run the worker finished reading and then
        crashed before cleaning up is terminal, is still costing resources, and
        is invisible to a listing that only reports unfinished work. A run leaves
        this list when DELETE succeeds, not when it reaches a terminal state.

        What is *not* served is history. Once destroyed, a run is gone from here
        for good; the platform owns the record of what ran (iron rule 10) and a
        provider's recollection is not a source of truth. `result` is omitted
        from the entries - read a single run to get it.
      parameters:
        - name: active
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: |
            Only `true` is served, and it is the default. `false` answers 400
            rather than an empty list, because an empty list would read as "no
            destroyed runs" from an endpoint that never retained any to give.
      responses:
        "200":
          description: |
            Every run this provider currently holds resources for, terminal ones
            awaiting DELETE included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRunList"
        "400":
          description: '`active=false` requested.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /runs/{provider_run_id}:
    parameters:
      - name: provider_run_id
        in: path
        required: true
        schema: { type: string }
        description: |
          The provider's ephemeral handle, as returned by POST /runs. It
          addresses a run on this provider only; it is never a platform key and
          never part of a platform URL (iron rule 10) - the public API's
          GET /runs/{id} takes the permanent platform run_id instead.
    get:
      operationId: getProviderRun
      summary: Current provider-side state of one attempt (RUN-002)
      description: |
        The polling read. `state` is the provider's own lifecycle (see
        ProviderRunState) and the platform maps it into its own status machine;
        `result` is present exactly when `state` is terminal.
      responses:
        "200":
          description: The run as this provider currently sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
    delete:
      operationId: destroyProviderRun
      summary: Release everything this attempt holds (RUN-007, SBX-009)
      description: |
        Idempotent, and deliberately without a 404: a handle the provider has no
        record of is already in the state the caller asked for, so it answers 204
        like any other successful destroy. ADR-004 requires destroy to be safely
        repeatable (iron rule 9), and a cleanup path that fails on the second
        call cannot be retried by a worker that crashed mid-cleanup.

        Destroying discards the run's state, `result` included. A caller that
        still needs the result reads it first; the platform stores it, the
        provider does not keep one.
      responses:
        "204":
          description: |
            Nothing is held for this handle any more. Also the answer when
            nothing was held to begin with.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Resources could not be released and are still held. The platform
            records the cleanup failure separately from the run outcome
            (Run.cleanup_status) and retries; repeating this call is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{provider_run_id}/cancel:
    parameters:
      - name: provider_run_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelProviderRun
      summary: Ask the provider to stop an attempt (RUN-006)
      description: |
        Records the intent and answers 202; stopping is not instant. The run
        stays readable and reaches `cancelled` when the workload is actually
        down, so the caller polls for the outcome rather than assuming it.

        Idempotent, including on an attempt that has already reached a terminal
        state - that answers 202 with the run as it stands rather than 409. The
        caller polls on an interval and the run can finish between the read and
        the cancel; making that race an error would turn an ordinary timing
        window into a failure the worker has to special-case.

        Cancelling does not release resources. The caller still sends DELETE:
        the result and the artifact manifest survive until it does.
      responses:
        "202":
          description: Cancellation requested, or the attempt was already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"

components:
  securitySchemes:
    providerToken:
      type: http
      scheme: bearer
      description: |
        A static token configured on both sides at deployment. It authenticates
        the control plane to the provider and nothing else: it carries no
        workspace, no user and no run scope, so it can never widen what a request
        may reach (iron rule 3 - scope is settled in the control plane before a
        RunRequest is built).

        Not to be confused with the per-run credentials inside a RunRequest.
        ModelGatewayGrant and ObjectGrant are short-lived and minted per run
        (ADR-017, SBX-005/006); this one is long-lived infrastructure
        configuration and never travels into a sandbox.
  responses:
    Unauthorized:
      description: Missing or invalid provider token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RunNotFound:
      description: |
        No run with this handle. Either it never existed on this provider, or it
        was destroyed - the provider keeps no record of destroyed runs, so the
        two are the same answer here.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Masked and safe to log (iron rule 11). Machine-readable failure
            classification is RunError.class, not this string.

    ProviderRunState:
      type: string
      enum: [creating, running, completed, failed, cancelled]
      description: |
        The provider's own lifecycle. It is *not* the platform's run status
        (queued / provisioning / preparing / running / evaluating / ...): the
        control plane owns that machine and maps into it from here (iron rule 5),
        which is why `evaluating` has no value here at all - evaluation happens in
        the control plane after this contract is done.

        - `creating` - provisioning and preparing; the workload has not started.
          Covers ADR-004's provision and prepare.
        - `running` - the workload is executing.
        - `completed` - the workload ran to its own end. Terminal. `result` says
          whether that end was a success; a workload that ran correctly and
          reported failure is `completed` here with RunResult.status `failed`.
        - `failed` - the provider could not carry the attempt through: provision
          failed, the sandbox died, or a limit was enforced against it. Terminal.
          A wall-clock stop lands here with RunResult.status `timed_out`.
        - `cancelled` - stopped because of POST /cancel. Terminal.

        The last three are terminal and always carry a `result`. Cleanup is not a
        state: it is DELETE, tracked separately by the platform, because "the run
        failed" and "its sandbox was torn down" are two different facts (ADR-004).
      $comment: |
        Provider lifecycle only. Do not add platform status values here, and do
        not assume a value maps 1:1 onto one platform status - the mapping is the
        control plane's and may be many-to-one.

    ProviderRun:
      description: |
        One attempt as this provider currently sees it: the ProviderRunRef
        mapping plus where it has got to. The platform identifiers are echoed
        back so a scan of GET /runs can be reconciled against the platform's own
        attempts without the provider's handle ever becoming a key (iron rule 10).
      allOf:
        - $ref: "#/components/schemas/ProviderRunRef"
        - type: object
          required: [state, observed_at]
          properties:
            state:
              $ref: "#/components/schemas/ProviderRunState"
            state_reason:
              type: string
              description: Why it is in this state. Masked, human-readable (iron rule 11).
            cancel_requested_at:
              type: string
              format: date-time
              description: |
                When a cancel was accepted. Intent, not outcome - the state is
                still `running` until the workload is actually down.
            created_at: { type: string, format: date-time }
            started_at:
              type: string
              format: date-time
              description: When the workload began, not when the sandbox was created.
            finished_at: { type: string, format: date-time }
            observed_at:
              type: string
              format: date-time
              description: |
                Provider clock reading for this answer. Polling means every read
                is already stale by the time it arrives; this is what lets the
                caller order two answers rather than guess.
            result:
              allOf:
                - $ref: "#/components/schemas/RunResult"
              description: |
                Present exactly when `state` is terminal, and absent otherwise.
                Omitted from GET /runs listings even for terminal runs - fetch
                the single run to read it.

    ProviderRunList:
      type: object
      description: |
        Runs still holding resources on this provider (RUN-007), terminal ones
        not yet destroyed included - see GET /runs for why that boundary is
        DELETE rather than the terminal state.

        Not paginated: the list is bounded by the provider's own slot count, so
        there is no page for a page token to point at.
      required: [provider, runs, observed_at]
      properties:
        provider: { type: string }
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRun"
        observed_at:
          type: string
          format: date-time
          description: |
            When this snapshot was taken. An orphan scan compares it against the
            platform's own state, and a run created after this instant must not
            be judged leaked because it was missing from an older list.

    RunRequest:
      type: object
      description: |
        One execution attempt handed to a provider. Contains no field that only
        a particular provider could interpret (RUN-001). Provider-specific
        tuning, if it ever exists, goes in `provider_extensions` and must never
        be required for a correct run.
      required:
        - run_id
        - run_attempt_id
        - attempt
        - workspace_id
        - skill_version
        - test_case_snapshot
        - runtime
        - resource_limits
        - egress
        - trace
      properties:
        run_id:
          $ref: "#/components/schemas/RunID"
        run_attempt_id:
          type: string
          format: uuid
          description: |
            This attempt. Permanent, platform-owned, one row in run_attempts.
            The provider echoes it back on every event and result so a late
            message from a superseded attempt can be recognised and dropped.
        attempt:
          type: integer
          minimum: 1
          description: 1-based attempt number within the run.
        workspace_id:
          type: string
          format: uuid
          description: |
            Tenancy label for trace and artifact routing only. The provider has
            no database access (iron rule 2) and cannot widen its own scope with
            it; scope is enforced in the control plane before this is built.
        idempotency_key:
          type: string
          description: |
            Stable for one run_attempt_id. When the control plane cannot tell
            whether a dispatch was received, it re-sends with the same key
            rather than creating a second sandbox (ADR-004 "失敗與重試").
        skill_version:
          $ref: "#/components/schemas/PackageRef"
        test_case_snapshot:
          $ref: "#/components/schemas/TestCaseSnapshotRef"
        runtime:
          $ref: "#/components/schemas/RuntimeProfile"
        resource_limits:
          $ref: "#/components/schemas/ResourceLimits"
        egress:
          $ref: "#/components/schemas/EgressPolicy"
        object_grants:
          type: array
          description: |
            Short-lived, per-path object storage authorizations - the only way
            the execution plane moves bytes (iron rule 2).
          items:
            $ref: "#/components/schemas/ObjectGrant"
        model_gateway:
          $ref: "#/components/schemas/ModelGatewayGrant"
        trace:
          $ref: "#/components/schemas/TracePolicy"
        provider_extensions:
          type: object
          additionalProperties: true
          description: |
            Escape hatch for capability a provider declares and the orchestrator
            opted into. A run whose success depends on a key in here is a
            RUN-001 violation.

    RunID:
      type: string
      format: uuid
      description: |
        The platform's permanent run identifier (iron rule 10). Used for
        correlation, history and URLs. A provider's own id never substitutes
        for it - see ProviderRunRef.

    ProviderRunRef:
      type: object
      description: |
        The mapping RUN-003 asks for, in the direction that is safe: platform id
        is the key, the provider's id hangs off it. Recorded per attempt, so a
        retry adds a row instead of overwriting the previous provider id.
      required: [run_id, run_attempt_id, provider, provider_run_id]
      properties:
        run_id:
          $ref: "#/components/schemas/RunID"
        run_attempt_id: { type: string, format: uuid }
        provider: { type: string, description: "Provider name, e.g. self_hosted." }
        provider_run_id:
          type: string
          description: |
            The provider's ephemeral handle. Never a primary key, never part of
            a permanent URL, and only unique within one provider.

            Ephemeral is about the platform's use of it, not about how long the
            provider may recycle it: the value must never be reused for a second
            run, across provider restarts included. UUID-grade uniqueness, not a
            counter or a slot index. The platform's `run_attempts` holds a unique
            `(provider, provider_run_id)`, so a reused id collides with the row
            of a finished attempt and the dispatch fails - this is a collision
            the contract tests have actually produced, not a hypothetical.

    PackageRef:
      type: object
      description: |
        A content-addressed package the provider fetches with a grant.

        Deliberately carries no skill *name*. The runtime unpacks into one
        directory per skill and takes that directory's name from the package's
        own SKILL.md frontmatter, inside the sandbox - reading untrusted content
        is exactly what the sandbox is for, and a name in this frozen request
        would be a second copy of a fact the package already states. A package
        with no readable, spec-shaped name is simply not discovered, and the
        trace shows no activation rather than a run under a guessed name.
      required: [skill_version_id, content_hash]
      properties:
        skill_version_id: { type: string, format: uuid }
        content_hash:
          type: string
          description: sha256 of the package archive; the provider verifies before unpacking.
        object_key:
          type: string
          description: Object storage key, readable only through the matching ObjectGrant.

    TestCaseSnapshotRef:
      type: object
      description: |
        The frozen test case (TEST-001, iron rule 4). The prompt travels inline
        because the provider needs it to run; dataset bytes do not, and arrive
        through grants.
      required: [test_case_snapshot_id, content_hash, user_prompt]
      properties:
        test_case_snapshot_id: { type: string, format: uuid }
        content_hash: { type: string }
        user_prompt: { type: string }
        dataset_refs:
          type: array
          items:
            type: object
            required: [dataset_id, file_name, content_hash]
            properties:
              dataset_id: { type: string, format: uuid }
              file_name: { type: string }
              content_hash: { type: string }
              object_key: { type: string }

    RuntimeProfile:
      type: object
      description: |
        What the workload runs as, in terms every provider understands. Matched
        against ProviderCapability before dispatch (RUN-001).
      required: [runtime, runtime_version]
      properties:
        runtime:
          type: string
          description: Agent runtime family, e.g. claude_agent_sdk.
        runtime_version: { type: string }
        model:
          type: string
          description: |
            Logical model name resolved by the gateway, not a provider SKU
            (ADR-017). Default tier is the mini class (PDM-003).
        agent_integration:
          type: string
          enum: [in_sandbox_sdk, provider_hosted_agent]
          description: |
            in_sandbox_sdk - the sandbox runs the agent loop and calls out
            through the gateway. provider_hosted_agent - the provider owns the
            loop. Declared so capability matching can reject the mismatch.

    ResourceLimits:
      type: object
      description: |
        Per-run ceilings (PDM-005 5.2). A provider that cannot enforce one of
        these must not declare support for it in ProviderCapability; the
        orchestrator refuses to dispatch rather than run unbounded.
      required:
        - vcpu
        - memory_bytes
        - disk_bytes
        - max_pids
        - max_open_files
        - wall_clock_soft_seconds
        - wall_clock_hard_seconds
        - artifact_total_bytes
        - artifact_file_bytes
      properties:
        vcpu: { type: number, default: 2 }
        memory_bytes: { type: integer, default: 4294967296, description: 4 GiB. }
        disk_bytes:
          type: integer
          default: 8589934592
          description: 8 GiB total; PDM-005 splits it /work 6 GiB + /out 2 GiB.
        max_pids: { type: integer, default: 256 }
        max_open_files: { type: integer, default: 1024 }
        wall_clock_soft_seconds:
          type: integer
          default: 600
          description: Reaching this marks the run timed_out (RUN-004).
        wall_clock_hard_seconds:
          type: integer
          default: 900
          description: |
            Forced destroy. Strictly greater than the soft limit: the gap is the
            window in which a cooperative stop can still collect artifacts.
        artifact_total_bytes: { type: integer, default: 104857600, description: 100 MB. }
        artifact_file_bytes: { type: integer, default: 26214400, description: 25 MB. }
        token_budget:
          $ref: "#/components/schemas/TokenBudget"

    TokenBudget:
      type: object
      description: |
        PDM-005 5.2a. A token ceiling, and not max_budget, which prompt caching
        decoupled from token count by 7-8x. The Virtual Key's max_budget and
        tpm_limit are a spend brake and a rate brake, not this limit.

        300K input is roughly 15 turns with no tool calls, 7.7 with one per
        turn, 5 with two (measured, PDM-003 spike 11.5). Quoting the number
        without the turn conversion is meaningless.

        Enforced by the runtime harness inside the sandbox, which counts each
        model response's tokens as they stream and stops the turn on the
        response that crosses the ceiling. PDM-005 5.2a proposed the Go worker
        as the counter; that was not buildable as written, because RunUsage
        carries no token count back for a worker to accumulate and a count
        reconstructed from the trace arrives after the spending. The harness is
        where the numbers are.

        Cache-hit tokens count: caching reduces cost, not context.

        What a provider is promising by declaring this in ProviderCapability:
        that it stops the run at the ceiling, emits a terminal `usage` trace
        event and an `error` event with code `token_budget_exceeded`, and
        reports the attempt as completed-with-failure so artifacts and trace are
        still collected. A provider that does not enforce it MUST leave
        max_resources.token_budget unset rather than accept a ceiling it will
        not apply - a limit shown in the pre-run permission summary and then not
        applied is the misleading UI NFR-001 forbids.

        The stop is cooperative, in the same class as wall_clock_soft_seconds:
        it bounds a runaway agent loop, not a workload attacking its own
        harness. The non-cooperative brakes are still the Virtual Key and the
        wall-clock kill, both outside the sandbox.
      properties:
        max_input_tokens: { type: integer, default: 300000 }
        max_output_tokens: { type: integer, default: 60000 }

    EgressPolicy:
      type: object
      description: |
        Default-deny with exactly three permitted destinations (PDM-005 5.2,
        ADR-005). All three go through the controlled proxy; there is no bypass
        route, and "general internet" is not a value this schema can express.

        How that is enforced today: a run whose `allow` names `model_gateway`
        joins an internal network on which the LiteLLM gateway is the only
        reachable address - an allow list of one, enforced by what is on the
        wire rather than by a proxy. A run that allows nothing gets no network
        at all. Object storage is deliberately never on that wire: a sandbox
        that could reach the bucket would make a pre-signed URL meaningless, so
        the execution node moves those bytes itself. Production names an egress
        proxy's network instead, and the proxy enforces the destination list,
        DNS pinning and destination logging.
      required: [mode, allow]
      properties:
        mode:
          type: string
          enum: [default_deny, none]
          description: |
            `default_deny` - nothing leaves except what `allow` names, through
            the controlled proxy (PDM-005 5.2, ADR-005). `none` - no egress at
            all, and `allow` must be empty.

            The two are ordered, not alternatives: `none` is strictly stronger
            than `default_deny` with an empty allow list. A provider declaring
            only `none` can therefore satisfy a request for `default_deny` with
            an empty `allow`, and cannot satisfy one with a non-empty `allow` -
            it has no route to offer. Capability matching (RUN-005) reads the
            order this way round and never the other; substituting a weaker
            mode for a stronger one is never allowed, whatever the request said.
        allow:
          type: array
          items:
            type: object
            required: [purpose, url]
            properties:
              purpose:
                type: string
                enum: [model_gateway, object_storage, trace_ingestion]
              url: { type: string, format: uri }

    ObjectGrant:
      type: object
      description: |
        A short-lived authorization for one object path in one direction. Minted
        per attempt by the worker at dispatch (SBX-008) as a pre-signed URL, and
        fail-closed: a dispatch that cannot authorize its inputs never reaches a
        sandbox, because a run that silently executed without its skill package
        would be reported as executed-and-failed and blame the skill.

        One object, never a prefix. There is no grant shape that says "this
        directory", so the write side has exactly one key to aim at and the
        artifacts are collected into a single archive uploaded to it - the
        platform cannot know the output file names before the workload has
        produced them, and a per-file grant would have to. RunResult.artifacts
        stays the per-file manifest; it describes what is inside that archive.
      required: [purpose, object_key, access, expires_at]
      properties:
        purpose:
          type: string
          enum: [skill_package, dataset, artifact_upload]
        object_key: { type: string }
        access: { type: string, enum: [read, write] }
        url:
          type: string
          format: uri
          description: Pre-signed URL. Secret material - never logged or traced (iron rule 11).
        expires_at: { type: string, format: date-time }

    ModelGatewayGrant:
      type: object
      description: |
        A per-run LiteLLM Virtual Key (ADR-017, iron rule 8). Minted per attempt
        against the gateway's management API, scoped to the run's logical model
        so a workload cannot spend the budget on a bigger tier, and revoked at
        cleanup by an alias derived from the attempt id - nothing has to be
        stored for a restarted process to still revoke it.

        Provider keys never appear here; only the gateway holds those, and the
        management credential that mints this one stays in the control plane and
        never travels in a RunRequest.
      required: [base_url, expires_at]
      properties:
        base_url: { type: string, format: uri }
        virtual_key:
          type: string
          description: |
            Secret. Masked before any log, trace or analytics write (iron rule
            11, TRACE-001), and its pattern is on the trace masking list.
        max_budget_usd:
          type: number
          description: Spend brake, budgeted at cold-cache prices (PDM-005 5.2a-5).
        tpm_limit: { type: integer, description: "Rate brake, independent of spend flush." }
        expires_at: { type: string, format: date-time }

    TracePolicy:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [standard, verbose]
          description: |
            TRACE-001's two modes. Both are masked before storage; verbose adds
            the safety-processed raw events, it does not lift masking.
        ingestion_url: { type: string, format: uri }

    RunResult:
      type: object
      description: |
        Terminal report for one attempt. Provider diagnostics may be attached,
        but nothing in core evaluation may depend on them (ADR-004).
      required: [run_id, run_attempt_id, status]
      properties:
        run_id:
          $ref: "#/components/schemas/RunID"
        run_attempt_id: { type: string, format: uuid }
        provider_run_id: { type: string }
        status:
          type: string
          enum: [succeeded, failed, cancelled, timed_out]
          description: |
            Terminal states only. The non-terminal states of RunStatus are the
            control plane's, driven by dispatch and by streamed events; a
            provider never reports one in a result.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        agent_output:
          type: string
          description: The agent's final output, masked (iron rule 11).
        artifacts:
          type: array
          description: Manifest only. The bytes went to object storage under a write grant.
          items:
            type: object
            required: [file_name, content_hash, size_bytes]
            properties:
              file_name: { type: string }
              content_type: { type: string }
              size_bytes: { type: integer }
              content_hash: { type: string }
              object_key: { type: string }
              truncated:
                type: boolean
                description: Set when the artifact limits of PDM-005 5.2 cut the output short.
        artifacts_truncated:
          type: boolean
          description: |
            True when any output was dropped by the frozen artifact limits.
            Aggregate so even an all-dropped collection remains representable.
        usage:
          $ref: "#/components/schemas/RunUsage"
        error:
          $ref: "#/components/schemas/RunError"
        provider_diagnostics:
          type: object
          additionalProperties: true

    RunUsage:
      type: object
      description: |
        Metering, in units every provider can report (ADR-004 標準輸出).

        Known gap, stated rather than hidden: the current provider populates
        only `wall_clock_seconds`. Token counts and cost travel the trace path
        instead - the workload emits `usage` events and the platform reads spend
        from the gateway's own per-key log - so a consumer must not treat an
        absent token count here as zero usage. The ResourceLimits token ceiling
        is therefore not enforced from this field: it is enforced inside the
        sandbox, where the counts exist. See TokenBudget.
      properties:
        input_tokens:
          type: integer
          description: |
            Includes cache-hit tokens: caching reduces cost, not token count
            (PDM-005 5.2a-3). Not populated yet - see the schema description.
        output_tokens: { type: integer }
        model_cost_usd: { type: number }
        wall_clock_seconds: { type: number }
        peak_memory_bytes: { type: integer }

    RunError:
      type: object
      description: |
        Classified failure. The class decides whether a retry is even
        considerable; `retryable` is the provider's opinion and the control
        plane's policy still decides (ADR-004 - no unbounded retries).
      required: [class, message]
      properties:
        class:
          type: string
          enum:
            - provision
            - execution
            - event_delivery
            - artifact_upload
            - evaluation
            - cleanup
            - capability_mismatch
            - budget_exhausted
            - cancelled
            - timeout
          description: |
            ADR-004's failure categories, plus three the platform must be able
            to tell apart without parsing message strings:
            capability_mismatch (rejected before dispatch),
            budget_exhausted (gateway 429, distinct from a model 403 - PDM-003
            spike 6.1) and the two terminal intents.
        message:
          type: string
          description: Human-readable, masked, safe to show the user (RUN-004).
        retryable: { type: boolean }

    ProviderCapability:
      type: object
      description: |
        What a provider declares it can do (RUN-002). The orchestrator matches
        RunRequest against this and refuses incompatible work *before* queueing,
        with a reason a user can understand (ADR-004, threat model gate B).
        Matching itself lands with RUN-005.
      required: [provider, runtimes, max_resources, isolation]
      properties:
        provider: { type: string }
        runtimes:
          type: array
          items:
            type: object
            required: [runtime, versions]
            properties:
              runtime: { type: string }
              versions: { type: array, items: { type: string } }
              agent_integration:
                type: array
                items: { type: string, enum: [in_sandbox_sdk, provider_hosted_agent] }
        max_resources:
          $ref: "#/components/schemas/ResourceLimits"
        max_resources_unenforced:
          type: array
          items:
            type: string
            enum:
              [vcpu, memory_bytes, disk_bytes, max_pids, max_open_files,
               artifact_total_bytes, artifact_file_bytes]
          description: |
            Ceilings this provider carries a number for in `max_resources` but
            does not have the operating system hold to. Empty or absent means
            every declared ceiling is enforced, which is what a production
            provider must be able to say.

            This field exists because ResourceLimits' own description says a
            provider that cannot enforce a ceiling "must not declare support for
            it" - and its `required` list makes obeying that impossible, since
            every ceiling must be present. The result was a declaration that
            could only ever claim enforcement, so a provider that detected it
            had none could either lie in the field or refuse to run at all.

            It is not a demo concession. The incident ADR-059 decision 3 records
            has this exact shape: a node whose declaration and reality diverged,
            where the only thing that knew was a line in a startup log.

            A consumer must treat a named ceiling as unbounded. Dispatching
            untrusted work to a provider that names any ceiling here is a
            decision a deployment has to make on purpose, not a default.
        isolation:
          type: object
          required: [level]
          properties:
            level:
              type: string
              enum: [gvisor, container, vm, process, clean]
              description: |
                gvisor is the production baseline (ADR-015). `container` exists
                for the local dev provider only - gVisor needs Linux, and this
                is the honest name for what a developer machine actually runs.
                `process` is not acceptable for untrusted skills (iron rule 1).

                `clean` means **no boundary at all** - not a weaker one (ADR-059
                decision 1). It exists for a machine that can install nothing,
                carries only curated demo material, and needs its own opt-in at
                the dispatch gate, which is an allow list: an unlisted level,
                including a typo, is refused (ADR-059 decision 3).

                This value was added to the enum on 2026-08-29, after the code
                had been emitting it since 2026-08-28. Nothing failed in the
                meantime because this provider serves the capability from
                hand-written structs, not from generated types - which is
                exactly why the drift was invisible.
            rootless:
              type: boolean
              description: Workload runs unprivileged and non-root (RUN-003).
            dedicated_workspace_per_run: { type: boolean }
            reaps_detached_descendants:
              type: boolean
              description: |
                Whether ending a run also ends a descendant that deliberately
                left the process group or job it was started in - `setsid()` on
                POSIX, which Node spells `detached: true`.

                It is a separate field from the isolation level because the two
                platforms of one driver can differ on it: a Windows job object
                holds every descendant whether or not it wants to be held, while
                a POSIX process group is something a descendant walks out of.
                A provider that cannot reach such a process declares false here
                rather than leaving the difference in a comment.

                Absent means not declared, which a consumer must read as "no",
                not as "unknown but probably fine".
        network:
          type: object
          properties:
            egress_modes: { type: array, items: { type: string, enum: [default_deny, none] } }
            egress_unenforced:
              type: boolean
              description: |
                True when this provider declares an egress mode that nothing
                holds the workload to. Absent or false means the declared mode
                is enforced, which is what a production provider must be able
                to say.

                It exists for the same reason `max_resources_unenforced` does,
                and for the same provider. `egress_modes` has exactly two
                values: `none` (no route out) and `default_deny` (a route to
                the rendered allow list and nowhere else). A host process with
                no network namespace of its own is neither - it reaches
                everything - and until 2026-08-30 there was no way to say so.
                The consequence was not a wrong declaration but no run at all:
                any request carrying a model gateway needs `default_deny`, a
                clean-mode node could not honestly claim it, and RUN-005
                refused every such dispatch (04 丙-98).

                A consumer must treat this as "the allow list the user agreed
                to is a statement of intent, not a boundary". The workload can
                reach anything the host can. Dispatching to such a provider
                anyway is a deployment decision, and it is the same decision as
                accepting `isolation.level: clean` - the platform gates both on
                the same switch rather than inventing a second one.

                The asymmetry with `max_resources_unenforced` is deliberate:
                that field NAMES which ceilings are loose, because some can be
                enforced while others are not. Egress has nothing to enumerate.
                Either the node filters the workload's traffic or it does not.
            private_network: { type: boolean }
        features:
          type: object
          properties:
            mcp: { type: boolean }
            tool_calls: { type: boolean }
            scripts: { type: boolean }
            artifacts: { type: boolean }
            event_streaming: { type: boolean }
            gpu: { type: boolean }
        regions:
          type: array
          items: { type: string }
          description: For data residency matching.
        availability:
          type: object
          properties:
            concurrent_run_slots:
              type: integer
              description: |
                Slots still free right now, not the configured total. RUN-005
                asks this to decide whether to dispatch, and a total would have
                to be paired with a live count to answer that at all. 0 means
                full: dispatching anyway earns a 429.
            healthy: { type: boolean }
        security:
          type: object
          description: |
            What this node's own continuous checks currently say about itself.

            A capability response is a claim, and every other field here is a
            claim about configuration: what this node was *set up* to do. This
            block is the one that reports a measurement, and it is here rather
            than on a new endpoint for a structural reason — the sandbox
            provider contract is one-way. Every operation in this file is the
            control plane calling the node; the node has no channel to push an
            alert back. Polling `GET /capability` is the only path that already
            exists, and RUN-005 already reads it before every dispatch.
          properties:
            p02_probe:
              type: object
              description: |
                Threat model P-02, and ADR-022 promotes it to its own acceptance
                item T10 for a reason worth restating: every other P-zone check
                is a declarative audit that a single snapshot satisfies, while
                P-02 says in so many words that the block must be verified **by
                a probe, not by reading configuration**, and verified
                continuously. Reporting a one-time audit here would let a
                snapshot impersonate resident monitoring.

                The measurement is a connection attempt made from a sandbox's
                own network position to the addresses a sandbox must never
                reach. A node answering `pass` is saying it tried and could not
                get through, as of `checked_at`.
              required: [state, checked_at]
              properties:
                state:
                  type: string
                  enum: [pass, fail, unknown, not_configured]
                  description: |
                    `fail` means a connection SUCCEEDED — the probe reached
                    something a sandbox must not reach. It is the architecture
                    regression signal of `02:SEC-010`'s P1 row, so the platform
                    halts dispatch on it without waiting for a human, and the
                    node terminates its own live runs before answering.

                    `unknown` is a probe that could not complete. ADR-022 §3
                    counts unknown as fail for acceptance, but the two are not
                    the same operationally and are not merged here: `fail` is
                    evidence of a hole, `unknown` is the absence of evidence
                    either way. A node reporting `unknown` takes itself out of
                    rotation via `healthy: false`; it does not halt the fleet,
                    because a node that has merely just booted would otherwise
                    stop dispatch everywhere.

                    `not_configured` is a node that was never given the
                    addresses it must not reach. Honest rather than absent: a
                    field that simply disappeared would read as `pass` to
                    anything scanning for problems. Production nodes refuse to
                    start in this state (the runtime is the signal, as with the
                    image digest and the dev entrypoint); the local dev provider
                    reports it and keeps serving.
                checked_at:
                  type: string
                  format: date-time
                  description: |
                    When the reading was taken, not when it was reported. A
                    resident probe that stopped running keeps answering `pass`
                    with a `checked_at` that stops moving, and that is the only
                    way to see it from outside.
                detail:
                  type: string
                  description: |
                    On `fail`, which destination answered. Never the payload,
                    never a credential (iron rule 11) — an address and a port.
        cost_model:
          type: object
          properties:
            currency: { type: string }
            per_run_seconds_usd: { type: number }
