openapi: 3.1.0
info:
  title: Skill Hub LLM Internal API
  version: 0.1.0
  description: |
    Go control plane to Python LLM service (ADR-016 rule 3). Internal only, never
    exposed publicly. The Python server stub under packages/ is generated from
    this file and must never be hand-edited.
servers:
  - url: http://llm:8000

# No authentication, stated rather than left blank. services/llm's FastAPI app
# has no auth dependency on any route: the only thing standing between it and a
# caller is that it is not routable from outside the deployment. That is a
# network boundary and there is no security scheme to describe it with, so the
# honest declaration is an empty requirement rather than an invented apiKey.
# Publishing this port is what would make it wrong, not a missing scheme here.
security: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /embed:
    post:
      operationId: embed
      summary: Generate embeddings for texts (ADR-013, PDM-003)
      description: |
        Generates text-embedding-3-small embeddings (1536 dims) via LiteLLM
        gateway (Iron Rule 8). Used by Go to build query embeddings for hybrid
        search and by the index-time enrichment pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Embedding vectors, one per input text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "502":
          description: Embedding provider error (LiteLLM or upstream).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/enrich-skill:
    post:
      operationId: enrichSkill
      summary: Index-time LLM enrichment of a Skill Version (ADR-013 section 1)
      description: |
        Runs once per Skill Version. Reads SKILL.md plus a package file-tree
        summary and returns the ADR-013 enrichment whitelist: a plain-language
        summary, example task sentences, and input/output/tool/dependency tags.
        Feeds INGEST-009 / DISC-001 search documents.

        The response carries `model` and `prompt_version` so the caller can mark
        the fields as model-generated. It deliberately contains no trust, risk,
        safety or quality judgement - those are never model-derived (ADR-013).

        No retry here: retry and timeout policy belong to Go (ADR-016 rule 6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichSkillRequest"
      responses:
        "200":
          description: Enrichment fields for the Skill Version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichSkillResponse"
        "422":
          description: Request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Gateway error, or the model returned unusable output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: LiteLLM gateway is not configured for this process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /match-reasons:
    post:
      operationId: matchReasons
      summary: Generate match reasons for search results (ADR-013 section 3)
      description: |
        Given a user query and candidate skills, produces human-readable match
        reasons. Called by Go for the top-N search results; timeout/failure
        degrades to template reasons on the Go side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchReasonsRequest"
      responses:
        "200":
          description: Match reasons for each candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReasonsResponse"
        "502":
          description: LLM provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /suggest-criteria:
    post:
      operationId: suggestCriteria
      summary: Propose acceptance criteria for one test case (TEST-002)
      description: |
        A proposal, never a decision. Go stores whatever comes back with
        `source: suggested` and the user edits, confirms or deletes it; nothing
        here confirms a criterion on the user's behalf (ADR-016 rule 6). An
        answer the service cannot use comes back as an empty `criteria` list
        rather than as invented text - the user then writes their own, which is
        the documented manual path.

        What may travel here is bounded by the schema, not only by the caller:
        see DatasetField. No retry and no timeout policy - both are Go's
        (ADR-016 rule 6), and Go degrades a failure here to its own 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestCriteriaRequest"
      responses:
        "200":
          description: |
            The proposed criteria, de-duplicated and capped. An empty list is a
            valid answer and means no usable proposal was produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestCriteriaResponse"
        "422":
          description: Request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |
            Gateway error. Unlike /v1/enrich-skill there is no 503 here: this
            endpoint has no configuration it can be missing, so an unconfigured
            gateway surfaces as a failed call rather than as a distinct state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    EmbedRequest:
      type: object
      required: [texts]
      properties:
        texts:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 64
    EmbedResponse:
      type: object
      required: [embeddings, model, dimensions]
      properties:
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
        model:
          type: string
        dimensions:
          type: integer
    EnrichSkillRequest:
      type: object
      required: [skill_name, skill_md]
      properties:
        skill_name:
          type: string
          minLength: 1
          maxLength: 200
        skill_md:
          type: string
          description: Raw SKILL.md content. Untrusted data, never treated as instructions.
          minLength: 1
          maxLength: 200000
        file_tree:
          type: array
          description: Package file paths, already summarised/truncated by the caller.
          items:
            type: string
          maxItems: 500
          default: []
        language:
          type: string
          description: Language for `summary`. `task_examples` are always bilingual.
          maxLength: 32
          default: zh-Hant
    TaskExample:
      type: object
      required: [zh_hant, en]
      properties:
        zh_hant:
          type: string
        en:
          type: string
    SkillTags:
      type: object
      required: [inputs, outputs, tools, dependencies]
      properties:
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string
    EnrichSkillResponse:
      type: object
      description: |
        ADR-013 enrichment whitelist only. No trust, risk, safety or quality
        field may be added here.
      required: [summary, task_examples, tags, limitations, model, prompt_version]
      properties:
        summary:
          type: string
          description: Plain-language, task-oriented summary covering the document body.
        task_examples:
          type: array
          items:
            $ref: "#/components/schemas/TaskExample"
        tags:
          $ref: "#/components/schemas/SkillTags"
        limitations:
          type: array
          description: |
            What the document itself states the Skill does not do, or requires
            in order to work (DISC-003 一般模式「限制」). Restatement only: it
            stays inside the ADR-013 whitelist because it reports what the
            content says, exactly like `summary` does. A limitation the model
            infers, and any judgement of risk, safety or quality, is out of
            scope and belongs to the static scan or to a human reviewer. Empty
            when the document states none.
          items:
            type: string
        model:
          type: string
          description: Model that generated the fields above.
        prompt_version:
          type: string
          description: Prompt revision, so stale enrichments can be rebuilt.
    SkillCandidate:
      type: object
      required: [skill_id, name, summary]
      properties:
        skill_id:
          type: string
        name:
          type: string
        summary:
          type: string
    MatchReasonsRequest:
      type: object
      required: [query, candidates]
      properties:
        query:
          type: string
          minLength: 1
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/SkillCandidate"
          minItems: 1
          maxItems: 20
    MatchReason:
      type: object
      required: [skill_id, reason]
      properties:
        skill_id:
          type: string
        reason:
          type: string
    DatasetField:
      type: object
      description: |
        One column of an uploaded dataset, described by its shape and by nothing
        else: the field's name and a type inferred from the first data row.

        `additionalProperties: false` is the point of this schema, not a
        formality. Iron rule 11 and 02:TEST-002 資料使用範圍 say a user's
        uploaded rows never reach a model, and until now that rule lived only in
        Go's enforcement (internal/testlab/suggest.go) and in the service's own
        pydantic `extra="forbid"`. Stated here, the contract itself refuses a
        request that carries a cell value, a sample row or an example, so a
        future caller cannot quietly widen what leaves the platform and have it
        accepted. The row that produced `inferred_type` is read in Go's process
        and dropped there; there is deliberately no field it could travel in.
      additionalProperties: false
      required: [name, inferred_type]
      properties:
        name:
          type: string
          description: The column's name, as it appears in the uploaded file.
        inferred_type:
          type: string
          description: |
            Coarse type inferred from the first data row, e.g. number or text.
            The value that led to it is not sent and has no field here.
    DatasetOutline:
      type: object
      description: One attached file, described by its shape. Never its contents.
      additionalProperties: false
      required: [file_name]
      properties:
        file_name:
          type: string
        content_type:
          type: string
          description: |
            From the content's magic bytes, not the file name (PDM-005 §5.1).
            Empty when the caller has none.
          default: ""
        fields:
          type: array
          items:
            $ref: "#/components/schemas/DatasetField"
          default: []
    SuggestCriteriaRequest:
      type: object
      description: |
        What the model is given: the skill's name and summary, the user's own
        prompt, and the *shape* of each attached file. Untrusted content
        throughout - the prompt and the summary are user and package text, never
        treated as instructions.
      required: [user_prompt]
      properties:
        skill_name:
          type: string
          default: ""
        skill_summary:
          type: string
          description: The skill's summary, or an excerpt of SKILL.md - whichever the caller has.
          default: ""
        user_prompt:
          type: string
          minLength: 1
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetOutline"
          maxItems: 20
          default: []
    SuggestedCriterion:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
    SuggestCriteriaResponse:
      type: object
      description: |
        Also the JSON schema handed to the model, so the wire shape and the shape
        the prompt asks for cannot drift apart (same rule as MatchReasonsResponse).
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedCriterion"
          maxItems: 8
          description: |
            Blank and duplicate texts are dropped by the service, and the list is
            cut at 8. Empty means no usable proposal - not that the task needs no
            criteria.
    MatchReasonsResponse:
      description: |
        Reasons the model actually produced, for requested skill_ids only. It
        may cover fewer candidates than were sent, including none at all when
        the model's output does not match the schema. The service never
        substitutes a filler sentence: Go supplies a template reason for every
        uncovered candidate and labels it `template`, and a filler returned from
        here would be labelled `model` instead (DISC-002 provenance).
      type: object
      required: [reasons]
      properties:
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/MatchReason"
