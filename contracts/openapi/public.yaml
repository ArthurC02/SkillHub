openapi: 3.1.0
info:
  title: Skill Hub Public API
  version: 0.1.0
  description: |
    Web to Go control plane API. This file is the single source of truth for the
    contract (implementation rule 12); the TS client under packages/ is generated
    from it and must never be hand-edited.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/github/login:
    get:
      operationId: startGithubLogin
      summary: Begin GitHub OAuth login (ADR-020)
      responses:
        "302":
          description: Redirect to GitHub authorization, with a one-shot state cookie.
  /auth/github/callback:
    get:
      operationId: finishGithubLogin
      summary: GitHub OAuth callback; creates user and workspace on first login
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Login succeeded; session cookie set, redirect to the app.
        "401":
          description: State mismatch or code exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/dev/login:
    post:
      operationId: devLogin
      summary: Offline dev-provider login (ADR-020)
      description: |
        Exists only when the server runs with DEV_LOGIN=1 (local demo and E2E);
        in production the route is absent and returns 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  maxLength: 64
                  description: Dev user handle; defaults to "dev".
      responses:
        "204":
          description: Logged in; session cookie set.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked (idempotent; also returned when no session).
  /me:
    get:
      operationId: getMe
      summary: Current user and personal workspace, resolved from the session
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Me:
      type: object
      required: [user_id, email, display_name, workspace_id]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        workspace_id:
          type: string
          format: uuid
