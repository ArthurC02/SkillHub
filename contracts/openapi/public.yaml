openapi: 3.1.0
info:
  title: Skill Hub Public API
  version: 0.1.0
  description: |
    Web to Go control plane API. This file is the single source of truth for the
    contract (implementation rule 12); the TS client under packages/ is generated
    from it and must never be hand-edited.
servers:
  - url: http://localhost:8080

# Every route in internal/entrypoint/api/apiserver/router.go is wrapped in RequireSession
# unless it is listed below with its own `security`. Inheriting the requirement
# here rather than repeating it per operation keeps the two in step: a new
# operation is authenticated by default, which is the direction a mistake should
# fall in.
security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/github/login:
    get:
      operationId: startGithubLogin
      summary: Begin GitHub OAuth login (ADR-020)
      security: []
      responses:
        "302":
          description: Redirect to GitHub authorization, with a one-shot state cookie.
  /auth/github/callback:
    get:
      operationId: finishGithubLogin
      summary: GitHub OAuth callback; creates user and workspace on first login
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Login succeeded; session cookie set, redirect to the app.
        "401":
          description: State mismatch or code exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/dev/login:
    post:
      operationId: devLogin
      summary: Offline dev-provider login (ADR-020)
      description: |
        Exists only when the server runs with DEV_LOGIN=1 (local demo and E2E);
        in production the route is absent and returns 404.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  maxLength: 64
                  description: Dev user handle; defaults to "dev".
      responses:
        "204":
          description: Logged in; session cookie set.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: |
        No session is required to call it. The handler revokes whatever session
        cookie arrives and clears the cookie either way, so a caller holding an
        already-invalid cookie can still get rid of it.
      security: []
      responses:
        "204":
          description: Session revoked (idempotent; also returned when no session).
  /me:
    get:
      operationId: getMe
      summary: Current user and personal workspace, resolved from the session
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: requestAccountDeletion
      summary: Request deletion of the caller's account (CORE-007)
      description: |
        Starts a 30-day grace period; nothing is removed yet and the account
        stays usable so the request can be cancelled. Idempotent — asking twice
        keeps the original start time rather than extending the wait.

        When the grace period ends, uploaded datasets, run and download
        artifacts, and every skill nobody else forked or ran are permanently
        deleted, files included. Skill versions other users forked or historical
        runs used are retained with the owner's identity removed (PDM-006 §6.1):
        deleting them would break a third party's provenance chain, which
        DISC-003 requires to stay intact.
      responses:
        "200":
          description: Grace period started, with the scope of what will be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/deletion/cancel:
    post:
      operationId: cancelAccountDeletion
      summary: Withdraw a pending account deletion (CORE-007)
      description: |
        Valid for the whole grace period. Idempotent: cancelling when nothing is
        pending is a no-op.
      responses:
        "200":
          description: No deletion is pending any more.
          content:
            application/json:
              schema:
                type: object
                required: [deletion_requested_at]
                properties:
                  deletion_requested_at:
                    type: [string, "null"]
                    format: date-time
                    description: |
                      Always null here - the field exists so a client can read
                      the post-cancel state from the same shape it reads
                      elsewhere, rather than inferring it from a bare 200.
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/quota:
    get:
      operationId: getRunQuota
      summary: How much of the free run allowance is left (PDM-010)
      description: |
        The beta's cost ceiling as the account holder sees it: runs left today,
        runs left in the rolling window, when the window resets, and the four
        limits in force.

        Served from the same counters POST /skills/{id}/runs enforces, never
        from a stored balance. A balance column drifts and a refund would be a
        write that can be missed; the count is a time-window query over the runs
        themselves, so a refund is a predicate excluding a failure class rather
        than a row nobody remembered to add back.

        This endpoint exists only because the enforcement point does. Showing an
        allowance the platform does not apply is the exact mistake PDM-005 made
        once already (04 乙-2): a ceiling displayed on the preflight screen and
        enforced nowhere, which NFR-001 forbids. Read that order as binding —
        the numbers here are a report on a rule, not the rule.
      responses:
        "200":
          description: The allowance as it stands right now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunQuota" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            This deployment enforces no allowance, so there is none to report. The
            route is not mounted at all in that build — the same answer the mux
            gives for a path nobody wrote — because an endpoint that served zeroes
            or nulls would be a claim that a ceiling exists (04 乙-2). The pre-run
            permission summary omits its `quota` block in the same builds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /policy/data-retention:
    get:
      operationId: getDataRetentionPolicy
      summary: What the product analytics events record, and for how long (O11Y-004)
      security: []
      description: |
        02:O11Y-004: product analytics is the only data class a user produces
        without submitting anything, so its disclosure obligation is no lower
        than any other's. This is that disclosure as an endpoint rather than a
        document, for the reason GET /test-cases/limits is one — the values come
        from the constants the writer itself reads, so the page and the behaviour
        cannot drift.

        No session. A data policy a visitor has to log in to read is not a policy
        they can decide by, and the funnel's first segment is measured before any
        login exists. Nothing user-specific is read or returned.

        `collecting: false` with `retention_days: 0` is the shipped default and a
        real answer, not a missing one: NFR-002 forbids collection before a
        retention value exists, ADR-029 決策 5's 180 days is still a proposal, and
        a deployment that has set nothing writes no row and sets no cookie.
      responses:
        "200":
          description: The analytics disclosure as this deployment applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRetentionPolicy" }
  /feedback:
    post:
      operationId: submitFeedback
      summary: Report a blocking problem or a missing capability (BETA-003/004/005)
      description: |
        One endpoint for the three entry points the closed beta needs, split by
        `kind` rather than by URL: the person who is not on the invite list, the
        person whose allowance ran out, and the person who is stuck somewhere in
        the journey. The first two are the same question ("what did you want
        that you could not have") and were designed to share one form (PDM-010
        §8.1); the third is a different question and says so in `kind`.

        Not the same channel as PUT /runs/{id}/evaluation/feedback, which
        answers "was this judgement useful" about one evaluation. Merging them
        would produce one bucket that answers neither.

        `page_path` and `run_id` are what the client already knows about where
        the report came from. Nothing is captured beyond them — no screenshot,
        no console, no automatic context grab (beta-design §5): the message is
        the user's own words and everything else is a field they can see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, message]
              properties:
                kind:
                  type: string
                  enum: [blocking_issue, need_signal]
                  description: |
                    `blocking_issue` — something stopped the user from getting
                    further (BETA-004). `need_signal` — something they wanted
                    and the product does not offer, which is what both the
                    not-invited and the out-of-allowance surfaces send
                    (BETA-005).
                message:
                  type: string
                  maxLength: 2000
                  description: The user's own words. Must not be blank.
                page_path:
                  type: string
                  maxLength: 512
                  description: |
                    Where they were, as a route path only. A path, never a full
                    URL with a query string: a search query can carry personal
                    data and this channel is not where it belongs (beta-design
                    §4.2 界線 2).
                run_id:
                  type: string
                  format: uuid
                  description: |
                    The run they were looking at, when there was one. Must be
                    the caller's own; a run that is not is dropped rather than
                    failing the report, because losing the feedback would be the
                    worse outcome.
      responses:
        "204":
          description: |
            Recorded. No body and no id: there is no read surface for feedback
            and handing back an identifier would imply one exists.
        "400":
          description: Body is not JSON, `kind` is outside the enum, or `message` is blank or too long.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            No valid session. Feedback is signed-in only — the not-invited
            surface it serves is a logged-in user who has no workspace yet, not
            an anonymous visitor (beta-design §2).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/import/upload:
    post:
      operationId: uploadSkillPackage
      summary: Import a skill package by uploading a zip archive (SKILL-001)
      description: |
        Requires a session. The archive is statically validated only; nothing
        inside it is executed. Blocking findings reject the import; identical
        content re-uploaded to the same skill returns the existing version.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Package imported (or already present as this version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a valid zip archive, or uncompressed content too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Archive exceeds the upload size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /skills/generate:
    post:
      operationId: generateSkill
      summary: Generate a Skill from a task description (GEN-001)
      description: |
        Requires a session and an invite. **Mounted only where the deployment
        turns the M5 exposure flag on** (ADR-052); everywhere else this route
        does not exist — it answers whatever an unregistered path under /skills
        answers (405 today, because GET /skills/{id} matches the shape; the
        sameness is the point, not the number) — and `GET /me` does not list
        `generate_skill` among its features. A client must read that field rather
        than probing here — an entry point that has to be discovered by a failed
        request has already been drawn.

        Synchronous: there is no job and no run id, so an abandoned request is a
        cancelled generation. Nothing inside the produced package is ever
        executed, and it goes through exactly the validation path an upload does.
        A blocking finding after one retry rejects the whole thing and creates no
        version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_description]
              properties:
                task_description:
                  type: string
                  minLength: 8
                  maxLength: 4000 # one-number: generateMaxTaskRunes
                  description: |
                    The user's own words. Stored as the generated version's
                    provenance record (GEN-002) and subject to NFR-002 deletion
                    like any other user content.
      responses:
        "201":
          description: A package was generated, validated and stored as version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSkillResult"
        "400":
          description: Body was not JSON with a task_description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not on the beta invite list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            This workspace already has a generation running. One at a time: two
            concurrent generations cost twice and read the same allowance. The
            same request works once the first one finishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Either the generated package failed validation — findings verbatim,
            same shape a failed import returns, and no version was created — or
            the request was refused before the model was called (blank
            description, exhausted generation allowance) or after it produced
            something unusable (output truncated at the token ceiling, which is
            **not** retried, ADR-047 決策 2). The two are told apart by shape:
            findings for the first, a single error message for the rest.

            `task_description` is bounded on BOTH sides in Go and not only in the
            model service: a description under the floor used to travel to the
            gateway and come back as a 502, which told the user the platform was
            broken when the fix was "write a bit more".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSkillRefusal"
        "502":
          description: The model gateway failed. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/generate/failures:
    get:
      operationId: listGenerationFailures
      summary: Generations in this workspace that produced nothing (GEN-003)
      description: |
        The read half of 02:GEN-003 「在工作區留下可查的失敗紀錄」. A generation
        that failed leaves an audit row; until this route existed, that row could
        only be seen by someone holding a database connection, which is not a
        record left in the workspace.

        Requires a session and an invite, and is **mounted on the same flag as
        POST /skills/generate** (ADR-052) — a failure list is a generation
        surface, and a route answering 200 with an empty array is still an answer
        about a feature that must not be discoverable. Where the flag is off this
        route does not exist and answers 404.

        Workspace-scoped from the session; the caller never names a workspace
        (iron rule 3).

        **The task description is not here and will not be added.** It belongs to
        the skill_sources row, under NFR-002 deletion; these rows are kept 400
        days under a different rule, and one copy under each is a retention
        promise nobody made (ADR-029 decision 3 draws the same line).
      responses:
        "200":
          description: |
            Most recent first, capped. A ceiling and not a pager: the question a
            user asks of this list is "what happened the last few times".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationFailures"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not on the beta invite list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/import/url:
    post:
      operationId: importSkillFromURL
      summary: Import a skill package from an allow-listed URL (SKILL-001)
      description: |
        Requires a session. GitHub repo URLs are normalized to their zip
        archives; other allow-listed URLs must point directly at a zip. The
        package goes through the same static validation as uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: Package imported (or already present as this version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Disallowed or unreachable URL, or content is not a valid archive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /api/skills/search:
    get:
      operationId: publicSearchSkills
      summary: Public intent search for skills (DISC-001, DISC-002)
      description: |
        Natural language search over the public skill catalog. Uses hybrid
        retrieval (ADR-013): pgvector embedding similarity ranks the results and
        Postgres FTS only widens the candidate set, so a lexical hit the vector
        leg missed is still ordered by its own vector distance. Does not require
        authentication.
        Scope is the public catalog only: private workspace content is never
        returned, and no request parameter can widen the scope (CORE-006,
        ADR-011). Use GET /skills/search for the caller's own workspace.
        Candidates further than the cosine distance cut-off are not returned at
        all; when nothing survives it, the response carries no_results and a
        query_suggestion rather than a page of weak matches. Blank or
        incomprehensible queries take the same no_results path.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 2000 }
          description: Natural language task description.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: script
          in: query
          required: false
          schema: { type: string, enum: ["yes", "no"] }
          description: |
            DISC-003 filter on whether the package carries runnable code, as
            recorded by the import scan: a script file in the tree, or code
            embedded in SKILL.md itself (SKILL-003). Absent = not filtered.

            A row the projection holds no scan for matches neither value. It is
            not known to have a script and it is not known to be free of one,
            and answering `no` for it would be the 不得自行推定為通過 that
            DISC-004 forbids. Such rows leave a filtered page and return when
            the filter is cleared.
        - name: validation
          in: query
          required: false
          schema: { type: string, enum: [passed, unverified] }
          description: |
            DISC-003 filter on the spec-validation axis of `compatibility`.
            `passed` is a skill with a saved version — static validation blocks
            the import on any error-level finding, so a stored version is the
            evidence. `unverified` is a skill with no saved content, which is
            never reported as failed. Absent = not filtered.
        - name: agent
          in: query
          required: false
          schema: { type: string, enum: [native, transpiled, failed, unverified] }
          description: |
            DISC-002's Agent dimension, live since migration 0022. It filters the
            `runtime` axis of `compatibility` and only that axis, matching the
            measured verdict **exactly** rather than as a boolean: `unverified`
            is a value a caller can ask for, and a "not native" filter would
            silently mean transpiled-or-failed-or-never-measured, which are three
            different things to someone choosing a skill. Absent = not filtered.

            The `capability` axis is shown but not filterable. Every measured
            skill in the catalogue came back `activated` (45/45 in the M2
            baseline), so a control on it separates nothing; it becomes a filter
            when a `not_activated` row exists and not before.
      responses:
        "200":
          description: Ranked matches with match reasons, or empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSearchResponse"
        "400":
          description: |
            An oversized query, or an unusable filter. Either a query over 2,000
            characters, a `script`/`validation`/`agent` value
            outside its enum, or one of the three 02:DISC-002 dimensions this
            build has no per-row data for — `category`, `tier`, `mcp`. (`agent`
            left that list when 0022 gave it per-row data.) Those are
            rejected rather than ignored: answering a filtered request with an
            unfiltered page would present the whole catalog as the filtered
            subset. The error message names the dimension and why it is
            unavailable, and the UI shows the same reason on a disabled control
            rather than offering a filter that does nothing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/skills/{id}:
    get:
      operationId: getSkillDetail
      summary: Skill detail, source, license, risk and compatibility (DISC-006, DISC-008)
      description: |
        Does not require authentication. Scope is resolved by the server and never
        by the request (CORE-006, ADR-011): the public catalog answers for every
        caller, and a caller with a session additionally sees skills in their own
        workspace. Anything outside both scopes answers 404, identical to a skill
        that does not exist, so the status code is not an existence oracle for
        someone else's private content (WS-006).

        `summary` is always the package's own frontmatter description.
        Model-generated text lives under `enrichment` and is labelled there
        (ADR-013). `license` carries the ADR-021 two-axis answer — the expression
        and the provenance tier it was established at — and its status is
        `declared` at best: confirmation is a reviewer's act and nothing records
        one yet. `risk` reports a static scan of the stored package; the scan
        never executes anything (iron rule 1) and passing it is not a safety
        claim (NFR-001). `compatibility` keeps the three axes apart; the two that
        need a sandbox carry a measured verdict together with the
        `runtime_image` it holds for, and say `unverified` rather than being
        omitted when this (version, image) pair was never measured.
      # OptionalSession, not RequireSession: the request is served without a
      # session and a session only widens the scope, so both requirements are
      # listed rather than one of them.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The skill as visible in the caller's widest scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetail"
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: |
            Withdrawn from the catalog (INGEST-010). The URL was public and is
            still in circulation, so a withdrawal answers 410 rather than 404:
            the content existed and was taken down, which is a different fact
            from never having existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/skills/{id}/files:
    get:
      operationId: getSkillFiles
      summary: SKILL.md and the package file tree (DISC-007)
      description: |
        Advanced view of the latest version. Same scope rules as
        GET /api/skills/{id}, so it needs no authentication for catalog content.
        Scripts are marked with the same rule the import scan used, and the
        SKILL.md embedded-code disclosure is repeated here because the file tree
        is exactly what cannot show code living inside the document (SKILL-003).
        Package files other than SKILL.md are listed with their metadata; an
        endpoint serving their content is later DISC-007 work.

        This is the endpoint that reproduces the package's own bytes, so it is
        the one a 0023 licensing hold closes: a skill carrying
        `access_restriction` answers 403 here while everything else about it
        still answers.
      # OptionalSession; see GET /api/skills/{id}.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: SKILL.md text and the file tree of the latest version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFiles"
        "403":
          description: |
            A licensing hold is in force (SEC-011, 0023): the full text and the
            file tree are withheld until the review concludes.

            403 and not 404 on purpose. Search still lists the skill and
            GET /api/skills/{id} still describes it, so "no such thing" would be
            a lie the rest of the API immediately contradicts - the opposite call
            from the operator endpoints, where hiding existence is the point.

            `error` carries the reason sentence itself, in 繁體中文 and ready to
            show: what is withheld, what is still available, and that the hold is
            a conservative reading of the licence rather than a safety or quality
            finding. Display it rather than substituting a generic refusal - it is
            the same text `access_restriction.note` carries on the detail view,
            served from one place so every surface says it identically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller, or it has no saved version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Withdrawn from the catalog (INGEST-010); see GET /api/skills/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The stored package could not be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/search:
    get:
      operationId: searchSkills
      summary: Full-text search over the caller's skills (INGEST-009)
      description: |
        FTS leg of hybrid retrieval (ADR-013); vector recall and match reasons
        arrive with the Explorer milestone. Scoped to the session workspace.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Ranked matches; empty list when nothing matches.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "400":
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills:
    get:
      operationId: listSkills
      summary: List the caller's skills (WS-004)
      responses:
        "200":
          description: The caller's skills, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [skills, limit, truncated]
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnSkill"
                  limit:
                    type: integer
                    description: |
                      How many rows this endpoint will return at most. It is a
                      server-side cap, not a page size the caller chose — there
                      is no pagination here yet.
                  truncated:
                    type: boolean
                    description: |
                      True when the workspace holds more skills than `limit`.
                      The cap existed before this field did, and skill 101 simply
                      did not appear: a limit the platform enforces and the page
                      cannot see is 02:NFR-001's other direction, and a list that
                      is silently short reads as a complete answer.
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/{id}:
    delete:
      operationId: deleteSkill
      summary: Delete a private skill (WS-005)
      description: |
        Soft delete: the skill leaves lists, reads, and search immediately.
        Version snapshots stay frozen for the 30-day grace period before the
        background purge; shared package objects are unaffected.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted, with the exact deletion scope.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, versions_retained, note]
                properties:
                  deleted: { type: boolean }
                  versions_retained: { type: integer }
                  note: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/fork:
    post:
      operationId: forkSkill
      summary: Fork a readable skill's latest version into the caller's workspace (WS-001)
      description: |
        The package object is shared (content-addressed), not copied. Lineage
        to the original skill and version is preserved on the fork.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Fork created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Skill"
                  - type: object
                    required: [version_id, version_number]
                    properties:
                      version_id: { type: string, format: uuid }
                      version_number: { type: integer }
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The closed beta is running and the caller is not on the invite list
            (BETA-001, ADR-028 決策 1). Forking, starting a run and downloading are
            the three actions the invite gate covers; search and skill detail stay
            open to everybody, which they already were (DISC-010). Absent from
            deployments with no invite list configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A skill with the fork's name already exists in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/{id}/versions:
    get:
      operationId: listSkillVersions
      summary: List a skill's immutable versions, newest first (WS-001)
      description: |
        Workspace scoped from the session like every other registry read
        (ADR-011): a skill in somebody else's workspace answers with an empty
        list rather than with their history.

        This is the list the pre-run permission screen and the packaging screen
        pick a version from. Before it existed, both took the version id from
        the URL only, so the reader had to paste one by hand.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The skill's versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version_id, version_number, content_hash, created_at]
                      properties:
                        version_id: { type: string, format: uuid }
                        version_number: { type: integer }
                        content_hash: { type: string }
                        created_at: { type: string, format: date-time }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: saveSkillVersion
      summary: Save a zip as the next immutable version of a skill (WS-002)
      description: |
        Same static validation as import. The skills row keeps its name; the
        manifest inside the version is the snapshot's truth. Identical content
        returns the existing version with duplicate=true.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Version saved (or already present).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a valid zip archive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Archive exceeds the upload size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /skills/{id}/versions/from-suggestions:
    post:
      operationId: createSkillVersionFromSuggestions
      summary: Apply accepted improvement suggestions as one new version (EVAL-002)
      description: |
        Turns accepted suggestions into exactly **one** new immutable version
        (iron rule 4). The version they were written against is not touched and
        historical runs keep pointing at it. Several suggestions land in one
        version on purpose: one version per suggestion would leave a chain of
        intermediate versions nobody ever ran.

        Every suggestion is re-checked here rather than trusted from when it was
        proposed. `target_path` must resolve inside the package, the target file
        must still hash as it did then, the package must still pass the same
        static validation an import goes through, and a skill under a 0023
        licensing hold is refused. Anything that fails comes back by id with its
        reason instead of being applied quietly.

        Creating a version is not permission to run it. The new content hashes
        differently, so the preflight summary changes and TEST-009 requires a
        fresh confirmation before POST /skills/{id}/runs will start anything —
        the same reason EVAL-003 has no re-run endpoint of its own.
      parameters:
        - name: id
          in: path
          required: true
          description: Skill id. The evaluation's run must belong to a version of this skill.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evaluation_id, suggestion_ids]
              properties:
                evaluation_id:
                  type: string
                  format: uuid
                  description: |
                    The evaluation the suggestions belong to. Named explicitly
                    rather than derived, so applying a set produced under one
                    rubric cannot pick up a suggestion from a re-evaluation.
                suggestion_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                  description: |
                    The suggestions to apply, all of which must belong to
                    `evaluation_id`. Order does not matter; two suggestions
                    touching the same file are applied in path order.
      responses:
        "201":
          description: |
            The new version. `applied_suggestion_ids` is what actually went in;
            anything the caller asked for that did not is in
            `rejected_suggestions` with its reason, so a partial application is
            never reported as a complete one.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UploadResult"
                  - type: object
                    required: [applied_suggestion_ids, rejected_suggestions]
                    properties:
                      applied_suggestion_ids:
                        type: array
                        items: { type: string, format: uuid }
                      rejected_suggestions:
                        type: array
                        items: { $ref: "#/components/schemas/RejectedSuggestion" }
        "400":
          description: |
            Body is not JSON, the ids are not UUIDs, or at least one named
            suggestion has not been accepted (its `decision` is still `pending`,
            or it is `rejected`).

            Nothing is built from a suggestion nobody accepted, and the whole
            call is refused rather than partly honoured: a 201 listing fewer ids
            than were asked for reads as "these applied, those were blocked",
            which is a different thing from "you asked for one you never agreed
            to". The message names the ids. Decide them first with
            PUT /suggestions/{id}/decision, then send the call again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Skill, evaluation or a suggestion not visible to the caller, or a
            suggestion that does not belong to this evaluation (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Not one suggestion could be applied, so no version was created. The
            body names the reason per suggestion; the fix depends on which one,
            and re-reading GET /suggestions/{id}/diff shows the same verdict.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [rejected_suggestions]
                    properties:
                      rejected_suggestions:
                        type: array
                        items: { $ref: "#/components/schemas/RejectedSuggestion" }
  /skills/{id}/diff:
    get:
      operationId: diffSkillVersions
      summary: Compare any two versions of a skill (WS-003)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Added, removed, and modified files; unified diffs for text.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileDiff"
        "400":
          description: Malformed ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill or versions not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/takedown:
    post:
      operationId: takedownSkill
      summary: Withdraw a skill from the public surface (INGEST-010)
      description: |
        Not a delete. The skill, its versions and their import sources are
        retained (PDM-006 §6 makes takedown the only removal path for them); the
        skill leaves search, stops being a fork source, and its detail view
        answers 410. Existing forks and historical runs are unaffected, and a
        full reindex does not bring it back.

        Authorization is the ordinary workspace scope, which for curated catalog
        entries means the operator who owns the catalog workspace. Taking down
        content in someone else's workspace needs an operator role the MVP does
        not define yet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Why the content was withdrawn; required and reviewable later.
      responses:
        "200":
          description: Withdrawn, with the exact scope of the withdrawal.
          content:
            application/json:
              schema:
                type: object
                required: [skill_id, takedown_at, reason, note]
                properties:
                  skill_id: { type: string, format: uuid }
                  takedown_at: { type: string, format: date-time }
                  reason: { type: string }
                  note: { type: string }
        "400":
          description: Missing or empty reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already taken down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/skills/{id}/restriction:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setSkillRestriction
      summary: Put the licensing hold on a skill (SEC-011)
      description: |
        Operator only. Sets the 0023 access restriction on one skill, or changes
        the reason of a hold already in place, and records who did it and why.

        Idempotent: applying the same code twice writes a second audit event and
        leaves the row as it was. An operator repeating an action is not an
        error, and answering 409 here would only invite retry loops.

        The column and the audit event are written in one transaction (iron rule
        9), so a hold can never be in force without the event that explains it,
        nor explained without being in force.

        This is the only cross-workspace write in the API. A licensing question
        is about a *source*, so a hold has to reach the catalogue entry and every
        fork of it alike; being an operator is still not a widened workspace
        scope, and nothing here reads workspace-private data on the strength of
        it (SEC-011 最小權力原則).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, note]
              properties:
                reason:
                  type: string
                  description: |
                    A known reason code, e.g. `license-review`. Unknown codes are
                    refused here even though every *read* treats an unknown code
                    as restricted. The two rules face opposite ways on purpose: a
                    code arriving from anywhere else must never unlock content,
                    and a code typed in here must never leave the reader with the
                    generic sentence when a specific one was meant. The 400 names
                    the codes that exist.
                note:
                  type: string
                  maxLength: 1000
                  description: |
                    Why, in the operator's own words. Required and not
                    satisfiable with whitespace: an operator action nobody can
                    explain later is not a decision (02:SEC-011 理由必填). It goes
                    into the audit event rather than onto the row - unlike a
                    takedown, whose reason the row itself carries.
      responses:
        "200":
          description: |
            The hold is in force. The body echoes the sentence the public detail
            view will now show, so the operator sees what the user sees without
            fetching the skill.
          content:
            application/json:
              schema:
                type: object
                required: [skill_id, access_restriction, previous_reason]
                properties:
                  skill_id: { type: string, format: uuid }
                  access_restriction:
                    $ref: "#/components/schemas/SkillAccessRestriction"
                  previous_reason:
                    type: [string, "null"]
                    description: |
                      The code that was in force before this call, or null when
                      there was no hold. Null rather than an empty string: a hold
                      with a blank reason is a state 0023's CHECK constraint
                      makes impossible, and "" would read as one.
        "400":
          description: |
            Body is not JSON, `reason` is blank or not a known code, or `note` is
            blank or over 1000 bytes. The unknown-code message lists the codes
            that do exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            The caller is not an operator, **or** no such skill. The two are one
            answer on purpose.

            Not 401 and not 403: 401 would tell an anonymous caller the route
            exists and that logging in is the next step, and 403 would tell a
            signed-in member there is a privilege they lack. SEC-011 asks for
            neither to be knowable (不揭露資源與端點存在, the rule WS-006 applies
            to other people's content), so this is the answer the router gives
            for a path nobody ever wrote. Anyone off the deployment's operator
            list cannot distinguish these endpoints from a typo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: clearSkillRestriction
      summary: Lift the licensing hold on a skill (SEC-011)
      description: |
        Operator only; the 終判允許 half of 0023, setting the column back to
        null. Takes a `note` but no `reason`: there is no code to name when the
        answer is "no hold at all", and the operator still has to say why.

        Idempotent by construction - lifting a hold that was never there writes
        the same audit event with a null before-state and answers 204, because
        the caller's intent (this skill must not be held) is satisfied either
        way. Same single transaction as the PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 1000
                  description: Why the hold was lifted. Required, same rule as on PUT.
      responses:
        "204":
          description: |
            No hold is in force. Also the answer when there was none to lift, so
            there is no body to return either way.
        "400":
          description: Body is not JSON, or `note` is blank or over 1000 bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not an operator, or no such skill. See PUT for why these are one answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/dispatch:
    get:
      operationId: getDispatchStatus
      summary: Is the platform dispatching new Runs (SEC-012)
      description: |
        Operator only. The single answer to 「現在到底有沒有在派送」, which is the
        whole reason 03:SEC-012 requires the P1 halt and ADR-022 X-04's
        drain/suspend to be one switch rather than two.

        Both triggers appear here in the same list and are told apart by
        `source`: `p1_incident` waits for a person, `orphan_threshold` clears
        itself after two consecutive reconciler rounds below the threshold.
      responses:
        "200":
          description: The switch, as the platform's own dispatcher reads it.
          content:
            application/json:
              schema:
                type: object
                required: [dispatching, halts]
                properties:
                  dispatching:
                    type: boolean
                    description: |
                      False when nothing can be dispatched at all — the pool is
                      halted, or every configured provider is drained one at a
                      time, which is the same operational fact.
                  halts:
                    type: array
                    items:
                      type: object
                      required: [target, source, reason, declared_at, automatic_recovery]
                      properties:
                        target:
                          type: string
                          description: A provider name, or `pool` for the whole fleet.
                        source:
                          type: string
                          enum: [p1_incident, orphan_threshold]
                        reason: { type: string }
                        declared_at: { type: string, format: date-time }
                        clear_rounds:
                          type: integer
                          description: |
                            Consecutive reconciler rounds this halt's own
                            condition has been clear. Only moves for
                            `orphan_threshold`; two lifts it.
                        automatic_recovery:
                          type: boolean
                          description: |
                            False for `p1_incident`. Automatic release would let
                            the trigger decide when service resumes, which
                            03:SEC-012 forbids.
        "404":
          description: |
            The caller is not an operator. Same non-disclosure rule as the
            restriction routes above, and more so: an endpoint that stops the
            whole fleet is one whose existence is worth not advertising.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/dispatch/halt:
    put:
      operationId: declareDispatchHalt
      summary: Stop dispatching new Runs (SEC-012, 02:SEC-010 P1)
      description: |
        Operator only. Declares a P1 and performs its three automatic actions at
        once: new runs are refused (503 on POST /skills/{id}/runs), nothing is
        dispatched to the target, and cleanup and orphan teardown stand down so
        the scene is preserved for the investigation.

        This endpoint exists because most P1 criteria are judgements or live
        outside this process — 逃逸疑慮, the P-02 probe, the gVisor advisory cron,
        and a Reconciler that has stopped cannot be the thing that notices it
        stopped. What the platform can do is make the response one request, which
        is what 02:SEC-010's escalation rule 「不確定屬 P1 或 P2 時一律以 P1 處理」
        depends on.

        Writes the halt row and its audit event in one transaction (iron rule 9).
        Idempotent: re-declaring rewrites the reason and writes a second audit
        event, because an operator repeating an action is not an error.

        A P1 declared over a target already paused by the X-04 threshold takes it
        over — including its release, which stops being automatic. The reverse
        never happens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                provider:
                  type: string
                  description: |
                    Drain one node (ADR-022 X-04 ①「其他節點不受影響」). Omit for
                    the whole fleet. A name that is not in the deployment's
                    provider list is refused rather than stored: a halt on a
                    misspelled node protects nothing and reads, on GET
                    /admin/dispatch, exactly like one that does.

                    Draining is a control-plane action only. Cordoning the VM,
                    stopping sandboxd and rebuilding the node are deployment-period
                    actions and nothing here simulates them.
                note:
                  type: string
                  maxLength: 1000
                  description: |
                    Why, in the operator's own words. Required and not satisfiable
                    with whitespace, same rule as the restriction routes: halting
                    the fleet is not a decision if nobody can explain it later. It
                    is stored as the halt's reason and copied into the audit event.
      responses:
        "200":
          description: Nothing is dispatched to this target until somebody resumes it.
          content:
            application/json:
              schema:
                type: object
                required: [target, source, reason, declared_at, note]
                properties:
                  target: { type: string }
                  source: { type: string, enum: [p1_incident] }
                  reason: { type: string }
                  declared_at: { type: string, format: date-time }
                  note:
                    type: string
                    description: What the halt now does, in one sentence.
        "400":
          description: Body is not JSON, `note` is blank or over 1000 bytes, or `provider` is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The caller is not an operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: liftDispatchHalt
      summary: Resume dispatching (SEC-012)
      description: |
        Operator only, and the only way a `p1_incident` halt is ever released:
        03:SEC-012 「解除不得是自動的（自動解除等於讓觸發條件自己決定何時恢復服務）」.

        It releases an `orphan_threshold` halt too, because an operator who has
        finished dealing with a leak should not have to wait out the reconciler.
        Same statement either way — there is no second path back to dispatching
        that could disagree with this one.

        Queued runs resume on the supervisor's next sweep; nothing was failed
        while the halt was in force, so nobody has to start over. Cleanups that
        stood down are performed on the next sweep as well.

        Idempotent: lifting nothing answers 204, because the caller's intent is
        already true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                provider:
                  type: string
                  description: The drained node to return to service; omit for the fleet-wide halt.
                note:
                  type: string
                  maxLength: 1000
                  description: Why it is safe to resume. Required, same rule as on PUT.
      responses:
        "204":
          description: |
            This target is dispatchable. Also the answer when there was nothing
            to lift.
        "400":
          description: Body is not JSON, `note` is blank or over 1000 bytes, or `provider` is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The caller is not an operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/runs/preflight:
    get:
      operationId: getRunPreflight
      summary: What the run will be allowed to touch, before it starts (TEST-008)
      description: |
        Eight disclosures for one (version, test case) pair: the datasets it can
        read, whether the package carries runnable code, the tools and MCP
        servers it gets, its egress policy, the names of the secrets injected
        into it, who will run it, and the resource ceilings it is held to.

        Nothing here is a claim that the skill is safe (NFR-001) and nothing in
        the package is executed to produce it (iron rule 1) — `scripts` comes
        from re-scanning the stored bytes, which is why an unreadable package
        reports `unavailable` and never `none`.

        `summary_hash` is a hash over exactly those facts and is what
        `POST .../preflight/confirm` and `POST /skills/{id}/runs` agree to. It
        changes whenever any of them does, so a dataset added after a
        confirmation invalidates that confirmation by construction — nothing
        sweeps for stale agreements. `notes` sits outside the hash: rewording an
        explanation must not invalidate every outstanding confirmation.
      parameters:
        - name: id
          in: path
          required: true
          description: Skill id. The version must belong to this skill.
          schema: { type: string, format: uuid }
        - name: version_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: test_case_id
          in: query
          required: true
          description: |
            The editable draft, not a snapshot. The summary describes a run that
            has not started, and a snapshot only exists once one has.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The current permission summary and its hash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPermissionSummary" }
        "400":
          description: '`version_id` or `test_case_id` missing or not a UUID.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Skill, version or test case not in the caller's workspace, or the
            version does not belong to this skill (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/runs/preflight/confirm:
    post:
      operationId: confirmRunPreflight
      summary: Record agreement to a permission summary (TEST-009)
      description: |
        The user's explicit agreement to the summary they were shown. Declining
        is not an operation: a user who declines simply does not call this, and
        without a record here the run cannot start.

        The hash is checked against a freshly built summary rather than taken on
        trust, so a client cannot confirm a hash it invented or one that has
        already gone stale.

        Confirmations accumulate by hash, and re-confirming an already-agreed
        summary is harmless. Nothing expires them: a summary that no longer
        describes the run hashes differently and its old agreement is simply
        never looked up again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id, test_case_id, summary_hash]
              properties:
                version_id: { type: string, format: uuid }
                test_case_id: { type: string, format: uuid }
                summary_hash:
                  type: string
                  description: The `summary_hash` from GET .../preflight, verbatim.
      responses:
        "201":
          description: Agreement recorded.
          content:
            application/json:
              schema:
                type: object
                required: [confirmed, summary_hash, confirmed_at]
                properties:
                  confirmed: { type: boolean }
                  summary_hash: { type: string }
                  confirmed_at: { type: string, format: date-time }
        "400":
          description: Body is not JSON, or the ids are not UUIDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill, version or test case not visible to the caller (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `summary_hash` is not the current summary's. 422 rather than 409: the
            request is well formed and nothing conflicts, the agreement is simply
            to something that is no longer true. Read the summary again and
            confirm that one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/runs:
    post:
      operationId: startRun
      summary: Start a run of one skill version against one test case (RUN-001)
      description: |
        Creates the run in `queued` and enqueues its execution job in the same
        transaction, so a run that exists is always a run something will pick up.

        The test case is snapshotted here, not referenced: a run points at frozen
        content (iron rule 4), and later edits to the test case cannot rewrite
        what a past run was asked to do.

        The response is immediate — execution is asynchronous (ADR-008). Poll
        `GET /runs/{run_id}` for progress.

        Two things are checked before anything is written. Whether the configured
        fleet can carry the work at all (RUN-005), and whether the caller has
        agreed to the current permission summary (TEST-005); both refuse with 422
        and neither leaves a run behind. `provider` still comes back as
        `unassigned` — the fleet was checked here, but the individual provider is
        picked when the job is dispatched, and naming one now would name one the
        scheduler may not use.
      parameters:
        - name: id
          in: path
          required: true
          description: Skill id. The version must belong to this skill.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id, test_case_id, confirmed_summary_hash]
              properties:
                version_id: { type: string, format: uuid }
                test_case_id: { type: string, format: uuid }
                confirmed_summary_hash:
                  type: string
                  description: |
                    The permission summary the user agreed to (TEST-005). Required,
                    and never inferred from a previous run of the same pair - an
                    agreement is to one summary, not to a skill.

                    It is not an authorization by itself: the server rebuilds the
                    summary from what is true now, requires this to equal that
                    hash, and requires a recorded confirmation of it. Sending a
                    hash nobody confirmed fails the second check.
      responses:
        "201":
          description: Run queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Skill, version or test case not in the caller's workspace, or the
            version does not belong to this skill. Existence is private, so this
            is a 404 rather than a 403 (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The closed beta is running and the caller is not on the invite list
            (BETA-001, ADR-028 決策 1). 403 rather than 404 because the beta is
            not a secret: the same API just served this person the catalogue, so
            denying the endpoint exists would be contradicted by their next
            request. The body explains, and points at POST /feedback.

            Absent from deployments with no invite list configured, which is
            every deployment that is not running a closed beta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Well formed, the platform is working, and the run still may not
            start. Three causes, and the message says which:

            - No configured provider can satisfy the run's requirements
              (RUN-005); the message names the requirement each one failed.
            - `confirmed_summary_hash` is absent, is not the current summary's,
              or names a summary nobody confirmed (TEST-005). The fix is the same
              in all three cases: GET the preflight summary again, confirm the
              hash it returns, and retry with that. A permission that changed
              since the agreement lands here rather than riding an agreement
              nobody gave.
            - The free run allowance is spent (PDM-010). The daily and the
              rolling-window ceilings both land here, and the message carries the
              reset time. Enforced in the same transaction that would have
              inserted the run and under the same advisory lock as the
              concurrency limit, so a refusal leaves no run behind (ADR-028
              決策 2). The counters are the same ones GET /me/quota reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            The fleet is held for a P1 security incident (SEC-012, 02:SEC-010's
            automatic first action). 503 and not 422, which is what every other
            refusal on this route is: those say the request may not proceed while
            the platform is fine, this one says the platform is not.

            Only an incident halt refuses creation. ADR-022 X-04's capacity pause
            leaves runs `queued` instead, because its release is automatic — two
            clear reconciler rounds — so queueing is a wait with an end. An
            incident halt has no automatic release at all, and a queue that may
            not move until an investigation finishes is a worse answer than
            saying so now.

            The body carries no incident detail: the person who cannot start a
            run is not the person the incident is about. Retrying is safe and
            nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs:
    get:
      operationId: listRuns
      summary: The workspace's run history, newest first (WS-004)
      description: |
        02:WS-002 第 1 條's "Run 歷史". Workspace scoped from the session like
        every other run route (iron rule 3).

        Each row carries what happened, to which skill, and when. The status
        transitions and the per-attempt provider ids stay on GET /runs/{id}:
        they are what a reader opens one run to see, and serving them for a page
        of runs would make the list the heaviest read in the API for information
        nobody reads a page of.
      parameters:
        - name: test_case_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Only runs of this test case — the "執行歷史" of one draft, which is
            what closes the 建立 → 試跑 → 回來看 loop. Matched against the test
            case the run's snapshot was frozen from, so a run stays in the list
            after the draft has been edited. Workspace scoped like the unfiltered
            list; another workspace's id matches nothing (WS-006).

            ponytail: the filter is applied over the newest 500 runs of the
            workspace rather than in the SQL. A workspace with more runs than
            that will not see the older ones in a filtered list; the upgrade is
            a predicate on ListWorkspaceRuns.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Clamped server-side; an out-of-range value falls back to the default.
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The workspace's runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/RunListItem" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}:
    get:
      operationId: getRun
      summary: Current run status and how it got there (RUN-002)
      description: |
        `id` is the platform `run_id` and always will be: a provider's ephemeral
        id is never part of a URL (iron rule 10). It appears in the response only
        as an attribute of the attempt that owns it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run, its full status history and its attempts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/artifacts:
    get:
      operationId: listRunArtifacts
      summary: What a run produced, as a manifest (WS-004, 02:SEC-006)
      description: |
        File names, sizes and hashes — never the bytes. The archive a sandbox
        produced is untrusted content and the control plane does not open it
        (iron rule 1); evaluation reads these same rows.

        This list exists so the owner can see what there is to delete. Before it,
        the only way to remove a run artifact was to delete the whole account.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run's outputs.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/RunArtifact" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/artifacts/{artifactId}:
    delete:
      operationId: deleteRunArtifact
      summary: Delete one of the caller's run outputs (02:WS-002 第 3 條, 02:SEC-006 第 1 條)
      description: |
        Idempotent: an id that is not there, is already deleted, or belongs to
        somebody else all answer 204. The caller asked for the file not to exist,
        and that holds in every one of those cases; answering 404 to a repeat of
        a delete that worked would report success as failure.

        The row is soft-deleted so evaluations keep the evidence reference they
        already recorded, and stops appearing in this workspace's surfaces, which
        is what 02:SEC-006 asks for. The stored object is removed after the
        commit unless another artifact row still names the same key.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The artifact is gone, or was never there.
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      summary: Request cancellation of a run (RUN-004)
      description: |
        Records the request and returns 202. The run keeps its current status:
        the workload is still up until something stops it, and reporting
        `cancelled` before that would misdescribe a live sandbox.

        A queued run has no workload yet, so it does move to `cancelled` shortly
        after. Propagating the request to a run already at a provider — and the
        wall-clock timeout that shares the same machinery — is RUN-006.

        Idempotent: asking twice keeps the first request time.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    properties:
                      note: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The run already finished; there is nothing left to cancel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/trace:
    get:
      operationId: getRunTrace
      summary: Run trace, in either the general or the advanced mode (TRACE-006, TRACE-007)
      description: |
        One endpoint, two modes, because both are the same stored events read two
        ways and a client toggling between them should not have to know two URLs.

        `general` is a human-readable progress summary aggregated from the
        events: which skills were used, how many resources were read, how the
        tool calls went, the final answer, token usage. `advanced` is the raw
        events in reliable receipt-order pages, with canonical ordering inside
        each page, plus an explicit statement of which ones are missing. A
        consumer that needs one reconstructed cross-producer timeline fetches
        all pages and applies the ordering tuple documented on `events`.

        There is no unmasked mode. Masking runs before storage (TRACE-005, iron
        rule 11), so the plaintext an unmasked mode would show does not exist
        anywhere to be served.

        `complete: false` means a producer's gapless sequence has a hole, which
        means an event was lost. The UI must say so rather than present the
        remainder as the whole story (ADR-009).

        Every payload here is untrusted content that crossed the trust boundary
        (ADR-001) and must be rendered as inert text: no HTML, ANSI or SVG
        interpretation.
      parameters:
        - name: id
          in: path
          required: true
          description: The platform run_id. A provider's ephemeral id never appears in a URL (iron rule 10).
          schema: { type: string, format: uuid }
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [general, advanced]
            default: general
        - name: after
          in: query
          required: false
          description: |
            Advanced-mode ingestion cursor. Omit or use 0 for the first page.
            Page boundaries follow receipt order so a running producer cannot
            make an earlier page skip a newly committed event.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200":
          description: The trace in the requested mode.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TraceSummary"
                  - $ref: "#/components/schemas/TraceAdvanced"
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run. Existence is private (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/evaluation:
    get:
      operationId: getRunEvaluation
      summary: The task judgement for one run (EVAL-001)
      description: |
        Answers "was the task achieved". That is a different question from
        `Run.status`, which answers "what happened while this executed", and the
        two are separate resources because they are separate facts: a run at
        `succeeded` whose evaluation is `not_met` is an ordinary consistent
        state — the workload finished and did not do what was asked. No surface
        may collapse them into one verdict (ADR-025, NFR-001).

        A run with no evaluation answers **404, not an empty evaluation**.
        「未評估」 is a state of its own, and a blank body is exactly what a UI
        would render as a pass. An evaluation that ran and broke is a third
        state again, and it does have a body: `status: failed`.

        `revision` reads one particular judgement by id; omitted, the answer is
        the current one. Re-evaluation is append-only (a new rubric or judge
        prompt writes a new row and supersedes the old), so a verdict quoted in
        a report never changes underneath it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revision
          in: query
          required: false
          description: An `evaluation_id` from GET /runs/{id}/evaluation/revisions.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The judgement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Not the caller's run, the run has never been evaluated, or no such
            revision. One answer for all three: existence is private (WS-006),
            and 「還沒評」 is not an error condition the client can fix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/evaluation/revisions:
    get:
      operationId: listRunEvaluationRevisions
      summary: Every judgement ever recorded for one run (EVAL-001)
      description: |
        Newest first. Re-evaluating writes a new revision and stamps
        `superseded_at` on the previous one; nothing is overwritten, so a reader
        can always tell which rubric and judge prompt a verdict was reached
        under. Exactly one revision has a null `superseded_at` — that is the one
        GET /runs/{id}/evaluation returns without `revision`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run's judgement history.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: { $ref: "#/components/schemas/EvaluationRevision" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run, or it has never been evaluated (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/evaluation/feedback:
    put:
      operationId: setEvaluationFeedback
      summary: Say whether the judgement was helpful (EVAL-001)
      description: |
        PUT and not POST: this is a mutable field of an evaluation that already
        exists, and a user is allowed to change their mind. Sending it again
        replaces the previous answer instead of recording a second one.

        It attaches to the current revision. A later re-evaluation starts
        without feedback — carrying an opinion about one verdict onto another
        one would be attributing something nobody said.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean }
                comment:
                  type: string
                  maxLength: 2000
                  description: Optional; sending it empty clears a previous comment.
      responses:
        "200":
          description: The evaluation, with the feedback as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "400":
          description: Body is not JSON, `helpful` is missing, or the comment is too long.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run, or it has no evaluation to answer about (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/suggestions:
    get:
      operationId: listRunSuggestions
      summary: Improvement suggestions from the current evaluation (EVAL-002)
      description: |
        Suggestions belong to an evaluation, not to a run: re-evaluating under a
        different rubric produces its own set, and this returns the current
        evaluation's. An empty list means that evaluation produced none; a run
        with no evaluation answers 404, for the same reason
        GET /runs/{id}/evaluation does.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The current evaluation's suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [evaluation_id, suggestions]
                properties:
                  evaluation_id:
                    type: string
                    format: uuid
                    description: |
                      Which evaluation these came from. Quote it back to
                      POST /skills/{id}/versions/from-suggestions.
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/ImprovementSuggestion" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's run, or it has never been evaluated (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /runs/{id}/comparison:
    get:
      operationId: compareRuns
      summary: Compare this run with another one (EVAL-003)
      description: |
        Read-only. Both sides are frozen snapshots, so comparing cannot rewrite
        either run (iron rule 4).

        **There is no re-run endpoint.** Re-running is POST /skills/{id}/runs
        with the new `skill_version_id` and the same `test_case_id`, which keeps
        preflight and `confirmed_summary_hash` on the path. A one-click shortcut
        would be a way around the single screen TEST-009 exists to force, and
        the package contents genuinely did change.

        Each side reports its execution status and its task judgement
        separately, and a side with no judgement says so rather than reading as
        a pass (ADR-025).

        Any two runs in the caller's workspace may be compared. Two runs of
        different test cases, or of different skills, are not refused: the
        criterion matrix carries a null verdict where a criterion exists on one
        side only, and `version_diff_url` is absent when there is no diff to
        link. Refusing them would need a rule the acceptance criteria do not
        state, and would hide the case a user most wants to see — the same test
        case re-run after the package changed — behind a guess about intent.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: against
          in: query
          required: true
          description: The other run. Must be in the caller's workspace.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The two runs side by side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunComparison" }
        "400":
          description: '`against` is missing, is not a UUID, or names this same run.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Either run is not the caller's. Existence is private (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /suggestions/{id}/decision:
    put:
      operationId: decideSuggestion
      summary: Accept or reject one suggestion (EVAL-002)
      description: |
        Records the decision and changes no package. Applying is
        POST /skills/{id}/versions/from-suggestions, and the two are separate so
        that accepting five suggestions produces one new version rather than
        five.

        Repeatable: a later call replaces the decision. It does not undo
        anything already applied — a version that was built is history, and the
        way back from it is another version (iron rule 4). Withdrawing the
        acceptance of a suggestion that has already been built into a version is
        therefore refused with 409 rather than recorded: the record would say the
        user never agreed to a change that is sitting in a stored package.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accepted, rejected]
                  description: |
                    `pending` is not settable: it is the state a suggestion
                    starts in, and there is no request that means "un-decide".
      responses:
        "200":
          description: The suggestion, with its decision as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImprovementSuggestion" }
        "400":
          description: Body is not JSON, or `decision` is missing or outside the enum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Suggestion not visible to the caller (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `rejected` on a suggestion whose `applied_skill_version_id` is set.
            The version exists and cannot be unbuilt, so the decision behind it
            is not rewritable; the way to change the package again is another
            version (iron rule 4). Re-sending `accepted` on the same suggestion
            is not a conflict and stays a 200.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /suggestions/{id}/diff:
    get:
      operationId: getSuggestionDiff
      summary: What applying this suggestion would change (EVAL-002)
      description: |
        EVAL-002 第 3 條 requires the change to be viewable before it is
        applied, so the diff is served rather than assembled in the client:
        computing it needs the stored package bytes, which the client does not
        have, and a client-side guess could disagree with what apply actually
        does.

        It runs the same checks the apply call runs, so `applicable: false` here
        and a rejection there give the same `blocked_reason`. A suggestion that
        cannot be applied still shows why.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The unified diff, or the reason there is none to show.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestionDiff" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Suggestion not visible to the caller (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /internal/trace/{token}:
    post:
      operationId: ingestTraceEvents
      summary: Accept one batch of trace events from the execution plane (TRACE-002)
      description: |
        Machine to machine, not a user endpoint. The caller is a sandbox
        provider pushing what the workload wrote; the sandbox itself has no
        network and cannot reach this.

        **Authentication is the token in the path and nothing else.** Not a
        session: there is no user. Not the provider's bearer token: that
        credential is deployment-wide, and a credential covering every run must
        not be able to append to one run's timeline. The token is HMAC-signed by
        the control plane, scoped to one (run_id, attempt), short-lived, and
        grants append only - it can read nothing. It travels inside
        `TracePolicy.ingestion_url` of the sandbox provider contract, which has
        no separate token field.

        Everything in the body is untrusted input (ADR-001). The order on this
        side is fixed: verify the token, resolve workspace_id from run_id under
        the platform's own authority (iron rule 3), validate each envelope, mask
        (TRACE-005), then store. Nothing reaches the database unmasked.

        Rejection is per event, not per batch: one malformed event must not
        discard the well-formed ones beside it. An event naming a different run
        or attempt than the token covers is rejected, never re-homed.

        Delivery is at-least-once, so a redelivered `event_id` is counted as a
        duplicate and stored once. Events arriving after the run reached a
        terminal state are accepted and flagged late rather than dropped: a
        sandbox pushes its last batch as it shuts down, and that tail is the
        part a failed run most needs (RUN-004, TRACE-008).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The signed per-attempt ingestion credential. Secret material; never logged.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: { $ref: "#/components/schemas/SandboxTraceEvent" }
      responses:
        "202":
          description: |
            Batch accepted. 202 rather than 201 on purpose: the producer must not
            read this as "all of them were new" - the report says how many were
            stored, how many were duplicates and how many were refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceIngestReport" }
        "400":
          description: Body is not a JSON array of trace events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing, malformed, wrongly signed or expired token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The token names a run that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Batch too large, or too many events in one request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases:
    post:
      operationId: createTestCase
      summary: Create a test case draft (TEST-001)
      description: |
        A test case is an editable draft bound to a skill in the caller's
        workspace. The prompt and criteria a run actually executed are frozen
        separately in a snapshot (TEST-010), so editing a draft never rewrites
        what a past run did.

        The skill is chosen here; the skill *version* is chosen when the run
        starts, so improving a skill does not orphan its test cases (iron rule 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id, name, user_prompt]
              properties:
                skill_id: { type: string, format: uuid }
                name: { type: string, maxLength: 200 }
                user_prompt:
                  type: string
                  maxLength: 32768
                  description: Must not be blank (TEST-001).
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400":
          description: Blank or over-long name or prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listTestCases
      summary: List the caller's test cases (WS-004)
      description: |
        Workspace scoped from the session (iron rule 3). `skill_id` narrows the
        list to one skill and is not a widening: a skill outside the caller's
        workspace matches nothing, exactly as an id that does not exist does
        (WS-006).
      parameters:
        - name: skill_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Only this skill's test cases. Answers "which test cases have I
            written for this skill", which the Skill detail page asks.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 101, default: 51 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The caller's test cases, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [test_cases]
                properties:
                  test_cases:
                    type: array
                    items: { $ref: "#/components/schemas/TestCaseListItem" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/limits:
    get:
      operationId: getDatasetLimits
      summary: Upload limits and storage policy (TEST-002 上傳前顯示)
      description: |
        02:TEST-002 requires the size limit, the retention policy and the data
        usage scope to be shown *before* an upload, not discovered by being
        refused. The values are PDM-005 §5.1 and are served from the same
        constants the upload path enforces, so the two can never drift.
      responses:
        "200":
          description: The limits in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetLimits" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTestCase
      summary: Read one test case draft
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateTestCase
      summary: Edit a test case's name, prompt or rubric (TEST-001, CONTENT-007)
      description: |
        Omitted fields keep their stored value.

        `rubric` is three-valued and each value is a different statement: absent
        keeps the stored rubric, an object replaces it, and an explicit `null`
        removes it. There is no "empty rubric" — a rubric with no items is
        refused, because "this test case has no rubric" and "this test case has a
        rubric that says nothing" would otherwise be the same bytes.

        Editing here never rewrites a past run: a run freezes the rubric along
        with the prompt and the criteria, so an edit is the standard for the
        *next* run (iron rule 4, ADR-003).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                user_prompt: { type: string, maxLength: 32768 }
                rubric:
                  oneOf:
                    - $ref: "#/components/schemas/Rubric"
                    - type: "null"
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400":
          description: Blank or over-long name or prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteTestCase
      summary: Delete a test case and its uploaded files (WS-002)
      description: |
        Soft delete. The draft and its live datasets leave every read now and the
        stored objects are removed. Snapshots of past runs are retained and keep
        the prompt, the criteria and each file's name and content hash, so those
        runs stay traceable although they are no longer reproducible (ADR-003).
      responses:
        "200":
          description: Deleted, with the exact deletion scope.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, datasets_deleted, note]
                properties:
                  deleted: { type: boolean }
                  datasets_deleted: { type: integer }
                  note: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/{id}/criteria:
    post:
      operationId: addAcceptanceCriterion
      summary: Add an acceptance criterion (TEST-003)
      description: |
        The one write path for a criterion, whether the user typed it or adopted
        a proposal from POST .../criteria/suggest. Either way it arrives
        unconfirmed: adopting a wording is not yet agreeing to it (TEST-003).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
                source:
                  type: string
                  enum: [user, suggested]
                  default: user
                  description: |
                    Who wrote the wording. `suggested` is for text taken verbatim
                    from a suggestion — EVAL-001 reads it to keep a model's
                    proposal from being reported as the user's own judgement, and
                    a client that drops the label makes that impossible. Editing
                    the text later re-labels it `user`, because by then the words
                    are theirs.

      responses:
        "201":
          description: The updated draft, criteria included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400":
          description: Blank or over-long text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The test case already holds the maximum number of criteria.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/{id}/criteria/suggest:
    post:
      operationId: suggestAcceptanceCriteria
      summary: Ask the model to propose acceptance criteria (TEST-002)
      description: |
        **Returns proposals and stores nothing.** TEST-001 makes automatic
        suggestion 可選強化 and puts the confirmation with the user; a route that
        wrote first and left the user deleting what it had decided for them was
        the opposite shape. Adopting a proposal is POST
        /test-cases/{id}/criteria with its text, one at a time, which is the
        same route a hand-written criterion goes through.

        A proposal that breaks an input rule, or repeats a criterion already on
        the draft, is dropped rather than reported — the rest of the batch is
        still useful.

        What reaches the model is the skill's name and summary, the user's own
        prompt, and for each attached file its name, its type and its *column
        names* with a type inferred from the first data row. Never a cell value,
        never a row, never the file: the row that led to "number" or "text" is
        read in this process and dropped, and the request has no field it could
        travel in (iron rule 11, NFR-002).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: |
            The proposals. 200 and not 201 because nothing was created: the
            draft is exactly as it was before the call, and an empty list is a
            valid answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptanceCriteriaSuggestions" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Test case not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            No suggestion could be produced, and the draft is unchanged. Covers
            every reason alike: the LLM service is not configured for this
            process, it answered an error, or it did not answer inside the
            timeout. TEST-002 is an enhancement on top of TEST-003, so its
            absence is an unavailable feature and not a failed request, and the
            message names the manual path. The cause stays in the platform's log
            — a client cannot tell a misconfiguration from a gateway error here,
            and does not need to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/{id}/criteria/{criterionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: criterionId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAcceptanceCriterion
      summary: Edit and/or confirm an acceptance criterion (TEST-003)
      description: |
        Edit and confirmation are one statement because they are one decision:
        confirming means agreeing to the text as it stands. Changing the text of
        a confirmed criterion therefore clears the confirmation — the agreement
        applied to the old words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                text: { type: string, maxLength: 2000 }
                confirmed:
                  type: boolean
                  description: True records the user's explicit agreement; false withdraws it.
      responses:
        "200":
          description: The updated draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400":
          description: Empty body, or blank or over-long text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Test case or criterion not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteAcceptanceCriterion
      summary: Remove an acceptance criterion (TEST-003)
      responses:
        "200":
          description: The updated draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Test case or criterion not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/{id}/datasets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: uploadDataset
      summary: Upload one dataset file to a test case (TEST-004)
      description: |
        PDM-005 §5.1 limits are enforced here: at most 25 MB per file, 100 MB and
        20 files per test case, and an allow-list of kinds judged by magic bytes
        — the file extension is never consulted, so an executable renamed to
        `.csv` is refused. Rejections name the limit that was hit and nothing
        about the system behind it (02:TEST-002 不洩漏系統資訊).

        The stored file is reachable only by runs of this test case, and
        `expires_at` is 90 days from upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400":
          description: Missing file part, empty file, or unreadable upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Test case not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: |
            A size or count limit was exceeded: the file is over 25 MB, or the
            test case would exceed 100 MB or 20 files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The content is not an allowed kind, judged by magic bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listDatasets
      summary: List a test case's uploaded files (TEST-004)
      responses:
        "200":
          description: The live files and their total size.
          content:
            application/json:
              schema:
                type: object
                required: [datasets, total_bytes]
                properties:
                  datasets:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
                  total_bytes: { type: integer, format: int64 }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Test case not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /test-cases/{id}/datasets/{datasetId}:
    delete:
      operationId: deleteDataset
      summary: Delete an uploaded file (TEST-004)
      description: |
        Usable before a run to withdraw a file and after a run to remove it. The
        stored object is deleted; snapshots keep the file's name and content
        hash so past runs stay traceable (ADR-003).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: datasetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted, with the exact deletion scope.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, dataset_id, note]
                properties:
                  deleted: { type: boolean }
                  dataset_id: { type: string, format: uuid }
                  note: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  # Packaging and downloads (PACK-001/002, WS-002, SEC-006).
  #
  # Every route below resolves its workspace from the session and never from the
  # request (iron rule 3), and answers 404 rather than 403 for content that is
  # not the caller's — existence is private (WS-006, CORE-006). Packaging
  # executes nothing: it reads stored bytes, filters them, writes a zip and hands
  # the result to the same validator an import goes through (iron rule 1).
  /packaging/targets:
    get:
      operationId: listPackagingTargets
      summary: The packaging targets a download can be built for (PACK-002)
      description: |
        One standard package plus two verified install profiles (PDM-008), which
        is how the product describes them everywhere: `kind` keeps the standard
        package and the profiles apart rather than folding all three into one
        list of "profiles", because the standard package is the evidence that
        Skill Hub is not bound to a single agent and a profile is not.

        An endpoint rather than a constant in the web client. `support_status`
        changes when a target is measured, and a copy of it compiled into the
        front end would be a second truth that nobody re-measures.
      responses:
        "200":
          description: Every target this deployment can build, standard first.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: { $ref: "#/components/schemas/PackagingTarget" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/versions/{versionId}/packaging/preview:
    get:
      operationId: previewPackaging
      summary: What packaging this version would produce, before producing it (PACK-001)
      description: |
        Runs the checks the packaging call runs, so a preview that says yes and a
        packaging that refuses cannot both happen. Same relationship
        GET /suggestions/{id}/diff has with the apply call, and for the same
        reason: two sets of criteria drift, and the drift always favours the step
        the user most wants to succeed.

        It re-validates the bytes it *would* produce, not the bytes it read. The
        source version passed validation at import, but packaging adds files and
        a profile may add frontmatter fields, so validating the source would make
        PACK-002 a check of something nobody downloads.

        Nothing is written and no object is created. A preview of a version that
        cannot be packaged still answers 200 with `allowed: false` and the reason
        — being told why is the point.
      parameters:
        - name: id
          in: path
          required: true
          description: Skill id. The version must belong to this skill.
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: target
          in: query
          required: true
          description: |
            Which target to preview. Required and not defaulted: the answer
            differs per target, and a default would let a user read the standard
            package's verdict as a profile's.
          schema: { $ref: "#/components/schemas/PackagingTargetId" }
        - name: include_test_cases
          in: query
          required: false
          description: |
            Preview with the PACK-005 test cases included. The excluded list is
            returned either way, so a user can see what would be left out before
            deciding.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: |
            Whether packaging is allowed, the re-validation findings, and which
            test cases would travel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingPreview" }
        "400":
          description: '`target` is missing or outside the enum.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Skill or version not visible to the caller, or the version does not
            belong to this skill (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/versions/{versionId}/packaging:
    post:
      operationId: createDownloadArtifact
      summary: Build a downloadable package from one immutable version (PACK-001)
      description: |
        Reads the version's stored bytes, filters them against the PACK-004
        allow-list, applies the target's profile, adds the platform's own three
        files, and validates the result before any of it becomes downloadable.
        The skill version is neither created nor modified (iron rule 4); a
        Download Artifact is a new row every time.

        **Idempotent.** The same (version, target, include_test_cases, packager
        version) that already has an unexpired `available` artifact returns that
        one with `duplicate: true` rather than spending the bytes again — the
        same answer POST /skills/{id}/versions gives for identical content.
        Re-packaging is this call again; there is no separate re-package
        endpoint, because a second route to here would be a second route around
        the four checks below (the same ruling that left EVAL-003 without a
        re-run endpoint).

        Four things can refuse it, and `blocked_reason` says which, because
        whether the user can do anything about it depends entirely on that:
        a licensing hold, content that may not be redistributed, a licence
        nobody could establish, and a package that would not validate. The first
        three fail closed — an unknown restriction code restricts and an
        unestablished licence blocks, in the same direction every read of those
        flags already faces (SEC-011, 02:DISC-003).

        A refusal writes no object and leaves no artifact behind. A build that
        gets as far as bytes and then fails validation keeps its row at
        `rejected` with the reason, so "why can I not download this" has an
        answer that outlives the request (packaging-design §4.6).
      parameters:
        - name: id
          in: path
          required: true
          description: Skill id. The version must belong to this skill.
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { $ref: "#/components/schemas/PackagingTargetId" }
                include_test_cases:
                  type: boolean
                  default: false
                  description: |
                    Include the redistributable test cases and example data
                    (PACK-005). Only platform-curated material qualifies: a
                    dataset the user uploaded never travels, and there is no
                    option to make it — that would hand a licensing judgement to
                    the person least equipped to make it, about files that may
                    not be theirs (packaging-design §5.1).
      responses:
        "201":
          description: |
            The artifact. `duplicate: true` means an identical package already
            existed and this is it, not a second copy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DownloadArtifact"
                  - type: object
                    required: [duplicate]
                    properties:
                      duplicate: { type: boolean }
        "400":
          description: Body is not JSON, or `target` is missing or outside the enum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The closed beta is running and the caller is not on the invite list
            (BETA-001, ADR-028 決策 1). Producing a Download Artifact is the third
            of the three gated actions. Distinct from the 422 below, which is
            about the *content* rather than the caller. Absent from deployments
            with no invite list configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Skill or version not visible to the caller, or the version does not
            belong to this skill (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Well formed, and the package still may not be built. `blocked_reason`
            names which of the four gates closed and `error` carries the sentence
            to show; `validation` is present when the reason is
            `validation_blocked`, carrying the same findings an import refusal
            does.

            422 rather than 403 for the licensing gates: the skill is readable
            and the caller is allowed to ask, the *content* is what may not be
            redistributed. Same code and same flag as POST /skills/{id}/runs uses
            for a held skill.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [blocked_reason]
                    properties:
                      blocked_reason:
                        $ref: "#/components/schemas/PackagingBlockedReason"
                      validation:
                        $ref: "#/components/schemas/PackageValidation"
  /downloads:
    get:
      operationId: listDownloadArtifacts
      summary: The workspace's download history (WS-002, WS-004)
      description: |
        Every Download Artifact in the caller's workspace, newest first,
        including expired ones. 02:WS-002 asks the user to be able to see what
        they downloaded, and an expired package leaving the list silently would
        answer that question wrongly — the row states that it expired, which is
        a different fact from never having existed.
      responses:
        "200":
          description: The caller's download artifacts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [downloads]
                properties:
                  downloads:
                    type: array
                    items: { $ref: "#/components/schemas/DownloadArtifact" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/{artifactId}:
    parameters:
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDownloadArtifact
      summary: One download artifact, with its expiry and download count (WS-002)
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadArtifact" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's artifact. Existence is private (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDownloadArtifact
      summary: Delete a download artifact of one's own (WS-002, SEC-006)
      description: |
        Removes the stored object, and the row stops being visible: it leaves
        this list, `GET /downloads/{artifactId}` answers 404, and so does the
        content route. That is what 02:SEC-006 asks for — deleted content no
        longer appearing in ordinary access surfaces.

        The row itself is kept rather than dropped, for two reasons that both
        outrank tidiness: the download *records* have a foreign key onto it and
        outlive it by design (`WS-004` — they say the user once downloaded this,
        which stays true after the file is gone), and the packaging row is
        immutable (iron rule 4). The bytes are what actually go, and they can:
        every packaging run writes its own object, unlike a skill version's
        package object, which forks share by content address and the governance
        purge deliberately spares.

        Idempotent, and 204 for an id that is not there — the caller's intent
        (this artifact must not exist) is satisfied either way, and answering 404
        for a repeat of a delete that worked would report success as failure.
      responses:
        "204":
          description: Gone. Also the answer when there was nothing to delete.
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/{artifactId}/records:
    get:
      operationId: listDownloadRecords
      summary: Who took a copy of this package, and when (WS-004)
      description: |
        WS-004's own words are "誰、何時、哪一筆 artifact、哪一個 profile". The
        artifact list answers the last two plus a count; this answers the first
        two, one row per download, which is what an aggregate cannot give.

        Deliberately not the audit trail. The same download writes an audit event
        too (CORE-008), and the two are separate records with different retention
        and different visibility: this one is the product feature the owner reads
        and it goes with the account, the audit row is the compliance record and
        does not.

        The actor is a display name, not a user id: on a personal workspace it is
        always the owner, and an id would be an identifier the reader cannot
        resolve. It reads `deleted user` when the account was purged — the rows
        survive de-identified (PDM-006 §6.1), because "somebody, at this time" is
        still true.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The downloads of this package, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      required: [downloaded_at, actor]
                      properties:
                        downloaded_at: { type: string, format: date-time }
                        actor: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the caller's artifact. Existence is private (WS-006).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/{artifactId}/content:
    get:
      operationId: downloadArtifactContent
      summary: The package bytes themselves (PACK-001)
      description: |
        **The platform streams the bytes; it does not hand out a pre-signed
        URL** (packaging-design §7.1). Workspace scope is then the session
        middleware already in place rather than a second authorization scheme;
        the URL is not secret material, so it can appear in a log and in the
        audit event this download writes; and the status and restriction checks
        happen in this handler on every request instead of once at signing time,
        where a hold applied inside the TTL would not have stopped anything.
        Bytes crossing the API process is movement, not execution (iron rule 1).

        One successful download writes three things in one transaction (iron
        rule 9): the artifact's access time, a download record (WS-004, what the
        user sees) and an audit event (CORE-008, what compliance keeps). Those
        two are not merged — their retention and their visibility differ, and one
        row would bind each to the stricter of the two.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The package, as an attachment.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<file_name>"`, the same name the artifact reports.'
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The closed beta is running and the caller is not on the invite list
            (BETA-001, ADR-028 決策 1). Distinct from the 404 below on purpose: that
            one hides whether an artifact exists, this one is about the caller and
            says so. Absent from deployments with no invite list configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            One answer for every reason the bytes are not served: not the
            caller's artifact, `status` is not `available`, it has expired, or a
            licensing hold has since been applied to the skill.

            404 and not 403, unlike GET /api/skills/{id}/files. There the skill
            is public and search still lists it, so denying existence would be a
            lie the rest of the API contradicts; here the artifact is private to
            one workspace and its existence is exactly what must not leak
            (WS-006). A caller who owns it can tell the cases apart from
            GET /downloads/{artifactId}, which still describes the row and its
            status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sh_session
      description: |
        The opaque session token set by the auth routes and resolved by
        RequireSession (apps/platform/internal/creator/workspace/http.go). HttpOnly,
        SameSite=Lax, Secure outside plain-http local dev, so a browser sends it
        on its own and no client code reads or sets it - the generated TS client
        only has to send credentials with the request.

        It identifies the user and nothing more. The workspace scope every query
        runs under is resolved from it server-side and is never taken from a
        request parameter (iron rule 3, ADR-011).
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TraceEvent:
      type: object
      description: |
        One Run Trace event on the wire. The authority on this shape is
        contracts/events/trace-event.schema.json - including the per-type payload
        schemas, which are not repeated here. This entry exists so the HTTP
        contract is self-describing; when the two disagree, the JSON Schema wins.
      required: [schema_version, event_id, run_id, attempt, seq, occurred_at, emitted_by, type, masked, payload]
      properties:
        schema_version: { type: string, example: "1.0" }
        event_id:
          type: string
          format: uuid
          description: Producer-assigned. This is the consumer idempotency key (TRACE-008).
        run_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, maximum: 100000 }
        seq:
          type: integer
          minimum: 1
          maximum: 100000
          description: |
            Gapless from 1, scoped to (run_id, attempt, emitted_by). A hole is how
            a lost event is detected; it is not a run-wide ordinal.
        occurred_at: { type: string, format: date-time }
        emitted_by: { type: string, enum: [sandbox, orchestrator, llm_service] }
        type:
          type: string
          enum: [skill_activation, resource_read, tool_call, mcp_call, script_log, agent_output, error, usage, run_lifecycle]
        # Mirrors trace-event.schema.json exactly, null in the enum included: the
        # JSON Schema is the authority and a producer may send either an absent
        # status or an explicit null for an event that has no outcome.
        status:
          type: [string, "null"]
          enum: [ok, error, skipped, cancelled, timed_out, null]
        masked:
          type: boolean
          description: |
            What the producer claims. The control plane does not believe it: the
            masker runs on every event regardless, and a sandbox vouching for
            itself is exactly what the trust boundary forbids.
        masked_fields:
          type: array
          items: { type: string }
          description: JSON Pointers, relative to payload, of values actually redacted.
        payload: { type: object }
    SandboxTraceEvent:
      allOf:
        - $ref: "#/components/schemas/TraceEvent"
        - type: object
          description: A Trace event accepted through a sandbox attempt's signed ingestion capability.
          properties:
            emitted_by: { type: string, enum: [sandbox] }
    TraceIngestReport:
      type: object
      required: [received, stored, duplicate, rejected]
      properties:
        received: { type: integer }
        stored: { type: integer }
        duplicate:
          type: integer
          description: Already had this event_id. Expected under at-least-once delivery, not an error.
        rejected: { type: integer }
        reasons:
          type: array
          items: { type: string }
          description: One line per rejected event, so a producer can fix its output.
    TraceEventView:
      type: object
      description: A stored, server-masked Trace event returned by the advanced reader.
      required: [event_id, attempt, seq, occurred_at, emitted_by, type, masked_fields, payload]
      properties:
        event_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, maximum: 100000 }
        seq: { type: integer, minimum: 1, maximum: 100000 }
        occurred_at: { type: string, format: date-time }
        emitted_by: { type: string, enum: [sandbox, orchestrator, llm_service] }
        type:
          type: string
          enum: [skill_activation, resource_read, tool_call, mcp_call, script_log, agent_output, error, usage, run_lifecycle, evaluation_started, evaluation_completed]
        status:
          type: string
          enum: [ok, error, skipped, cancelled, timed_out]
        late: { type: boolean }
        masked_fields:
          type: array
          items: { type: string }
        payload: { type: object }
    TraceStream:
      type: object
      description: One (attempt, emitted_by) stream's completeness.
      required: [attempt, emitted_by, received, highest_seq, missing_count, late_events]
      properties:
        attempt: { type: integer }
        emitted_by: { type: string }
        received: { type: integer }
        highest_seq: { type: integer }
        missing_count:
          type: integer
          minimum: 0
          description: Exact count of sequence numbers that never arrived.
        missing_seq:
          type: array
          maxItems: 1000
          items: { type: integer }
          description: At most the first 1,000 missing numbers; missing_count is authoritative.
        late_events:
          type: integer
          description: Events that arrived after the run had already reached a terminal state.
    TraceAdvanced:
      type: object
      required: [run_id, complete, streams, events, next_after, has_more]
      properties:
        run_id: { type: string, format: uuid }
        complete:
          type: boolean
          description: |
            False when any stream has a hole. Not "the run finished": a finished
            run with a gap is incomplete, and a running one with no gap yet is
            complete so far.
        streams:
          type: array
          items: { $ref: "#/components/schemas/TraceStream" }
        events:
          type: array
          maxItems: 1000
          description: |
            Masked events, canonically ordered within this ingestion page.
            Pages themselves follow receipt order. A consumer that needs one
            cross-producer timeline must fetch every page and then sort the
            combined events by (occurred_at, emitted_by, attempt, seq).
          items: { $ref: "#/components/schemas/TraceEventView" }
        next_after:
          type: integer
          format: int64
          minimum: 0
          description: Cursor to send as `after` to fetch events ingested after this page.
        has_more:
          type: boolean
          description: True when another page is already available.
    TraceSummary:
      type: object
      description: |
        TRACE-006's general mode: what happened, in language a non-technical user
        reads, without opening a single raw event.
      required: [run_id, status, complete, skills, skills_total, resources_read, tool_calls, errors, errors_total, summary_truncated, steps]
      properties:
        run_id: { type: string, format: uuid }
        status:
          type: string
          enum:
            [queued, provisioning, preparing, running, evaluating, succeeded, failed, cancelled, timed_out]
          description: |
            Read from the runs table, which is the only authority on run state
            (iron rule 5). Never reconstructed by replaying run_lifecycle trace
            events, and never allowed to disagree with `Run.status`.
        status_reason: { type: string }
        complete: { type: boolean }
        skills:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              name: { type: string }
              decision: { type: string, enum: [activated, skipped] }
              reason: { type: string }
        skills_total:
          type: integer
          minimum: 0
          description: Exact number of skill activation events; skills contains at most the first 100.
        resources_read: { type: integer }
        tool_calls:
          type: object
          properties:
            total: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            total_duration_ms: { type: integer }
            slowest_duration_ms: { type: integer }
            slowest_tool: { type: string }
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              category: { type: string }
              code: { type: string }
              message: { type: string }
        errors_total:
          type: integer
          minimum: 0
          description: Exact number of error events; errors contains at most the first 100.
        summary_truncated:
          type: boolean
          description: True when a repeated summary list was bounded; exact totals remain available.
        last_event_at:
          type: string
          format: date-time
          description: |
            When this run last produced anything. Absent while nothing has
            arrived yet — a real state for a run still being provisioned, not a
            missing field, and a consumer must word it rather than render a blank
            or a zero elapsed time (設計系統 §2.12).

            A watching screen needs this and cannot derive it from the counters:
            a wedged run's counters simply stop, and stopping looks exactly like
            finishing. Client-side timing cannot stand in either, because it
            restarts at zero on every page load and would report a stalled run as
            having just moved.
        final_output: { type: string }
        usage:
          type: object
          properties:
            model: { type: string }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cost_usd:
              type: [number, "null"]
              description: |
                NULL means the gateway did not report a cost. Consumers MUST render
                that as "unreported" and never as 0 - showing 0 tells the user the
                run was free.
            cost_source: { type: string, enum: [gateway, estimated] }
        steps:
          type: array
          items: { type: string }
          description: |
            Progress, taken from run_status_transitions - the authoritative
            history - and never reconstructed by replaying run_lifecycle events
            (iron rule 5).
    Me:
      type: object
      required:
        [
          user_id,
          email,
          display_name,
          workspace_id,
          deletion_requested_at,
          purge_after,
          deletion_scope,
        ]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        workspace_id:
          type: string
          format: uuid
        features:
          type: object
          additionalProperties:
            type: boolean
          description: |
            Optional entry points this deployment turns on. **Absent** when there
            are none — not an empty object, so a client never has to tell "off"
            apart from "this build predates the flag".

            It exists because a route that is simply not mounted cannot be
            discovered without a request that fails, and a feature discovered by
            a failed request has already been drawn on somebody's screen. Today
            the only key is `generate_skill` (ADR-052).
        deletion_scope:
          type: [string, "null"]
          description: |
            What the purge will and will not destroy, in the server's own words,
            or null when no deletion is pending. The same sentence DELETE /me
            returns — and it is required here because a client that only had it
            from that one response lost it on the next reload, which is exactly
            when a user goes looking for it. 02:WS-002 第 3 條 and PDM-006 §6.1
            want the scope stated up front rather than discovered afterwards, and
            a disclosure that survives one render is not stated.
        deletion_requested_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the caller asked for their account to be deleted, or null when
            no deletion is pending. 02:SEC-006 requires the deletion job to have
            a state the user can follow, and until this field existed the only
            place it appeared was the response to DELETE /me itself — a user who
            closed the tab could not ask again.
        purge_after:
          type: [string, "null"]
          format: date-time
          description: |
            When the grace period ends and the purge becomes due; cancellable
            until then. Null exactly when `deletion_requested_at` is null.
    AccountDeletion:
      type: object
      required: [deletion_requested_at, purge_after, cancellable, scope]
      properties:
        deletion_requested_at:
          type: string
          format: date-time
        purge_after:
          type: string
          format: date-time
          description: When the purge becomes due; cancellable until then.
        cancellable:
          type: boolean
        scope:
          type: string
          description: |
            Plain-language statement of what is deleted and what is retained
            de-identified. WS-002 requires the scope to be shown before the
            deletion, not discovered after it.
    Finding:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
        path:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
          description: |
            The full list behind an aggregated finding, when the message
            summarises rather than enumerates. `external-url` findings are
            grouped per host and carry every "<file>: <url>" reference here, so
            a package citing hundreds of schema URIs stays readable without the
            individual references being lost.
    CategorizedFindings:
      description: |
        Validation findings grouped by severity (INGEST-008/SKILL-002):
        blocking errors, non-blocking warnings, and informational notes are
        separate lists rather than one undifferentiated feed.
      type: object
      required: [errors, warnings, infos]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        infos:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Skill:
      type: object
      required: [skill_id, name, summary, redistribution]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        redistribution:
          type: string
          enum: [allowed, blocked, unknown, self_supplied, generated]
          description: |
            Whether a Download Artifact may be produced from this skill. Two of
            its four values release and two refuse, so on the owner's own list
            this is the difference between a skill they can take away and one
            they cannot. It was already on the row and dropped in serialisation;
            surfacing it is 02:NFR-001 in the direction that says a limit which
            will block you has to be visible before you hit it.

            `self_supplied` is what a user's own import carries since 0036. It
            was `unknown` before that, which refused — so the answer to "may I
            download the Skill I just wrote" was permanently no, over a licensing
            question nobody could resolve (ADR-045).
        access_restriction:
          type: [string, "null"]
          description: |
            Reason code for a licensing hold on the package materials, null when
            there is none. Also copied onto forks at fork time, which is why it
            belongs on a list of skills the caller owns rather than only on the
            detail view.
        forked_from_skill_id:
          type: string
          format: uuid
        forked_from_version_id:
          type: string
          format: uuid
    OwnSkill:
      description: |
        A row of the caller's own skill list. `Skill` plus the two facets that
        make the list decidable rather than merely enumerable: this is a page of
        code the caller owns and will run, and without them there was nothing on
        it to decide by (設計系統 §1.1, 04 丙-31). Not folded into `Skill`,
        because the fork reply shares that schema and a fork one second old has
        neither.

        The two are one fact seen from two sides. Both come from the import
        scan, and a fork has neither, for the same reason: a fork copies the
        bytes and not the measurement.
      allOf:
        - $ref: "#/components/schemas/Skill"
        - type: object
          required: [risk, verification]
          properties:
            risk:
              allOf:
                - $ref: "#/components/schemas/SearchResultRisk"
              description: |
                The same block, from the same projection, that a search row
                carries for the same skill — deliberately the same schema and not
                a second one shaped like it, because the rule this facet exists
                to keep is that the two planes word one fact the same way
                (02:NFR-007 第 3 條). `scan_status: unavailable` is the usual
                answer for a fork; see `verification` for why.
            verification:
              $ref: "#/components/schemas/SkillVerification"
    SkillVerification:
      description: |
        Whether anything was measured **in this workspace**, and when.

        The obvious field would have been a bare `verified_at`, defined as the
        newest version's creation time the way the search projection defines it.
        That is right for an import — the version row is created by the scan —
        and false for a fork, whose version row is created the instant somebody
        pressed Fork, with nothing scanned. Serving that timestamp would print
        something reading as "scanned just now" on the one case where nothing was
        scanned; serving a blank instead is what 設計系統 §2.9 forbids. So the
        state is named, and the timestamp appears only in the state that has one.

        `Labelled` rather than a bare enum, which is the 04 丙-29 ruling applied
        at birth instead of retrofitted: one field, one consumer, three values,
        and the alternative is a twenty-first enum→中文 map on the client for a
        state whose entire job is to be worded carefully.

        `value` is `scanned` | `not_measured` | `not_applicable`.

        `scanned` covers two cases and `label` tells them apart, because they are
        the same claim with different provenance rather than different claims.
        Either this version was imported here and the scan ran on import, or it is
        a fork whose bytes are identical to a public-catalogue ancestor's and the
        ancestor's scan is being attributed to it (ADR-042 決策 6 — in-toto binds
        an attestation to the subject's digest, not to where it sits, and the scan
        is a deterministic function of the bytes). In the inherited case
        `scanned_at` is the **ancestor's** import time, so it is older than the
        fork, and `note` names the ancestor. Only measurements that hold for bytes
        are inherited: compatibility, trial results and evaluation verdicts
        measure behaviour in an environment and are never carried across.

        `not_measured`: a fork whose ancestor cannot answer — taken down, deleted,
        outside the public catalogue (無權檢視, and a lineage column existing does
        not widen ADR-011), or no longer the same bytes. **Not a claim that the
        content is unsafe**, and not a claim that it is fine either.

        `not_applicable`: no version exists yet, so there is nothing to scan.
      allOf:
        - $ref: "#/components/schemas/Labelled"
        - type: object
          properties:
            scanned_at:
              type: [string, "null"]
              format: date-time
              description: Present only when `value` is `scanned`.
    PublicSearchResponse:
      type: object
      required:
        [query, results, degraded, no_results, partial_index, filtered_out,
         limit, truncated]
      properties:
        query:
          type: string
          description: The original query, echoed back (DISC-001).
        results:
          type: array
          items:
            $ref: "#/components/schemas/PublicSearchResult"
        degraded:
          type: boolean
          description: |
            True when the vector leg did not run and the answer came from
            lexical matching alone. ADR-013 定案調整 1/2: the vector leg is what
            carries cross-language recall, so a degraded answer has materially
            lower recall and must not be presented as "nothing matches".
        degraded_reason:
          type: string
          description: |
            Why the vector leg was skipped. Absent when degraded is false. Every
            result on a degraded answer carries a null `rank`: the page is
            ordered by lexical score, which is not a similarity.
        limit:
          type: integer
          description: |
            How many results this page will carry at most — the `limit` parameter
            if it was accepted, otherwise the default. Zero when nothing was
            retrieved at all, because naming a cap that never applied would be a
            number with no enforcement behind it (設計系統 §2.2).
        truncated:
          type: boolean
          description: |
            True when the catalogue held more matches than this page shows. The
            cap has always been here and result 21 simply did not exist as far as
            a caller could tell; ADR-042 決策 3 makes that the defect it is —
            **a truncated list must state that it was truncated**, and "no limit
            at all" stopped being an available answer. Distinct from `degraded`
            and `partial_index`, which are statements about how well the search
            could look rather than about how much of what it found is here.
        partial_index:
          type: boolean
          description: |
            True when at least one result on this page has no embedding yet
            (enrichment_status 'pending'): it reached the page through the
            lexical leg, the distance cut-off could not judge it, and it sits at
            the bottom of the list with a null `rank`.

            Separate from `degraded` on purpose. `degraded` is a transient
            outage of the query-side embedding call; `partial_index` is index
            coverage, which stays as it is until a reindex backfill runs —
            import is designed not to fail when enrichment does. One flag for
            both would let a normal state mask an outage and vice versa.
        no_results:
          type: boolean
          description: |
            True when the search produced nothing to show (DISC-001
            清楚的無結果狀態). Two situations reach it: every candidate fell
            outside the cosine distance cut-off, or the query was never searched
            because it was blank or incomprehensible. Read it together with
            `degraded`: no_results with degraded false means nothing in the
            catalog is close enough, while no_results with degraded true only
            means the lexical floor found nothing and recall was already reduced.

            Always false when `filtered_out` is true.
        filtered_out:
          type: boolean
          description: |
            True when the query did match skills and the active DISC-003 filters
            removed every one of them (results is then empty).

            Kept apart from `no_results` because the two call for opposite
            actions: no_results means the catalog holds nothing close enough and
            the query should be described differently, while filtered_out means
            it does hold matches and the filters should be widened. The two must
            not share copy, and `query_suggestion` is absent here — advice about
            rewriting the query would be advice about the wrong thing.
        query_suggestion:
          type: string
          description: |
            Copy to show with a no-results answer, prompting the user to add the
            task, the input they have and the output they want (DISC-001).
            Absent when there are results, and absent when `filtered_out`.
    SearchResultRisk:
      description: |
        Compact risk hint for a result row (DISC-002 風險提示). Unlike
        `SkillRisk` on the detail view this is read from the search projection,
        not from a fresh scan of the package, so it carries counts and flags but
        no verbatim findings — open the skill for those. There is deliberately
        no "safe" level (NFR-001).
      type: object
      required: [scan_status, level, warnings, disclosures, note]
      properties:
        scan_status:
          type: string
          enum: [scanned, unavailable]
          description: |
            `unavailable` means the projection holds no scan for this row (it
            predates the facet columns, or was rebuilt by the SQL-only reindex
            phase). Reported as unknown, never as a clean scan (DISC-004
            不得自行推定為通過); every flag below is then absent.
        level:
          type: string
          enum: [none, disclosed, warning]
          description: |
            Highest severity the scan recorded. `warning` = at least one
            warning-level finding. `disclosed` = no warnings, but the package
            declares something the reader should know about (scripts, external
            URLs, binaries, dependency manifests). `none` = neither. Error-level
            findings never appear: they block the import, so nothing carrying one
            is in the index at all.
        warnings:
          type: integer
          description: Warning-level finding count.
        disclosures:
          type: array
          items: { $ref: "#/components/schemas/Disclosure" }
          description: |
            What the scan found the package declaring, server-worded. Empty when
            it declared none of them — which is not 「安全」 and is not rendered
            as such (NFR-001).
        note: { type: string }
    PublicSearchResult:
      type: object
      required:
        [skill_id, name, summary, summary_source, rank, tier, risk, dependencies,
         compatibility]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
          description: |
            Plain summary (DISC-002). The index-time LLM summary when the skill
            has been enriched (ADR-013 §1, model-generated), otherwise the
            package's own frontmatter description. `summary_source` says which,
            because until it existed this sentence was documented as sometimes
            model-written and had no field a client could act on.
        summary_source:
          type: string
          enum: [model, package]
          description: |
            Who wrote `summary`. ADR-013 requires model-generated content to be
            labelled, and this row was already labelling `match_reason` while
            printing the model's rewrite of the summary unmarked — the footnote
            carried the badge and the sentence a reader decides on did not.

            `package` also carries a second fact worth knowing: it is the
            `description` an agent actually reads when it decides whether to
            load this Skill. A `model` summary is not that text, so a Skill can
            read well here and be passed over by the agent, and nothing about
            the enriched summary changes what the downloaded package says.
        rank:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: |
            Cosine similarity to the query, 0..1, higher is better (DISC-002 —
            never star count). Results are ordered by it.

            Null when this page was not ranked by similarity, and the ordering
            is then something else entirely — see `rank_note`. Two cases reach
            it: the whole answer came from the lexical leg (`degraded`), or this
            one row has no embedding yet (`partial_index`). The lexical score is
            not returned in its place: `ts_rank_cd` is unbounded (a local answer
            measured 1.4) and is not the same quantity as a cosine similarity,
            so squeezing it into 0..1 would be false precision.
        rank_note:
          type: string
          description: |
            Why `rank` is null and what ordered the page instead. Present only
            when `rank` is null.
        tier:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            Collection tier (DISC-002 來源層級). Always `indexed` here for the
            same reason as on the detail view: curation is a recorded human
            review and nothing records one yet.
        risk:
          $ref: "#/components/schemas/SearchResultRisk"
        dependencies:
          type: array
          items: { type: string }
          description: |
            Dependency tags from the index-time enrichment (DISC-002 依賴).
            Model-extracted from what the package's own documentation states —
            not a resolved dependency graph, and empty while enrichment is
            pending.
        compatibility:
          allOf:
            - $ref: "#/components/schemas/SkillCompatibility"
          description: |
            Same three axes as the detail view (DISC-002 Agent 相容狀態).
            `spec_validation` is `passed` for any row with a saved version:
            static validation is what admits a package to the index, so being
            listed here is the evidence. It is `unverified` only for a skill
            with no version yet. `capability` and `runtime` carry the measured
            verdict when the projection holds one, and stay `unverified` when it
            does not — that is the 「尚未試跑」 state DISC-002 requires to be
            explicit, and it is what `runtime_image` being absent means.
        verified_at:
          type: string
          format: date-time
          description: |
            When the listed content was last validated (DISC-002
            最近驗證時間): the creation time of the latest saved version, which
            is the import that scanned it. Versions are immutable, so this
            cannot drift from the content it describes. Absent for a skill with
            no saved version.
        match_reason:
          type: string
          description: |
            Human-readable explanation of why this skill matches the query
            (DISC-002). Template-based fallback when LLM polish times out.
        match_reason_source:
          type: string
          enum: [model, template]
          description: |
            Provenance of match_reason. ADR-013 requires model-generated content
            to be labelled, so the UI can mark it as such. `template` reasons are
            assembled from the query/document lexical overlap, or state plainly
            that the hit came from semantic similarity with no shared keywords.
    Labelled:
      description: |
        An enum value together with the copy shown for it. The label and note
        live server-side so that every surface explains a trust state the same
        way, and so the wording stays factual about what was checked (NFR-001).
      type: object
      required: [value, label, note]
      properties:
        value: { type: string }
        label: { type: string }
        note: { type: string }
    Disclosure:
      description: |
        One thing a package declares about itself, with the words to show for it
        (04 丙-29 ④). It replaces the parallel `has_*` booleans that used to sit
        on `SkillRisk` and `SearchResultRisk`.

        Booleans could not become `Labelled`: `Labelled` describes one enum
        value, and six independent flags are not one. The list form fixes what
        the booleans made easy to get wrong — the two payloads carried
        **different sets** (the search row disclosed `has_dependency_manifest`,
        the detail view did not), so the screen a reader meets first said more
        than the screen they open next. A list has no shape to disagree on.

        `code` is the scan finding code and stays stable; `label` and `note` are
        the server's wording, so the search row and the detail view cannot word
        the same disclosure differently (設計系統 §4.4, NFR-007 第 3 條).

        **Only what the package asserts appears.** An absent code is not a claim
        that the thing is not there, it is the scan not having found it — which
        is why there is no `false` entry and no "clean" member.
      type: object
      required: [code, label, note]
      properties:
        code:
          type: string
          description: |
            Scan finding code — `script-file`, `embedded-script`, `external-url`,
            `possible-secret`, `binary-file`, `dependency-file`. Not an enum: a
            code this client does not know still has a label and a note, and
            dropping it would hide a disclosure to keep a union tidy.
        label: { type: string }
        note: { type: string }
    SkillSource:
      description: |
        Import provenance (DISC-003). Fields the import never recorded are absent
        rather than filled in with a plausible value.
      type: object
      required: [type, trust]
      properties:
        type:
          type: string
          enum: [git, upload, generated]
        url:
          type: string
          description: Source URL for a git import.
        task_description:
          type: string
          description: |
            The user's own words that produced a generated package (GEN-002).
            Present only for `generated`. It is the whole provenance record for
            a package with no upstream, which is why the source of a generated
            skill is never reported as unknown — it is known, it just is not a
            URL.
        generator_model:
          type: string
          description: Model id that wrote a generated package. Present only for `generated`.
        generator_prompt_version:
          type: string
          description: |
            Generator prompt revision, e.g. `generate-skill/v1`. Present only for
            `generated`. Together with task_description and generator_model this
            is what lets someone re-derive the package (ADR-047 決策 1).
        source_version:
          type: string
          description: Commit SHA, tag, or branch, when the fetch resolved one.
        fetched_at:
          type: string
          format: date-time
        content_hash:
          type: string
          description: Hash of the package as fetched.
        last_checked_at:
          type: string
          format: date-time
          description: |
            When the upstream-availability probe last looked at this source.
            Absent means never probed — which is not the same as "available".
        unavailable_since:
          type: string
          format: date-time
          description: |
            When the source *started* failing, not the latest failure, so a
            two-week outage stays distinguishable from a blip. Absent means the
            source answered on its last probe.
        trust:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            unknown | traceable | manually_confirmed | generated. `traceable`
            requires a git import that recorded a URL; an upload has no
            verifiable origin. `manually_confirmed` needs a reviewer and has no
            store yet, so this endpoint never returns it. `generated` is not a
            rung above `unknown` on the same ladder — it says the origin is
            recorded and is not a URL, and it makes no claim at all about
            quality or safety.
    SkillLicense:
      description: |
        ADR-021 two axes. The expression alone cannot distinguish "the author
        declared MIT in frontmatter" from "the monorepo root had an MIT file",
        and DISC-003 forbids presenting the second as the first.
      type: object
      required: [status]
      properties:
        expression:
          type: string
          description: SPDX id. Absent means unknown, which must never be shown as permissive.
        source:
          type: string
          enum: [manifest, manifest-referenced-file, package-license-file, repo-license-file]
          description: |
            Provenance tier, strongest first. `manifest-referenced-file` means the
            frontmatter named a file instead of declaring a license (npm's
            `SEE LICENSE IN <filename>` convention) and that file's text was
            recognised — the author chose the file, but the expression was read,
            not declared. Absent on versions imported before ADR-021, whose tier
            was never recorded and must not be invented.
        source_note:
          type: string
          description: What that tier does and does not claim about this package.
        status:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            unknown | declared. `confirmed` requires a reviewer's check and
            nothing records one, so it is never returned here.
    SkillRisk:
      description: |
        Static scan of the stored package, recomputed on read. Nothing in the
        package is executed (iron rule 1) and there is deliberately no single
        "safe" verdict (NFR-001).
      type: object
      required: [scan_status, counts, highlights, info_counts, disclosures, note]
      properties:
        scan_status:
          type: string
          enum: [scanned, unavailable]
          description: |
            `unavailable` means the stored package could not be read. It is
            reported as unknown, never as a clean scan (DISC-004
            不得自行推定為通過).
        counts:
          type: object
          required: [errors, warnings, infos]
          properties:
            errors: { type: integer }
            warnings: { type: integer }
            infos: { type: integer }
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
          description: Every error- and warning-level finding, verbatim.
        info_counts:
          type: object
          additionalProperties: { type: integer }
          description: |
            Info-level disclosures folded to a count per finding code. One seed
            package produced 321 URL findings; a list nobody reads hides the
            findings that matter.
        disclosures:
          type: array
          items: { $ref: "#/components/schemas/Disclosure" }
          description: |
            The same list the search row carries, from the same catalogue —
            including `dependency-file`, which this view used to be missing while
            the row above it showed it (04 丙-29 ④).

            `embedded-script` stays its own code rather than folding into
            `script-file`: runnable code inside SKILL.md is SKILL-003's case and
            no file list can show it.
        note: { type: string }
    SkillAccessRestriction:
      description: |
        The 0023 licensing hold on a skill, rendered so a reader is told what is
        withheld and why rather than shown a gap.
      type: object
      required: [reason, note]
      properties:
        reason:
          type: string
          description: |
            The reason code, e.g. `license-review`. Not an enum here: an unknown
            code still restricts, because failing open on a code nobody
            recognises would make a typo in a review the way to unlock content.
        note:
          type: string
          description: |
            The user-facing sentence for that code, served rather than stored, so
            the decision does not change when the wording does. An unrecognised
            code falls back to a generic sentence rather than to no sentence.
    SkillCompatibility:
      description: |
        The three DISC-008 axes, kept apart, and the same shape on the search
        result and the detail view. An axis with no answer says `unverified`
        rather than being omitted: a missing field reads as "fine" and an
        explicit 未驗證 does not.

        `spec_validation` is derived from the stored package. The other two are
        *measurements* (migration 0022) and are only true of the
        `runtime_image` beside them — the same package on the same version gets
        a different `runtime` answer on an image that provides python3 than on
        one that does not, so a verdict without its image is a claim nobody
        made. Bumping the runtime image therefore drops a skill back to
        `unverified` until a baseline re-run measures the new pair; a verdict
        carried across an image change is what would make the axis worse than
        not having one.
      type: object
      required: [spec_validation, capability, runtime, note]
      properties:
        spec_validation:
          $ref: "#/components/schemas/Labelled"
          description: |
            Format and static validation only. Passing is never a claim that the
            skill is safe to run or effective (SKILL-002). `value` is `passed`,
            `failed` or `unverified`.

            Labelled rather than a bare enum (04 丙-29 ③): two screens had
            already worded this axis differently, and one of them wrote
            `passed ? 通過 : 未驗證`, which reports **`failed` as 未驗證** — the
            one reading a client-side table makes easy and a served label makes
            impossible.
        capability:
          $ref: "#/components/schemas/Labelled"
          description: |
            Does the agent actually pick this skill up when it is mounted, read
            from the run trace. `value` is `activated`, `not_activated` or
            `unverified`.

            - `activated` — a `skill_activation` event for this skill in the run.
            - `not_activated` — the run completed and the trace shows the skill
              was offered and something else was used instead.
            - `unverified` — no run, or a run that ended before the question
              could be answered.

            `not_activated` is **never inferred from silence**. The SDK message
            stream cannot express "available but not called" at all (TRACE-002
            限制註記), so a missing activation event on a truncated run is not
            evidence of non-activation, and it is reported as `unverified`.
        runtime:
          $ref: "#/components/schemas/Labelled"
          description: |
            Can the package's own scripts execute in this image. `value` is
            `native`, `transpiled`, `failed` or `unverified`.

            `transpiled` is why this axis carries a `note` and not just a label:
            the caveat below is not guessable from any single word, and a reader
            who does not get it will believe the Skill's own script ran.

            - `native` — every runtime the package declares is provided here.
            - `transpiled` — they are not, and the observed run got its result
              from **the model re-implementing the script rather than running
              it**. A working run whose work was not the Skill's own code. It is
              its own state because collapsing it into `native` would claim an
              execution that did not happen, and collapsing it into `failed`
              would contradict the artifacts the run produced. Surface the
              distinction to the reader; it is the one a user will not guess and
              the one that decides whether the Skill's own script is what ran.
            - `failed` — they are not, and the run failed because of it.
            - `unverified` — this (version, image) pair was never measured.
        runtime_image:
          type: string
          description: |
            The image `capability` and `runtime` were measured on, e.g.
            `skillhub/runtime-agent-sdk:2026.08-1`. A digest reference is the
            preferred form; the M2 baseline predates the publishing pipeline and
            its rows record the tag they genuinely ran under rather than a digest
            invented to fit. Absent exactly when nothing was measured, so there is
            no image to name.
        measured_at:
          type: string
          format: date-time
          description: When the measurement ran. Absent when unmeasured.
        note:
          type: string
          description: |
            Copy explaining what was and was not checked, server-side so every
            surface says it the same way (NFR-001). It differs between the
            measured and unmeasured cases, and the measured one spells out the
            `transpiled` meaning in words rather than leaving it as a value name.
    SkillEnrichment:
      description: |
        Index-time model output (ADR-013 §1), labelled as model-written so a
        reader can always tell it from the author's own text.
      type: object
      required: [status, note]
      properties:
        status:
          type: string
          enum: [pending, enriched]
        summary:
          type: string
          description: Plain-language summary written by the model.
        task_examples:
          type: array
          items: { type: string }
        tags:
          description: |
            Input/output/tool/dependency tags, kept in their buckets. DISC-003
            一般模式 asks for 輸入、輸出、依賴 as separate answers, and a flat
            list cannot say which is which. Absent while enrichment is pending.
          type: object
          required: [inputs, outputs, tools, dependencies]
          properties:
            inputs:
              type: array
              items: { type: string }
            outputs:
              type: array
              items: { type: string }
            tools:
              type: array
              items: { type: string }
            dependencies:
              type: array
              items: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        note: { type: string }
    SkillLimitation:
      description: |
        One stated limitation of the skill (DISC-003 一般模式「限制」), with
        where it came from. The two sources answer different questions and are
        never merged into one anonymous sentence.
      type: object
      required: [text, source]
      properties:
        text: { type: string }
        source:
          type: string
          enum: [model, scan]
          description: |
            `model` — extracted by the index-time enrichment from what the
            package's own documentation states about its limits (ADR-013 §1
            whitelist: a factual restatement, never a safety or quality
            judgement). `scan` — derived from the static package scan, e.g. the
            package cites external URLs so it needs network access. ADR-013
            requires the model-written half to be labelled as such.
    SkillDetail:
      type: object
      required:
        [skill_id, name, summary, scope, tier, enrichment, limitations, license,
         redistribution, derivation, risk, compatibility]
      properties:
        skill_id: { type: string, format: uuid }
        name: { type: string }
        summary:
          type: string
          description: The package's own frontmatter description, never the model's rewrite.
        scope:
          type: string
          enum: [catalog, private]
          description: Which read answered — the public catalog, or the caller's own workspace.
        tier:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            curated | indexed | external. Always `indexed` today: curation is a
            recorded human review (PDM-002) and CONTENT-003's promotion workflow
            is what would record one. Catalog membership is not that review, and
            labelling it 精選 would be the endorsement PDM-002 warns against.
        enrichment:
          $ref: "#/components/schemas/SkillEnrichment"
        version:
          type: object
          description: The latest version. Absent for a skill with no saved content yet.
          required: [version_id, version_number, content_hash, created_at]
          properties:
            version_id: { type: string, format: uuid }
            version_number: { type: integer }
            content_hash: { type: string }
            created_at: { type: string, format: date-time }
        source:
          $ref: "#/components/schemas/SkillSource"
        license:
          $ref: "#/components/schemas/SkillLicense"
        redistribution:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            allowed | blocked | unknown | self_supplied | generated — whether this skill's
            content may be handed on, which is what decides whether a download
            package can be built from it at all (02:SEC-007, ADR-012).

            Required, and required for every skill, because the question has an
            answer for every skill: `unknown` is where a curated skill starts and
            where anything unclassifiable stays, and it is treated exactly like
            `blocked` at the packaging gate, since 02:DISC-003 forbids implying
            that an unestablished licence may be modified or redistributed.

            **Two values release, for different reasons, and the difference
            matters** (ADR-045). `allowed` is a verdict about the licence:
            somebody established that this content may be copied. `self_supplied`
            is a fact about the supplier: this workspace brought the bytes in, so
            the platform handing them back is retrieval and not redistribution —
            there is no second party for a licence to protect. A publish path
            that treated the two as one would hand out content nobody ever
            judged, which is the direction ADR-021 §5.3 forbids erring in.

            A separate axis from `license.status` and never derivable from it:
            02:CONTENT-002 states plainly that a manually confirmed licence is
            not thereby a redistributable one, so `confirmed` is not a release
            condition. Also separate from `access_restriction`, which is a
            reviewer's temporary hold on a handful of known skills; this is a
            property of the content that every skill has. Reading the absence of
            a hold as permission would be asserting that whatever nobody
            objected to may be redistributed.

            The copy in `label`/`note` says what was and was not established,
            server-side so every surface words it the same way (NFR-001).
        derivation:
          type: object
          description: |
            Fork lineage (DISC-003, WS-001). A fork resolves to both the parent
            skill and the parent *version* it diverged from: versions are
            immutable, so the parent's current version can have moved on.
          required: [is_fork, label, note]
          properties:
            is_fork: { type: boolean }
            forked_from_skill_id: { type: string, format: uuid }
            forked_from_version_id: { type: string, format: uuid }
            label: { type: string }
            note: { type: string }
        limitations:
          type: array
          items:
            $ref: "#/components/schemas/SkillLimitation"
          description: |
            What the skill does not do or needs in order to work (DISC-003
            一般模式「限制」). Assembled from both sources — the enrichment's
            reading of the document and the static scan of the package — each
            labelled. An empty list means neither source found anything to
            state, never that the skill is unconstrained.
        allowed_tools:
          type: array
          items: { type: string }
          description: The manifest's allowed-tools, as declared by the package.
        risk:
          $ref: "#/components/schemas/SkillRisk"
        compatibility:
          $ref: "#/components/schemas/SkillCompatibility"
        access_restriction:
          allOf:
            - $ref: "#/components/schemas/SkillAccessRestriction"
          description: |
            The 0023 licensing hold, present only while a licensing question
            about the package is open. Absent is the normal state and means no
            hold - it is omitted rather than nulled, so a client must treat
            "field missing" as unrestricted.

            Every other field still answers when it is present: the hold is on
            the *materials*, not on the platform's own description of them. What
            it does close is GET /api/skills/{id}/files, which answers 403 while
            this is set. A client that sees it should say so before offering the
            advanced view rather than letting the user walk into the refusal.
    SkillFiles:
      type: object
      required: [skill_id, version_id, version_number, skill_md, skill_md_truncated, tree, note]
      properties:
        skill_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version_number: { type: integer }
        skill_md:
          type: string
          description: Full SKILL.md text of that version, capped at 1 MiB.
        skill_md_truncated:
          type: boolean
        tree:
          type: array
          items:
            $ref: "#/components/schemas/SkillFileEntry"
          description: |
            Every file in the package, sorted by path. Directories are omitted:
            the paths carry the structure.
        embedded_script_note:
          type: string
          description: |
            The SKILL-003 disclosure, repeated on the view where its absence
            would mislead: this tree cannot show code that lives inside SKILL.md.
        note: { type: string }
    SkillFileEntry:
      type: object
      required: [path, size, is_script]
      properties:
        path: { type: string }
        size:
          type: integer
          description: Uncompressed size in bytes.
        is_script:
          type: boolean
          description: |
            Marked with the same extension rule the import scan used, so the tree
            and the risk block never disagree about what counts as a script
            (DISC-003 Script 必須有明確標示).
    SearchHit:
      description: |
        One workspace-scoped lexical hit, best first. No score is returned: this
        endpoint has only the FTS leg, `ts_rank_cd` is unbounded and is not a
        similarity, and the ordering it produces is already in the array order.
        Publishing the raw number as a 0..1 rank would be false precision — see
        PublicSearchResult.rank.
      type: object
      required: [skill_id, name, summary]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
    FileDiff:
      type: object
      required: [path, status]
      properties:
        path:
          type: string
        status:
          type: string
          enum: [added, removed, modified]
        diff:
          type: string
          description: Unified diff; absent for binary or oversized files.
    UploadResult:
      type: object
      required: [skill_id, version_id, version_number, content_hash, duplicate, findings]
      properties:
        skill_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        content_hash:
          type: string
        duplicate:
          type: boolean
          description: True when identical content already existed as a version of this skill.
        findings:
          $ref: "#/components/schemas/CategorizedFindings"
    GenerateSkillRefusal:
      description: |
        The 422 body of POST /skills/generate: either the package's own findings
        (GenerateSkillRejected) or a single-sentence refusal from around the
        model call. Told apart by shape — `findings` present, or `error` present.

        A named schema rather than an inline `oneOf` with `Error`, and the
        second arm inlined rather than `$ref`'d: openapi-generator's
        typescript-fetch renames the `Error` schema to `ModelError` (it shadows
        JS's Error) and then forgets to import it inside a oneOf wrapper, so
        `packages/api-client-ts` failed to build for a day with nothing on the
        web side noticing. The inline arm is Error's exact shape; if Error ever
        grows a field, this has to grow with it — the drift the generated
        client would otherwise have caught is now the contract author's.
      oneOf:
        - $ref: "#/components/schemas/GenerateSkillRejected"
        - type: object
          title: GenerateSkillRefusalMessage
          required: [error]
          properties:
            error:
              type: string
    GenerateSkillRejected:
      description: |
        A generated package that failed validation: the findings verbatim, the
        same body a failed import returns, plus how many attempts produced them.

        `attempts` is here and not only on the 201 because the failure screen has
        a sentence about the automatic retry, and that sentence is false for a
        `possible-secret` finding — ADR-048 does not retry that one. Without the
        number the page cannot tell the two apart.
      allOf:
        - $ref: "#/components/schemas/CategorizedFindings"
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: integer
              minimum: 1
              maximum: 2 # one-number: generateMaxAttempts
    GenerationFailure:
      description: |
        One generation that produced nothing, as the workspace reads it back.

        Every field except `occurred_at` is best-effort. These rows are 400-day
        history written by whichever version of the code was running at the time,
        so a missing or re-typed key produces a row with less in it rather than an
        error — the alternative is a screen that goes blank because of something
        that happened last year.
      type: object
      required: [occurred_at, failure, attempts]
      properties:
        occurred_at:
          type: string
          format: date-time
        failure:
          type: string
          enum: [quota, unavailable, gateway, unpackageable, rejected, blocked, ""]
          description: |
            What went wrong. `quota` never reached the gateway; `unavailable`
            never reached it either, but for the opposite reason — the allowance
            could not be counted, and that is not the account running out, so it
            is not called `quota`; `gateway` is the model service or the proxy; `unpackageable` is an answer that parsed
            but cannot be made into an archive; `rejected` is admission refusing
            it (a name collision, most often); `blocked` is a validation finding.
            Empty when a row's metadata could not be decoded — the row still
            happened, and its timestamp is the part the screen needs most.
        attempts:
          type: integer
          minimum: 0
          maximum: 2 # one-number: generateMaxAttempts
          description: |
            How many gateway calls that failure cost. 0 for a refusal that never
            reached the gateway — `quota` and `unavailable`.
        codes:
          type: array
          items:
            type: string
          description: |
            Blocking finding codes, present only for `blocked`. **Codes and never
            values**: a finding's message never carries the matched text (iron
            rule 11), and this must not become the place that reintroduces it.
        truncated:
          type: boolean
          description: |
            The model hit the token ceiling. One of the two failures a user can
            act on — the action is "make the task smaller".
        collision:
          type: boolean
          description: |
            This workspace already had a skill of that name and the two are not
            the same kind of content. The other actionable one — rename or delete
            the existing skill.
    GenerationFailures:
      type: object
      required: [failures]
      properties:
        failures:
          type: array
          items:
            $ref: "#/components/schemas/GenerationFailure"
    GenerateSkillResult:
      description: |
        One generated package that passed validation and became a version
        (GEN-001). Everything UploadResult reports, plus how it got here.
      allOf:
        - $ref: "#/components/schemas/UploadResult"
        - type: object
          required: [attempts, generator_model, generator_prompt_version]
          properties:
            attempts:
              type: integer
              minimum: 1
              maximum: 2 # one-number: generateMaxAttempts
              description: |
                1 or 2. Reported because 02:GEN-003 forbids the UI promising a
                success rate: one retry was measured to move 80% to 90%, not to
                nothing, and "it took two goes" is the honest form of that.
            generator_model:
              type: string
            generator_prompt_version:
              type: string
    AcceptanceCriterion:
      description: |
        One acceptance condition (TEST-003). Stored inside the test case rather
        than as its own resource, because the run snapshot and the evaluation
        result already carry this exact shape as JSON.
      type: object
      required: [id, text, source, confirmed_at]
      properties:
        id:
          type: string
          description: Unique within one test case; stable across edits.
        text:
          type: string
          maxLength: 2000
        source:
          type: string
          enum: [user, suggested]
          description: |
            Who proposed the condition. `suggested` is reserved for TEST-002's
            automatic suggestion so EVAL-001 can keep a model's proposal from
            being presented as the user's own (not written yet).
        confirmed_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the user explicitly agreed to this wording. Null means proposed
            but not confirmed. Editing the text clears it.
    AcceptanceCriteriaSuggestions:
      description: |
        What the model proposed for one draft (TEST-002). Text and nothing else:
        a proposal has no id because it is not a criterion, and it has no
        `source` or `confirmed_at` because those are facts about a criterion the
        user has adopted. Adopting one is POST /test-cases/{id}/criteria.
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 50
          items:
            type: object
            required: [text]
            properties:
              text: { type: string, maxLength: 2000 }
    RubricItem:
      description: |
        One rubric line, strengthening exactly one acceptance criterion
        (CONTENT-007). Same shape as llm-internal.yaml's RubricItem, because it
        is the same object: what is stored here is what /judge-run is sent.
      type: object
      required: [id, text, evidence_required]
      properties:
        id:
          type: string
          description: |
            The id of the acceptance criterion this item strengthens, not an id
            of its own. /judge-run answers one verdict per criterion id and the
            platform drops any id it did not send, so an item naming something
            else could never produce a stored verdict. An item whose criterion is
            deleted is removed with it.
        text: { type: string, maxLength: 2000 }
        weight:
          type: number
          description: |
            The author's relative-importance signal, passed to the model as
            written. Nothing in the platform does arithmetic on it: the overall
            verdict is recomputed from the per-criterion results, so this is not
            a score. Absent means the author gave none.
        evidence_required:
          type: boolean
          description: |
            Whether this item's verdict must come back with a quotation. Per item
            rather than a global switch, because a quote can show that something
            is present and cannot show that something is absent.
    Rubric:
      description: |
        A user-editable strengthening of the acceptance criteria (CONTENT-007) —
        not a second mechanism. Its items map onto the same `criterion_results`
        entries the criteria produce; a rubric only adds what a judgement must
        show its work for.
      type: object
      required: [version, items]
      properties:
        version:
          type: string
          maxLength: 200
          description: |
            Which wording is in force. Changing any item's text, weight or
            evidence flag is a new version and therefore another judge regression
            (EVAL-013), so this is recorded on every evaluation it produced
            (`Evaluation.rubric_version`). Not sent to the judge: the internal
            contract's Rubric carries only the items.
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/RubricItem" }
    TestCase:
      type: object
      required:
        [test_case_id, skill_id, name, user_prompt, acceptance_criteria, created_at, updated_at]
      properties:
        test_case_id: { type: string, format: uuid }
        skill_id: { type: string, format: uuid }
        name: { type: string }
        user_prompt: { type: string }
        acceptance_criteria:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceCriterion" }
        rubric:
          allOf:
            - $ref: "#/components/schemas/Rubric"
          description: |
            Absent means this test case has no rubric — never that it uses a
            default one. The copy a run was judged against is the one frozen in
            its snapshot, which is what `Evaluation.rubric_version` names.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TestCaseListItem:
      description: |
        One row of GET /test-cases: the draft plus the few facts a browsing user
        needs before opening it. Nothing here is new state — the counts are over
        `acceptance_criteria` and `has_rubric` is over `rubric` — they are served
        so a list of fifty rows is not fifty client-side reductions, and so
        `skill_name` does not have to be a second request per row.
      allOf:
        - $ref: "#/components/schemas/TestCase"
        - type: object
          required: [skill_name, criteria_confirmed, criteria_total, has_rubric]
          properties:
            skill_name:
              type: string
              description: |
                The skill this draft is bound to, so a list is readable without
                a bare UUID. Empty when the skill is no longer visible to the
                caller — an empty string is "we cannot name it", which the UI
                renders as unknown rather than as a name.
            criteria_confirmed:
              type: integer
              description: |
                How many acceptance criteria carry a `confirmed_at` (TEST-003).
                The pair with `criteria_total` is what tells a user a draft is
                not ready yet.
            criteria_total: { type: integer }
            has_rubric:
              type: boolean
              description: |
                Whether the draft carries a rubric (CONTENT-007). False is "no
                rubric", never "a default one" — same distinction `rubric`
                itself makes by being absent.
    Dataset:
      type: object
      required: [dataset_id, file_name, content_type, size_bytes, content_hash, expires_at]
      properties:
        dataset_id: { type: string, format: uuid }
        file_name:
          type: string
          description: Display name only; it is never used as a storage path.
        content_type:
          type: string
          description: |
            Decided from the content's magic bytes, not from the file name
            (PDM-005 §5.1). It may disagree with the uploaded extension.
        size_bytes: { type: integer, format: int64 }
        content_hash:
          type: string
          description: |
            SHA-256 of the stored bytes. Copied into the run snapshot, where it
            outlives the file itself (ADR-003).
        expires_at:
          type: string
          format: date-time
          description: 90 days from upload; deleting earlier is always allowed.
    DatasetLimits:
      description: PDM-005 §5.1, served from the constants the upload path enforces.
      type: object
      required:
        [max_file_bytes, max_test_case_bytes, max_files_per_test_case, retention_days, allowed_kinds, note]
      properties:
        max_file_bytes: { type: integer, format: int64 }
        max_test_case_bytes: { type: integer, format: int64 }
        max_files_per_test_case: { type: integer }
        retention_days: { type: integer }
        allowed_kinds:
          type: array
          items: { type: string }
        note: { type: string }
    DataRetentionPolicy:
      description: |
        ADR-029's four events and their attribute whitelist, plus the retention
        this deployment actually applies. Served from the constants in
        internal/analytics, never from numbers typed into a document.
      type: object
      required: [collecting, retention_days, events, note]
      properties:
        collecting:
          type: boolean
          description: |
            False — the shipped default — means no row is written and no cookie
            is set. The four events below are still disclosed: "we collect
            nothing" is a disclosure, not the absence of one.
        retention_days:
          type: integer
          description: |
            How long an event is kept, and the analytics cookie's own lifetime.
            Zero exactly when `collecting` is false.
        events:
          type: array
          description: |
            The closed set of four (the CHECK in 0029). A fifth would have to
            explain first why no domain table answers it (ADR-029 決策 1).
          items:
            type: object
            required: [name, when, attributes, not_recorded]
            properties:
              name:
                type: string
                enum: [search_performed, skill_detail_viewed, session_started, download_started]
              when: { type: string }
              attributes:
                type: array
                description: |
                  The whitelist itself, one entry per column the event writes.
                  It is the constructor signature in analytics.go: an attribute
                  nobody declared cannot be passed, so it cannot be stored.
                items: { type: string }
              not_recorded:
                type: string
                description: The disclosure that a summary of what *is* stored would hide.
        note: { type: string }
    RunPermissionSummary:
      description: |
        Everything a run will be able to touch, shown before it starts
        (TEST-005/008). Built for a (skill version, test case draft) pair and
        never stored: it is recomputed on every read, so it always describes the
        run as it would start right now.
      type: object
      required: [summary, summary_hash, estimated_cost, notes]
      properties:
        summary:
          $ref: "#/components/schemas/RunPermissionSummaryContent"
        summary_hash:
          type: string
          description: |
            SHA-256 over a canonical encoding of `summary` and nothing else. Both
            the confirmation and the run request quote it back, and the server
            recomputes it rather than trusting either, so it is an integrity
            check on what the user saw and not a token.
        estimated_cost:
          allOf:
            - $ref: "#/components/schemas/RunCostEstimate"
          description: |
            What the run is predicted to cost. Outside the hash, like `notes` and
            for the same reason: the hash covers what the run is *allowed to
            touch*, and a prediction is not a permission. Recalibrating the
            numbers against a larger sample must not silently revoke every
            confirmation a user has outstanding.
        quota:
          allOf:
            - $ref: "#/components/schemas/RunQuota"
          description: |
            What the account has left (PDM-010), shown here because it answers
            the same kind of question `estimated_cost` does — what this run will
            use up — and the screen where a user decides to start one is where
            that belongs.

            Outside the hash, for the same reason and by the same rule TEST-011
            set for `estimated_cost`: the hash covers what the run is *allowed to
            touch*, and an allowance is a state, not a permission. A run
            finishing elsewhere in the workspace must not invalidate a
            confirmation the user is holding.

            Absent when the deployment enforces no allowance. Absent rather than
            zeroed or filled with nulls: a number on this screen is a claim that
            it is applied (04 乙-2), so a build with no enforcement shows nothing
            at all.
        notes:
          type: array
          items: { type: string }
          description: |
            Plain-language explanation of the summary, deliberately outside the
            hash. Rewording a sentence must not invalidate every outstanding
            confirmation, and the facts are in `summary` where the hash covers
            them.
    RunCostEstimate:
      description: |
        PDM-005 §5.3's 預估成本區間. A range rather than a number because §5.2a-6
        makes one wrong every time: prompt caching puts a first run and a repeat
        run of the same skill about 8x apart, so any single figure misdescribes
        one of them.

        An estimate, never a quote and never a commitment. The actual charge is
        the gateway's own per-key spend. It is also not the per-run budget
        ceiling - that is `resource_limits` and the gateway's max_budget, and
        showing the ceiling here would tell every user their run costs half a
        dollar when the median is six cents.
      type: object
      required: [currency, low, typical, high, basis]
      properties:
        currency:
          type: string
          description: |
            Fixed at USD - the gateway prices in it and the baseline was measured
            in it. A converted number would present an exchange rate the platform
            does not own as a fact about a run.
        low: { type: number }
        typical: { type: number }
        high:
          type: number
          description: |
            Rounded up past the observed maximum, not a bound: the baseline is 45
            runs and a sample that size does not establish one.
        basis:
          type: string
          description: |
            Where the numbers came from, in the user's language, so nobody reads
            them as a quote. Display it with them rather than beside them.
    RunPermissionSummaryContent:
      description: |
        The hashed body: the eight TEST-008 disclosures plus what they belong to.
        Field order is fixed by the server's type rather than by an encoder,
        because the hash depends on it.

        Deliberately absent: the user prompt and the acceptance criteria. Editing
        either changes what the run is *asked* to do, not what it is *allowed* to
        touch, and invalidating a permission agreement over a typo fix would
        train users to click through the one screen that must not be reflexive.
      type: object
      required:
        [skill_version_id, skill_content_hash, test_case_id, datasets,
         dataset_total_bytes, scripts, tools, mcp_servers, network,
         injected_secrets, provider, resource_limits]
      properties:
        skill_version_id: { type: string, format: uuid }
        skill_content_hash:
          type: string
          description: |
            The exact package bytes this run would execute. In the hash because
            "which code runs" is a permission fact.
        test_case_id: { type: string, format: uuid }
        datasets:
          type: array
          description: Every file the run will be able to read, oldest upload first.
          items:
            type: object
            required: [dataset_id, file_name, content_type, size_bytes, content_hash]
            properties:
              dataset_id: { type: string, format: uuid }
              file_name: { type: string }
              content_type:
                type: string
                description: From the content's magic bytes, not its name (PDM-005 §5.1).
              size_bytes: { type: integer, format: int64 }
              content_hash: { type: string }
        dataset_total_bytes: { type: integer, format: int64 }
        scripts:
          type: object
          description: |
            Whether the package carries runnable code, answered by re-scanning
            the stored package rather than by reading a projected flag - the
            scan covers the exact bytes that would be executed. Nothing is
            executed to produce it (iron rule 1).
          required: [status, findings]
          properties:
            status:
              type: string
              enum: [none, present, unavailable]
              description: |
                `none` - scanned, no script file and no code embedded in
                SKILL.md. `present` - scanned, and `findings` names what was
                found. `unavailable` - the package could not be read, so nothing
                is claimed either way. `unavailable` is never rendered as `none`:
                an unreadable package is not a clean one (DISC-004
                不得自行推定為通過).
            findings:
              type: array
              items: { type: string }
              description: '`<code>: <path>` per finding, sorted. Empty unless `present`.'
        tools:
          type: array
          items: { type: string }
          description: |
            The agent's own tools, inside the sandbox and nowhere else. There is
            no per-tool grant to disclose because there is none to make: the
            isolation boundary is the container, not a tool list.
        mcp_servers:
          type: array
          items: { type: string }
          description: |
            Always empty in the MVP, and shown as empty rather than omitted. A
            missing row reads as a question nobody asked; an empty one states
            that the answer is none (remote MCP is out of first release).
        network:
          type: object
          required: [mode, allow]
          properties:
            mode:
              type: string
              description: |
                Egress policy the sandbox is held to (ADR-005). `default_deny`
                with an empty `allow` means it can reach nothing at all.
            allow:
              type: array
              items: { type: string }
        injected_secrets:
          type: array
          items: { type: string }
          description: |
            Names only, never values (iron rule 11, NFR-002). The values are
            per-run short-lived credentials minted at dispatch, and they appear
            in no screen, log or trace.
        provider:
          type: object
          description: |
            Who would run the workload and how strongly it is isolated. Best
            effort: an empty or unreachable fleet reports `unassigned` rather
            than failing the summary - refusing incompatible work is
            POST /skills/{id}/runs' job, not this one's.
          required: [name, rootless]
          properties:
            name:
              type: string
              description: '`unassigned` when no provider could be resolved right now.'
            isolation_level:
              type: string
              description: gvisor | container | vm | process (ADR-015). Absent when unassigned.
            rootless: { type: boolean }
            runtime: { type: string }
            runtime_version: { type: string }
        resource_limits:
          $ref: "#/components/schemas/RunResourceLimits"
    RunResourceLimits:
      description: |
        The ceilings this run is held to (PDM-005 §5.2). A deliberate copy of
        ResourceLimits in contracts/openapi/sandbox-provider.yaml, not a
        reference to it: that file is the control-plane-to-execution-plane
        surface and apps/sandbox generates from it alone, so the two stay
        separate modules. Changing a value means changing both.
      type: object
      required:
        [vcpu, memory_bytes, disk_bytes, max_pids, max_open_files,
         wall_clock_soft_seconds, wall_clock_hard_seconds, artifact_total_bytes,
         artifact_file_bytes, token_budget]
      properties:
        vcpu: { type: number }
        memory_bytes: { type: integer, format: int64 }
        disk_bytes:
          type: integer
          format: int64
          description: Total; PDM-005 splits it /work 6 GiB + /out 2 GiB.
        max_pids: { type: integer }
        max_open_files: { type: integer }
        wall_clock_soft_seconds:
          type: integer
          description: Reaching this marks the run `timed_out`.
        wall_clock_hard_seconds:
          type: integer
          description: |
            Forced destroy. The gap above the soft limit is the window in which a
            cooperative stop can still collect artifacts.
        artifact_total_bytes: { type: integer, format: int64 }
        artifact_file_bytes: { type: integer, format: int64 }
        token_budget:
          type: object
          required: [max_input_tokens, max_output_tokens]
          properties:
            max_input_tokens:
              type: integer
              description: |
                Counts cache-hit tokens: caching cuts cost, not token count
                (PDM-005 §5.2a-3).
            max_output_tokens: { type: integer }
    RunListItem:
      description: |
        One row of the run history (WS-004). A narrower shape than `Run` on
        purpose: a list needs what happened, to which skill, and when, and the
        transitions and attempts belong to the one run a reader opens.

        `status` carries the same warning it does on `Run`: `succeeded` says the
        workload finished, not that the task was done (ADR-025). A history list
        showing this value must word it as execution and must not present it as a
        pass.
      type: object
      required:
        [run_id, status, evaluation, skill_id, skill_name, skill_version_id,
         provider, cleanup_status, created_at]
      properties:
        run_id: { type: string, format: uuid }
        evaluation:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            The second axis (ADR-025, 04 丙-32). Required and never null: a run
            with no evaluation carries `not_evaluated` / 未評估, because an absent
            verdict beside a column of 「執行完成」 reads as a pass — which is the
            precise misreading ADR-025 separates the two axes to prevent. A list
            rendering these must put the verdict **ahead of** `status`.

            `value` folds the evaluation's own status into the verdict, and only
            the evaluation context may do that: an evaluation is created carrying
            `undetermined` and keeps it until the judge finishes, so `overall`
            read alone reports 「無法判斷」 for a pending or failed one. Values are
            `not_evaluated`, `evaluating`, `evaluation_failed`, and the four
            verdicts `met` / `partially_met` / `not_met` / `undetermined`.
            `evaluation_failed` says nobody judged, **not** that the task failed.
        status:
          type: string
          enum:
            [queued, provisioning, preparing, running, evaluating, succeeded, failed, cancelled, timed_out]
        status_reason:
          type: string
          description: Why the run entered this status. Masked and safe to display.
        skill_id: { type: string, format: uuid }
        skill_name:
          type: string
          description: |
            Joined into the row rather than resolved per item by the client: a
            history page is the one place where N runs render at once, and a
            lookup per row is how a page becomes a hundred round trips.
        skill_version_id: { type: string, format: uuid }
        test_case_id:
          type: string
          format: uuid
          description: |
            The editable test case the run's snapshot was frozen from, so a
            re-run can be started from a history row. Not permission to re-run —
            that is preflight's answer (TEST-009).
        provider: { type: string }
        failure_class: { type: string }
        cleanup_status:
          $ref: "#/components/schemas/Labelled"
          description: |
            `value` is the database type run_cleanup_status
            (0004_test_lab_and_runs.sql): `pending`, `cleaning_up`, `cleaned`,
            `failed`. The handler puts that value on the wire unmapped.

            Labelled rather than a bare enum (04 丙-29 ②) because of what went
            wrong here: the contract said `cleaning` until 2026-08-22 while the
            database said `cleaning_up`, so the one state this field exists to
            report — the sandbox is being torn down right now — arrived as a
            value no client had a word for and **rendered as a blank row**. A
            client-side enum→中文 table can only fail that way; a served label
            cannot. One field, one consumer, four values: the cheapest place to
            stop the whole failure mode.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    RunArtifact:
      description: |
        One file a run produced, as a manifest row. The bytes are never served
        here: the archive is a sandbox's output and the control plane does not
        open it (iron rule 1).
      type: object
      required: [artifact_id, file_name, content_type, size_bytes, content_hash, created_at, purged]
      properties:
        artifact_id: { type: string, format: uuid }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        content_hash: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        purged:
          type: boolean
          description: |
            True when the stored bytes are gone while the row remains — retention
            expiry, or a reconciler finding them missing (0028). Distinct from
            the owner deleting it, which removes the row from this list entirely:
            "it expired" and "it never existed" are different answers.
    Run:
      description: |
        One run as the Web surface sees it. The provider-facing shapes are a
        separate contract (contracts/openapi/sandbox-provider.yaml) and nothing
        provider-specific leaks into this one (RUN-001).
      type: object
      required:
        [run_id, status, skill_id, skill_version_id, test_case_snapshot_id, provider,
         cleanup_status, created_at]
      properties:
        run_id:
          type: string
          format: uuid
          description: The permanent platform identifier (iron rule 10).
        status:
          type: string
          enum:
            [queued, provisioning, preparing, running, evaluating, succeeded, failed, cancelled, timed_out]
          description: |
            The standard lifecycle of ADR-004 / RUN-002. `cleaning_up` is not in
            here: cleanup happens after a terminal state and is reported
            separately in `cleanup_status`, so "the run failed" and "its sandbox
            was torn down" stay two distinct facts.

            `succeeded` says the workload finished, not that the task was done.
            Whether it was is `Evaluation.overall` from
            GET /runs/{id}/evaluation, which is a separate resource an
            evaluation never writes back into (ADR-025). A surface showing this
            value alone must word it as execution (執行完成 / 執行失敗) and must
            not present it as a pass.
        status_reason:
          type: string
          description: Why the run entered this status. Masked and safe to display.
        skill_id:
          type: string
          format: uuid
          description: |
            The skill the version belongs to. Served rather than left to the
            client to work out: applying improvement suggestions posts to
            POST /skills/{id}/versions/from-suggestions, and a run page that had
            to be reached with the id already in its URL could only offer that
            action to callers who arrived the one right way.

            It is a fact about the version, not about the run: a run never moves
            between skills, and this changes for no reason at all.
        skill_version_id: { type: string, format: uuid }
        test_case_snapshot_id:
          type: string
          format: uuid
          description: |
            The frozen copy taken when the run was created, not the editable test
            case (iron rule 4).
        test_case_id:
          type: string
          format: uuid
          description: |
            The editable test case the snapshot was frozen from, which is what a
            re-run needs: POST /skills/{id}/runs takes a test case and snapshots
            it again, and the snapshot id cannot be handed back to it.

            Optional, so that a reader which no longer resolves is an absent
            field rather than an id pointing at nothing. Absent rather than null,
            like every other optional id in this contract.

            **Present is not permission to re-run.** The draft may have been
            deleted or its datasets may be gone — `inputs_available` on
            GET /runs/{id}/comparison is what answers that — and a re-run goes
            through preflight and `confirmed_summary_hash` either way (TEST-009).
        provider:
          type: string
          description: '`unassigned` until provider selection lands (RUN-005).'
        cleanup_status:
          $ref: "#/components/schemas/Labelled"
          description: |
            Tracked apart from the run outcome, and still writable after a
            terminal state. Idempotent cleanup is RUN-007. `value` is the
            database enum; see RunListItem.cleanup_status for why it is served
            with its words.
        cancel_requested_at:
          type: string
          format: date-time
          description: Set by POST /runs/{id}/cancel. Intent, not the outcome.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        transitions:
          type: array
          description: |
            Every state change with its time and reason (RUN-002). Append-only
            and oldest first; the first entry has no `from_status` because it is
            the run's creation.
          items:
            type: object
            required: [to_status, occurred_at]
            properties:
              from_status: { type: string }
              to_status: { type: string }
              reason: { type: string }
              occurred_at: { type: string, format: date-time }
        attempts:
          type: array
          description: |
            One entry per execution attempt (RUN-003). The provider's ephemeral
            id hangs off the attempt that owns it, so a retry adds a mapping
            instead of overwriting the previous one.
          items:
            type: object
            required: [run_attempt_id, attempt_number, provider]
            properties:
              run_attempt_id: { type: string, format: uuid }
              attempt_number: { type: integer }
              provider: { type: string }
              provider_run_id:
                type: string
                description: Never a key and never part of a URL (iron rule 10).
              error_class:
                type: string
                description: RunError.class from the provider contract.
              error_message: { type: string }
              started_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
    Evaluation:
      description: |
        One judgement of one run (EVAL-001), and a resource of its own because
        it answers a question `Run` does not. `Run.status` records what happened
        during execution; `Evaluation.overall` records whether the task was
        achieved. `succeeded` is an execution outcome and never a task verdict,
        an evaluation never writes back to the run, and the two are not to be
        merged into a single pass/fail on any screen (ADR-025, NFR-001).

        `status` and `overall` are likewise two fields on purpose. `status` is
        about the judgement (did it run at all), `overall` is about the task
        (what did it conclude). With only one of them, "the evaluator broke" and
        "the evidence does not settle it" would be indistinguishable.
      type: object
      required:
        [evaluation_id, run_id, status, overall, criterion_results,
         deterministic_findings, judge_model, judge_prompt_version,
         evidence_complete, cost, evaluated_at]
      properties:
        evaluation_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, completed, failed]
          description: |
            Whether the judgement itself ran. `failed` means it could not be
            produced — the model gateway was unavailable, the evidence could not
            be read — and is shown as 評估未完成, never quietly turned into a
            lenient verdict. It is a different thing from having no evaluation
            at all, which is a 404 rather than a row.
        overall:
          type: string
          enum: [met, partially_met, not_met, undetermined]
          description: |
            Whether the task was achieved. Never derived from the run's terminal
            state. `undetermined` is the safe default: it is the answer whenever
            the evidence does not settle the question, and it is what a
            `pending` or `failed` evaluation reports.
        summary:
          type: string
          description: |
            Human-readable verdict, for display above the per-criterion detail.
            On `status: failed` it states what stopped the judgement instead.
        criterion_results:
          type: array
          items: { $ref: "#/components/schemas/CriterionResult" }
          description: |
            One entry per acceptance criterion in the run's *snapshot*, not the
            editable test case (iron rule 4).
        deterministic_findings:
          type: array
          items: { $ref: "#/components/schemas/DeterministicFinding" }
          description: |
            Kept apart from `criterion_results` because the two answer different
            questions: "what is wrong with this run" versus "did this criterion
            pass". An empty list is not a clean bill of health.
        judge_model:
          type: string
          description: |
            The model that produced the `model`-sourced verdicts (EVAL-001
            第 5 條). Empty when no judge ran at all - a run with no acceptance
            criteria is settled without one - because naming a model here would
            describe a call that was never made.
        judge_prompt_version:
          type: string
          description: |
            The judge prompt this verdict was reached under (ADR-017). Together
            with `rubric_version` it is what makes two revisions comparable.
        rubric_version:
          type: string
          description: |
            The CONTENT-007 rubric in force. Absent when the skill's category
            has none — absent means "no rubric", not "the default rubric".
        evidence_complete:
          type: boolean
          description: |
            False when the material judged was incomplete: the run trace has a
            hole (`complete: false` on GET /runs/{id}/trace), an artifact could
            not be read, or an input had to be truncated. A criterion judged on
            incomplete evidence must not come back `passed`; `undetermined` is
            the honest outcome and the UI has to keep saying so (ADR-009).
        cost:
          $ref: "#/components/schemas/EvaluationCost"
        feedback:
          type: object
          description: |
            The user's own answer about this judgement (EVAL-001 第 4 條). Absent
            means nobody answered, which is not the same as "not helpful".
          required: [helpful, submitted_at]
          properties:
            helpful: { type: boolean }
            comment: { type: string, maxLength: 2000 }
            submitted_at: { type: string, format: date-time }
        evaluated_at: { type: string, format: date-time }
        superseded_at:
          type: [string, "null"]
          format: date-time
          description: |
            Set when a later re-evaluation replaced this one; null on the
            current revision. Returned so that reading an old revision through
            `?revision=` cannot be mistaken for reading the standing verdict.
    CriterionResult:
      description: |
        One acceptance criterion's verdict. `criterion_id` refers to the run's
        frozen test case snapshot, so editing the draft afterwards cannot
        rewrite what was judged (iron rule 4).
      type: object
      required: [criterion_id, text, result, source, evidence, reason]
      properties:
        criterion_id: { type: string }
        text:
          type: string
          description: |
            The wording as it stood in the snapshot, carried here so an
            evaluation report stays readable without resolving the snapshot —
            and so it keeps showing the words that were actually judged.
        result:
          type: string
          enum: [passed, failed, undetermined]
          description: |
            `undetermined` whenever the evidence does not settle it: input was
            truncated, an evidence reference did not resolve, or the trace was
            incomplete. It is one of EVAL-001's required states, not a missing
            answer, and it is what the pipeline falls back to on any doubt.
        source:
          type: string
          enum: [rule, model, user]
          description: |
            Who decided, and required rather than optional: EVAL-001 第 5 條
            requires a model's judgement to be labelled as a model's, and an
            omitted field would read as a platform fact.

            The control plane sets this from where the verdict actually came,
            never from what the model reports about itself — the judge service's
            response has no such field to fill in. `rule` is a deterministic
            check over the platform's own records, `user` is a person's verdict
            recorded over the automated one.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceRef" }
          description: |
            What the verdict rests on. Every reference a model returns is
            re-checked server-side before it is stored; one that does not
            resolve drops the verdict to `undetermined` instead of being passed
            through as given.
        reason:
          type: string
          description: |
            Why, in the user's language. Untrusted text when `source` is
            `model`: render it as inert text like any other model output.
    EvidenceRef:
      description: |
        A pointer to the material a verdict rests on, together with a copy of
        it. Both, because they expire differently: trace events live in monthly
        partitions that the retention policy drops, while an evaluation report
        is read long after. Only the pointer would turn old reports into empty
        citations; only the excerpt would make fresh ones unverifiable.
      type: object
      required: [kind, excerpt, excerpt_truncated, available, match]
      properties:
        kind:
          type: string
          enum: [trace_event, artifact, agent_output]
        match:
          type: string
          enum: [exact, normalized, not_found, not_checked]
          description: |
            How the excerpt was found in the source it names (ADR-043). This is
            the platform's own answer, never the judge's — a citation is verified
            **by content**, not by the source it was filed under.

            - `exact` — the quote occurs verbatim.
            - `normalized` — it occurs after bounded normalisation (NFC, runs of
              whitespace collapsed, leading and trailing structural punctuation
              trimmed). A real citation losing to one stray colon is the failure
              that put 45 correct verdicts on the floor in the A round, and it
              cost the platform a `judge-run/v2`.
            - `not_found` — the quote is in none of the run's verifiable sources.
              It does not become evidence, whatever it was filed as.
            - `not_checked` — no comparison happened. This is what an `artifact`
              citation carries: the path is on the run's manifest, so the file
              exists and is that size and that hash, but the archive is never
              opened in the control plane (evaluation-design §2.2), so no quote
              of its **contents** was verified against anything.

              `not_checked` and `not_found` were one value until 2026-08-22 and
              are not the same claim. `not_found` says the platform searched and
              the quote is nowhere, which is close to an accusation; this says
              the platform never looked. Filing the second under the first made
              the report sound certain about something it had not examined. It
              is the independent field ADR-043 §影響 asked for, rather than the
              statement being left implicit in `excerpt`.

              Like `not_found` it never counts as verified evidence, so a rubric
              item with `evidence_required` is not satisfied by it.
        reattributed_from:
          type: string
          enum: [trace_event, artifact, agent_output]
          description: |
            Present when the quote was found, but **not in the source the judge
            named** — `kind` is corrected to where it actually is and this
            records where it was filed. ADR-043's核心: mis-filed and fabricated
            are different failures and one string search tells them apart, so the
            platform stopped treating them the same. Absent when `kind` was
            right, which is the ordinary case.
        trace_event_id:
          type: string
          format: uuid
          description: Present for `trace_event`.
        occurred_at:
          type: string
          format: date-time
          description: |
            Present for `trace_event`, and not optional in practice: trace_events
            is partitioned by time and keyed on (id, occurred_at), so an id on
            its own does not locate the row.
        artifact_path:
          type: string
          description: |
            Run-output-relative path for `artifact`. Never absolute and never
            escaping the run's own output.
        byte_range:
          type: object
          description: Half-open [start, end) byte offsets into the artifact.
          required: [start, end]
          properties:
            start: { type: integer, format: int64 }
            end: { type: integer, format: int64 }
        char_range:
          type: object
          description: Half-open [start, end) character offsets into the agent output.
          required: [start, end]
          properties:
            start: { type: integer }
            end: { type: integer }
        excerpt:
          type: string
          description: |
            The cited material as it was when the judgement was made: masked
            before storage (iron rule 11) and length-capped. It is untrusted
            content that crossed the trust boundary (ADR-001) — render it as
            inert text, never interpreting HTML, ANSI or SVG.
        excerpt_truncated:
          type: boolean
          description: True when the excerpt is a cut of a longer passage.
        available:
          type: boolean
          description: |
            Whether the original can still be read. False means the trace
            partition was dropped or the artifact is gone; the excerpt is still
            shown and must be labelled as the copy kept at evaluation time.
            Never presented as though the original were still there, and never
            blanked out either (ADR-009).
    DeterministicFinding:
      description: |
        One problem found about the run itself — EVAL-001 第 1 條's six
        categories — reported apart from the criterion verdicts. Everything here
        except `effect` is decided by rules over the platform's own records, so
        five of the six categories cannot be argued with by anything inside the
        sandbox.
      type: object
      required: [category, severity, message, evidence]
      properties:
        category:
          type: string
          enum: [spec, activation, execution, effect, compatibility, cost]
          description: |
            `spec` — static validation of the version. `activation` — whether
            the mounted skills show up in the trace; it never claims a skill was
            "offered and ignored", because the SDK stream cannot express that
            (TRACE-002 限制註記) and the only honest statement is that no
            activation event appeared. `execution` — the run's own status,
            failure class and error events. `effect` — the one category a model
            produces. `compatibility` — the measured (version, runtime image)
            pair. `cost` — the run's usage totals, which are a lower bound.
        severity:
          type: string
          enum: [error, warning, info]
          description: Same three levels as `Finding`, so one severity vocabulary covers the product.
        message: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceRef" }
    EvaluationCost:
      description: |
        What this judgement cost: the platform's own model call, and nothing
        else. It is never added to the run's cost — they are spent by different
        workloads under different keys, and the run's figure is a lower bound
        (see RunComparison) while this one is not. One combined number would
        inherit the weaker guarantee without saying so.
      type: object
      required: [evaluation_usd, source, note]
      properties:
        evaluation_usd:
          type: [number, "null"]
          description: |
            NULL means the gateway reported no cost. Render that as
            "unreported" and never as 0 — 0 tells the user the judgement was
            free.
        source:
          type: string
          enum: [gateway, estimated]
          description: |
            `gateway` is the LiteLLM per-key spend for this evaluation, which is
            the authoritative figure (ADR-017). `estimated` is a computed one
            and must be labelled as such wherever it is shown.
        note: { type: string }
    EvaluationRevision:
      description: |
        One entry in a run's judgement history. It carries just enough to tell
        which rubric and judge prompt a verdict was reached under, because a
        verdict only means something together with what it was measured against.
      type: object
      required: [evaluation_id, judge_prompt_version, overall, evaluated_at, superseded_at]
      properties:
        evaluation_id:
          type: string
          format: uuid
          description: Pass as `?revision=` to GET /runs/{id}/evaluation to read it in full.
        judge_prompt_version: { type: string }
        rubric_version:
          type: string
          description: Absent when the skill's category has no rubric.
        overall:
          type: string
          enum: [met, partially_met, not_met, undetermined]
        evaluated_at: { type: string, format: date-time }
        superseded_at:
          type: [string, "null"]
          format: date-time
          description: |
            When a later re-evaluation replaced this one. Null on the current
            revision, and exactly one revision has it null.
    ImprovementSuggestion:
      description: |
        One proposed improvement (EVAL-002). It belongs to the evaluation that
        produced it rather than to the run: re-evaluating under another rubric
        produces its own set, and merging them would present suggestions about
        different verdicts as one list.

        The descriptive fields are frozen once written — what a model proposed
        is a fact about what was proposed. Only the decision fields move.
      type: object
      required:
        [suggestion_id, category, problem, evidence, target_path,
         expected_impact, decision]
      properties:
        suggestion_id: { type: string, format: uuid }
        category:
          type: string
          enum: [skill, runtime, mcp, tool, dataset]
          description: |
            Which layer the problem is in (EVAL-002 第 2 條). `mcp` is never
            produced in the MVP — remote MCP is out of first release — and
            exists so the value does not have to be added to a live enum later,
            the same placement TRACE-003 already uses.
        problem:
          type: string
          description: What went wrong. Model-written; render as inert text.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceRef" }
          description: |
            Why the model believes it, in verifiable form. Same server-side
            re-check as on a criterion verdict.
        target_path:
          type: string
          description: |
            Package-relative path the change applies to. Normalised and checked
            again when it is applied; anything resolving outside the package is
            refused there as `path_out_of_bounds`.
        expected_impact:
          type: string
          description: What the model expects to improve. A prediction, not a measurement.
        decision:
          type: string
          enum: [pending, accepted, rejected]
          description: |
            The user's per-suggestion decision (EVAL-002 第 3 條). `pending` is
            the starting state. Accepting records agreement only — nothing is
            written to any package until
            POST /skills/{id}/versions/from-suggestions is called.
        decided_at: { type: string, format: date-time }
        applied_skill_version_id:
          type: string
          format: uuid
          description: |
            The **new** version this suggestion went into, once one was built.
            Absent means it has not been applied. The version it was written
            against is untouched either way (iron rule 4).
    SuggestionBlockedReason:
      description: |
        Why a suggestion cannot be applied. One vocabulary, served from one
        place, so the preview and the apply call can never disagree about what
        stops a change.

        `path_out_of_bounds` — `target_path` resolves outside the package.
        `target_changed` — the target file changed after the suggestion was
        written, or this request contains multiple replacements for that file.
        `validation_blocked` — the package would no longer pass static
        validation with the change applied; the same rule that blocks an import
        blocks this, only earlier (PACK-002 的精神).
        `access_restricted` — the skill is under a 0023 licensing hold, so its
        contents are not reproduced (SEC-011).
        `diff_unavailable` — no diff could be computed, and EVAL-002 第 3 條
        does not allow applying a change the user could not see.
      type: string
      enum:
        [path_out_of_bounds, target_changed, validation_blocked,
         access_restricted, diff_unavailable]
    SuggestionDiff:
      type: object
      required: [target_path, applicable]
      properties:
        target_path: { type: string }
        unified_diff:
          type: string
          description: |
            The exact change, against the version the suggestion was written
            for. Absent when none could be computed, which is also
            `applicable: false` with `diff_unavailable`.
        applicable:
          type: boolean
          description: |
            Whether applying it would be allowed right now. It is evaluated at
            read time against the current package, so it can go from true to
            false when another version is saved in between — the apply call
            checks again and is the one that decides.
        blocked_reason:
          $ref: "#/components/schemas/SuggestionBlockedReason"
    RejectedSuggestion:
      description: One suggestion the apply call refused, and why.
      type: object
      required: [suggestion_id, blocked_reason, message]
      properties:
        suggestion_id: { type: string, format: uuid }
        blocked_reason:
          $ref: "#/components/schemas/SuggestionBlockedReason"
        message:
          type: string
          description: The reason in the user's language, safe to display as-is.
    RunComparison:
      description: |
        Two runs of the same test case, side by side (EVAL-003). A read: neither
        run is written to, and both sides are immutable snapshots (iron rule 4).

        Each side reports execution and task judgement in separate fields, and
        an unevaluated side says so rather than leaving the reader to infer a
        pass from `succeeded` (ADR-025).
      type: object
      required: [runs, criterion_matrix]
      properties:
        runs:
          type: array
          minItems: 2
          maxItems: 2
          description: The run named in the path first, the `against` run second.
          items:
            type: object
            required: [run_id, skill_id, skill_version_id, status, cost, inputs_available]
            properties:
              run_id: { type: string, format: uuid }
              skill_id:
                type: string
                format: uuid
                description: |
                  The skill this side's version belongs to. Per side rather than
                  once for the comparison: two runs of different skills may be
                  compared, and one shared field would have to be wrong for one
                  of them.
              skill_version_id: { type: string, format: uuid }
              test_case_id:
                type: string
                format: uuid
                description: |
                  The editable test case this side's snapshot was frozen from,
                  the same field as on `Run` and with the same caveat: it is what
                  a re-run would be started from, and it is not permission to
                  start one. Read it together with `inputs_available`, and note
                  that re-running is still POST /skills/{id}/runs behind
                  preflight — there is no re-run endpoint here.
              status:
                type: string
                enum:
                  [queued, provisioning, preparing, running, evaluating, succeeded, failed, cancelled, timed_out]
                description: |
                  How the execution ended, and only that. `succeeded` means the
                  workload finished; whether it did what was asked is
                  `evaluation.overall` beside it. Label this column with
                  execution wording (執行完成 / 執行失敗) and the judgement on
                  its own row.
              evaluation:
                type: object
                description: |
                  The task judgement for this run. **Absent means the run was
                  never evaluated** — show 未評估, never a pass. An evaluation
                  that broke is present with `status: failed`.
                required: [evaluation_id, status, overall, cost]
                properties:
                  evaluation_id: { type: string, format: uuid }
                  status:
                    type: string
                    enum: [pending, completed, failed]
                  overall:
                    type: string
                    enum: [met, partially_met, not_met, undetermined]
                  cost:
                    $ref: "#/components/schemas/EvaluationCost"
              final_output:
                type: string
                description: |
                  The run's final answer, masked. Untrusted content — render as
                  inert text (ADR-001).
              errors:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string }
                    code: { type: string }
                    message: { type: string }
              duration_ms:
                type: integer
                description: Wall clock from start to terminal state. Absent for a run that never started.
              cost:
                type: object
                description: |
                  What the *run* spent, kept in its own field beside the
                  evaluation's own cost. Two columns, never one total (design
                  §5.4).
                required: [usd, is_lower_bound, authoritative_source]
                properties:
                  usd:
                    type: [number, "null"]
                    description: |
                      NULL means no usage event carried a cost. Render as
                      "unreported", never as 0.
                  is_lower_bound:
                    type: boolean
                    const: true
                    description: |
                      Always true, and required so it cannot be dropped on the
                      way to a screen. The figure is summed from trace `usage`
                      events and that sum is structurally incomplete: a response
                      still in flight when the stream ends is not counted, and a
                      producer's last flush can land after this was read. It is
                      a floor, not a total, and every surface showing the number
                      shows that too. Making it a constant field puts the
                      obligation in the contract instead of in everyone's memory.
                  authoritative_source:
                    type: string
                    description: |
                      Where the settling figure lives — the gateway's per-key
                      spend for this run (ADR-017). Named rather than implied,
                      so a reader knows what a disagreement would be resolved
                      against.
              inputs_available:
                type: boolean
                description: |
                  Whether this run's inputs could still be supplied again: the
                  test case it was frozen from has not been deleted, and every
                  dataset the snapshot referenced is still stored and unexpired.

                  False means a re-run of *these* inputs is no longer possible,
                  and the screen must not offer one (ADR-003 刪除與可追溯性).
                  The comparison itself stays fully readable either way — the
                  snapshot's hash and both verdicts are history and do not
                  depend on the files still existing — so this disables a
                  re-run affordance and nothing else.

                  Answered from the platform's own deletion and expiry records,
                  which is what the storage sweep acts on, rather than by
                  probing object storage per dataset on every read.
        criterion_matrix:
          type: array
          description: |
            One row per acceptance criterion with both runs' verdicts, so a
            regression shows up per criterion instead of only in the overall.
            Criteria are matched by `criterion_id`, which the two snapshots
            share when the same test case was re-run (equal `content_hash`); one
            present on only a single side carries a null verdict for the other
            rather than being dropped.
          items:
            type: object
            required: [criterion_id, text, results]
            properties:
              criterion_id: { type: string }
              text: { type: string }
              results:
                type: array
                minItems: 2
                maxItems: 2
                description: Same order as `runs`.
                items:
                  type: object
                  required: [run_id, result]
                  properties:
                    run_id: { type: string, format: uuid }
                    result:
                      type: [string, "null"]
                      enum: [passed, failed, undetermined, null]
                      description: |
                        Null when this side has no verdict for the criterion —
                        it was not evaluated, or the criterion does not exist in
                        that snapshot. Not the same as `undetermined`, which is
                        a verdict that was reached.
                    source:
                      type: string
                      enum: [rule, model, user]
        version_diff_url:
          type: string
          description: |
            Where to see what changed between the two skill versions: the
            existing GET /skills/{id}/diff with `from` and `to` filled in
            (WS-003), not a second diff implementation. Absent when both runs
            used the same version, and absent when they used versions of
            different skills — that diff does not exist, and inventing a
            cross-skill one would be a second diff implementation for a
            comparison nobody asked for.
    PackagingTargetId:
      description: |
        The three packaging targets, named once and referenced everywhere a
        target appears (PDM-008). One vocabulary from one place, the same reason
        SuggestionBlockedReason is its own schema: the preview, the packaging
        call and the stored artifact must agree on what a target is called.
      type: string
      enum: [standard, claude-code, claude-agent-sdk]
    PackagingTarget:
      description: |
        One packaging target and what installing it involves (PACK-002,
        PACK-006/007/008).
      type: object
      required: [id, kind, version, display_name, support_status, env_vars, notes]
      properties:
        id: { $ref: "#/components/schemas/PackagingTargetId" }
        kind:
          type: string
          enum: [standard_package, profile]
          description: |
            `standard_package` — the Agent Skills spec package itself, with no
            agent-specific adaptation. `profile` — a versioned set of install
            settings for one agent.

            Two values rather than one flat list of profiles, because the
            standard package is what makes "Skill Hub is not tied to one agent"
            checkable (PDM-008): its SKILL.md is unchanged from the source
            version, byte for byte, and a profile's is not.
        version:
          type: string
          description: |
            The profile's own version, recorded in the package manifest so a
            downloaded package says which settings produced it. The standard
            package reports the packager's version instead — there is no profile
            to version.
        display_name: { type: string }
        install_location:
          type: string
          description: |
            Where the package goes, in the words the install instructions use.
            Absent for `standard_package`, which makes no claim about any
            agent's layout.

            The two profiles resolve to the same path today and differ in *which
            layer* it is — a user-level or project-level skills directory versus
            an agent's working directory — so the copy has to state the
            difference or the two read as one option listed twice (PDM-008 v4).
        support_status:
          type: string
          enum: [verified, unverified]
          description: |
            `verified` — Skill Hub has actually installed and run a package
            through this target. `unverified` — it has not, and nothing here
            promises the package will work (02:PACK-002 第 2 條). The standard
            package is `unverified` by construction: any spec-compliant agent may
            try it, and Skill Hub has not tried it on yours.

            It is a property of the *target*, not of a skill. Whether a
            particular version was ever measured is the `compatibility` axes on
            the skill, and passing format validation is never permission to say
            it installs (ADR-012).
        verification_prompt:
          type: string
          description: |
            A prompt to run against the target agent once the package is
            installed, to see whether the Skill was actually picked up
            (02:PACK-002 第 3 條). Absent for `standard_package`, which names no
            agent to run a prompt against — its check is `verification_steps`.
        verification_steps:
          type: array
          items: { type: string }
          description: |
            Post-install checks, in order. Every target has at least one of
            these two fields; both are optional here because which one a target
            carries depends on whether it names an agent.

            Served rather than left to the INSTALL.md inside the package: a
            check that only exists inside a package the user has not built yet
            is not available on the page where they are choosing a target, and
            02:PACK-002 第 3 條 asks for the check itself, not for a promise
            that one ships.
        env_vars:
          type: array
          description: |
            The environment variables this target needs, and the other half of
            02:PACK-002 第 1 條's "依賴與環境變數需求". A property of the target
            rather than of the skill: the SDK target needs its API key whichever
            Skill is inside, and the skill's own dependencies are on the
            packaging preview, which is where the package's bytes are known.

            Served rather than left to the INSTALL.md inside the package, for
            the same reason as `verification_steps`: a requirement the user only
            discovers after building the package is not on the page where they
            choose a target. Empty array for a target that needs none — the
            standard package names no agent and therefore no variable.
          items:
            type: object
            required: [name, required, description]
            properties:
              name: { type: string }
              required:
                type: boolean
                description: Whether the target fails without it.
              description: { type: string }
              example:
                type: string
                description: |
                  A placeholder showing the shape of the value, never a
                  credential: packaging-profile.schema.json refuses a value
                  matching a live key pattern, because this string is rendered
                  verbatim into an INSTALL.md that ships inside a package
                  (iron rule 11).
        notes:
          type: array
          items: { type: string }
          description: |
            Known limitations and the steps a path alone does not cover — for
            the SDK target, that `cwd` and `setting_sources` are part of
            installing and a skill silently never loads without them (ADR-023).
            Server-side so every surface states them identically (NFR-001).
    PackagingBlockedReason:
      description: |
        Why a package may not be built. Five values and not one `blocked: true`,
        because what the user can do about it differs completely between them:
        the first three are decisions about the content that they cannot argue
        with, the fourth is a package they can fix, and the fifth is one this
        platform broke itself.

        `license_hold` — the skill carries a 0023 access restriction (SEC-011).
        An unrecognised reason code still blocks: a code nobody recognises must
        never be the way content unlocks.
        `not_redistributable` — the skill's `redistribution` is `blocked`. A
        source-available licence reaches this even when the licence itself was
        manually confirmed: 02:CONTENT-002 已人工確認不等於可再散布, so
        `confirmed` is never a release condition.
        `license_unknown` — `redistribution` is `unknown`, which is where a skill
        starts and where anything unclassifiable stays. Treated as blocked, not
        as permitted: 02:DISC-003 forbids implying an unknown licence may be
        redistributed, and the one real misreading on record (ADR-021 §5.3, a
        root MIT file taken to cover a subdirectory) erred in exactly that
        direction.
        `validation_blocked` — the package that would be produced carries an
        error-level finding, so it must not be presented as a valid package
        (02:PACK-001). The severities are skillpkg's own; packaging does not
        define a second notion of "blocking".
        `file_removed_by_packager` — `SKILL.md` points at a file that was in the
        version and that the **exporter** removed (`excluded_files` names it).
        The fifth value exists because it is the one failure on this list the
        platform caused: a dangling reference that arrived that way is the
        author's, disclosed as a warning and shipped, but a package the packager
        itself broke must not go out looking whole. It is also the one a user can
        act on without arguing with a licence — move the file out of `.git/`,
        stop vendoring `node_modules/`, replace the symlink.
      type: string
      enum:
        [license_hold, not_redistributable, license_unknown, validation_blocked,
         file_removed_by_packager]
    PackageValidation:
      description: |
        The re-validation of the bytes packaging would produce (PACK-002), in
        the same three-severity shape an import refusal uses — errors, warnings
        and infos apart (02:SKILL-002). It is that shape rather than one like
        it: the findings come from the same `skillpkg` validator, and a second
        severity vocabulary would drift from it in the lenient direction.

        Warnings never block. They do have to be shown: PACK-001 blocks on
        errors only, but hiding the warnings would break 02:SKILL-002, so they
        travel in the download manifest and onto the download page as well.
      allOf:
        - $ref: "#/components/schemas/CategorizedFindings"
        - type: object
          required: [blocked]
          properties:
            blocked:
              type: boolean
              description: |
                True when `errors` is non-empty. Stated rather than left to the
                client to derive, so no surface can decide for itself what
                counts as blocking.
    PackagingPreview:
      description: |
        What POST .../packaging would do, without doing it (PACK-001). Computed
        against the package as it stands, so it can change when a new version is
        saved in between; the packaging call checks again and is the one that
        decides.
      type: object
      required:
        [target, allowed, validation, dependencies, included_test_cases,
         excluded_test_cases, excluded_files]
      properties:
        target: { $ref: "#/components/schemas/PackagingTargetId" }
        allowed:
          type: boolean
          description: Whether packaging would be permitted right now.
        blocked_reason:
          allOf:
            - $ref: "#/components/schemas/PackagingBlockedReason"
          description: Present exactly when `allowed` is false.
        blocked_message:
          type: string
          description: |
            The reason in the user's language, safe to display as-is and served
            rather than assembled client-side, so the preview and the 422 from
            the packaging call say the same sentence.
        validation:
          $ref: "#/components/schemas/PackageValidation"
        dependencies:
          type: array
          items: { type: string }
          description: |
            What the package needs installed, as the download page's half of
            02:PACK-002 第 1 條. These are the exact lines the produced
            INSTALL.md carries, from the same `skillpkg` findings, so the page
            and the packaged document cannot disagree about what a Skill needs.

            It includes the dependencies the package never declares but its
            scripts import (`undeclared-dependency`): that is the first reason a
            reader follows the instructions and the Skill still does not run.

            Empty when a licensing gate closed before any bytes were read —
            there is no package yet to have dependencies — and empty when the
            package genuinely declares and imports nothing. The preview's
            `allowed` and `blocked_reason` tell those two apart.
        included_test_cases:
          type: array
          description: |
            The test cases that would travel in the package (PACK-005). Empty
            when the caller did not ask for them, and empty is not the same as
            "there are none" — `excluded_test_cases` says which were left out
            and why.
          items:
            type: object
            required: [test_case_id, name, slug]
            properties:
              test_case_id: { type: string, format: uuid }
              name: { type: string }
              slug:
                type: string
                description: |
                  The directory it gets under `test-cases/` in the zip. Stable:
                  packaging the same test case twice produces the same slug, so
                  two packages can be diffed by path.
        excluded_test_cases:
          type: array
          description: |
            Test cases that will not travel, each with its reason. Listed rather
            than omitted so the user is told what they are not getting — most
            often that a dataset they uploaded cannot be redistributed, which is
            a decision about licensing and not a defect in their test case.
          items:
            type: object
            required: [test_case_id, name, reason]
            properties:
              test_case_id: { type: string, format: uuid }
              name: { type: string }
              reason: { type: string }
        excluded_files:
          type: array
          description: |
            Source files the packager removed, each with its reason.

            The exporter has always dropped these — `.git/`, `node_modules/`,
            `.ssh/`, `.env`, symlinks — and until now it dropped them
            **silently**: nothing in the manifest, nothing on this page, nothing
            in INSTALL.md. `excluded_test_cases` existed for exactly this reason
            one field over, and the argument is the same one 02:PACK-001 makes
            about keeping the Skill's directory structure: a package missing a
            file the Skill needs is not the same product as one that never had
            it, and only one of those two is worth telling the author about.

            Empty for almost every package. It is not empty for the case that
            matters — a Skill that vendored its dependencies, or one whose
            `SKILL.md` points at something the exporter would not carry.
          items:
            type: object
            required: [path, reason, label, note]
            properties:
              path:
                type: string
                description: Package-relative path of the file that was removed.
              reason:
                type: string
                enum: [excluded_dir, credential_file, not_a_regular_file, unsafe_path]
              label: { type: string }
              note: { type: string }
              referenced_by_skill_md:
                type: boolean
                description: |
                  True when `SKILL.md` points at this path. That combination is
                  the one the platform treats as its own fault rather than the
                  author's: the file was there, the document needs it, and the
                  packager is what removed it. Packaging refuses in that case
                  (`blocked_reason: file_removed_by_packager`).
                  A reference that was already dangling on import is a different
                  fact and stays a warning — the platform did not break that one.
    DownloadArtifact:
      description: |
        One built package (PACK-001). Immutable: re-packaging produces another
        row, never an edit of this one (iron rule 4).

        **Two hashes, answering two different questions.** `content_hash` is over
        the zip bytes and answers "is this the file I had". `manifest_hash` is
        canonical over `{path: sha256}` with no zip metadata and not covering the
        manifest itself, and answers "is the *content* the same as last time" —
        which is what deduplication and "did the skill change or only the
        profile" need, and what a byte hash cannot answer across packager
        versions (packaging-design §2.4).
      type: object
      required:
        [artifact_id, skill_id, skill_version_id, version_number,
         latest_version_number, version_state, target, file_name, size_bytes,
         content_hash, manifest_hash, status, servable, serve_state, expires_at,
         created_at, download_count, includes_test_cases]
      properties:
        artifact_id: { type: string, format: uuid }
        skill_id: { type: string, format: uuid }
        skill_version_id: { type: string, format: uuid }
        version_number:
          type: integer
          description: |
            Which version these bytes are, in the monotonic per-skill numbering
            the immutability trigger protects. The uuid beside it identifies the
            row; this is the only field on this schema a person can read as an
            answer to "which one is this" (04 丙-42, `02:WS-002` 1「版本」).
        latest_version_number:
          type: integer
          description: |
            The highest version number this skill currently has. Present so the
            client never has to fetch a second resource to find out whether it
            is showing a stale package, and equal to `version_number` when this
            is the newest.
        version_state:
          $ref: "#/components/schemas/Labelled"
          description: |
            `current` or `superseded`, with the wording — including the numbers —
            from the server (設計系統 §4.4).

            **Deliberately not a fifth `serve_state`.** Being superseded says
            nothing about whether the bytes are available: a superseded package
            is downloadable, and downloading exactly the version you packaged is
            a legitimate thing to want. `serve_state` answers "can I have the
            bytes"; this answers "is this the newest content". Folding them would
            make one field mean two things and force a superseded-and-expired row
            to pick which truth to tell (設計系統 §2.12 的第三軸).

            It is not upstream freshness. Whether the *source* the skill was
            imported from has moved is `CONTENT-009`/`INGEST-010`, neither of
            which is built, and whose re-fetch cadence is still 待決策.
        target: { $ref: "#/components/schemas/PackagingTargetId" }
        file_name:
          type: string
          description: |
            Display and attachment name only. Like a dataset's, it is never used
            as a storage path.
        size_bytes: { type: integer, format: int64 }
        content_hash: { type: string }
        manifest_hash: { type: string }
        status:
          type: string
          enum: [quarantined, available, rejected]
          description: |
            The artifact's own scan state (ADR-003: an upload is quarantined
            until it passes its checks), not a `ready` boolean. `rejected` and
            `quarantined` are two different things to the person waiting for a
            download — one is over and one is not — and one flag would say
            neither.

            Only `available` is served by GET /downloads/{artifactId}/content.
            That is the point of keeping the state: the rule is a condition on
            one handler that a test can hold to, rather than a habit of not
            handing bytes over too early.
        servable:
          type: boolean
          description: |
            Whether GET /downloads/{artifactId}/content would hand the bytes over
            **right now**: `status == available` AND the stored object has not
            been purged AND `expires_at` is still in the future
            (skill/delivery/download.go). Served rather than derived (04 丙-29 ⑤)
            because one of its three inputs — the purge — is not on this schema
            at all, so no client can compute it and every client that tried was
            computing something else.

            The three parts stay visible beside it: `status` says which check,
            `expires_at` says when, and this says the answer. Folding them into
            one flag would lose why (`quarantined` is not over, `rejected` is).
        serve_state:
          $ref: "#/components/schemas/Labelled"
          description: |
            The one sentence for the composite above — 「可下載」, 「檢查中」,
            「已拒絕」, 「已過期，不再提供下載」. `value` is the state that decided
            it, which is `status` except when an `available` artifact has expired
            or been purged, where it is `expired` or `purged` — **two values that
            do not appear in `status` at all**, which is why a label on `status`
            alone would have fought the word on the screen instead of settling it
            (設計系統 §2.2 顯示但不強制).
        expires_at:
          type: string
          format: date-time
          description: |
            When the object is deleted. The retention period is deployment
            configuration; PDM-006 proposes 90 days for download packages and
            that proposal is not ratified yet, so no number is fixed here.

            Show it as an absolute date, never as "in N days" (PDM-006 risk
            table), and alongside the fact that the same version can be packaged
            again at any time — which is true because packaging is idempotent.
            Expiry deletes the object and this row; the download records it
            produced are kept, because "you downloaded this" stays true.
        created_at: { type: string, format: date-time }
        download_count:
          type: integer
          description: How many times the bytes were actually served.
        includes_test_cases:
          type: boolean
          description: |
            Whether the PACK-005 test cases travelled. Part of the idempotency
            key, so the same version packaged with and without them is two
            artifacts rather than one that quietly changed.
        packager_version:
          type: string
          description: |
            The builder that produced these bytes. `content_hash` is reproducible
            within one packager version and not guaranteed across them, which is
            exactly why the version is recorded rather than assumed.
        profile_version:
          type: string
          description: The target profile's version. Absent for `standard`, which has no profile.
    RunQuota:
      description: |
        The free-tier allowance (PDM-010). Four limits in one place so a user can
        see all of them at once; `concurrent` is the one that has been enforced
        since M2 and is listed here rather than left to be discovered by hitting
        it.

        The proposed values are not ratified — PDM-010 asks the owner to pick
        between 20 and 20+30 for the first window explicitly rather than leave it
        to be inferred — so the numbers are served from deployment configuration
        and this contract fixes none of them.
      type: object
      required: [remaining_today, remaining_window, window_resets_at, limits]
      properties:
        remaining_today: { type: integer, minimum: 0 }
        remaining_window: { type: integer, minimum: 0 }
        window_resets_at:
          type: string
          format: date-time
          description: |
            When the rolling window's oldest counted run drops out. Rolling, not
            calendar: the count is a time-window query over the runs themselves,
            so there is no monthly reset moment to name.
        limits:
          type: object
          required: [daily, window, window_days, concurrent]
          properties:
            daily: { type: integer }
            window: { type: integer }
            window_days: { type: integer }
            concurrent:
              type: integer
              description: |
                Runs of one workspace that may be in flight at once. Enforced in
                the same transaction and under the same advisory lock as the
                allowance, which is the only place where a run is about to exist
                and nothing has been spent yet.
