openapi: 3.1.0
info:
  title: Skill Hub Public API
  version: 0.1.0
  description: |
    Web to Go control plane API. This file is the single source of truth for the
    contract (implementation rule 12); the TS client under packages/ is generated
    from it and must never be hand-edited.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/github/login:
    get:
      operationId: startGithubLogin
      summary: Begin GitHub OAuth login (ADR-020)
      responses:
        "302":
          description: Redirect to GitHub authorization, with a one-shot state cookie.
  /auth/github/callback:
    get:
      operationId: finishGithubLogin
      summary: GitHub OAuth callback; creates user and workspace on first login
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Login succeeded; session cookie set, redirect to the app.
        "401":
          description: State mismatch or code exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/dev/login:
    post:
      operationId: devLogin
      summary: Offline dev-provider login (ADR-020)
      description: |
        Exists only when the server runs with DEV_LOGIN=1 (local demo and E2E);
        in production the route is absent and returns 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  maxLength: 64
                  description: Dev user handle; defaults to "dev".
      responses:
        "204":
          description: Logged in; session cookie set.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked (idempotent; also returned when no session).
  /me:
    get:
      operationId: getMe
      summary: Current user and personal workspace, resolved from the session
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/import/upload:
    post:
      operationId: uploadSkillPackage
      summary: Import a skill package by uploading a zip archive (SKILL-001)
      description: |
        Requires a session. The archive is statically validated only; nothing
        inside it is executed. Blocking findings reject the import; identical
        content re-uploaded to the same skill returns the existing version.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Package imported (or already present as this version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a valid zip archive, or uncompressed content too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Archive exceeds the upload size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /skills/import/url:
    post:
      operationId: importSkillFromURL
      summary: Import a skill package from an allow-listed URL (SKILL-001)
      description: |
        Requires a session. GitHub repo URLs are normalized to their zip
        archives; other allow-listed URLs must point directly at a zip. The
        package goes through the same static validation as uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: Package imported (or already present as this version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Disallowed or unreachable URL, or content is not a valid archive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /api/skills/search:
    get:
      operationId: publicSearchSkills
      summary: Public intent search for skills (DISC-001, DISC-002)
      description: |
        Natural language search over the public skill catalog. Uses hybrid
        retrieval (ADR-013): pgvector embedding similarity ranks the results and
        Postgres FTS only widens the candidate set, so a lexical hit the vector
        leg missed is still ordered by its own vector distance. Does not require
        authentication.
        Scope is the public catalog only: private workspace content is never
        returned, and no request parameter can widen the scope (CORE-006,
        ADR-011). Use GET /skills/search for the caller's own workspace.
        Candidates further than the cosine distance cut-off are not returned at
        all; when nothing survives it, the response carries no_results and a
        query_suggestion rather than a page of weak matches. Blank or
        incomprehensible queries take the same no_results path.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Natural language task description.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Ranked matches with match reasons, or empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSearchResponse"
  /skills/search:
    get:
      operationId: searchSkills
      summary: Full-text search over the caller's skills (INGEST-009)
      description: |
        FTS leg of hybrid retrieval (ADR-013); vector recall and match reasons
        arrive with the Explorer milestone. Scoped to the session workspace.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Ranked matches; empty list when nothing matches.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "400":
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills:
    get:
      operationId: listSkills
      summary: List the caller's skills (WS-004)
      responses:
        "200":
          description: The caller's skills, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/{id}:
    delete:
      operationId: deleteSkill
      summary: Delete a private skill (WS-005)
      description: |
        Soft delete: the skill leaves lists, reads, and search immediately.
        Version snapshots stay frozen for the 30-day grace period before the
        background purge; shared package objects are unaffected.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted, with the exact deletion scope.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, versions_retained, note]
                properties:
                  deleted: { type: boolean }
                  versions_retained: { type: integer }
                  note: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/fork:
    post:
      operationId: forkSkill
      summary: Fork a readable skill's latest version into the caller's workspace (WS-001)
      description: |
        The package object is shared (content-addressed), not copied. Lineage
        to the original skill and version is preserved on the fork.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Fork created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Skill"
                  - type: object
                    required: [version_id, version_number]
                    properties:
                      version_id: { type: string, format: uuid }
                      version_number: { type: integer }
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A skill with the fork's name already exists in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/{id}/versions:
    post:
      operationId: saveSkillVersion
      summary: Save a zip as the next immutable version of a skill (WS-002)
      description: |
        Same static validation as import. The skills row keeps its name; the
        manifest inside the version is the snapshot's truth. Identical content
        returns the existing version with duplicate=true.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Version saved (or already present).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a valid zip archive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Archive exceeds the upload size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /skills/{id}/diff:
    get:
      operationId: diffSkillVersions
      summary: Compare any two versions of a skill (WS-003)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Added, removed, and modified files; unified diffs for text.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileDiff"
        "400":
          description: Malformed ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill or versions not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Me:
      type: object
      required: [user_id, email, display_name, workspace_id]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        workspace_id:
          type: string
          format: uuid
    Finding:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
        path:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
          description: |
            The full list behind an aggregated finding, when the message
            summarises rather than enumerates. `external-url` findings are
            grouped per host and carry every "<file>: <url>" reference here, so
            a package citing hundreds of schema URIs stays readable without the
            individual references being lost.
    CategorizedFindings:
      description: |
        Validation findings grouped by severity (INGEST-008/SKILL-002):
        blocking errors, non-blocking warnings, and informational notes are
        separate lists rather than one undifferentiated feed.
      type: object
      required: [errors, warnings, infos]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        infos:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Skill:
      type: object
      required: [skill_id, name, summary]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        forked_from_skill_id:
          type: string
          format: uuid
        forked_from_version_id:
          type: string
          format: uuid
    PublicSearchResponse:
      type: object
      required: [query, results, degraded, no_results, partial_index]
      properties:
        query:
          type: string
          description: The original query, echoed back (DISC-001).
        results:
          type: array
          items:
            $ref: "#/components/schemas/PublicSearchResult"
        degraded:
          type: boolean
          description: |
            True when the vector leg did not run and the answer came from
            lexical matching alone. ADR-013 定案調整 1/2: the vector leg is what
            carries cross-language recall, so a degraded answer has materially
            lower recall and must not be presented as "nothing matches".
        degraded_reason:
          type: string
          description: Why the vector leg was skipped. Absent when degraded is false.
        partial_index:
          type: boolean
          description: |
            True when at least one result on this page has no embedding yet
            (enrichment_status 'pending'): it reached the page through the
            lexical leg, the distance cut-off could not judge it, and it reports
            rank 0 at the bottom of the list.

            Separate from `degraded` on purpose. `degraded` is a transient
            outage of the query-side embedding call; `partial_index` is index
            coverage, which stays as it is until a reindex backfill runs —
            import is designed not to fail when enrichment does. One flag for
            both would let a normal state mask an outage and vice versa.
        no_results:
          type: boolean
          description: |
            True when the search produced nothing to show (DISC-001
            清楚的無結果狀態). Two situations reach it: every candidate fell
            outside the cosine distance cut-off, or the query was never searched
            because it was blank or incomprehensible. Read it together with
            `degraded`: no_results with degraded false means nothing in the
            catalog is close enough, while no_results with degraded true only
            means the lexical floor found nothing and recall was already reduced.
        query_suggestion:
          type: string
          description: |
            Copy to show with a no-results answer, prompting the user to add the
            task, the input they have and the output they want (DISC-001).
            Absent when there are results.
    PublicSearchResult:
      type: object
      required: [skill_id, name, summary, rank]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
          description: |
            Plain summary (DISC-002). The index-time LLM summary when the skill
            has been enriched (ADR-013 §1, model-generated), otherwise the
            package's own frontmatter description.
        rank:
          type: number
          description: |
            Cosine similarity to the query, 0..1, higher is better (DISC-002 —
            never star count). Results are ordered by this. A skill matched only
            lexically while its enrichment is still pending has no vector and
            reports 0.
        match_reason:
          type: string
          description: |
            Human-readable explanation of why this skill matches the query
            (DISC-002). Template-based fallback when LLM polish times out.
        match_reason_source:
          type: string
          enum: [model, template]
          description: |
            Provenance of match_reason. ADR-013 requires model-generated content
            to be labelled, so the UI can mark it as such. `template` reasons are
            assembled from the query/document lexical overlap, or state plainly
            that the hit came from semantic similarity with no shared keywords.
    SearchHit:
      type: object
      required: [skill_id, name, summary, rank]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        rank:
          type: number
    FileDiff:
      type: object
      required: [path, status]
      properties:
        path:
          type: string
        status:
          type: string
          enum: [added, removed, modified]
        diff:
          type: string
          description: Unified diff; absent for binary or oversized files.
    UploadResult:
      type: object
      required: [skill_id, version_id, version_number, content_hash, duplicate, findings]
      properties:
        skill_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        content_hash:
          type: string
        duplicate:
          type: boolean
          description: True when identical content already existed as a version of this skill.
        findings:
          $ref: "#/components/schemas/CategorizedFindings"
