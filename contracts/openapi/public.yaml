openapi: 3.1.0
info:
  title: Skill Hub Public API
  version: 0.1.0
  description: |
    Web to Go control plane API. This file is the single source of truth for the
    contract (implementation rule 12); the TS client under packages/ is generated
    from it and must never be hand-edited.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/github/login:
    get:
      operationId: startGithubLogin
      summary: Begin GitHub OAuth login (ADR-020)
      responses:
        "302":
          description: Redirect to GitHub authorization, with a one-shot state cookie.
  /auth/github/callback:
    get:
      operationId: finishGithubLogin
      summary: GitHub OAuth callback; creates user and workspace on first login
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Login succeeded; session cookie set, redirect to the app.
        "401":
          description: State mismatch or code exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/dev/login:
    post:
      operationId: devLogin
      summary: Offline dev-provider login (ADR-020)
      description: |
        Exists only when the server runs with DEV_LOGIN=1 (local demo and E2E);
        in production the route is absent and returns 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  maxLength: 64
                  description: Dev user handle; defaults to "dev".
      responses:
        "204":
          description: Logged in; session cookie set.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked (idempotent; also returned when no session).
  /me:
    get:
      operationId: getMe
      summary: Current user and personal workspace, resolved from the session
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: requestAccountDeletion
      summary: Request deletion of the caller's account (CORE-007)
      description: |
        Starts a 30-day grace period; nothing is removed yet and the account
        stays usable so the request can be cancelled. Idempotent — asking twice
        keeps the original start time rather than extending the wait.

        When the grace period ends, uploaded datasets, run and download
        artifacts, and every skill nobody else forked or ran are permanently
        deleted, files included. Skill versions other users forked or historical
        runs used are retained with the owner's identity removed (PDM-006 §6.1):
        deleting them would break a third party's provenance chain, which
        DISC-003 requires to stay intact.
      responses:
        "200":
          description: Grace period started, with the scope of what will be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/deletion/cancel:
    post:
      operationId: cancelAccountDeletion
      summary: Withdraw a pending account deletion (CORE-007)
      description: |
        Valid for the whole grace period. Idempotent: cancelling when nothing is
        pending is a no-op.
      responses:
        "200":
          description: No deletion is pending any more.
          content:
            application/json:
              schema:
                type: object
                required: [deletion_requested_at]
                properties:
                  deletion_requested_at:
                    type: string
                    nullable: true
                    format: date-time
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/import/upload:
    post:
      operationId: uploadSkillPackage
      summary: Import a skill package by uploading a zip archive (SKILL-001)
      description: |
        Requires a session. The archive is statically validated only; nothing
        inside it is executed. Blocking findings reject the import; identical
        content re-uploaded to the same skill returns the existing version.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Package imported (or already present as this version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a valid zip archive, or uncompressed content too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Archive exceeds the upload size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /skills/import/url:
    post:
      operationId: importSkillFromURL
      summary: Import a skill package from an allow-listed URL (SKILL-001)
      description: |
        Requires a session. GitHub repo URLs are normalized to their zip
        archives; other allow-listed URLs must point directly at a zip. The
        package goes through the same static validation as uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: Package imported (or already present as this version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Disallowed or unreachable URL, or content is not a valid archive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /api/skills/search:
    get:
      operationId: publicSearchSkills
      summary: Public intent search for skills (DISC-001, DISC-002)
      description: |
        Natural language search over the public skill catalog. Uses hybrid
        retrieval (ADR-013): pgvector embedding similarity ranks the results and
        Postgres FTS only widens the candidate set, so a lexical hit the vector
        leg missed is still ordered by its own vector distance. Does not require
        authentication.
        Scope is the public catalog only: private workspace content is never
        returned, and no request parameter can widen the scope (CORE-006,
        ADR-011). Use GET /skills/search for the caller's own workspace.
        Candidates further than the cosine distance cut-off are not returned at
        all; when nothing survives it, the response carries no_results and a
        query_suggestion rather than a page of weak matches. Blank or
        incomprehensible queries take the same no_results path.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Natural language task description.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Ranked matches with match reasons, or empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSearchResponse"
  /api/skills/{id}:
    get:
      operationId: getSkillDetail
      summary: Skill detail, source, license, risk and compatibility (DISC-006, DISC-008)
      description: |
        Does not require authentication. Scope is resolved by the server and never
        by the request (CORE-006, ADR-011): the public catalog answers for every
        caller, and a caller with a session additionally sees skills in their own
        workspace. Anything outside both scopes answers 404, identical to a skill
        that does not exist, so the status code is not an existence oracle for
        someone else's private content (WS-006).

        `summary` is always the package's own frontmatter description.
        Model-generated text lives under `enrichment` and is labelled there
        (ADR-013). `license` carries the ADR-021 two-axis answer — the expression
        and the provenance tier it was established at — and its status is
        `declared` at best: confirmation is a reviewer's act and nothing records
        one yet. `risk` reports a static scan of the stored package; the scan
        never executes anything (iron rule 1) and passing it is not a safety
        claim (NFR-001). `compatibility` keeps the three axes apart and states
        the two that need a sandbox as `unverified` rather than omitting them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The skill as visible in the caller's widest scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetail"
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: |
            Withdrawn from the catalog (INGEST-010). The URL was public and is
            still in circulation, so a withdrawal answers 410 rather than 404:
            the content existed and was taken down, which is a different fact
            from never having existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/skills/{id}/files:
    get:
      operationId: getSkillFiles
      summary: SKILL.md and the package file tree (DISC-007)
      description: |
        Advanced view of the latest version. Same scope rules as
        GET /api/skills/{id}, so it needs no authentication for catalog content.
        Scripts are marked with the same rule the import scan used, and the
        SKILL.md embedded-code disclosure is repeated here because the file tree
        is exactly what cannot show code living inside the document (SKILL-003).
        Package files other than SKILL.md are listed with their metadata; an
        endpoint serving their content is later DISC-007 work.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: SKILL.md text and the file tree of the latest version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFiles"
        "404":
          description: Skill not visible to the caller, or it has no saved version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Withdrawn from the catalog (INGEST-010); see GET /api/skills/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The stored package could not be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/search:
    get:
      operationId: searchSkills
      summary: Full-text search over the caller's skills (INGEST-009)
      description: |
        FTS leg of hybrid retrieval (ADR-013); vector recall and match reasons
        arrive with the Explorer milestone. Scoped to the session workspace.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Ranked matches; empty list when nothing matches.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "400":
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills:
    get:
      operationId: listSkills
      summary: List the caller's skills (WS-004)
      responses:
        "200":
          description: The caller's skills, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/{id}:
    delete:
      operationId: deleteSkill
      summary: Delete a private skill (WS-005)
      description: |
        Soft delete: the skill leaves lists, reads, and search immediately.
        Version snapshots stay frozen for the 30-day grace period before the
        background purge; shared package objects are unaffected.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted, with the exact deletion scope.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, versions_retained, note]
                properties:
                  deleted: { type: boolean }
                  versions_retained: { type: integer }
                  note: { type: string }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/fork:
    post:
      operationId: forkSkill
      summary: Fork a readable skill's latest version into the caller's workspace (WS-001)
      description: |
        The package object is shared (content-addressed), not copied. Lineage
        to the original skill and version is preserved on the fork.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Fork created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Skill"
                  - type: object
                    required: [version_id, version_number]
                    properties:
                      version_id: { type: string, format: uuid }
                      version_number: { type: integer }
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A skill with the fork's name already exists in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /skills/{id}/versions:
    post:
      operationId: saveSkillVersion
      summary: Save a zip as the next immutable version of a skill (WS-002)
      description: |
        Same static validation as import. The skills row keeps its name; the
        manifest inside the version is the snapshot's truth. Identical content
        returns the existing version with duplicate=true.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Version saved (or already present).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a valid zip archive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Archive exceeds the upload size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Package failed spec or static validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizedFindings"
  /skills/{id}/diff:
    get:
      operationId: diffSkillVersions
      summary: Compare any two versions of a skill (WS-003)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Added, removed, and modified files; unified diffs for text.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileDiff"
        "400":
          description: Malformed ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill or versions not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /skills/{id}/takedown:
    post:
      operationId: takedownSkill
      summary: Withdraw a skill from the public surface (INGEST-010)
      description: |
        Not a delete. The skill, its versions and their import sources are
        retained (PDM-006 §6 makes takedown the only removal path for them); the
        skill leaves search, stops being a fork source, and its detail view
        answers 410. Existing forks and historical runs are unaffected, and a
        full reindex does not bring it back.

        Authorization is the ordinary workspace scope, which for curated catalog
        entries means the operator who owns the catalog workspace. Taking down
        content in someone else's workspace needs an operator role the MVP does
        not define yet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Why the content was withdrawn; required and reviewable later.
      responses:
        "200":
          description: Withdrawn, with the exact scope of the withdrawal.
          content:
            application/json:
              schema:
                type: object
                required: [skill_id, takedown_at, reason, note]
                properties:
                  skill_id: { type: string, format: uuid }
                  takedown_at: { type: string, format: date-time }
                  reason: { type: string }
                  note: { type: string }
        "400":
          description: Missing or empty reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Skill not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already taken down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Me:
      type: object
      required: [user_id, email, display_name, workspace_id]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        workspace_id:
          type: string
          format: uuid
    AccountDeletion:
      type: object
      required: [deletion_requested_at, purge_after, cancellable, scope]
      properties:
        deletion_requested_at:
          type: string
          format: date-time
        purge_after:
          type: string
          format: date-time
          description: When the purge becomes due; cancellable until then.
        cancellable:
          type: boolean
        scope:
          type: string
          description: |
            Plain-language statement of what is deleted and what is retained
            de-identified. WS-002 requires the scope to be shown before the
            deletion, not discovered after it.
    Finding:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
        path:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
          description: |
            The full list behind an aggregated finding, when the message
            summarises rather than enumerates. `external-url` findings are
            grouped per host and carry every "<file>: <url>" reference here, so
            a package citing hundreds of schema URIs stays readable without the
            individual references being lost.
    CategorizedFindings:
      description: |
        Validation findings grouped by severity (INGEST-008/SKILL-002):
        blocking errors, non-blocking warnings, and informational notes are
        separate lists rather than one undifferentiated feed.
      type: object
      required: [errors, warnings, infos]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        infos:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Skill:
      type: object
      required: [skill_id, name, summary]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        forked_from_skill_id:
          type: string
          format: uuid
        forked_from_version_id:
          type: string
          format: uuid
    PublicSearchResponse:
      type: object
      required: [query, results, degraded, no_results, partial_index]
      properties:
        query:
          type: string
          description: The original query, echoed back (DISC-001).
        results:
          type: array
          items:
            $ref: "#/components/schemas/PublicSearchResult"
        degraded:
          type: boolean
          description: |
            True when the vector leg did not run and the answer came from
            lexical matching alone. ADR-013 定案調整 1/2: the vector leg is what
            carries cross-language recall, so a degraded answer has materially
            lower recall and must not be presented as "nothing matches".
        degraded_reason:
          type: string
          description: Why the vector leg was skipped. Absent when degraded is false.
        partial_index:
          type: boolean
          description: |
            True when at least one result on this page has no embedding yet
            (enrichment_status 'pending'): it reached the page through the
            lexical leg, the distance cut-off could not judge it, and it reports
            rank 0 at the bottom of the list.

            Separate from `degraded` on purpose. `degraded` is a transient
            outage of the query-side embedding call; `partial_index` is index
            coverage, which stays as it is until a reindex backfill runs —
            import is designed not to fail when enrichment does. One flag for
            both would let a normal state mask an outage and vice versa.
        no_results:
          type: boolean
          description: |
            True when the search produced nothing to show (DISC-001
            清楚的無結果狀態). Two situations reach it: every candidate fell
            outside the cosine distance cut-off, or the query was never searched
            because it was blank or incomprehensible. Read it together with
            `degraded`: no_results with degraded false means nothing in the
            catalog is close enough, while no_results with degraded true only
            means the lexical floor found nothing and recall was already reduced.
        query_suggestion:
          type: string
          description: |
            Copy to show with a no-results answer, prompting the user to add the
            task, the input they have and the output they want (DISC-001).
            Absent when there are results.
    PublicSearchResult:
      type: object
      required: [skill_id, name, summary, rank]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
          description: |
            Plain summary (DISC-002). The index-time LLM summary when the skill
            has been enriched (ADR-013 §1, model-generated), otherwise the
            package's own frontmatter description.
        rank:
          type: number
          description: |
            Cosine similarity to the query, 0..1, higher is better (DISC-002 —
            never star count). Results are ordered by this. A skill matched only
            lexically while its enrichment is still pending has no vector and
            reports 0.
        match_reason:
          type: string
          description: |
            Human-readable explanation of why this skill matches the query
            (DISC-002). Template-based fallback when LLM polish times out.
        match_reason_source:
          type: string
          enum: [model, template]
          description: |
            Provenance of match_reason. ADR-013 requires model-generated content
            to be labelled, so the UI can mark it as such. `template` reasons are
            assembled from the query/document lexical overlap, or state plainly
            that the hit came from semantic similarity with no shared keywords.
    Labelled:
      description: |
        An enum value together with the copy shown for it. The label and note
        live server-side so that every surface explains a trust state the same
        way, and so the wording stays factual about what was checked (NFR-001).
      type: object
      required: [value, label, note]
      properties:
        value: { type: string }
        label: { type: string }
        note: { type: string }
    SkillSource:
      description: |
        Import provenance (DISC-003). Fields the import never recorded are absent
        rather than filled in with a plausible value.
      type: object
      required: [type, trust]
      properties:
        type:
          type: string
          enum: [git, upload]
        url:
          type: string
          description: Source URL for a git import.
        source_version:
          type: string
          description: Commit SHA, tag, or branch, when the fetch resolved one.
        fetched_at:
          type: string
          format: date-time
        content_hash:
          type: string
          description: Hash of the package as fetched.
        trust:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            unknown | traceable | manually_confirmed. `traceable` requires a git
            import that recorded a URL; an upload has no verifiable origin.
            `manually_confirmed` needs a reviewer and has no store yet, so this
            endpoint never returns it.
    SkillLicense:
      description: |
        ADR-021 two axes. The expression alone cannot distinguish "the author
        declared MIT in frontmatter" from "the monorepo root had an MIT file",
        and DISC-003 forbids presenting the second as the first.
      type: object
      required: [status]
      properties:
        expression:
          type: string
          description: SPDX id. Absent means unknown, which must never be shown as permissive.
        source:
          type: string
          enum: [manifest, package-license-file, repo-license-file]
          description: |
            Provenance tier, strongest first. Absent on versions imported before
            ADR-021, whose tier was never recorded and must not be invented.
        source_note:
          type: string
          description: What that tier does and does not claim about this package.
        status:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            unknown | declared. `confirmed` requires a reviewer's check and
            nothing records one, so it is never returned here.
    SkillRisk:
      description: |
        Static scan of the stored package, recomputed on read. Nothing in the
        package is executed (iron rule 1) and there is deliberately no single
        "safe" verdict (NFR-001).
      type: object
      required: [scan_status, counts, highlights, info_counts, note]
      properties:
        scan_status:
          type: string
          enum: [scanned, unavailable]
          description: |
            `unavailable` means the stored package could not be read. It is
            reported as unknown, never as a clean scan (DISC-004
            不得自行推定為通過).
        counts:
          type: object
          required: [errors, warnings, infos]
          properties:
            errors: { type: integer }
            warnings: { type: integer }
            infos: { type: integer }
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
          description: Every error- and warning-level finding, verbatim.
        info_counts:
          type: object
          additionalProperties: { type: integer }
          description: |
            Info-level disclosures folded to a count per finding code. One seed
            package produced 321 URL findings; a list nobody reads hides the
            findings that matter.
        has_scripts: { type: boolean }
        has_embedded_script:
          type: boolean
          description: |
            Runnable code inside SKILL.md itself (SKILL-003). Separate from
            has_scripts because the package file list cannot show it.
        has_external_urls: { type: boolean }
        has_possible_secrets: { type: boolean }
        has_binaries: { type: boolean }
        note: { type: string }
    SkillCompatibility:
      description: |
        The three DISC-008 axes, kept apart. Only spec validation has an answer
        before M2; the other two say `unverified` rather than being omitted,
        because a missing field reads as "fine" and an explicit 未驗證 does not.
      type: object
      required: [spec_validation, capability, runtime, note]
      properties:
        spec_validation:
          type: string
          enum: [passed, failed, unverified]
          description: |
            Format and static validation only. Passing is never a claim that the
            skill is safe to run or effective (SKILL-002).
        capability:
          type: string
          enum: [unverified, passed, failed]
        runtime:
          type: string
          enum: [unverified, passed, failed]
        note: { type: string }
    SkillEnrichment:
      description: |
        Index-time model output (ADR-013 §1), labelled as model-written so a
        reader can always tell it from the author's own text.
      type: object
      required: [status, note]
      properties:
        status:
          type: string
          enum: [pending, enriched]
        summary:
          type: string
          description: Plain-language summary written by the model.
        task_examples:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        note: { type: string }
    SkillDetail:
      type: object
      required: [skill_id, name, summary, scope, tier, enrichment, license, derivation, risk, compatibility]
      properties:
        skill_id: { type: string, format: uuid }
        name: { type: string }
        summary:
          type: string
          description: The package's own frontmatter description, never the model's rewrite.
        scope:
          type: string
          enum: [catalog, private]
          description: Which read answered — the public catalog, or the caller's own workspace.
        tier:
          allOf:
            - $ref: "#/components/schemas/Labelled"
          description: |
            curated | indexed | external. Always `indexed` today: curation is a
            recorded human review (PDM-002) and CONTENT-003's promotion workflow
            is what would record one. Catalog membership is not that review, and
            labelling it 精選 would be the endorsement PDM-002 warns against.
        enrichment:
          $ref: "#/components/schemas/SkillEnrichment"
        version:
          type: object
          description: The latest version. Absent for a skill with no saved content yet.
          required: [version_id, version_number, content_hash, created_at]
          properties:
            version_id: { type: string, format: uuid }
            version_number: { type: integer }
            content_hash: { type: string }
            created_at: { type: string, format: date-time }
        source:
          $ref: "#/components/schemas/SkillSource"
        license:
          $ref: "#/components/schemas/SkillLicense"
        derivation:
          type: object
          description: |
            Fork lineage (DISC-003, WS-001). A fork resolves to both the parent
            skill and the parent *version* it diverged from: versions are
            immutable, so the parent's current version can have moved on.
          required: [is_fork, label, note]
          properties:
            is_fork: { type: boolean }
            forked_from_skill_id: { type: string, format: uuid }
            forked_from_version_id: { type: string, format: uuid }
            label: { type: string }
            note: { type: string }
        allowed_tools:
          type: array
          items: { type: string }
          description: The manifest's allowed-tools, as declared by the package.
        risk:
          $ref: "#/components/schemas/SkillRisk"
        compatibility:
          $ref: "#/components/schemas/SkillCompatibility"
    SkillFiles:
      type: object
      required: [skill_id, version_id, version_number, skill_md, skill_md_truncated, tree, note]
      properties:
        skill_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version_number: { type: integer }
        skill_md:
          type: string
          description: Full SKILL.md text of that version, capped at 1 MiB.
        skill_md_truncated:
          type: boolean
        tree:
          type: array
          items:
            $ref: "#/components/schemas/SkillFileEntry"
          description: |
            Every file in the package, sorted by path. Directories are omitted:
            the paths carry the structure.
        embedded_script_note:
          type: string
          description: |
            The SKILL-003 disclosure, repeated on the view where its absence
            would mislead: this tree cannot show code that lives inside SKILL.md.
        note: { type: string }
    SkillFileEntry:
      type: object
      required: [path, size, is_script]
      properties:
        path: { type: string }
        size:
          type: integer
          description: Uncompressed size in bytes.
        is_script:
          type: boolean
          description: |
            Marked with the same extension rule the import scan used, so the tree
            and the risk block never disagree about what counts as a script
            (DISC-003 Script 必須有明確標示).
    SearchHit:
      type: object
      required: [skill_id, name, summary, rank]
      properties:
        skill_id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        rank:
          type: number
    FileDiff:
      type: object
      required: [path, status]
      properties:
        path:
          type: string
        status:
          type: string
          enum: [added, removed, modified]
        diff:
          type: string
          description: Unified diff; absent for binary or oversized files.
    UploadResult:
      type: object
      required: [skill_id, version_id, version_number, content_hash, duplicate, findings]
      properties:
        skill_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        content_hash:
          type: string
        duplicate:
          type: boolean
          description: True when identical content already existed as a version of this skill.
        findings:
          $ref: "#/components/schemas/CategorizedFindings"
