{
  "openapi": "3.1.0",
  "info": {
    "title": "Skill Hub transient creation worker input",
    "version": "0.1.0",
    "description": "Original diagrams travel only in HTTP memory; no queue or object persistence."
  },
  "security": [
    {
      "serviceBearer": []
    }
  ],
  "paths": {
    "/v1/creation/transient-step": {
      "post": {
        "operationId": "transientCreationStep",
        "summary": "Analyze diagram for an authorized durable command",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "workspace_id",
                  "session_id",
                  "receipt_id",
                  "expected_revision",
                  "diagram"
                ],
                "properties": {
                  "workspace_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "session_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "receipt_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "expected_revision": {
                    "type": "integer"
                  },
                  "diagram": {
                    "$ref": "./llm-internal.yaml#/components/schemas/GenerateDiagram"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Receipt settled; API reads scoped snapshot."
          },
          "400": {
            "description": "Invalid transient input."
          },
          "401": {
            "description": "Invalid service identity."
          },
          "409": {
            "description": "Consumed or stale command."
          },
          "503": {
            "description": "Unavailable; upload original diagram again."
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "serviceBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  }
}
